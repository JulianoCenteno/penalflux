a 35 anos para Presidente, Vice e Senador; 30 para Governador e Vice; 21 para Deputados, Prefeito, Vice-Prefeito e juiz de paz; e 18 para Vereador. Confundir a idade de Senador (35) com a de Governador (30) é o erro mais comum.", "ref": "Art. 14, § 3º, VI"}, {"q": "O art. 15 da Constituição veda a cassação de direitos políticos, cuja perda ou suspensão só se dará, entre outros casos, em razão de:", "o": ["condenação criminal transitada em julgado, enquanto durarem seus efeitos.", "condenação criminal confirmada em segunda instância, ainda que pendente recurso.", "incapacidade civil relativa.", "cancelamento da naturalização por decisão administrativa."], "a": 0, "c": "O art. 15, III, exige condenação criminal transitada em julgado, enquanto durarem seus efeitos. A incapacidade civil deve ser absoluta (inciso II) e o cancelamento da naturalização exige sentença transitada em julgado (inciso I).", "ref": "Art. 15, III"}, {"q": "Segundo o caput do art. 37 da Constituição, a administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de:", "o": ["legalidade, impessoalidade, moralidade, publicidade e economicidade.", "legalidade, impessoalidade, moralidade, publicidade e eficiência.", "legalidade, razoabilidade, moralidade, publicidade e eficiência.", "legalidade, impessoalidade, moralidade, supremacia do interesse público e eficiência."], "a": 1, "c": "O caput do art. 37 enumera legalidade, impessoalidade, moralidade, publicidade e eficiência. Razoabilidade, economicidade e supremacia do interesse público são princípios estudados pela doutrina, mas não constam do caput.", "ref": "Art. 37, caput"}, {"q": "Nos termos do art. 37, III, da Constituição, o prazo de validade do concurso público será de:", "o": ["dois anos, improrrogável.", "até dois anos, prorrogável sucessivamente, por iguais períodos.", "até quatro anos, prorrogável uma vez, por até dois anos.", "até dois anos, prorrogável uma vez, por igual período."], "a": 3, "c": "O art. 37, III, fixa validade de até dois anos, prorrogável uma única vez por igual período. O termo \"até\" e a prorrogação única por período igual são os pontos mais cobrados.", "ref": "Art. 37, III"}, {"q": "Conforme o art. 37, XVI, da Constituição, é permitida, havendo compatibilidade de horários e observado o teto do inciso XI, a acumulação remunerada de:", "o": ["dois cargos técnicos ou científicos de qualquer natureza.", "um cargo de professor com outro de qualquer natureza, independentemente de compatibilidade de horários.", "dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas.", "dois cargos quaisquer, desde que um deles seja em sociedade de economia mista."], "a": 2, "c": "O art. 37, XVI, admite dois cargos de professor, um de professor com outro de qualquer natureza e dois privativos de profissionais de saúde com profissões regulamentadas, sempre com compatibilidade de horários. O inciso XVII estende a proibição às empresas estatais, portanto o vínculo com sociedade de economia mista não libera a acumulação.", "ref": "Art. 37, XVI"}, {"q": "De acordo com o art. 37, § 6º, da Constituição, as pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros:", "o": ["assegurado o direito de regresso contra o responsável apenas nos casos de dolo.", "assegurado o direito de regresso contra o responsável, independentemente de dolo ou culpa.", "assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.", "vedado o direito de regresso contra o agente público."], "a": 2, "c": "O art. 37, § 6º, prevê a responsabilidade da pessoa jurídica perante o terceiro e o regresso contra o agente nos casos de dolo ou culpa. O erro comum é exigir apenas dolo ou dispensar o elemento subjetivo na ação de regresso.", "ref": "Art. 37, § 6º"}, {"q": "Não integra o rol de órgãos de segurança pública previsto nos incisos do art. 144 da Constituição:", "o": ["a polícia ferroviária federal.", "as polícias penais federal, estaduais e distrital.", "os corpos de bombeiros militares.", "a guarda municipal."], "a": 3, "c": "Os incisos I a VI do art. 144 listam polícia federal, polícia rodoviária federal, polícia ferroviária federal, polícias civis, polícias militares e corpos de bombeiros militares e polícias penais. As guardas municipais aparecem no § 8º, que permite aos Municípios constituí-las para proteção de seus bens, serviços e instalações.", "ref": "Art. 144, I a VI e § 8º"}, {"q": "Nos termos do art. 144 da Constituição, exercer, com exclusividade, as funções de polícia judiciária da União cabe:", "o": ["à polícia rodoviária federal.", "à polícia federal.", "às polícias civis dos Estados, em cooperação com a União.", "à polícia federal e à polícia rodoviária federal, concorrentemente."], "a": 1, "c": "O art. 144, § 1º, IV, atribui à polícia federal, com exclusividade, a polícia judiciária da União. À polícia rodoviária federal cabe o patrulhamento ostensivo das rodovias federais (§ 2º) e às polícias civis a polícia judiciária ressalvada a competência da União (§ 4º).", "ref": "Art. 144, § 1º, IV"}, {"q": "Sobre as atribuições dos órgãos de segurança pública, conforme o art. 144 da Constituição, é correto afirmar:", "o": ["às polícias penais, vinculadas ao órgão administrador do sistema penal da unidade federativa a que pertencem, cabe a segurança dos estabelecimentos penais.", "às polícias civis, dirigidas por delegados de polícia de carreira, incumbem as funções de polícia judiciária e a apuração de infrações penais, inclusive as militares.", "aos corpos de bombeiros militares cabem a polícia ostensiva e a preservação da ordem pública.", "às polícias militares incumbem as funções de polícia judiciária e a execução de atividades de defesa civil."], "a": 0, "c": "O art. 144, § 5º-A, atribui às polícias penais a segurança dos estabelecimentos penais. As polícias civis apuram infrações penais, exceto as militares (§ 4º); polícia ostensiva e preservação da ordem pública cabem às polícias militares e a defesa civil aos corpos de bombeiros militares (§ 5º).", "ref": "Art. 144, § 5º-A"}, {"q": "Conforme o art. 144, § 6º, da Constituição, as polícias militares e os corpos de bombeiros militares:", "o": ["são forças auxiliares e reserva das Forças Armadas e subordinam-se diretamente ao Presidente da República.", "são forças auxiliares e reserva do Exército e subordinam-se, juntamente com a polícia penal federal, aos Governadores dos Estados.", "são forças auxiliares da polícia federal e subordinam-se aos Secretários de Segurança Pública, sem vinculação aos Governadores.", "são forças auxiliares e reserva do Exército e subordinam-se, juntamente com as polícias civis e as polícias penais estaduais e distrital, aos Governadores dos Estados, do Distrito Federal e dos Territórios."], "a": 3, "c": "O art. 144, § 6º, qualifica PM e bombeiros militares como forças auxiliares e reserva do Exército e os subordina, com as polícias civis e as polícias penais estaduais e distrital, aos Governadores. A polícia penal federal não está nessa subordinação, e a reserva é do Exército, não das Forças Armadas em geral.", "ref": "Art. 144, § 6º"}, {"q": "Nos termos do art. 228 da Constituição, são penalmente inimputáveis:", "o": ["os menores de dezoito anos, sujeitos às normas da legislação especial.", "os menores de dezesseis anos, sujeitos às normas da legislação especial.", "os menores de dezoito anos, salvo nos crimes hediondos e nos dolosos contra a vida.", "os menores de vinte e um anos, sujeitos às normas da legislação especial."], "a": 0, "c": "O art. 228 fixa a inimputabilidade penal dos menores de dezoito anos, sem exceções, remetendo-os à legislação especial. A idade de dezesseis anos tem relevância para o voto facultativo (art. 14, § 1º, II, c), não para a imputabilidade.", "ref": "Art. 228"}, {"q": "Quanto à proteção especial da criança, do adolescente e do jovem, o art. 227 da Constituição estabelece que:", "o": ["é dever exclusivo do Estado assegurar à criança, ao adolescente e ao jovem, com absoluta prioridade, o direito à vida e à saúde.", "a aplicação de qualquer medida privativa da liberdade obedecerá aos princípios de brevidade, excepcionalidade e respeito à condição peculiar de pessoa em desenvolvimento.", "a idade mínima para admissão ao trabalho é de dezesseis anos, sem exceções.", "os filhos havidos por adoção poderão receber designação própria quanto à filiação, desde que sem prejuízo de direitos."], "a": 1, "c": "O art. 227, § 3º, V, consagra brevidade, excepcionalidade e respeito à condição peculiar de pessoa em desenvolvimento. O dever é da família, da sociedade e do Estado (caput); o § 3º, I, fala em idade mínima de quatorze anos, observado o art. 7º, XXXIII; e o § 6º proíbe designações discriminatórias relativas à filiação.", "ref": "Art. 227, § 3º, V"}, {"q": "Nos termos do art. 60, § 4º, da Constituição, não será objeto de deliberação a proposta de emenda tendente a abolir:", "o": ["o voto obrigatório.", "a forma republicana de governo.", "o voto direto, secreto, universal e periódico.", "o sistema presidencialista de governo."], "a": 2, "c": "O art. 60, § 4º, protege a forma federativa de Estado, o voto direto, secreto, universal e periódico, a separação dos Poderes e os direitos e garantias individuais. A obrigatoriedade do voto, a república e o presidencialismo não constam do rol: incluir o voto obrigatório é a pegadinha mais comum.", "ref": "Art. 60, § 4º"}];
const TRAPS=[{"t": "Fração da tentativa", "afirmacao": "Salvo disposição em contrário, pune-se a tentativa com a pena do crime consumado diminuída de um sexto a um terço.", "certo": false, "explica": "A fração da tentativa é de um a dois terços (art. 14, parágrafo único). Um sexto a um terço é a fração da participação de menor importância e do erro de proibição evitável.", "ref": "Art. 14, parágrafo único"}, {"t": "Desconhecimento da lei", "afirmacao": "O desconhecimento da lei, quando inevitável, isenta o agente de pena.", "certo": false, "explica": "O art. 21 diz que o desconhecimento da lei é inescusável; o que isenta de pena, se inevitável, é o erro sobre a ilicitude do fato. O desconhecimento da lei é apenas atenuante (art. 65, II).", "ref": "Art. 21"}, {"t": "Arrependimento posterior", "afirmacao": "O arrependimento posterior reduz a pena de qualquer crime, desde que o dano seja reparado até a sentença de primeiro grau.", "certo": false, "explica": "O art. 16 só vale para crimes cometidos sem violência ou grave ameaça à pessoa, e a reparação ou restituição deve ocorrer até o recebimento da denúncia ou da queixa, por ato voluntário do agente.", "ref": "Art. 16"}, {"t": "Desistência voluntária", "afirmacao": "Na desistência voluntária e no arrependimento eficaz, o agente só responde pelos atos já praticados.", "certo": true, "explica": "É o texto do art. 15: quem voluntariamente desiste de prosseguir na execução ou impede que o resultado se produza só responde pelos atos já praticados, afastando-se a tentativa do crime pretendido.", "ref": "Art. 15"}, {"t": "Embriaguez voluntária", "afirmacao": "A embriaguez completa, ainda que voluntária, isenta de pena o agente que estava inteiramente incapaz de entender o caráter ilícito do fato.", "certo": false, "explica": "A embriaguez voluntária ou culposa não exclui a imputabilidade (art. 28, II). Só isenta de pena a embriaguez completa proveniente de caso fortuito ou força maior (art. 28, § 1º).", "ref": "Art. 28, II e § 1º"}, {"t": "Emoção e paixão", "afirmacao": "A emoção e a paixão, quando intensas, excluem a imputabilidade penal.", "certo": false, "explica": "O art. 28, I, diz expressamente que a emoção e a paixão não excluem a imputabilidade penal. A violenta emoção pode, no máximo, reduzir a pena ou atenuá-la nas hipóteses previstas em lei.", "ref": "Art. 28, I"}, {"t": "Tempo do crime", "afirmacao": "Considera-se praticado o crime no momento em que se produziu o resultado.", "certo": false, "explica": "O art. 4º adota a teoria da atividade: o crime se considera praticado no momento da ação ou omissão, ainda que outro seja o momento do resultado. O resultado importa para o lugar do crime (art. 6º).", "ref": "Art. 4º"}, {"t": "Retroatividade benéfica", "afirmacao": "A lei posterior que de qualquer modo favorecer o agente aplica-se aos fatos anteriores, mesmo que já decididos por sentença condenatória transitada em julgado.", "certo": true, "explica": "É a regra do parágrafo único do art. 2º. A coisa julgada não impede a aplicação da lei penal mais benéfica.", "ref": "Art. 2º, parágrafo único"}, {"t": "Lei temporária", "afirmacao": "Encerrado o período de vigência de uma lei temporária, ela deixa de alcançar os fatos praticados durante sua vigência.", "certo": false, "explica": "Pelo art. 3º, a lei excepcional ou temporária, embora decorrido seu período de duração, aplica-se ao fato praticado durante sua vigência (ultratividade).", "ref": "Art. 3º"}, {"t": "Agressão iminente", "afirmacao": "Só há legítima defesa contra agressão atual; contra agressão apenas iminente, o agente deve buscar a autoridade pública.", "certo": false, "explica": "O art. 25 admite a legítima defesa contra injusta agressão atual ou iminente, a direito próprio ou de outrem, usando moderadamente dos meios necessários.", "ref": "Art. 25"}, {"t": "Excesso nas excludentes", "afirmacao": "Em qualquer das excludentes de ilicitude, o agente responde pelo excesso doloso ou culposo.", "certo": true, "explica": "É o texto do parágrafo único do art. 23, que vale para estado de necessidade, legítima defesa, estrito cumprimento de dever legal e exercício regular de direito.", "ref": "Art. 23, parágrafo único"}, {"t": "Coação irresistível", "afirmacao": "Na coação irresistível, coator e coagido respondem pelo crime em concurso de pessoas.", "certo": false, "explica": "Pelo art. 22, se o fato é cometido sob coação irresistível, só é punível o autor da coação. A coação a que o agente podia resistir é apenas atenuante (art. 65, III, c).", "ref": "Art. 22"}, {"t": "Erro sobre a pessoa", "afirmacao": "O erro quanto à pessoa contra a qual o crime é praticado isenta o agente de pena.", "certo": false, "explica": "O art. 20, § 3º, diz que o erro sobre a pessoa não isenta de pena; consideram-se as condições ou qualidades da pessoa que o agente queria atingir, e não as da vítima real.", "ref": "Art. 20, § 3º"}, {"t": "Erro de tipo", "afirmacao": "O erro sobre elemento constitutivo do tipo exclui o dolo, mas permite a punição por crime culposo, se previsto em lei.", "certo": true, "explica": "É o texto do caput do art. 20. Se não houver forma culposa prevista para aquele crime, o fato fica sem punição.", "ref": "Art. 20, caput"}, {"t": "Circunstâncias pessoais", "afirmacao": "As circunstâncias e condições de caráter pessoal nunca se comunicam aos demais coautores e partícipes.", "certo": false, "explica": "O art. 30 ressalva: elas se comunicam quando forem elementares do crime. Por isso o particular que age com o funcionário público, sabendo dessa condição, pode responder por peculato.", "ref": "Art. 30"}, {"t": "Detenção e regime fechado", "afirmacao": "A pena de detenção pode ser fixada desde o início em regime fechado, se a pena for superior a oito anos.", "certo": false, "explica": "Pelo art. 33, a detenção é cumprida em regime semiaberto ou aberto, salvo necessidade de transferência a regime fechado. Regime fechado inicial é próprio da reclusão.", "ref": "Art. 33, caput"}, {"t": "Substituição no crime culposo", "afirmacao": "Nos crimes culposos, a pena privativa de liberdade pode ser substituída por restritiva de direitos qualquer que seja a pena aplicada.", "certo": true, "explica": "O art. 44, I, limita a substituição a penas não superiores a quatro anos nos crimes dolosos sem violência ou grave ameaça, mas ressalva expressamente o crime culposo, qualquer que seja a pena aplicada, desde que presentes os demais requisitos.", "ref": "Art. 44, I"}, {"t": "Limite de cumprimento", "afirmacao": "O tempo de cumprimento das penas privativas de liberdade não pode ser superior a 30 anos.", "certo": false, "explica": "O limite atual é de 40 anos (art. 75). Se a soma das penas ultrapassar esse teto, elas são unificadas para atender ao limite máximo.", "ref": "Art. 75"}, {"t": "Interrupção da prescrição", "afirmacao": "O oferecimento da denúncia interrompe o curso da prescrição.", "certo": false, "explica": "O art. 117, I, fala em recebimento da denúncia ou da queixa, ato do juiz. O oferecimento pelo Ministério Público não interrompe a prescrição.", "ref": "Art. 117, I"}, {"t": "Redução da prescrição pela idade", "afirmacao": "Os prazos de prescrição são reduzidos de metade se o réu for menor de 21 anos na data da sentença.", "certo": false, "explica": "O art. 115 considera o menor de 21 anos ao tempo do crime e o maior de 70 anos na data da sentença. A banca costuma inverter esses marcos.", "ref": "Art. 115"}, {"t": "Prescrição e violência sexual", "afirmacao": "A redução pela metade dos prazos de prescrição para o maior de 70 anos na data da sentença não se aplica se o crime envolver violência sexual contra a mulher.", "certo": true, "explica": "O art. 115 traz essa ressalva expressa ao final, válida tanto para o menor de 21 quanto para o maior de 70 anos.", "ref": "Art. 115"}, {"t": "Escusa absolutória e idade", "afirmacao": "O filho que furta, sem violência, dinheiro do pai de 65 anos é isento de pena, pois o crime foi cometido contra ascendente.", "certo": false, "explica": "A isenção do art. 181, II, não se aplica se o crime é praticado contra pessoa com idade igual ou superior a 60 anos (art. 183, III).", "ref": "Art. 183, III"}, {"t": "Estranho que participa", "afirmacao": "A isenção de pena nos crimes patrimoniais entre parentes não se estende ao estranho que participa do crime.", "certo": true, "explica": "O art. 183, II, diz que as regras dos arts. 181 e 182 não se aplicam ao estranho que participa do crime.", "ref": "Art. 183, II"}, {"t": "Receptação sem autor conhecido", "afirmacao": "A receptação só pode ser punida se o autor do crime anterior for identificado e condenado.", "certo": false, "explica": "O art. 180, § 4º, diz que a receptação é punível ainda que desconhecido ou isento de pena o autor do crime de que proveio a coisa.", "ref": "Art. 180, § 4º"}, {"t": "Pena do latrocínio", "afirmacao": "No roubo, se da violência resulta morte, a pena é de reclusão de 20 a 30 anos, e multa.", "certo": false, "explica": "A pena atual do latrocínio é de reclusão de 24 a 30 anos, e multa (art. 157, § 3º, II).", "ref": "Art. 157, § 3º, II"}, {"t": "Pena do furto simples", "afirmacao": "O furto simples é punido com reclusão de 1 a 4 anos, e multa.", "certo": false, "explica": "A pena atual do furto simples é de reclusão de 1 a 6 anos, e multa (art. 155, caput).", "ref": "Art. 155, caput"}, {"t": "Feminicídio como qualificadora", "afirmacao": "O feminicídio é uma das qualificadoras do homicídio previstas no § 2º do art. 121.", "certo": false, "explica": "O feminicídio é hoje crime autônomo, previsto no art. 121-A, com pena de reclusão de 20 a 40 anos.", "ref": "Art. 121-A"}, {"t": "Retorsão imediata", "afirmacao": "Na injúria, o juiz pode deixar de aplicar a pena no caso de retorsão imediata que consista em outra injúria.", "certo": true, "explica": "É a hipótese do art. 140, § 1º, II. O inciso I prevê o mesmo quando o ofendido, de forma reprovável, provocou diretamente a injúria.", "ref": "Art. 140, § 1º, II"}, {"t": "Exceção da verdade na difamação", "afirmacao": "Na difamação, admite-se a exceção da verdade sempre que o acusado puder provar que o fato imputado é verdadeiro.", "certo": false, "explica": "O parágrafo único do art. 139 só admite a exceção da verdade se o ofendido é funcionário público e a ofensa é relativa ao exercício de suas funções.", "ref": "Art. 139, parágrafo único"}, {"t": "Reparação no peculato culposo", "afirmacao": "No peculato culposo, a reparação do dano após a sentença irrecorrível também extingue a punibilidade.", "certo": false, "explica": "Pelo art. 312, § 3º, a reparação extingue a punibilidade apenas se precede a sentença irrecorrível; se é posterior, reduz de metade a pena imposta.", "ref": "Art. 312, § 3º"}, {"t": "Funcionário sem remuneração", "afirmacao": "Para os efeitos penais, é funcionário público quem exerce função pública, ainda que de forma transitória e sem remuneração.", "certo": true, "explica": "É o conceito amplo do art. 327, que ainda equipara quem trabalha em entidade paraestatal ou em empresa contratada para atividade típica da Administração (§ 1º).", "ref": "Art. 327"}, {"t": "Exigir e solicitar", "afirmacao": "O verbo da concussão é solicitar vantagem indevida, enquanto o da corrupção passiva é exigir.", "certo": false, "explica": "É o contrário: exigir é concussão (art. 316); solicitar, receber ou aceitar promessa é corrupção passiva (art. 317).", "ref": "Arts. 316 e 317"}, {"t": "Verbos da corrupção ativa", "afirmacao": "O art. 333 pune o particular que oferece, promete ou dá vantagem indevida a funcionário público.", "certo": false, "explica": "Os verbos do art. 333 são apenas oferecer ou prometer. O verbo dar aparece, por exemplo, no art. 343 (suborno de testemunha ou perito), mas não na corrupção ativa.", "ref": "Art. 333"}, {"t": "Ação penal na ameaça", "afirmacao": "O crime de ameaça é sempre de ação penal pública condicionada à representação.", "certo": false, "explica": "O art. 147, § 2º, exige representação, e function months(p){const m=norm(p).match(/de (\d+) (dias?|mes(?:es)?|anos?)?\s*a (\d+) (dias?|mes(?:es)?|anos?)/);if(!m)return [0,0];const u=x=>/dia/.test(x||'')?1/30:/mes/.test(x||'')?1:12;const u2=u(m[4]),u1=m[2]?u(m[2]):u2;return [m[1]*u1,m[3]*u2];}

    const lbl=x=>`${x.t} (art. ${x.n})`;

  const num=(q.match(/\b(\d{1,3}(?:-[a-zA-Z])?)\b/)||[])[1];
  if(num&&byN[num.toUpperCase()]){const a=byN[num.toUpperCase()];return fmt(a);}
  const sc=ARTS.map(a=>{const tt=norm(a.t+' '+a.k),b=norm(a.s+' '+a.e);let s=0;t.forEach(w=>{if(tt.includes(w))s+=3;else if(b.includes(w))s+=1;});return [s,a];}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  if(!sc.length)return 'Não encontrei esse assunto. Tente o nome do crime ou o número do artigo, como "155" ou "estelionato".';
  const c=CMPS.find(c=>sc.slice(0,3).filter(x=>c.a.includes(x[1].n)).length>=2&&sc[1]&&sc[1][0]>=3);
  if(c)return `<b>${c.t}</b><br>${c.r}<br><a href="#cmp-${c.id}">Ver a comparação</a>`;
  return fmt(sc[0][1]);
}
const fmt=a=>`<b>Art. ${a.n}, ${esc(a.t.toLowerCase())}.</b> ${esc(a.s)}<br><b>${kLbl(a)}:</b> ${esc(a.k)}${a.pena?`<br><b>Pena:</b> ${esc(a.pena)}`:''}<br><a href="#artigo-${a.n}">Abrir o artigo</a>`;

/* ================= AJUSTES ================= */
function vSet(){
  $('#app').innerHTML=`<h1>Ajustes</h1>
  <section class="panel" style="margin-top:20px">
    <div class="set"><div><h3>Lembrete diário</h3><p class="muted small">${S.remind.on?'Todos os dias às '+S.remind.time:'Desligado'}</p></div><button class="btn soft sm" onclick="remindSheet()">${S.remind.on?'Alterar':'Configurar'}</button></div>
    <div class="set"><div><h3>Meta diária</h3><p class="muted small">${S.goal} artigos por dia</p></div><div class="row" style="gap:6px">${[3,5,10].map(g=>`<button class="btn sm ${S.goal===g?'navy':'soft'}" onclick="S.goal=${g};save();vSet()">${g}</button>`).join('')}</div></div>
    <div class="set"><div><h3>Modo escuro</h3><p class="muted small">Mais confortável para estudar à noite</p></div><button class="switch ${S.theme==='dark'?'on':''}" aria-label="Modo escuro" onclick="S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save();vSet()"></button></div>
    <div class="set"><div><h3>Instalar no celular</h3><p class="muted small">Abra no navegador do celular, toque no menu e em "Adicionar à tela inicial".</p></div></div>
  </section>
  <section class="panel" style="margin-top:16px"><h2>Modo demonstração</h2><p class="muted small" style="margin:6px 0 14px">Simule o que cada comprador vê. Toque num produto para liberar ou bloquear.</p>
    <div class="opts">${Object.entries(PRODUCTS).map(([k,p])=>`<button class="${S.owned[k]?'on':''}" onclick="togOwn('${k}')">${p.name.replace('PenalFlux ','')}</button>`).join('')}</div>
    <div class="row" style="margin-top:16px;flex-wrap:wrap;gap:8px"><button class="btn soft sm" onclick="Object.keys(PRODUCTS).forEach(k=>S.owned[k]=true);save();toast('Tudo liberado');route()">Liberar tudo</button><button class="btn soft sm" onclick="S.owned={basico:true};save();toast('Voltou ao Básico');route()">Só o Básico</button><button class="btn soft sm" onclick="S=JSON.parse(JSON.stringify(DEF));save();document.documentElement.dataset.theme='light';go('hoje');setTimeout(onboard,300)">Apagar meus dados</button></div>
  </section>${legal}`;
}
function togOwn(k){if(k==='basico')return toast('O Básico é a compra de entrada');S.owned[k]?delete S.owned[k]:S.owned[k]=true;save();route();}

/* ================= SHEETS ================= */
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#scrim').classList.add('show');setTimeout(()=>{const f=$('#sheet').querySelector('button,input');f&&f.focus();},50);}
function closeSheet(){$('#scrim').classList.remove('show');}
$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
const li=t=>`<li>${IC.check}<span>${t}</span></li>`;
function offer(id){
  const p=PRODUCTS[id],down=Object.keys(PRODUCTS).find(k=>PRODUCTS[k].of===id),up=id==='completo'&&S.owned.basico,price=up?20:p.price;
  openSheet(`<div class="row">${cover(id)}<div><span class="muted xs" style="font-weight:700">${{entrada:'Plano',bump:'Complemento',upsell:'Próximo nível',downsell:'Oferta especial'}[p.tier]}</span><h2>${p.name}</h2><p class="price" style="margin-top:4px">${p.old?`<s>${brl(p.old)}</s>`:''}${up?brl(20)+' <span class="muted small" style="font-weight:600">de diferença</span>':brl(p.price)+(p.per||'')}</p></div></div>
  <p style="margin-top:14px">${p.desc}</p><ul>${p.items.map(li).join('')}</ul>
  <button class="btn go block" onclick="checkout('${id}',${price})">Desbloquear agora</button>
  ${down&&!S.owned[down]?`<button class="btn soft block" style="margin-top:8px" onclick="offer('${down}')">Prefiro a versão de ${brl(PRODUCTS[down].price)}${PRODUCTS[down].per||''}</button>`:''}
  <button class="btn block" style="margin-top:4px;color:var(--ink2)" onclick="closeSheet()">Agora não</button>`);
}
let pay='pix';
function checkout(id,price){const p=PRODUCTS[id];
  openSheet(`<h2>Finalizar compra</h2><p class="muted">${p.name}, ${brl(price)}${p.per||''}</p><form id="cf"><div class="pay">${['pix','cartão','boleto'].map(m=>`<button type="button" class="${pay===m?'on':''}" data-pm="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
  <p class="note">Modo demonstração: nenhuma cobrança é feita. Na versão publicada, este passo abre o checkout (Kiwify, Hotmart, Stripe ou Mercado Pago) e o acesso é liberado automaticamente.</p>
  <button class="btn go block" style="margin-top:14px">Confirmar compra (demo)</button><button type="button" class="btn block" style="margin-top:4px;color:var(--ink2)" onclick="closeSheet()">Cancelar</button></form>`);
  document.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{pay=b.dataset.pm;document.querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#cf').onsubmit=e=>{e.preventDefault();S.owned[id]=true;save();closeSheet();toast(`${p.name} liberado`);route();};
}
function remindSheet(){let time=S.remind.time;
  openSheet(`<h2>Lembrete diário</h2><p class="muted" style="margin-top:4px">Escolha o horário em que você costuma ter 10 minutos livres.</p>
  <div class="opts" style="margin-top:16px">${['07:00','12:30','19:00','21:30'].map(t=>`<button data-tm="${t}" class="${time===t?'on':''}">${t}</button>`).join('')}</div>
  <div class="field"><label for="rt">Outro horário</label><input type="time" id="rt" value="${time}"></div>
  <button class="btn go block" style="margin-top:18px" id="rs">Ativar lembrete</button>${S.remind.on?'<button class="btn soft block" style="margin-top:8px" id="roff">Desligar lembrete</button>':''}
  <p class="note">Com o app aberto, o PenalFlux avisa no horário e mostra o lembrete no Início. Notificações com o celular bloqueado chegam na versão instalada (PWA ou app nas lojas).</p>`);
  document.querySelectorAll('[data-tm]').forEach(b=>b.onclick=()=>{time=b.dataset.tm;$('#rt').value=time;document.querySelectorAll('[data-tm]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#rt').onchange=e=>{time=e.target.value;};
  $('#rs').onclick=()=>{S.remind={on:true,time,sent:''};save();try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});}catch(e){}closeSheet();toast(`Lembrete ativado para as ${time}`);route();};
  const off=$('#roff');if(off)off.onclick=()=>{S.remind.on=false;save();closeSheet();toast('Lembrete desligado');route();};
}
setInterval(()=>{if(!S.remind.on)return;const now=new Date().toTimeString().slice(0,5);if(now>=S.remind.time&&S.remind.sent!==today()&&doneToday()<S.goal){S.remind.sent=today();save();const m=`Faltam ${S.goal-doneToday()} artigos para sua meta de hoje.`;try{if(Notification.permission==='granted')new Notification('Hora de estudar no PenalFlux',{body:m});}catch(e){}toast(m);}},30000);
$('#bellBtn').onclick=remindSheet;$('#setBtn').onclick=()=>go('ajustes');
function onboard(){let obj=S.obj,goal=S.goal;
  openSheet(`<svg class="seal" width="56" height="56" style="background:none;box-shadow:none;margin-bottom:14px;width:56px;height:56px" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EBD08E"/><stop offset=".5" stop-color="#C9A24A"/><stop offset="1" stop-color="#8E6C24"/></linearGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2B52"/><stop offset="1" stop-color="#0B1530"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg3)"/>
  <g transform="rotate(-45 256 256)">
    <circle cx="168" cy="256" r="92" fill="none" stroke="url(#g3)" stroke-width="30"/>
    <path d="M258 241 H430 a14 14 0 0 1 0 30 H258 Z" fill="url(#g3)"/>
    <rect x="352" y="262" width="26" height="54" rx="6" fill="url(#g3)"/>
    <rect x="394" y="262" width="26" height="40" rx="6" fill="url(#g3)"/>
    <g transform="rotate(45 168 256)"><text x="168" y="300" text-anchor="middle" font-family="DM Serif Display, Georgia, serif" font-size="128" fill="#EBD08E">§</text></g>
  </g>
</svg>
<h2>Bem-vindo ao PenalFlux</h2><p class="muted" style="margin-top:4px">Os 361 artigos do Código Penal explicados pelo verbo de cada crime. Três perguntas rápidas:</p>
  <div class="field"><label for="on">Como podemos te chamar?</label><input id="on" placeholder="Seu primeiro nome" value="${esc(S.name)}"></div>
  <div class="field"><label>Para que você está estudando?</label><div class="opts">${['Concurso policial','OAB','Faculdade de Direito','Outro concurso','Curiosidade'].map(o=>`<button data-o="${o}" class="${obj===o?'on':''}">${o}</button>`).join('')}</div></div>
  <div class="field"><label>Quantos artigos por dia?</label><div class="opts" id="og">${[3,5,10].map(g=>`<button data-g="${g}" class="${goal===g?'on':''}">${g} por dia</button>`).join('')}</div></div>
  <button class="btn gold block" style="margin-top:20px" id="ost">Começar a estudar</button>`);
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{obj=b.dataset.o;document.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('on',x===b));});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{goal=+b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#ost').onclick=()=>{S.name=$('#on').value.trim().split(' ')[0];S.obj=obj;S.goal=goal;S.onb=true;save();closeSheet();route();setTimeout(remindSheet,400);};
}
route();if(!S.onb)setTimeout(onboard,350);
</script>
</body>
