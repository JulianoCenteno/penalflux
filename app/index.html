culposo:","Pena - detenção, de seis meses a dois anos."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"271","t":"Corrupção ou poluição de água potável","k":"corromper ou poluir","s":"Pune quem suja ou contamina água potável, deixando-a imprópria para beber ou prejudicial à saúde. A pena é reclusão, de 2 a 5 anos.","e":"Uma fábrica despeja resíduos químicos no poço que abastece uma comunidade rural.","d":"Diferente do envenenamento, que tem pena bem maior: aqui a água é poluída ou corrompida, não envenenada. Na forma culposa, a pena é detenção, de 2 meses a 1 ano.","pena":"Reclusão, de 2 a 5 anos.","rub":"Corrupção ou poluição de água potável","caput":"Corromper ou poluir água potável, de uso comum ou particular, tornando-a imprópria para consumo ou nociva à saúde:","txt":["Art. 271 - Corromper ou poluir água potável, de uso comum ou particular, tornando-a imprópria para consumo ou nociva à saúde:","Pena - reclusão, de dois a cinco anos.","Modalidade culposa","Parágrafo único - Se o crime é culposo:","Pena - detenção, de dois meses a um ano."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"272","t":"Falsificação de alimentos","k":"corromper, adulterar ou falsificar","s":"Pune quem falsifica, adultera ou altera alimento destinado a consumo, tornando-o nocivo à saúde ou diminuindo seu valor nutritivo. A pena é reclusão, de 4 a 8 anos, e multa.","e":"Um laticínio mistura água e soda cáustica ao leite para aumentar o volume vendido.","d":"Também responde quem fabrica, vende, guarda para vender ou distribui o produto adulterado, e a regra vale para bebidas, com ou sem álcool. Há forma culposa: detenção, de 1 a 2 anos, e multa.","pena":"Reclusão, de 4 a 8 anos, e multa.","rub":"Falsificação, corrupção, adulteração ou alteração de substância ou produtos alimentícios","caput":"Corromper, adulterar, falsificar ou alterar substância ou produto alimentício destinado a consumo, tornando-o nociva à saúde ou reduzindo-lhe o valor nutritivo:","txt":["Art. 272 - Corromper, adulterar, falsificar ou alterar substância ou produto alimentício destinado a consumo, tornando-o nociva à saúde ou reduzindo-lhe o valor nutritivo:","Pena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa.","§ 1º-A - Incorre nas penas deste artigo quem fabrica, vende, expõe à venda, importa, tem em depósito para vender ou, de qualquer forma, distribui ou entrega a consumo a substância alimentícia ou o produto falsificado, corrompido ou adulterado.","§ 1º - Está sujeito às mesmas penas quem pratica as ações previstas neste artigo em relação a bebidas, com ou sem teor alcoólico.","Modalidade culposa","§ 2º - Se o crime é culposo:","Pena - detenção, de 1 (um) a 2 (dois) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"273","t":"Falsificação de remédios","k":"falsificar ou adulterar","s":"Pune quem falsifica, adultera ou altera produto destinado a tratamento de saúde ou uso medicinal. A pena é reclusão, de 10 a 15 anos, e multa.","e":"Uma quadrilha vende pela internet comprimidos falsos de remédio para emagrecer, feitos de farinha.","d":"Entram também cosméticos, saneantes (produtos de limpeza), matérias-primas e produtos de diagnóstico. E recebe a mesma pena quem vende produto sem registro na vigilância sanitária ou de procedência ignorada, mesmo que não seja falsificado.","pena":"Reclusão, de 10 a 15 anos, e multa.","rub":"Falsificação, corrupção, adulteração ou alteração de produto destinado a fins terapêuticos ou medicinais","caput":"Falsificar, corromper, adulterar ou alterar produto destinado a fins terapêuticos ou medicinais:","txt":["Art. 273 - Falsificar, corromper, adulterar ou alterar produto destinado a fins terapêuticos ou medicinais:","Pena - reclusão, de 10 (dez) a 15 (quinze) anos, e multa.","§ 1º - Nas mesmas penas incorre quem importa, vende, expõe à venda, tem em depósito para vender ou, de qualquer forma, distribui ou entrega a consumo o produto falsificado, corrompido, adulterado ou alterado.","§ 1º-A - Incluem-se entre os produtos a que se refere este artigo os medicamentos, as matérias-primas, os insumos farmacêuticos, os cosméticos, os saneantes e os de uso em diagnóstico.","§ 1º-B - Está sujeito às penas deste artigo quem pratica as ações previstas no § 1º em relação a produtos em qualquer das seguintes condições:","I - sem registro, quando exigível, no órgão de vigilância sanitária competente;","II - em desacordo com a fórmula constante do registro previsto no inciso anterior;","III - sem as características de identidade e qualidade admitidas para a sua comercialização;","IV - com redução de seu valor terapêutico ou de sua atividade;","V - de procedência ignorada;","VI - adquiridos de estabelecimento sem licença da autoridade sanitária competente.","Modalidade culposa","§ 2º - Se o crime é culposo:","Pena - detenção, de 1 (um) a 3 (três) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"274","t":"Processo proibido ou substância não permitida","k":"empregar","s":"Pune quem usa, na fabricação de produto para consumo, corante, conservante, aroma ou outra substância que a legislação sanitária não permite expressamente. A pena é reclusão, de 1 a 5 anos, e multa.","e":"Uma fábrica de salsichas usa um corante proibido pela vigilância sanitária para deixar o produto mais vermelho.","d":"Não é preciso provar que o produto fez mal a alguém: basta usar substância não permitida. Quem apenas vende esse produto responde por outro crime, previsto logo adiante.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Emprego de processo proibido ou de substância não permitida","caput":"Empregar, no fabrico de produto destinado a consumo, revestimento, gaseificação artificial, matéria corante, substância aromática, anti-séptica, conservadora ou qualquer outra não expressamente permitida pela legislação sanitária:","txt":["Art. 274 - Empregar, no fabrico de produto destinado a consumo, revestimento, gaseificação artificial, matéria corante, substância aromática, anti-séptica, conservadora ou qualquer outra não expressamente permitida pela legislação sanitária:","Pena - reclusão, de 1 (um) a 5 (cinco) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"275","t":"Embalagem com falsa indicação","k":"inculcar","s":"Pune quem afirma na embalagem de alimento ou remédio que existe uma substância que não está no produto, ou que está em quantidade menor que a anunciada. A pena é reclusão, de 1 a 5 anos, e multa. Inculcar significa apregoar, fazer crer.","e":"Uma marca de suplemento diz no rótulo que o produto contém colágeno, mas ele não tem nada dessa substância.","d":"O crime está na informação falsa da embalagem, não na adulteração do produto em si. Quem apenas vende o produto nessas condições responde por crime próprio, previsto logo adiante.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Invólucro ou recipiente com falsa indicação","caput":"Inculcar, em invólucro ou recipiente de produtos alimentícios, terapêuticos ou medicinais, a existência de substância que não se encontra em seu conteúdo ou que nele existe em quantidade menor que a mencionada:","txt":["Art. 275 - Inculcar, em invólucro ou recipiente de produtos alimentícios, terapêuticos ou medicinais, a existência de substância que não se encontra em seu conteúdo ou que nele existe em quantidade menor que a mencionada:","Pena - reclusão, de 1 (um) a 5 (cinco) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"276","t":"Venda de produto irregular","k":"vender","s":"Pune quem vende, expõe à venda, guarda para vender ou entrega a consumo produto com substância proibida ou com embalagem enganosa, nas condições dos arts. 274 e 275. A pena é reclusão, de 1 a 5 anos, e multa.","e":"Um mercado continua vendendo um suco que sabe ter rótulo com informação falsa sobre vitaminas.","d":"Pune quem comercializa, não quem fabrica ou rotula: estes respondem pelos arts. 274 e 275, com a mesma pena.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Produto ou substância nas condições dos dois artigos anteriores","caput":"Vender, expor à venda, ter em depósito para vender ou, de qualquer forma, entregar a consumo produto nas condições dos arts. 274 e 275.","txt":["Art. 276 - Vender, expor à venda, ter em depósito para vender ou, de qualquer forma, entregar a consumo produto nas condições dos arts. 274 e 275.","Pena - reclusão, de 1 (um) a 5 (cinco) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"277","t":"Substância destinada à falsificação","k":"vender ou ceder","s":"Pune quem vende, expõe à venda, guarda ou cede substância destinada a falsificar alimentos ou remédios. A pena é reclusão, de 1 a 5 anos, e multa.","e":"Um comerciante vende a padarias um pó químico próprio para imitar o leite em produtos lácteos.","d":"Aqui basta ter em depósito, sem a expressão para vender que aparece nos artigos vizinhos. O crime pune um ato preparatório: não é preciso que a falsificação chegue a acontecer.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Substância destinada à falsificação","caput":"Vender, expor à venda, ter em depósito ou ceder substância destinada à falsificação de produtos alimentícios, terapêuticos ou medicinais:","txt":["Art. 277 - Vender, expor à venda, ter em depósito ou ceder substância destinada à falsificação de produtos alimentícios, terapêuticos ou medicinais:","Pena - reclusão, de 1 (um) a 5 (cinco) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"278","t":"Outras substâncias nocivas à saúde","k":"fabricar ou vender","s":"Pune quem fabrica, vende, guarda para vender ou entrega a consumo coisa ou substância prejudicial à saúde, mesmo que não seja alimento nem remédio. A pena é detenção, de 1 a 3 anos, e multa.","e":"Uma loja vende brinquedos com tinta tóxica que pode intoxicar crianças.","d":"É um tipo residual: vale para produtos que não são alimento nem remédio. Na forma culposa, detenção, de 2 meses a 1 ano.","pena":"Detenção, de 1 a 3 anos, e multa.","rub":"Outras substâncias nocivas à saúde pública","caput":"Fabricar, vender, expor à venda, ter em depósito para vender ou, de qualquer forma, entregar a consumo coisa ou substância nociva à saúde, ainda que não destinada à alimentação ou a fim medicinal:","txt":["Art. 278 - Fabricar, vender, expor à venda, ter em depósito para vender ou, de qualquer forma, entregar a consumo coisa ou substância nociva à saúde, ainda que não destinada à alimentação ou a fim medicinal:","Pena - detenção, de um a três anos, e multa.","Modalidade culposa","Parágrafo único - Se o crime é culposo:","Pena - detenção, de dois meses a um ano."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"280","t":"Medicamento em desacordo com receita","k":"fornecer","s":"Pune quem entrega remédio diferente do que foi prescrito na receita médica. A pena é detenção, de 1 a 3 anos, ou multa.","e":"O balconista da farmácia troca o remédio receitado por outro, de dosagem diferente, sem consultar o médico.","d":"A pena do caput é alternativa (ou multa). Existe forma culposa, com detenção, de 2 meses a 1 ano, que é a mais comum na prática, quando há troca por distração.","pena":"Detenção, de 1 a 3 anos, ou multa.","rub":"Medicamento em desacordo com receita médica","caput":"Fornecer substância medicinal em desacordo com receita médica:","txt":["Art. 280 - Fornecer substância medicinal em desacordo com receita médica:","Pena - detenção, de um a três anos, ou multa.","Modalidade culposa","Parágrafo único - Se o crime é culposo:","Pena - detenção, de dois meses a um ano."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"282","t":"Exercício ilegal da medicina","k":"exercer","s":"Pune quem atua como médico, veterinário, dentista ou farmacêutico sem autorização legal ou passando dos limites dela, mesmo de graça. A pena é detenção, de 6 meses a 2 anos.","e":"Um homem sem diploma abre um consultório e passa a atender pacientes como se fosse médico.","d":"Também comete o crime quem exerce a profissão com a habilitação suspensa ou cancelada. Se houver fim de lucro, aplica-se multa; se houver lesão grave ou morte, o agente responde também por lesão corporal ou homicídio.","pena":"Detenção, de 6 meses a 2 anos.","rub":"Exercício ilegal da medicina, medicina veterinária, arte dentária ou farmacêutica","caput":"Exercer, ainda que a título gratuito, a profissão de médico, médico veterinário, dentista ou farmacêutico, sem autorização legal ou excedendo-lhe os limites:","txt":["Art. 282. Exercer, ainda que a título gratuito, a profissão de médico, médico veterinário, dentista ou farmacêutico, sem autorização legal ou excedendo-lhe os limites:","Pena - detenção, de 6 (seis) meses a 2 (dois) anos.","§ 1º Se o crime é praticado com o fim de lucro, aplica-se também multa.","§ 2º Se do crime resulta lesão corporal de natureza grave ou gravíssima, responde também o agente pelos crimes descritos nos §§ 1º e 2º do art. 129 deste Código.","§ 3º Se do crime resulta morte, responde também o agente pelo crime de homicídio, nos termos do art. 121 deste Código.","§ 4º Se do crime resulta lesão ou morte de animal, responde também o agente pelo crime previsto no art. 32 da Lei nº 9.605, de 12 de fevereiro de 1998 (Lei dos Crimes Ambientais).","§ 5º Incorre na conduta prevista no caput deste artigo o agente que exerce a profissão durante o período de suspensão ou após o cancelamento da habilitação ou do registro profissional."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"283","t":"Charlatanismo","k":"inculcar ou anunciar","s":"Pune quem anuncia ou promete cura por meio secreto ou infalível. A pena é detenção, de 3 meses a 1 ano, e multa.","e":"Um vendedor anuncia nas redes sociais um chá que garante a cura de qualquer câncer em uma semana.","d":"O charlatão pode até ser médico: o crime é prometer cura secreta ou infalível. Já o curandeiro, do artigo seguinte, é quem trata sem ter habilitação.","pena":"Detenção, de 3 meses a 1 ano, e multa.","rub":"Charlatanismo","caput":"Inculcar ou anunciar cura por meio secreto ou infalível:","txt":["Art. 283 - Inculcar ou anunciar cura por meio secreto ou infalível:","Pena - detenção, de três meses a um ano, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"284","t":"Curandeirismo","k":"exercer o curandeirismo","s":"Pune quem, sem ser profissional de saúde, faz diagnósticos, usa gestos ou palavras para tratar doenças, ou receita e aplica substâncias habitualmente. A pena é detenção, de 6 meses a 2 anos.","e":"Uma pessoa atende doentes em casa todos os dias, diagnostica doenças e manda tomar garrafadas no lugar do remédio.","d":"Se for praticado mediante remuneração, aplica-se também multa. Não confunda com o charlatanismo, que é promessa de cura secreta ou infalível.","pena":"","rub":"Curandeirismo","caput":"Exercer o curandeirismo:","txt":["Art. 284 - Exercer o curandeirismo:","I - prescrevendo, ministrando ou aplicando, habitualmente, qualquer substância;","II - usando gestos, palavras ou qualquer outro meio;","III - fazendo diagnósticos:","Pena - detenção, de seis meses a dois anos.","Parágrafo único - Se o crime é praticado mediante remuneração, o agente fica também sujeito à multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"285","t":"Forma qualificada","k":"art. 258","s":"Manda aplicar os aumentos de pena do art. 258 (por lesão grave ou morte) aos crimes contra a saúde pública deste capítulo, com exceção da epidemia (art. 267).","e":"Se uma pessoa morre por beber água poluída de propósito, a pena do crime de poluição é aplicada em dobro.","d":"A exceção é a epidemia, porque ela já tem regra própria para a morte, com pena em dobro no próprio artigo.","pena":"","rub":"Forma qualificada","caput":"Aplica-se o disposto no art. 258 aos crimes previstos neste Capítulo, salvo quanto ao definido no art. 267.","txt":["Art. 285 - Aplica-se o disposto no art. 258 aos crimes previstos neste Capítulo, salvo quanto ao definido no art. 267."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"286","t":"Incitação ao crime","k":"incitar","s":"Pune quem estimula publicamente as pessoas a cometerem crime. A pena é detenção, de 3 a 6 meses, ou multa.","e":"Um influenciador grava vídeo convocando seguidores a saquearem lojas de um bairro.","d":"A incitação precisa ser pública e a crime (não a mera contravenção). Também é punido quem incita publicamente animosidade entre as Forças Armadas, ou delas contra os poderes constitucionais, as instituições civis ou a sociedade.","pena":"Detenção, de 3 a 6 meses, ou multa.","rub":"Incitação ao crime","caput":"Incitar, publicamente, a prática de crime:","txt":["Art. 286 - Incitar, publicamente, a prática de crime:","Pena - detenção, de três a seis meses, ou multa.","Parágrafo único. Incorre na mesma pena quem incita, publicamente, animosidade entre as Forças Armadas, ou delas contra os poderes constitucionais, as instituições civis ou a sociedade."],"ti":16,"ch":""},{"n":"287","t":"Apologia de crime ou criminoso","k":"fazer apologia","s":"Pune quem elogia ou exalta publicamente um crime já cometido ou o autor de um crime. A pena é detenção, de 3 a 6 meses, ou multa.","e":"Um homem faz discurso em praça pública exaltando um assassino como herói pelo crime cometido.","d":"Incitar é estimular crime futuro; fazer apologia é elogiar crime ou criminoso. Ambos exigem que a conduta seja pública.","pena":"Detenção, de 3 a 6 meses, ou multa.","rub":"Apologia de crime ou criminoso","caput":"Fazer, publicamente, apologia de fato criminoso ou de autor de crime:","txt":["Art. 287 - Fazer, publicamente, apologia de fato criminoso ou de autor de crime:","Pena - detenção, de três a seis meses, ou multa."],"ti":16,"ch":""},{"n":"288","t":"Associação criminosa","k":"associarem-se","s":"Pune a união de 3 ou mais pessoas com o objetivo específico de cometer crimes. A pena é reclusão, de 1 a 3 anos.","e":"Quatro amigos se organizam de forma estável para aplicar golpes em idosos pelo telefone.","d":"Bastam 3 pessoas e o crime existe mesmo que nenhum crime planejado seja cometido. A pena aumenta até a metade se a associação é armada ou tem criança ou adolescente, e quem contrata crime de integrante da associação recebe a mesma pena do caput.","pena":"Reclusão, de 1 a 3 anos.","rub":"Associação Criminosa","caput":"Associarem-se 3 (três) ou mais pessoas, para o fim específico de cometer crimes:","txt":["Art. 288. Associarem-se 3 (três) ou mais pessoas, para o fim específico de cometer crimes:","Pena - reclusão, de 1 (um) a 3 (três) anos.","§ 1º A pena aumenta-se até a metade se a associação é armada ou se houver a participação de criança ou adolescente.","§ 2º Incorre na pena prevista no caput deste artigo quem, de qualquer modo, solicitar ou contratar o cometimento de crime a integrante de associação criminosa, independentemente da aplicação da pena correspondente ao crime solicitado ou contratado."],"ti":16,"ch":""},{"n":"288-A","t":"Constituição de milícia privada","k":"constituir ou integrar","s":"Pune quem cria, organiza, integra, mantém ou financia milícia, grupo paramilitar ou esquadrão para praticar crimes previstos no Código Penal. A pena é reclusão, de 4 a 8 anos.","e":"Um grupo armado passa a cobrar taxas de segurança de moradores e comerciantes de um bairro e financia suas armas com esse dinheiro.","d":"Não há número mínimo de integrantes no texto, ao contrário da associação criminosa, que exige um mínimo de pessoas. Quem apenas custeia (paga) a milícia também comete o crime.","pena":"Reclusão, de 4 a 8 anos.","rub":"Constituição de milícia privada","caput":"Constituir, organizar, integrar, manter ou custear organização paramilitar, milícia particular, grupo ou esquadrão com a finalidade de praticar qualquer dos crimes previstos neste Código:","txt":["Art. 288-A. Constituir, organizar, integrar, manter ou custear organização paramilitar, milícia particular, grupo ou esquadrão com a finalidade de praticar qualquer dos crimes previstos neste Código:","Pena - reclusão, de 4 (quatro) a 8 (oito) anos."],"ti":16,"ch":""},{"n":"289","t":"Moeda falsa","k":"falsificar","s":"Pune quem fabrica ou altera moeda ou cédula verdadeira, do Brasil ou do estrangeiro. A pena é reclusão, de 3 a 12 anos, e multa.","e":"Um homem imprime notas falsas de real numa gráfica caseira.","d":"Quem recebe nota falsa de boa-fé e repassa depois de saber da falsidade tem pena bem menor: detenção, de 6 meses a 2 anos, e multa. Já quem importa, compra, guarda ou põe em circulação moeda falsa recebe a mesma pena de quem falsifica.","pena":"Reclusão, de 3 a 12 anos, e multa.","rub":"Moeda Falsa","caput":"Falsificar, fabricando-a ou alterando-a, moeda metálica ou papel-moeda de curso legal no país ou no estrangeiro:","txt":["Art. 289 - Falsificar, fabricando-a ou alterando-a, moeda metálica ou papel-moeda de curso legal no país ou no estrangeiro:","Pena - reclusão, de três a doze anos, e multa.","§ 1º - Nas mesmas penas incorre quem, por conta própria ou alheia, importa ou exporta, adquire, vende, troca, cede, empresta, guarda ou introduz na circulação moeda falsa.","§ 2º - Quem, tendo recebido de boa-fé, como verdadeira, moeda falsa ou alterada, a restitui à circulação, depois de conhecer a falsidade, é punido com detenção, de seis meses a dois anos, e multa.","§ 3º - É punido com reclusão, de três a quinze anos, e multa, o funcionário público ou diretor, gerente, ou fiscal de banco de emissão que fabrica, emite ou autoriza a fabricação ou emissão:","I - de moeda com título ou peso inferior ao determinado em lei;","II - de papel-moeda em quantidade superior à autorizada.","§ 4º - Nas mesmas penas incorre quem desvia e faz circular moeda, cuja circulação não estava ainda autorizada."],"ti":17,"ch":"Da moeda falsa"},{"n":"290","t":"Crimes assimilados ao de moeda falsa","k":"formar, suprimir ou restituir","s":"Pune quem monta cédula com pedaços de notas verdadeiras, apaga o sinal de inutilização de notas recolhidas para voltar a usá-las, ou devolve essas notas à circulação. A pena é reclusão, de 2 a 8 anos, e multa.","e":"Uma pessoa junta pedaços de várias notas rasgadas para montar uma cédula inteira e usá-la no comércio.","d":"Se o autor é funcionário da repartição onde o dinheiro estava recolhido, ou tem fácil acesso a ela pelo cargo, o máximo da pena sobe para 12 anos.","pena":"Reclusão, de 2 a 8 anos, e multa.","rub":"Crimes assimilados ao de moeda falsa","caput":"Formar cédula, nota ou bilhete representativo de moeda com fragmentos de cédulas, notas ou bilhetes verdadeiros; suprimir, em nota, cédula ou bilhete recolhidos, para o fim de restituí-los à circulação, sinal indicativo de sua inutilização; restituir à circulação cédula, nota ou bilhete em tais condições, ou já recolhidos para o fim de inutilização:","txt":["Art. 290 - Formar cédula, nota ou bilhete representativo de moeda com fragmentos de cédulas, notas ou bilhetes verdadeiros; suprimir, em nota, cédula ou bilhete recolhidos, para o fim de restituí-los à circulação, sinal indicativo de sua inutilização; restituir à circulação cédula, nota ou bilhete em tais condições, ou já recolhidos para o fim de inutilização:","Pena - reclusão, de dois a oito anos, e multa.","Parágrafo único - O máximo da reclusão é elevado a doze anos e multa, se o crime é cometido por funcionário que trabalha na repartição onde o dinheiro se achava recolhido, ou nela tem fácil ingresso, em razão do cargo."],"ti":17,"ch":"Da moeda falsa"},{"n":"291","t":"Petrechos para falsificação de moeda","k":"fabricar ou possuir","s":"Pune quem fabrica, compra, fornece, possui ou guarda máquina ou objeto feito especialmente para falsificar moeda. A pena é reclusão, de 2 a 6 anos, e multa.","e":"A polícia encontra numa casa uma impressora e chapas preparadas especialmente para imprimir notas de real.","d":"Pune a preparação, sem precisar que alguma nota tenha sido falsificada. O objeto precisa ser especialmente destinado à falsificação; uma impressora comum, sozinha, não basta.","pena":"Reclusão, de 2 a 6 anos, e multa.","rub":"Petrechos para falsificação de moeda","caput":"Fabricar, adquirir, fornecer, a título oneroso ou gratuito, possuir ou guardar maquinismo, aparelho, instrumento ou qualquer objeto especialmente destinado à falsificação de moeda:","txt":["Art. 291 - Fabricar, adquirir, fornecer, a título oneroso ou gratuito, possuir ou guardar maquinismo, aparelho, instrumento ou qualquer objeto especialmente destinado à falsificação de moeda:","Pena - reclusão, de dois a seis anos, e multa."],"ti":17,"ch":"Da moeda falsa"},{"n":"292","t":"Título ao portador sem permissão legal","k":"emitir","s":"Pune quem emite, sem permissão legal, vale, ficha ou bilhete com promessa de pagamento em dinheiro ao portador, como se fosse uma moeda paralela. A pena é detenção, de 1 a 6 meses, ou multa.","e":"Um dono de fazenda paga os trabalhadores com vales próprios, que só valem no armazém dele, em vez de dinheiro.","d":"Quem recebe ou usa esses papéis como dinheiro também é punido, com pena menor: detenção, de 15 dias a 3 meses, ou multa.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Emissão de título ao portador sem permissão legal","caput":"Emitir, sem permissão legal, nota, bilhete, ficha, vale ou título que contenha promessa de pagamento em dinheiro ao portador ou a que falte indicação do nome da pessoa a quem deva ser pago:","txt":["Art. 292 - Emitir, sem permissão legal, nota, bilhete, ficha, vale ou título que contenha promessa de pagamento em dinheiro ao portador ou a que falte indicação do nome da pessoa a quem deva ser pago:","Pena - detenção, de um a seis meses, ou multa.","Parágrafo único - Quem recebe ou utiliza como dinheiro qualquer dos documentos referidos neste artigo incorre na pena de detenção, de quinze dias a três meses, ou multa."],"ti":17,"ch":"Da moeda falsa"},{"n":"293","t":"Falsificação de papéis públicos","k":"falsificar","s":"Pune quem fabrica ou altera papéis públicos, como selos de controle de impostos, guias de arrecadação, vales postais ou passes de transporte de empresa pública. A pena é reclusão, de 2 a 8 anos, e multa.","e":"Uma fábrica clandestina coloca selos fiscais falsos em maços de cigarro para fingir que pagou impostos.","d":"Quem apaga o carimbo de inutilização de papel legítimo para reutilizá-lo tem pena menor: reclusão, de 1 a 4 anos, e multa. Comércio irregular, inclusive na rua ou em casa, equipara-se a atividade comercial para punir quem vende produto com selo falso ou sem selo obrigatório.","pena":"","rub":"Falsificação de papéis públicos","caput":"Falsificar, fabricando-os ou alterando-os:","txt":["Art. 293 - Falsificar, fabricando-os ou alterando-os:","I - selo destinado a controle tributário, papel selado ou qualquer papel de emissão legal destinado à arrecadação de tributo;","II - papel de crédito público que não seja moeda de curso legal;","III - vale postal;","IV - cautela de penhor, caderneta de depósito de caixa econômica ou de outro estabelecimento mantido por entidade de direito público;","V - talão, recibo, guia, alvará ou qualquer outro documento relativo a arrecadação de rendas públicas ou a depósito ou caução por que o poder público seja responsável;","VI - bilhete, passe ou conhecimento de empresa de transporte administrada pela União, por Estado ou por Município:","Pena - reclusão, de dois a oito anos, e multa.","§ 1º Incorre na mesma pena quem:","I - usa, guarda, possui ou detém qualquer dos papéis falsificados a que se refere este artigo;","II - importa, exporta, adquire, vende, troca, cede, empresta, guarda, fornece ou restitui à circulação selo falsificado destinado a controle tributário;","III - importa, exporta, adquire, vende, expõe à venda, mantém em depósito, guarda, troca, cede, empresta, fornece, porta ou, de qualquer forma, utiliza em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, produto ou mercadoria:","a) em que tenha sido aplicado selo que se destine a controle tributário, falsificado;","b) sem selo oficial, nos casos em que a legislação tributária determina a obrigatoriedade de sua aplicação.","§ 2º - Suprimir, em qualquer desses papéis, quando legítimos, com o fim de torná-los novamente utilizáveis, carimbo ou sinal indicativo de sua inutilização:","Pena - reclusão, de um a quatro anos, e multa.","§ 3º - Incorre na mesma pena quem usa, depois de alterado, qualquer dos papéis a que se refere o parágrafo anterior.","§ 4º - Quem usa ou restitui à circulação, embora recebido de boa-fé, qualquer dos papéis falsificados ou alterados, a que se referem este artigo e o seu § 2º, depois de conhecer a falsidade ou alteração, incorre na pena de detenção, de 6 (seis) meses a 2 (dois) anos, ou multa.","§ 5º Equipara-se a atividade comercial, para os fins do inciso III do § 1º, qualquer forma de comércio irregular ou clandestino, inclusive o exercido em vias, praças ou outros logradouros públicos e em residências."],"ti":17,"ch":"Da falsidade de títulos e outros papéis públicos"},{"n":"294","t":"Petrechos de falsificação de papéis","k":"fabricar ou possuir","s":"Pune quem fabrica, compra, fornece, possui ou guarda objeto feito especialmente para falsificar papéis públicos. A pena é reclusão, de 1 a 3 anos, e multa.","e":"A polícia apreende numa gráfica clichês preparados para imprimir selos fiscais falsos de bebidas.","d":"Não confunda com os petrechos para falsificar moeda, que têm pena maior. Aqui o objeto se destina aos papéis públicos do artigo anterior.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Petrechos de falsificação","caput":"Fabricar, adquirir, fornecer, possuir ou guardar objeto especialmente destinado à falsificação de qualquer dos papéis referidos no artigo anterior:","txt":["Art. 294 - Fabricar, adquirir, fornecer, possuir ou guardar objeto especialmente destinado à falsificação de qualquer dos papéis referidos no artigo anterior:","Pena - reclusão, de um a três anos, e multa."],"ti":17,"ch":"Da falsidade de títulos e outros papéis públicos"},{"n":"295","t":"Aumento para funcionário público","k":"funcionário público","s":"Aumenta a pena de sexta parte quando o autor dos crimes de falsificação de papéis públicos é funcionário público e se aproveita do cargo.","e":"Um servidor da prefeitura usa seu acesso ao setor de arrecadação para falsificar guias de pagamento e tem a pena aumentada.","d":"Não basta ser funcionário público: é preciso cometer o crime prevalecendo-se do cargo. O aumento é fixo, de um sexto.","pena":"","rub":"","caput":"Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte.","txt":["Art. 295 - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."],"ti":17,"ch":"Da falsidade de títulos e outros papéis públicos"},{"n":"296","t":"Falsificação de selo ou sinal público","k":"falsificar","s":"Pune quem fabrica ou altera selo público usado para autenticar atos oficiais, ou selo e sinal de órgão público, autoridade ou tabelião. A pena é reclusão, de 2 a 6 anos, e multa.","e":"Um despachante cria um carimbo falso de cartório para autenticar documentos.","d":"Também é punido quem usa indevidamente o selo verdadeiro ou falsifica ou usa indevidamente logotipos e siglas de órgãos públicos. Se o funcionário público se aproveitar do cargo, a pena aumenta de sexta parte.","pena":"","rub":"Falsificação do selo ou sinal público","caput":"Falsificar, fabricando-os ou alterando-os:","txt":["Art. 296 - Falsificar, fabricando-os ou alterando-os:","I - selo público destinado a autenticar atos oficiais da União, de Estado ou de Município;","II - selo ou sinal atribuído por lei a entidade de direito público, ou a autoridade, ou sinal público de tabelião:","Pena - reclusão, de dois a seis anos, e multa.","§ 1º - Incorre nas mesmas penas:","I - quem faz uso do selo ou sinal falsificado;","II - quem utiliza indevidamente o selo ou sinal verdadeiro em prejuízo de outrem ou em proveito próprio ou alheio.","III - quem altera, falsifica ou faz uso indevido de marcas, logotipos, siglas ou quaisquer outros símbolos utilizados ou identificadores de órgãos ou entidades da Administração Pública.","§ 2º - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."],"ti":17,"ch":"Da falsidade documental"},{"n":"297","t":"Falsificação de documento público","k":"falsificar ou alterar","s":"Pune quem cria um documento público falso, total ou parcialmente, ou altera um documento público verdadeiro. A pena é reclusão, de 2 a 6 anos, e multa.","e":"Uma pessoa troca a foto de uma carteira de identidade verdadeira para usá-la em nome de outra.","d":"Para a lei penal, equiparam-se a documento público o título transmissível por endosso, as ações de sociedade comercial, os livros mercantis e o testamento particular. Aqui o documento é fisicamente falsificado; se o documento é verdadeiro mas o conteúdo é mentiroso, trata-se de falsidade ideológica.","pena":"Reclusão, de 2 a 6 anos, e multa.","rub":"Falsificação de documento público","caput":"Falsificar, no todo ou em parte, documento público, ou alterar documento público verdadeiro:","txt":["Art. 297 - Falsificar, no todo ou em parte, documento público, ou alterar documento público verdadeiro:","Pena - reclusão, de dois a seis anos, e multa.","§ 1º - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte.","§ 2º - Para os efeitos penais, equiparam-se a documento público o emanado de entidade paraestatal, o título ao portador ou transmissível por endosso, as ações de sociedade comercial, os livros mercantis e o testamento particular.","§ 3º Nas mesmas penas incorre quem insere ou faz inserir:","I - na folha de pagamento ou em documento de informações que seja destinado a fazer prova perante a previdência social, pessoa que não possua a qualidade de segurado obrigatório;","II - na Carteira de Trabalho e Previdência Social do empregado ou em documento que deva produzir efeito perante a previdência social, declaração falsa ou diversa da que deveria ter sido escrita;","III - em documento contábil ou em qualquer outro documento relacionado com as obrigações da empresa perante a previdência social, declaração falsa ou diversa da que deveria ter constado.","§ 4º Nas mesmas penas incorre quem omite, nos documentos mencionados no § 3º, nome do segurado e seus dados pessoais, a remuneração, a vigência do contrato de trabalho ou de prestação de serviços."],"ti":17,"ch":"Da falsidade documental"},{"n":"298","t":"Falsificação de documento particular","k":"falsificar ou alterar","s":"Pune quem cria um documento particular falso, total ou parcialmente, ou altera um documento particular verdadeiro. A pena é reclusão, de 1 a 5 anos, e multa.","e":"Um inquilino falsifica a assinatura do proprietário num recibo de aluguel.","d":"Cartão de crédito ou débito equipara-se a documento particular, então clonar cartão entra aqui. Testamento particular, porém, é tratado como documento público.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Falsificação de documento particular","caput":"Falsificar, no todo ou em parte, documento particular ou alterar documento particular verdadeiro:","txt":["Art. 298 - Falsificar, no todo ou em parte, documento particular ou alterar documento particular verdadeiro:","Pena - reclusão, de um a cinco anos, e multa.","Falsificação de cartão","Parágrafo único. Para fins do disposto no caput, equipara-se a documento particular o cartão de crédito ou débito."],"ti":17,"ch":"Da falsidade documental"},{"n":"299","t":"Falsidade ideológica","k":"omitir ou inserir","s":"Pune quem omite informação obrigatória ou coloca declaração falsa num documento, que por fora é verdadeiro, para prejudicar direito, criar obrigação ou alterar a verdade sobre fato relevante. A pena é reclusão, de 1 a 5 anos, e multa, se o documento é público, e reclusão, de 1 a 3 anos, e multa, se é particular.","e":"Um empresário registra a empresa em nome de um laranja, declarando na junta comercial que ele é o verdadeiro dono.","d":"Na falsidade ideológica o papel é autêntico, mas a informação é mentirosa. A pena aumenta de sexta parte se o autor é funcionário público que se aproveita do cargo ou se a falsidade é em registro civil.","pena":"Reclusão, de 1 a 5 anos, e multa, se o documento é público, e reclusão de 1 a 3 anos, e multa, de quinhentos mil réis a cinco contos de réis, se o documento é particular.","rub":"Falsidade ideológica","caput":"Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante:","txt":["Art. 299 - Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante:","Pena - reclusão, de um a cinco anos, e multa, se o documento é público, e reclusão de um a três anos, e multa, de quinhentos mil réis a cinco contos de réis, se o documento é particular.","Parágrafo único - Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, ou se a falsificação ou alteração é de assentamento de registro civil, aumenta-se a pena de sexta parte."],"ti":17,"ch":"Da falsidade documental"},{"n":"300","t":"Falso reconhecimento de firma","k":"reconhecer","s":"Pune quem, no exercício de função pública, reconhece como verdadeira uma assinatura (firma) ou letra que é falsa. A pena é reclusão, de 1 a 5 anos, e multa, se o documento é público, e de 1 a 3 anos, e multa, se é particular.","e":"Um escrevente de cartório reconhece a assinatura de um vendedor de imóvel sabendo que ela foi imitada.","d":"Só pode ser cometido por quem exerce função pública com poder de reconhecer firma, como o pessoal do cartório. A pena muda conforme o documento seja público ou particular.","pena":"Reclusão, de 1 a 5 anos, e multa, se o documento é público; e de 1 a 3 anos, e multa, se o documento é particular.","rub":"Falso reconhecimento de firma ou letra","caput":"Reconhecer, como verdadeira, no exercício de função pública, firma ou letra que o não seja:","txt":["Art. 300 - Reconhecer, como verdadeira, no exercício de função pública, firma ou letra que o não seja:","Pena - reclusão, de um a cinco anos, e multa, se o documento é público; e de um a três anos, e multa, se o documento é particular."],"ti":17,"ch":"Da falsidade documental"},{"n":"301","t":"Certidão ou atestado ideologicamente falso","k":"atestar ou certificar","s":"Pune o agente público que, por causa da função, atesta ou certifica falsamente fato que ajude alguém a obter cargo público, isenção ou outra vantagem. A pena é detenção, de 2 meses a 1 ano.","e":"Um servidor emite certidão dizendo que um amigo prestou serviço público por anos, para que ele obtenha vantagem num concurso.","d":"No caput o servidor mente no conteúdo; no parágrafo primeiro, qualquer pessoa falsifica materialmente o atestado ou certidão, com pena de detenção, de 3 meses a 2 anos. Com fim de lucro, aplica-se também multa.","pena":"Detenção, de 2 meses a 1 ano.","rub":"Certidão ou atestado ideologicamente falso","caput":"Atestar ou certificar falsamente, em razão de função pública, fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:","txt":["Art. 301 - Atestar ou certificar falsamente, em razão de função pública, fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:","Pena - detenção, de dois meses a um ano.","Falsidade material de atestado ou certidão","§ 1º - Falsificar, no todo ou em parte, atestado ou certidão, ou alterar o teor de certidão ou de atestado verdadeiro, para prova de fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:","Pena - detenção, de três meses a dois anos.","§ 2º - Se o crime é praticado com o fim de lucro, aplica-se, além da pena privativa de liberdade, a de multa."],"ti":17,"ch":"Da falsidade documental"},{"n":"302","t":"Falsidade de atestado médico","k":"dar atestado falso","s":"Pune o médico que, no exercício da profissão, emite atestado falso. A pena é detenção, de 1 mês a 1 ano.","e":"Um médico dá atestado de doença a um paciente saudável para que ele falte ao trabalho.","d":"É crime próprio do médico; se outra pessoa falsifica o atestado, o crime é outro. Se houver fim de lucro, aplica-se também multa.","pena":"Detenção, de 1 mês a 1 ano.","rub":"Falsidade de atestado médico","caput":"Dar o médico, no exercício da sua profissão, atestado falso:","txt":["Art. 302 - Dar o médico, no exercício da sua profissão, atestado falso:","Pena - detenção, de um mês a um ano.","Parágrafo único - Se o crime é cometido com o fim de lucro, aplica-se também multa."],"ti":17,"ch":"Da falsidade documental"},{"n":"303","t":"Reprodução ou adulteração de selo filatélico","k":"reproduzir ou alterar","s":"Pune quem copia ou altera selo ou peça filatélica que tenha valor para colecionadores. A pena é detenção, de 1 a 3 anos, e multa. Filatelia é o colecionismo de selos postais.","e":"Um comerciante falsifica selos raros do Império para vender a colecionadores como se fossem originais.","d":"Não há crime se a reprodução ou alteração estiver visivelmente anotada na frente ou no verso da peça. Quem usa a peça para fins de comércio recebe a mesma pena.","pena":"Detenção, de 1 a 3 anos, e multa.","rub":"Reprodução ou adulteração de selo ou peça filatélica","caput":"Reproduzir ou alterar selo ou peça filatélica que tenha valor para coleção, salvo quando a reprodução ou a alteração está visivelmente anotada na face ou no verso do selo ou peça:","txt":["Art. 303 - Reproduzir ou alterar selo ou peça filatélica que tenha valor para coleção, salvo quando a reprodução ou a alteração está visivelmente anotada na face ou no verso do selo ou peça:","Pena - detenção, de um a três anos, e multa.","Parágrafo único - Na mesma pena incorre quem, para fins de comércio, faz uso do selo ou peça filatélica."],"ti":17,"ch":"Da falsidade documental"},{"n":"304","t":"Uso de documento falso","k":"fazer uso","s":"Pune quem usa qualquer dos documentos falsificados ou alterados previstos nos arts. 297 a 302. A pena é a mesma prevista para a falsificação ou alteração daquele documento.","e":"Um motorista apresenta numa blitz uma carteira de habilitação falsa que comprou pela internet.","d":"O artigo não tem pena própria: toma emprestada a pena do crime de falsificação correspondente. Se o próprio falsificador usa o documento, em regra responde só por um dos crimes, não pelos dois.","pena":"A cominada à falsificação ou à alteração.","rub":"Uso de documento falso","caput":"Fazer uso de qualquer dos papéis falsificados ou alterados, a que se referem os arts. 297 a 302:","txt":["Art. 304 - Fazer uso de qualquer dos papéis falsificados ou alterados, a que se referem os arts. 297 a 302:","Pena - a cominada à falsificação ou à alteração."],"ti":17,"ch":"Da falsidade documental"},{"n":"305","t":"Supressão de documento","k":"destruir, suprimir ou ocultar","s":"Pune quem destrói, some com ou esconde um documento verdadeiro do qual não podia se desfazer, para se beneficiar ou prejudicar alguém. A pena é de reclusão, de 2 a 6 anos, e multa, se o documento é público, e de reclusão, de 1 a 5 anos, e multa, se é particular.","e":"Um herdeiro queima o testamento original do pai para que um irmão não receba a parte deixada a ele.","d":"Aqui o documento é verdadeiro: o agente não falsifica nada, ele faz o documento desaparecer. A pena muda conforme o documento seja público ou particular.","pena":"Reclusão, de 2 a 6 anos, e multa, se o documento é público, e reclusão, de 1 a 5 anos, e multa, se o documento é particular.","rub":"Supressão de documento","caput":"Destruir, suprimir ou ocultar, em benefício próprio ou de outrem, ou em prejuízo alheio, documento público ou particular verdadeiro, de que não podia dispor:","txt":["Art. 305 - Destruir, suprimir ou ocultar, em benefício próprio ou de outrem, ou em prejuízo alheio, documento público ou particular verdadeiro, de que não podia dispor:","Pena - reclusão, de dois a seis anos, e multa, se o documento é público, e reclusão, de um a cinco anos, e multa, se o documento é particular."],"ti":17,"ch":"Da falsidade documental"},{"n":"306","t":"Falsificação de sinal oficial","k":"falsificar ou usar","s":"Pune quem falsifica, fabricando ou alterando, a marca ou o sinal que o poder público usa para atestar metal precioso ou na fiscalização da alfândega, ou quem usa sinal falsificado por outra pessoa. A pena é de reclusão, de 2 a 6 anos, e multa.","e":"Um joalheiro fabrica um carimbo falso de contraste para fazer peças comuns parecerem ouro certificado.","d":"O parágrafo único traz pena menor, reclusão ou detenção, de 1 a 3 anos, e multa, quando o sinal falsificado é o de fiscalização sanitária ou o usado para autenticar ou lacrar objetos ou comprovar formalidade legal.","pena":"Reclusão, de 2 a 6 anos, e multa.","rub":"Falsificação do sinal empregado no contraste de metal precioso ou na fiscalização alfandegária, ou para outros fins","caput":"Falsificar, fabricando-o ou alterando-o, marca ou sinal empregado pelo poder público no contraste de metal precioso ou na fiscalização alfandegária, ou usar marca ou sinal dessa natureza, falsificado por outrem:","txt":["Art. 306 - Falsificar, fabricando-o ou alterando-o, marca ou sinal empregado pelo poder público no contraste de metal precioso ou na fiscalização alfandegária, ou usar marca ou sinal dessa natureza, falsificado por outrem:","Pena - reclusão, de dois a seis anos, e multa.","Parágrafo único - Se a marca ou sinal falsificado é o que usa a autoridade pública para o fim de fiscalização sanitária, ou para autenticar ou encerrar determinados objetos, ou comprovar o cumprimento de formalidade legal:","Pena - reclusão ou detenção, de um a três anos, e multa."],"ti":17,"ch":"De outras falsidades"},{"n":"307","t":"Falsa identidade","k":"atribuir-se falsa identidade","s":"Pune quem se apresenta com identidade falsa, ou atribui identidade falsa a outra pessoa, para obter vantagem ou causar dano. A pena é de detenção, de 3 meses a 1 ano, ou multa, se o fato não for parte de crime mais grave.","e":"Parado numa blitz, o motorista diz o nome e os dados do irmão para esconder que tem mandado de prisão.","d":"O crime é subsidiário: só se aplica se o fato não for elemento de crime mais grave. Não confunda com o art. 308, em que a pessoa usa um documento de identidade alheio, e não apenas se diz outra pessoa.","pena":"Detenção, de 3 meses a 1 ano, ou multa, se o fato não constitui elemento de crime mais grave.","rub":"Falsa identidade","caput":"Atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem:","txt":["Art. 307 - Atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem:","Pena - detenção, de três meses a um ano, ou multa, se o fato não constitui elemento de crime mais grave."],"ti":17,"ch":"De outras falsidades"},{"n":"308","t":"Uso de documento de identidade alheio","k":"usar ou ceder documento","s":"Pune quem usa como se fosse seu o passaporte, o título de eleitor, a caderneta de reservista ou outro documento de identidade de outra pessoa, e também quem empresta o próprio documento ou o de terceiro para alguém usar. A pena é de detenção, de 4 meses a 2 anos, e multa, se o fato não for parte de crime mais grave.","e":"Um rapaz empresta a carteira de identidade ao primo menor de idade para que ele entre numa festa só para adultos.","d":"Quem cede o documento, mesmo o próprio, também comete o crime. O documento aqui é verdadeiro, só que pertence a outra pessoa; se fosse falsificado, o caso seria de falsificação ou uso de documento falso.","pena":"Detenção, de 4 meses a 2 anos, e multa, se o fato não constitui elemento de crime mais grave.","rub":"","caput":"Usar, como próprio, passaporte, título de eleitor, caderneta de reservista ou qualquer documento de identidade alheia ou ceder a outrem, para que dele se utilize, documento dessa natureza, próprio ou de terceiro:","txt":["Art. 308 - Usar, como próprio, passaporte, título de eleitor, caderneta de reservista ou qualquer documento de identidade alheia ou ceder a outrem, para que dele se utilize, documento dessa natureza, próprio ou de terceiro:","Pena - detenção, de quatro meses a dois anos, e multa, se o fato não constitui elemento de crime mais grave."],"ti":17,"ch":"De outras falsidades"},{"n":"309","t":"Fraude de lei sobre estrangeiros","k":"usar nome falso","s":"Pune o estrangeiro que usa nome que não é o seu para entrar ou permanecer no Brasil. A pena é de detenção, de 1 a 3 anos, e multa.","e":"Um estrangeiro com entrada proibida no país apresenta-se na fronteira com o nome de outra pessoa para conseguir passar.","d":"No caput, quem comete o crime é o próprio estrangeiro. O parágrafo único pune quem atribui falsa qualidade a um estrangeiro para promover sua entrada, com pena maior: reclusão, de 1 a 4 anos, e multa.","pena":"Detenção, de 1 a 3 anos, e multa.","rub":"Fraude de lei sobre estrangeiros","caput":"Usar o estrangeiro, para entrar ou permanecer no território nacional, nome que não é o seu:","txt":["Art. 309 - Usar o estrangeiro, para entrar ou permanecer no território nacional, nome que não é o seu:","Pena - detenção, de um a três anos, e multa.","Parágrafo único - Atribuir a estrangeiro falsa qualidade para promover-lhe a entrada em território nacional:","Pena - reclusão, de um a quatro anos, e multa."],"ti":17,"ch":"De outras falsidades"},{"n":"310","t":"Testa de ferro de estrangeiro","k":"prestar-se a figurar","s":"Pune quem aceita aparecer como dono ou possuidor de ação, título ou valor que na verdade pertence a um estrangeiro, quando a lei proíbe que esse estrangeiro tenha esses bens. A pena é de detenção, de 6 meses a 3 anos, e multa.","e":"Um brasileiro registra em seu nome ações de uma empresa que a lei proíbe estrangeiros de possuir, mas quem manda e lucra é um investidor estrangeiro.","d":"Quem responde é o chamado testa de ferro, que empresta o nome. O crime só existe nos casos em que a lei realmente proíbe o estrangeiro de ter aquele bem.","pena":"Detenção, de 6 meses a 3 anos, e multa.","rub":"","caput":"Prestar-se a figurar como proprietário ou possuidor de ação, título ou valor pertencente a estrangeiro, nos casos em que a este é vedada por lei a propriedade ou a posse de tais bens:","txt":["Art. 310 - Prestar-se a figurar como proprietário ou possuidor de ação, título ou valor pertencente a estrangeiro, nos casos em que a este é vedada por lei a propriedade ou a posse de tais bens:","Pena - detenção, de seis meses a três anos, e multa."],"ti":17,"ch":"De outras falsidades"},{"n":"311","t":"Adulteração de sinal identificador de veículo","k":"adulterar, remarcar ou suprimir","s":"Pune quem adultera, remarca ou apaga o número do chassi, do motor, a placa ou qualquer sinal que identifica um veículo, inclusive elétrico ou híbrido, reboque e semirreboque, sem autorização do órgão competente. A pena é de reclusão, de 3 a 6 anos, e multa.","e":"Um desmanche lixa o número do chassi de um carro roubado e grava outro número para poder revendê-lo.","d":"O § 2º pune com a mesma pena quem usa, vende ou transporta veículo com sinal que devesse saber estar adulterado, e quem guarda ferramentas destinadas à adulteração. Se isso é feito em atividade comercial, mesmo clandestina ou em casa, a pena sobe para reclusão, de 4 a 8 anos, e multa (§§ 3º e 4º).","pena":"Reclusão, de 3 a 6 anos, e multa.","rub":"Adulteração de sinal identificador de veículo","caput":"Adulterar, remarcar ou suprimir número de chassi, monobloco, motor, placa de identificação, ou qualquer sinal identificador de veículo automotor, elétrico, híbrido, de reboque, de semirreboque ou de suas combinações, bem como de seus componentes ou equipamentos, sem autorização do órgão competente:","txt":["Art. 311. Adulterar, remarcar ou suprimir número de chassi, monobloco, motor, placa de identificação, ou qualquer sinal identificador de veículo automotor, elétrico, híbrido, de reboque, de semirreboque ou de suas combinações, bem como de seus componentes ou equipamentos, sem autorização do órgão competente:","Pena - reclusão, de três a seis anos, e multa.","§ 1º - Se o agente comete o crime no exercício da função pública ou em razão dela, a pena é aumentada de um terço.","§ 2º Incorrem nas mesmas penas do caput deste artigo:","I - o funcionário público que contribui para o licenciamento ou registro do veículo remarcado ou adulterado, fornecendo indevidamente material ou informação oficial;","II - aquele que adquire, recebe, transporta, oculta, mantém em depósito, fabrica, fornece, a título oneroso ou gratuito, possui ou guarda maquinismo, aparelho, instrumento ou objeto especialmente destinado à falsificação e/ou adulteração de que trata o caput deste artigo; ou","III - aquele que adquire, recebe, transporta, conduz, oculta, mantém em depósito, desmonta, monta, remonta, vende, expõe à venda, ou de qualquer forma utiliza, em proveito próprio ou alheio, veículo automotor, elétrico, híbrido, de reboque, semirreboque ou suas combinações ou partes, com número de chassi ou monobloco, placa de identificação ou qualquer sinal identificador veicular que devesse saber estar adulterado ou remarcado.","§ 3º Praticar as condutas de que tratam os incisos II ou III do § 2º deste artigo no exercício de atividade comercial ou industrial:","Pena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa.","§ 4º Equipara-se a atividade comercial, para efeito do disposto no § 3º deste artigo, qualquer forma de comércio irregular ou clandestino, inclusive aquele exercido em residência."],"ti":17,"ch":"De outras falsidades"},{"n":"311-A","t":"Fraudes em certames de interesse público","k":"utilizar ou divulgar","s":"Pune quem usa ou divulga indevidamente conteúdo sigiloso de concurso público, exame público, vestibular ou outro processo seletivo previsto em lei, para beneficiar alguém ou abalar a credibilidade da prova. A pena é de reclusão, de 1 a 4 anos, e multa.","e":"Um funcionário da gráfica que imprime as provas fotografa o caderno de questões e vende o gabarito a candidatos.","d":"Se resulta dano à administração pública, a pena vai para reclusão, de 2 a 6 anos, e multa. Quem permite ou facilita o acesso de pessoas não autorizadas recebe a mesma pena do caput, e há aumento de 1/3 se o autor for funcionário público.","pena":"","rub":"Fraudes em certames de interesse público","caput":"Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de:","txt":["Art. 311-A. Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de:","I - concurso público;","II - avaliação ou exame públicos;","III - processo seletivo para ingresso no ensino superior; ou","IV - exame ou processo seletivo previstos em lei:","Pena - reclusão, de 1 (um) a 4 (quatro) anos, e multa.","§ 1º Nas mesmas penas incorre quem permite ou facilita, por qualquer meio, o acesso de pessoas não autorizadas às informações mencionadas no caput.","§ 2º Se da ação ou omissão resulta dano à administração pública:","Pena - reclusão, de 2 (dois) a 6 (seis) anos, e multa.","§ 3º Aumenta-se a pena de 1/3 (um terço) se o fato é cometido por funcionário público."],"ti":17,"ch":"Das fraudes em certames de interesse público"},{"n":"312","t":"Peculato","k":"apropriar-se ou desviar","s":"Pune o funcionário público que se apropria de dinheiro, valor ou bem que está com ele por causa do cargo, ou que o desvia para si ou para outra pessoa. A pena é de reclusão, de 2 a 12 anos, e multa.","e":"O tesoureiro de uma prefeitura transfere para sua conta pessoal parte do dinheiro arrecadado com taxas municipais.","d":"Existe o peculato culposo (§ 2º), quando o funcionário, por descuido, facilita o crime de outra pessoa, com detenção de 3 meses a 1 ano. Só nele a reparação do dano antes da sentença irrecorrível extingue a punibilidade; depois dela, reduz a pena pela metade.","pena":"Reclusão, de 2 a 12 anos, e multa.","rub":"Peculato","caput":"Apropriar-se o funcionário público de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo, ou desviá-lo, em proveito próprio ou alheio:","txt":["Art. 312 - Apropriar-se o funcionário público de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo, ou desviá-lo, em proveito próprio ou alheio:","Pena - reclusão, de dois a doze anos, e multa.","§ 1º - Aplica-se a mesma pena, se o funcionário público, embora não tendo a posse do dinheiro, valor ou bem, o subtrai, ou concorre para que seja subtraído, em proveito próprio ou alheio, valendo-se de facilidade que lhe proporciona a qualidade de funcionário.","Peculato culposo","§ 2º - Se o funcionário concorre culposamente para o crime de outrem:","Pena - detenção, de três meses a um ano.","§ 3º - No caso do parágrafo anterior, a reparação do dano, se precede à sentença irrecorrível, extingue a punibilidade; se lhe é posterior, reduz de metade a pena imposta."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"313","t":"Peculato mediante erro de outrem","k":"apropriar-se","s":"Pune o funcionário que fica com dinheiro ou outra utilidade que recebeu, no exercício do cargo, por engano de outra pessoa. A pena é de reclusão, de 1 a 4 anos, e multa.","e":"Um contribuinte paga por engano o mesmo boleto duas vezes no guichê da repartição, e o servidor guarda a diferença para si.","d":"O funcionário não provoca o erro, apenas se aproveita dele. Por isso é chamado de peculato-estelionato, e tem pena menor que o peculato comum do art. 312.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Peculato mediante erro de outrem","caput":"Apropriar-se de dinheiro ou qualquer utilidade que, no exercício do cargo, recebeu por erro de outrem:","txt":["Art. 313 - Apropriar-se de dinheiro ou qualquer utilidade que, no exercício do cargo, recebeu por erro de outrem:","Pena - reclusão, de um a quatro anos, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"313-A","t":"Inserção de dados falsos em sistema","k":"inserir dados falsos","s":"Pune o funcionário autorizado que insere ou facilita a inserção de dados falsos, ou altera ou apaga dados corretos, nos sistemas ou bancos de dados da Administração Pública, para obter vantagem indevida ou causar dano. A pena é de reclusão, de 2 a 12 anos, e multa.","e":"Um servidor do INSS lança no sistema vínculos de trabalho que nunca existiram para liberar aposentadorias a conhecidos.","d":"Só comete o crime o funcionário autorizado a operar o sistema. Compare com o art. 313-B, que pune a modificação do próprio sistema ou programa, com pena bem menor.","pena":"Reclusão, de 2 a 12 anos, e multa.","rub":"Inserção de dados falsos em sistema de informações","caput":"Inserir ou facilitar, o funcionário autorizado, a inserção de dados falsos, alterar ou excluir indevidamente dados corretos nos sistemas informatizados ou bancos de dados da Administração Pública com o fim de obter vantagem indevida para si ou para outrem ou para causar dano:)","txt":["Art. 313-A. Inserir ou facilitar, o funcionário autorizado, a inserção de dados falsos, alterar ou excluir indevidamente dados corretos nos sistemas informatizados ou bancos de dados da Administração Pública com o fim de obter vantagem indevida para si ou para outrem ou para causar dano:)","Pena - reclusão, de 2 (dois) a 12 (doze) anos, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"313-B","t":"Modificação não autorizada de sistema","k":"modificar ou alterar","s":"Pune o funcionário que modifica ou altera sistema de informações ou programa de computador da Administração sem autorização ou pedido da autoridade competente. A pena é de detenção, de 3 meses a 2 anos, e multa.","e":"Um técnico de informática de um órgão público muda por conta própria o programa de protocolo, sem ordem de ninguém.","d":"Aqui se mexe no sistema em si, não nos dados. A pena aumenta de um terço até a metade se a alteração causa dano à Administração ou ao administrado.","pena":"Detenção, de 3 meses a 2 anos, e multa.","rub":"Modificação ou alteração não autorizada de sistema de informações","caput":"Modificar ou alterar, o funcionário, sistema de informações ou programa de informática sem autorização ou solicitação de autoridade competente:","txt":["Art. 313-B. Modificar ou alterar, o funcionário, sistema de informações ou programa de informática sem autorização ou solicitação de autoridade competente:","Pena - detenção, de 3 (três) meses a 2 (dois) anos, e multa.","Parágrafo único. As penas são aumentadas de um terço até a metade se da modificação ou alteração resulta dano para a Administração Pública ou para o administrado."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"314","t":"Extravio ou inutilização de documento","k":"extraviar, sonegar ou inutilizar","s":"Pune o funcionário que extravia, esconde ou inutiliza, total ou parcialmente, livro oficial ou documento que guarda por causa do cargo. A pena é de reclusão, de 1 a 4 anos, se o fato não constituir crime mais grave.","e":"Um escrivão some com o livro de registro de ponto do cartório para encobrir faltas de um colega.","d":"É crime do funcionário que tem a guarda do documento. Se quem subtrai ou inutiliza é um particular, o caso pode ser o do art. 337, que tem pena maior.","pena":"Reclusão, de 1 a 4 anos, se o fato não constitui crime mais grave.","rub":"Extravio, sonegação ou inutilização de livro ou documento","caput":"Extraviar livro oficial ou qualquer documento, de que tem a guarda em razão do cargo; sonegá-lo ou inutilizá-lo, total ou parcialmente:","txt":["Art. 314 - Extraviar livro oficial ou qualquer documento, de que tem a guarda em razão do cargo; sonegá-lo ou inutilizá-lo, total ou parcialmente:","Pena - reclusão, de um a quatro anos, se o fato não constitui crime mais grave."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"315","t":"Emprego irregular de verbas públicas","k":"aplicação diversa","s":"Pune quem dá ao dinheiro público destino diferente do que a lei determinou, mesmo que em benefício da própria Administração. A pena é de detenção, de 1 a 3 meses, ou multa.","e":"Um prefeito usa a verba que a lei destinou à merenda escolar para asfaltar uma rua.","d":"O dinheiro continua sendo usado em favor do público, só que em outra finalidade. Se o agente desviar em proveito próprio ou alheio, o crime passa a ser peculato.","pena":"Detenção, de 1 a 3 meses, ou multa.","rub":"Emprego irregular de verbas ou rendas públicas","caput":"Dar às verbas ou rendas públicas aplicação diversa da estabelecida em lei:","txt":["Art. 315 - Dar às verbas ou rendas públicas aplicação diversa da estabelecida em lei:","Pena - detenção, de um a três meses, ou multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"316","t":"Concussão","k":"exigir","s":"Pune o funcionário público que exige vantagem indevida, para si ou para outro, por causa da função, mesmo fora dela ou antes de assumi-la. A pena é de reclusão, de 2 a 12 anos, e multa.","e":"Um fiscal da vigilância sanitária diz ao dono do restaurante que só não fecha o local se receber dinheiro.","d":"O verbo é exigir, uma imposição; se o funcionário apenas solicita ou recebe, é corrupção passiva. O § 1º traz o excesso de exação, cobrança de tributo indevido ou por meio vexatório, com reclusão de 3 a 8 anos, e multa.","pena":"Reclusão, de 2 a 12 anos, e multa.","rub":"Concussão","caput":"Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida:","txt":["Art. 316 - Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida:","Pena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.","Excesso de exação","§ 1º - Se o funcionário exige tributo ou contribuição social que sabe ou deveria saber indevido, ou, quando devido, emprega na cobrança meio vexatório ou gravoso, que a lei não autoriza:","Pena - reclusão, de três a oito anos, e multa.","§ 2º - Se o funcionário desvia, em proveito próprio ou de outrem, o que recebeu indevidamente para recolher aos cofres públicos:","Pena - reclusão, de dois a doze anos, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"317","t":"Corrupção passiva","k":"solicitar ou receber","s":"Pune o funcionário público que pede ou recebe vantagem indevida, ou aceita promessa dela, por causa da função, mesmo fora dela ou antes de assumi-la. A pena é de reclusão, de 2 a 12 anos, e multa.","e":"Um policial rodoviário pede dinheiro ao motorista para não registrar a multa.","d":"A pena aumenta de um terço se o funcionário efetivamente retarda, deixa de praticar ou pratica o ato violando seu dever. No § 2º, se ele age cedendo a pedido ou influência de outra pessoa, sem vantagem, a pena cai para detenção, de 3 meses a 1 ano, ou multa.","pena":"Reclusão, de 2 a 12 anos, e multa.","rub":"Corrupção passiva","caput":"Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem:","txt":["Art. 317 - Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem:","Pena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.","§ 1º - A pena é aumentada de um terço, se, em conseqüência da vantagem ou promessa, o funcionário retarda ou deixa de praticar qualquer ato de ofício ou o pratica infringindo dever funcional.","§ 2º - Se o funcionário pratica, deixa de praticar ou retarda ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem:","Pena - detenção, de três meses a um ano, ou multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"318","t":"Facilitação de contrabando ou descaminho","k":"facilitar","s":"Pune o funcionário que, violando seu dever, facilita a prática de contrabando ou descaminho. A pena é de reclusão, de 3 a 8 anos, e multa.","e":"Um agente da Receita deixa passar sem fiscalização caminhões que ele sabe estarem carregados de mercadoria entrando sem pagar impostos.","d":"O funcionário responde por este crime, com pena própria, e não como coautor do contrabando ou descaminho. É preciso que ele tenha o dever funcional de impedir a prática.","pena":"Reclusão, de 3 a 8 anos, e multa.","rub":"Facilitação de contrabando ou descaminho","caput":"Facilitar, com infração de dever funcional, a prática de contrabando ou descaminho (art. 334):","txt":["Art. 318 - Facilitar, com infração de dever funcional, a prática de contrabando ou descaminho (art. 334):","Pena - reclusão, de 3 (três) a 8 (oito) anos, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"319","t":"Prevaricação","k":"retardar ou deixar de praticar","s":"Pune o funcionário que atrasa ou deixa de fazer, indevidamente, um ato do seu cargo, ou o faz contra a lei, para satisfazer interesse ou sentimento pessoal. A pena é de detenção, de 3 meses a 1 ano, e multa.","e":"Um delegado deixa de abrir inquérito contra um vizinho porque são amigos de longa data.","d":"Não há vantagem indevida envolvida: o motivo é interesse ou sentimento pessoal. Se houver vantagem, o caso é de corrupção passiva; se for cedendo a pedido de outrem, é o § 2º do art. 317.","pena":"Detenção, de 3 meses a 1 ano, e multa.","rub":"Prevaricação","caput":"Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal:","txt":["Art. 319 - Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal:","Pena - detenção, de três meses a um ano, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"319-A","t":"Omissão de vedar celular a preso","k":"deixar de vedar","s":"Pune o diretor de penitenciária ou agente público que deixa de cumprir seu dever de impedir que o preso tenha acesso a telefone, rádio ou aparelho parecido para se comunicar com outros presos ou com o mundo de fora. A pena é de detenção, de 3 meses a 1 ano.","e":"Um agente penitenciário vê um preso usando celular na cela e, por comodidade, finge que não viu e nada faz.","d":"É crime de omissão do agente público, sem multa na pena. Quem leva o aparelho para dentro do presídio responde por outro crime, previsto no art. 349-A.","pena":"Detenção, de 3 meses a 1 ano.","rub":"","caput":"Deixar o Diretor de Penitenciária e/ou agente público, de cumprir seu dever de vedar ao preso o acesso a aparelho telefônico, de rádio ou similar, que permita a comunicação com outros presos ou com o ambiente externo:.","txt":["Art. 319-A. Deixar o Diretor de Penitenciária e/ou agente público, de cumprir seu dever de vedar ao preso o acesso a aparelho telefônico, de rádio ou similar, que permita a comunicação com outros presos ou com o ambiente externo:.","Pena: detenção, de 3 (três) meses a 1 (um) ano."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"320","t":"Condescendência criminosa","k":"deixar de responsabilizar","s":"Pune o funcionário que, por indulgência, isto é, por tolerância ou pena, deixa de punir subordinado que cometeu infração no cargo ou, quando não tem competência para isso, não comunica o fato a quem tem. A pena é de detenção, de 15 dias a 1 mês, ou multa.","e":"Um chefe de setor descobre que um servidor subordinado falsificou a folha de ponto e, com dó, não toma nenhuma providência.","d":"O motivo é a indulgência, a tolerância. Se o chefe se omite para satisfazer interesse ou sentimento pessoal, pode ser prevaricação; se recebe vantagem, corrupção passiva.","pena":"Detenção, de 15 dias a 1 mês, ou multa.","rub":"Condescendência criminosa","caput":"Deixar o funcionário, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente:","txt":["Art. 320 - Deixar o funcionário, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente:","Pena - detenção, de quinze dias a um mês, ou multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"321","t":"Advocacia administrativa","k":"patrocinar","s":"Pune o funcionário que defende, direta ou indiretamente, interesse particular perante a administração pública, aproveitando-se da sua condição de servidor. A pena é de detenção, de 1 a 3 meses, ou multa.","e":"Um servidor da prefeitura usa sua influência no setor de alvarás para acelerar o pedido da loja do cunhado.","d":"O crime existe mesmo que o interesse defendido seja legítimo. Se o interesse for ilegítimo, a pena sobe para detenção, de 3 meses a 1 ano, além da multa.","pena":"Detenção, de 1 a 3 meses, ou multa.","rub":"Advocacia administrativa","caput":"Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário:","txt":["Art. 321 - Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário:","Pena - detenção, de um a três meses, ou multa.","Parágrafo único - Se o interesse é ilegítimo:","Pena - detenção, de três meses a um ano, além da multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"322","t":"Violência arbitrária","k":"praticar violência","s":"Pune o funcionário que pratica violência no exercício da função ou com a desculpa de estar exercendo-a. A pena é de detenção, de 6 meses a 3 anos, além da pena correspondente à violência.","e":"Um guarda municipal agride com socos um vendedor ambulante durante a apreensão de mercadorias.","d":"O agente responde pelos dois: pela violência arbitrária e também pelo resultado da violência, como a lesão corporal, com as penas somadas.","pena":"Detenção, de 6 meses a 3 anos, além da pena correspondente à violência.","rub":"Violência arbitrária","caput":"Praticar violência, no exercício de função ou a pretexto de exercê-la:","txt":["Art. 322 - Praticar violência, no exercício de função ou a pretexto de exercê-la:","Pena - detenção, de seis meses a três anos, além da pena correspondente à violência."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"323","t":"Abandono de função","k":"abandonar","s":"Pune quem abandona cargo público fora dos casos permitidos em lei. A pena é de detenção, de 15 dias a 1 mês, ou multa.","e":"O único vigia de um posto de saúde vai embora no meio do plantão e deixa o local sem ninguém por dias.","d":"Há duas formas mais graves: se resulta prejuízo público, detenção de 3 meses a 1 ano, e multa; se ocorre em faixa de fronteira, detenção de 1 a 3 anos, e multa.","pena":"Detenção, de 15 dias a 1 mês, ou multa.","rub":"Abandono de função","caput":"Abandonar cargo público, fora dos casos permitidos em lei:","txt":["Art. 323 - Abandonar cargo público, fora dos casos permitidos em lei:","Pena - detenção, de quinze dias a um mês, ou multa.","§ 1º - Se do fato resulta prejuízo público:","Pena - detenção, de três meses a um ano, e multa.","§ 2º - Se o fato ocorre em lugar compreendido na faixa de fronteira:","Pena - detenção, de um a três anos, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"324","t":"Exercício funcional antecipado ou prolongado","k":"entrar ou continuar","s":"Pune quem começa a exercer função pública antes de cumprir as exigências legais, ou continua exercendo-a sem autorização depois de saber oficialmente que foi exonerado, removido, substituído ou suspenso. A pena é de detenção, de 15 dias a 1 mês, ou multa.","e":"Um servidor recebe a notificação oficial da sua suspensão, mas continua indo à repartição assinar despachos.","d":"Na forma de continuar no cargo, é preciso que o funcionário saiba oficialmente do afastamento; um boato não basta.","pena":"Detenção, de 15 dias a 1 mês, ou multa.","rub":"Exercício funcional ilegalmente antecipado ou prolongado","caput":"Entrar no exercício de função pública antes de satisfeitas as exigências legais, ou continuar a exercê-la, sem autorização, depois de saber oficialmente que foi exonerado, removido, substituído ou suspenso:","txt":["Art. 324 - Entrar no exercício de função pública antes de satisfeitas as exigências legais, ou continuar a exercê-la, sem autorização, depois de saber oficialmente que foi exonerado, removido, substituído ou suspenso:","Pena - detenção, de quinze dias a um mês, ou multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"325","t":"Violação de sigilo funcional","k":"revelar","s":"Pune o funcionário que revela, ou facilita que se revele, fato que conheceu por causa do cargo e que deveria ficar em segredo. A pena é de detenção, de 6 meses a 2 anos, ou multa, se o fato não constituir crime mais grave.","e":"Um servidor conta a um amigo empresário o conteúdo de uma operação fiscal que ainda vai acontecer na empresa dele.","d":"Também comete o crime quem empresta senha ou facilita acesso de pessoas não autorizadas aos sistemas da Administração, ou usa indevidamente acesso restrito. Se resulta dano, a pena vira reclusão, de 2 a 6 anos, e multa.","pena":"Detenção, de 6 meses a 2 anos, ou multa, se o fato não constitui crime mais grave.","rub":"Violação de sigilo funcional","caput":"Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo, ou facilitar-lhe a revelação:","txt":["Art. 325 - Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo, ou facilitar-lhe a revelação:","Pena - detenção, de seis meses a dois anos, ou multa, se o fato não constitui crime mais grave.","§ 1º Nas mesmas penas deste artigo incorre quem:","I - permite ou facilita, mediante atribuição, fornecimento e empréstimo de senha ou qualquer outra forma, o acesso de pessoas não autorizadas a sistemas de informações ou banco de dados da Administração Pública;","II - se utiliza, indevidamente, do acesso restrito.","§ 2º Se da ação ou omissão resulta dano à Administração Pública ou a outrem:","Pena - reclusão, de 2 (dois) a 6 (seis) anos, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"326","t":"Violação de sigilo de concorrência","k":"devassar","s":"Pune quem viola o sigilo de proposta de concorrência pública, ou dá a outra pessoa oportunidade de violá-lo. A pena é de detenção, de 3 meses a 1 ano, e multa.","e":"Um funcionário abre o envelope lacrado de uma proposta antes da sessão e conta o valor a uma empresa concorrente.","d":"Não confunda com o art. 337-J, que trata da violação de sigilo de proposta em processo licitatório e tem pena bem maior, detenção de 2 a 3 anos, e multa.","pena":"Detenção, de 3 meses a 1 ano, e multa.","rub":"Violação do sigilo de proposta de concorrência","caput":"Devassar o sigilo de proposta de concorrência pública, ou proporcionar a terceiro o ensejo de devassá-lo:","txt":["Art. 326 - Devassar o sigilo de proposta de concorrência pública, ou proporcionar a terceiro o ensejo de devassá-lo:","Pena - Detenção, de três meses a um ano, e multa."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"327","t":"Funcionário público","k":"funcionário público","s":"Define quem é funcionário público para o Direito Penal: qualquer pessoa que exerce cargo, emprego ou função pública, mesmo que de forma temporária ou sem receber salário. Também são equiparados quem trabalha em entidade paraestatal e em empresa contratada ou conveniada para executar atividade típica da Administração.","e":"Um mesário convocado para as eleições, que não recebe salário e atua só um dia, é funcionário público para fins penais.","d":"O § 2º aumenta a pena da terça parte quando o autor dos crimes do capítulo ocupa cargo em comissão ou função de direção ou assessoramento em órgão da administração direta, sociedade de economia mista, empresa pública ou fundação pública.","pena":"","rub":"Funcionário público","caput":"Considera-se funcionário público, para os efeitos penais, quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública.","txt":["Art. 327 - Considera-se funcionário público, para os efeitos penais, quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública.","§ 1º - Equipara-se a funcionário público quem exerce cargo, emprego ou função em entidade paraestatal, e quem trabalha para empresa prestadora de serviço contratada ou conveniada para a execução de atividade típica da Administração Pública.","§ 2º -
