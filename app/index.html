sivamente comunicação telegráfica ou radioelétrica dirigida a terceiro, ou conversação telefônica entre outras pessoas;","III - quem impede a comunicação ou a conversação referidas no número anterior;","IV - quem instala ou utiliza estação ou aparelho radioelétrico, sem observância de disposição legal.","§ 2º - As penas aumentam-se de metade, se há dano para outrem.","§ 3º - Se o agente comete o crime, com abuso de função em serviço postal, telegráfico, radioelétrico ou telefônico:","Pena - detenção, de um a três anos.","§ 4º - Somente se procede mediante representação, salvo nos casos do § 1º, IV, e do § 3º."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"152","t":"Correspondência comercial","k":"abusar da condição","s":"Pune o sócio ou empregado de empresa comercial ou industrial que se aproveita do cargo para desviar, esconder, subtrair ou destruir correspondência da empresa, ou contar seu conteúdo a estranhos. A pena é de detenção, de 3 meses a 2 anos.","e":"Um funcionário do setor de compras desvia os e-mails impressos com propostas da empresa e entrega o conteúdo a um concorrente.","d":"Só pode cometer este crime o sócio ou empregado do estabelecimento, e a ação depende de representação.","pena":"Detenção, de 3 meses a 2 anos.","rub":"Correspondência comercial","caput":"Abusar da condição de sócio ou empregado de estabelecimento comercial ou industrial para, no todo ou em parte, desviar, sonegar, subtrair ou suprimir correspondência, ou revelar a estranho seu conteúdo:","txt":["Art. 152 - Abusar da condição de sócio ou empregado de estabelecimento comercial ou industrial para, no todo ou em parte, desviar, sonegar, subtrair ou suprimir correspondência, ou revelar a estranho seu conteúdo:","Pena - detenção, de três meses a dois anos.","Parágrafo único - Somente se procede mediante representação."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"153","t":"Divulgação de segredo","k":"divulgar","s":"Pune quem, sem motivo justo, divulga o conteúdo de documento particular ou carta confidencial que recebeu ou guarda, quando isso pode causar dano a alguém. A pena é de detenção, de 1 a 6 meses, ou multa.","e":"Uma pessoa recebe uma carta confidencial do primo contando suas dívidas e publica o texto no grupo da família, causando prejuízo a ele.","d":"Divulgar informações sigilosas da Administração Pública tem pena maior: detenção, de 1 a 4 anos, e multa. A ação depende de representação, mas passa a ser incondicionada se houver prejuízo para a Administração Pública.","pena":"Detenção, de 1 a 6 meses, ou multa, de trezentos mil réis a dois contos de réis.","rub":"Divulgação de segredo","caput":"Divulgar alguém, sem justa causa, conteúdo de documento particular ou de correspondência confidencial, de que é destinatário ou detentor, e cuja divulgação possa produzir dano a outrem:","txt":["Art. 153 - Divulgar alguém, sem justa causa, conteúdo de documento particular ou de correspondência confidencial, de que é destinatário ou detentor, e cuja divulgação possa produzir dano a outrem:","Pena - detenção, de um a seis meses, ou multa, de trezentos mil réis a dois contos de réis.","§ 1º Somente se procede mediante representação.","§ 1º-A. Divulgar, sem justa causa, informações sigilosas ou reservadas, assim definidas em lei, contidas ou não nos sistemas de informações ou banco de dados da Administração Pública:","Pena - detenção, de 1 (um) a 4 (quatro) anos, e multa.","§ 2º Quando resultar prejuízo para a Administração Pública, a ação penal será incondicionada."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"154","t":"Violação do segredo profissional","k":"revelar segredo","s":"Pune quem revela, sem motivo justo, um segredo que conheceu por causa da sua função, ofício ou profissão, quando isso pode causar dano a alguém. A pena é de detenção, de 3 meses a 1 ano, ou multa.","e":"Uma psicóloga conta numa festa o que um paciente revelou durante a sessão.","d":"O segredo precisa ter sido conhecido em razão da profissão ou função; se a pessoa divulga documento ou carta confidencial que apenas recebeu, o crime é o de divulgação de segredo. A ação depende de representação.","pena":"Detenção, de 3 meses a 1 ano, ou multa de um conto a dez contos de réis.","rub":"Violação do segredo profissional","caput":"Revelar alguém, sem justa causa, segredo, de que tem ciência em razão de função, ministério, ofício ou profissão, e cuja revelação possa produzir dano a outrem:","txt":["Art. 154 - Revelar alguém, sem justa causa, segredo, de que tem ciência em razão de função, ministério, ofício ou profissão, e cuja revelação possa produzir dano a outrem:","Pena - detenção, de três meses a um ano, ou multa de um conto a dez contos de réis.","Parágrafo único - Somente se procede mediante representação."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"154-A","t":"Invasão de dispositivo informático","k":"invadir dispositivo","s":"Pune quem invade celular, computador ou outro aparelho de outra pessoa para obter, alterar ou destruir dados sem autorização, ou para instalar falhas e tirar vantagem. A pena é de reclusão, de 1 a 4 anos, e multa.","e":"O técnico de uma loja de conserto acessa sem permissão as fotos e conversas do celular de um cliente e copia tudo para o próprio computador.","d":"Se a invasão permite obter conversas privadas, segredos comerciais ou controlar o aparelho à distância, a pena é de reclusão, de 2 a 5 anos, e multa. Quem fabrica ou vende programa para invadir responde com a mesma pena do caput.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Invasão de dispositivo informático","caput":"Invadir dispositivo informático de uso alheio, conectado ou não à rede de computadores, com o fim de obter, adulterar ou destruir dados ou informações sem autorização expressa ou tácita do usuário do dispositivo ou de instalar vulnerabilidades para obter vantagem ilícita:","txt":["Art. 154-A. Invadir dispositivo informático de uso alheio, conectado ou não à rede de computadores, com o fim de obter, adulterar ou destruir dados ou informações sem autorização expressa ou tácita do usuário do dispositivo ou de instalar vulnerabilidades para obter vantagem ilícita:","Pena - reclusão, de 1 (um) a 4 (quatro) anos, e multa.","§ 1º Na mesma pena incorre quem produz, oferece, distribui, vende ou difunde dispositivo ou programa de computador com o intuito de permitir a prática da conduta definida no caput.","§ 2º Aumenta-se a pena de 1/3 (um terço) a 2/3 (dois terços) se da invasão resulta prejuízo econômico.","§ 3º Se da invasão resultar a obtenção de conteúdo de comunicações eletrônicas privadas, segredos comerciais ou industriais, informações sigilosas, assim definidas em lei, ou o controle remoto não autorizado do dispositivo invadido:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","§ 4º Na hipótese do § 3º, aumenta-se a pena de um a dois terços se houver divulgação, comercialização ou transmissão a terceiro, a qualquer título, dos dados ou informações obtidos.","§ 5º Aumenta-se a pena de um terço à metade se o crime for praticado contra:","I - Presidente da República, governadores e prefeitos;","II - Presidente do Supremo Tribunal Federal;","III - Presidente da Câmara dos Deputados, do Senado Federal, de Assembleia Legislativa de Estado, da Câmara Legislativa do Distrito Federal ou de Câmara Municipal; ou","IV - dirigente máximo da administração direta e indireta federal, estadual, municipal ou do Distrito Federal."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"154-B","t":"Ação penal na invasão informática","k":"representação","s":"Na invasão de dispositivo informático, o processo só começa se a vítima fizer representação, isto é, se ela pedir formalmente que o caso seja investigado. A exceção é quando a vítima é a administração pública ou uma concessionária de serviço público.","e":"Se o sistema de uma prefeitura é invadido, o Ministério Público pode agir sozinho, sem esperar pedido de ninguém.","d":"A exceção vale também para empresas concessionárias de serviços públicos, como uma distribuidora de energia, e não só para órgãos públicos.","pena":"","rub":"Ação penal","caput":"Nos crimes definidos no art. 154-A, somente se procede mediante representação, salvo se o crime é cometido contra a administração pública direta ou indireta de qualquer dos Poderes da União, Estados, Distrito Federal ou Municípios ou contra empresas concessionárias de serviços públicos.","txt":["Art. 154-B. Nos crimes definidos no art. 154-A, somente se procede mediante representação, salvo se o crime é cometido contra a administração pública direta ou indireta de qualquer dos Poderes da União, Estados, Distrito Federal ou Municípios ou contra empresas concessionárias de serviços públicos."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"155","t":"Furto","k":"subtrair","s":"Pune quem pega para si ou para outra pessoa uma coisa móvel que pertence a outro, sem violência nem ameaça. A pena é de reclusão, de 1 a 6 anos, e multa.","e":"Uma pessoa pega a bicicleta destrancada na porta de uma padaria e sai pedalando.","d":"Furtar celular, computador, animal doméstico ou arma de fogo tem pena própria de 4 a 10 anos, maior que a do furto qualificado comum, de 2 a 8 anos. Se o réu é primário e a coisa é de pequeno valor, o juiz pode trocar a reclusão por detenção, diminuir a pena de um a dois terços ou aplicar só multa.","pena":"Reclusão, de 1 a 6 anos, e multa.","rub":"Furto","caput":"Subtrair, para si ou para outrem, coisa alheia móvel:","txt":["Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:","Pena - reclusão, de 1 (um) a 6 (seis) anos, e multa.","§ 1º A pena aumenta-se de metade, se o crime é praticado durante o repouso noturno.","§ 2º - Se o criminoso é primário, e é de pequeno valor a coisa furtada, o juiz pode substituir a pena de reclusão pela de detenção, diminuí-la de um a dois terços, ou aplicar somente a pena de multa.","§ 3º - Equipara-se à coisa móvel a energia elétrica ou qualquer outra que tenha valor econômico.","Furto qualificado","§ 4º A pena é de reclusão, de 2 (dois) a 8 (oito) anos, e multa, se o crime é cometido:","I - com destruição ou rompimento de obstáculo à subtração da coisa;","II - com abuso de confiança, ou mediante fraude, escalada ou destreza;","III - com emprego de chave falsa;","IV - mediante concurso de duas ou mais pessoas","V - contra quaisquer bens que comprometam o funcionamento de órgãos da União, de Estado, do Distrito Federal ou de Município ou de estabelecimentos públicos ou privados que prestem serviços essenciais.","§ 4º-A A pena é de reclusão de 4 (quatro) a 10 (dez) anos e multa, se houver emprego de explosivo ou de artefato análogo que cause perigo comum.","§ 4º-B. A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o furto mediante fraude é cometido por meio de dispositivo eletrônico ou informático, conectado ou não à rede de computadores, com ou sem a violação de mecanismo de segurança ou a utilização de programa malicioso, ou por qualquer outro meio fraudulento análogo.","§ 4º-C. A pena prevista no § 4º-B deste artigo, considerada a relevância do resultado gravoso:","I - aumenta-se de 1/3 (um terço) a 2/3 (dois terços), se o crime é praticado mediante a utilização de servidor mantido fora do território nacional;","II - aumenta-se de 1/3 (um terço) ao dobro, se o crime é praticado contra idoso ou vulnerável.","§ 5º A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for de veículo automotor que venha a ser transportado para outro Estado ou para o exterior.","§ 6º A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for:","I - de semovente domesticável de produção, ainda que abatido ou dividido em partes no local da subtração, ou de animal doméstico;","II - de aparelho de telefonia celular, de computador, inclusive portátil ou do tipo prancheta, ou de qualquer dispositivo eletrônico ou informático semelhante.","§ 7º A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for:","I - de substâncias explosivas ou de acessórios que, conjunta ou isoladamente, possibilitem sua fabricação, montagem ou emprego;","II - de arma de fogo.","§ 8º A pena é de reclusão, de 2 (dois) a 8 (oito) anos, e multa, se a subtração for de fios, cabos ou equipamentos utilizados para fornecimento ou transmissão de energia elétrica ou de telefonia ou para transferência de dados, bem como equipamentos ou materiais ferroviários ou metroviários, aplicável, em qualquer caso, o disposto no § 2º deste artigo.","§ 9º A pena é de reclusão de 4 (quatro) a 10 (dez) anos e multa, se a subtração, para si ou para outrem, de coisa alheia móvel é cometida por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.","§ 10. A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for de petróleo e derivados, gás natural e suas frações recuperáveis, álcool etílico hidratado carburante e demais combustíveis fluidos carburantes, inclusive biocombustíveis, e óleos lubrificantes, removidos dos estabelecimentos de produção ou de quaisquer instalações de armazenamento e de transporte de combustíveis, incluídos dutos e unidades de transporte em qualquer modal.","§ 11. Na hipótese do § 10 deste artigo, a pena é aumentada de 1/3 (um terço), se o crime é praticado:","I - com destruição, rompimento de obstáculo à subtração da coisa ou dano de qualquer natureza;","II - mediante o concurso de 2 (duas) ou mais pessoas;","III - com abuso de confiança ou valendo-se de vínculo atual ou passado com o ente lesado; ou","IV - por ocupante de cargo, de emprego ou de função pública.","§ 12. Na hipótese do § 10 deste artigo, a pena é aumentada de 2/3 (dois terços) se do crime resulta:","I - suspensão ou paralisação das atividades do estabelecimento;","II - desabastecimento;","III - incêndio;","IV - poluição efetiva ou potencial ao meio ambiente;","V - lesão corporal grave; ou","VI - morte."],"ti":9,"ch":"Do furto"},{"n":"156","t":"Furto de coisa comum","k":"subtrair coisa comum","s":"Pune o condômino, co-herdeiro ou sócio que tira a coisa que pertence a todos de quem a guarda legitimamente. A pena é de detenção, de 6 meses a 2 anos, ou multa.","e":"Um irmão leva escondido para a casa dele o carro herdado dos pais, que estava sob a guarda da irmã.","d":"A ação depende de representação. E não é punível pegar coisa comum fungível (substituível, como dinheiro) se o valor não passa da parte a que o agente tem direito.","pena":"Detenção, de 6 meses a 2 anos, ou multa.","rub":"Furto de coisa comum","caput":"Subtrair o condômino, co-herdeiro ou sócio, para si ou para outrem, a quem legitimamente a detém, a coisa comum:","txt":["Art. 156 - Subtrair o condômino, co-herdeiro ou sócio, para si ou para outrem, a quem legitimamente a detém, a coisa comum:","Pena - detenção, de seis meses a dois anos, ou multa.","§ 1º - Somente se procede mediante representação.","§ 2º - Não é punível a subtração de coisa comum fungível, cujo valor não excede a quota a que tem direito o agente."],"ti":9,"ch":"Do furto"},{"n":"157","t":"Roubo","k":"subtrair mediante violência","s":"Pune quem tira coisa móvel de outra pessoa usando grave ameaça ou violência, ou depois de deixá-la sem condições de resistir. A pena é de reclusão, de 6 a 10 anos, e multa.","e":"Um assaltante mostra uma faca num ponto de ônibus e obriga a vítima a entregar o celular.","d":"Também é roubo usar violência logo depois de pegar a coisa, para fugir ou ficar com ela (roubo impróprio). Arma de fogo aumenta a pena em 2/3, arma branca de 1/3 até metade, e se da violência resulta morte a pena é de 24 a 30 anos.","pena":"Reclusão, de 6 a 10 anos, e multa.","rub":"Roubo","caput":"Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:","txt":["Art. 157 - Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:","Pena - reclusão, de 6 (seis) a 10 (dez) anos, e multa.","§ 1º - Na mesma pena incorre quem, logo depois de subtraída a coisa, emprega violência contra pessoa ou grave ameaça, a fim de assegurar a impunidade do crime ou a detenção da coisa para si ou para terceiro.","§ 1º-A. A pena é de reclusão, de 6 (seis) a 12 (doze) anos, e multa, se a subtração for cometida contra quaisquer bens que comprometam o funcionamento de órgãos da União, de Estado, do Distrito Federal ou de Município ou de estabelecimentos públicos ou privados que prestem serviços públicos essenciais.","§ 2º A pena aumenta-se de 1/3 (um terço) até metade:","I - (revogado);","II - se há o concurso de duas ou mais pessoas;","III - se a vítima está em serviço de transporte de valores e o agente conhece tal circunstância.","IV - se a subtração for de veículo automotor que venha a ser transportado para outro Estado ou para o exterior;","V - se o agente mantém a vítima em seu poder, restringindo sua liberdade.","VI - se a subtração for de substâncias explosivas ou de acessórios que, conjunta ou isoladamente, possibilitem sua fabricação, montagem ou emprego.","VII - se a violência ou grave ameaça é exercida com emprego de arma branca;","VIII - se a subtração for de fios, cabos ou equipamentos utilizados para fornecimento ou transmissão de energia elétrica ou de telefonia ou para transferência de dados, bem como equipamentos ou materiais ferroviários ou metroviários.","IX - se a subtração for de aparelho de telefonia celular, de computador, inclusive portátil ou do tipo prancheta, ou de qualquer dispositivo eletrônico ou informático semelhante;","X - se a subtração for de arma de fogo.","XI - se a subtração for de petróleo e derivados, gás natural e suas frações recuperáveis, álcool etílico hidratado carburante e demais combustíveis fluidos carburantes, inclusive biocombustíveis, e óleos lubrificantes, removidos dos estabelecimentos de produção ou de quaisquer instalações de armazenamento e de transporte de combustíveis, incluídos dutos e unidades de transporte em qualquer modal.","§ 2º-A A pena aumenta-se de 2/3 (dois terços):","I - se a violência ou ameaça é exercida com emprego de arma de fogo;","II - se há destruição ou rompimento de obstáculo mediante o emprego de explosivo ou de artefato análogo que cause perigo comum.","III - se do crime previsto no inciso XI do § 2º deste artigo resulta:","a) suspensão ou paralisação das atividades do estabelecimento;","b) desabastecimento;","c) incêndio;","d) poluição efetiva ou potencial ao meio ambiente; ou","e) (VETADO).","§ 2º-B. Se a violência ou grave ameaça é exercida com emprego de arma de fogo de uso restrito ou proibido, aplica-se em dobro a pena prevista no caput deste artigo.","§ 3º Se da violência resulta:","I - lesão corporal grave, a pena é de reclusão de 7 (sete) a 18 (dezoito) anos, e multa;","II - morte, a pena é de reclusão, de 24 (vinte e quatro) a 30 (trinta) anos, e multa.","§ 4º Se a violência ou grave ameaça é cometida por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil, aplica-se em triplo a pena prevista no caput deste artigo, desprezadas as demais causas de aumento.","§ 5º Se o crime previsto no inciso II do § 3º deste artigo é cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil, e da violência resulta morte:","Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos, e multa."],"ti":9,"ch":"Do roubo e da extorsão"},{"n":"158","t":"Extorsão","k":"constranger","s":"Pune quem obriga alguém, com violência ou grave ameaça, a fazer, tolerar ou deixar de fazer algo para obter vantagem econômica indevida. A pena é de reclusão, de 4 a 10 anos, e multa.","e":"Um criminoso liga para a vítima dizendo que vai machucar sua família se ela não fizer um Pix naquele dia.","d":"Na extorsão a colaboração da vítima é indispensável (ela mesma entrega ou faz algo); no roubo o agente pega a coisa. Se a vítima tem a liberdade restringida para obter a vantagem (sequestro relâmpago), a pena é de reclusão, de 6 a 12 anos, além da multa.","pena":"Reclusão, de 4 a 10 anos, e multa.","rub":"Extorsão","caput":"Constranger alguém, mediante violência ou grave ameaça, e com o intuito de obter para si ou para outrem indevida vantagem econômica, a fazer, tolerar que se faça ou deixar de fazer alguma coisa:","txt":["Art. 158 - Constranger alguém, mediante violência ou grave ameaça, e com o intuito de obter para si ou para outrem indevida vantagem econômica, a fazer, tolerar que se faça ou deixar de fazer alguma coisa:","Pena - reclusão, de quatro a dez anos, e multa.","§ 1º - Se o crime é cometido por duas ou mais pessoas, ou com emprego de arma, aumenta-se a pena de um terço até metade.","§ 2º - Aplica-se à extorsão praticada mediante violência o disposto no § 3º do artigo anterior. Vide Lei nº 8.072, de 25.7.90","§ 3º Se o crime é cometido mediante a restrição da liberdade da vítima, e essa condição é necessária para a obtenção da vantagem econômica, a pena é de reclusão, de 6 (seis) a 12 (doze) anos, além da multa; se resulta lesão corporal grave ou morte, aplicam-se as penas previstas no art. 159, §§ 2º e 3º, respectivamente.","§ 4º Se os crimes previstos neste artigo são cometidos por integrante de organização criminosa, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas, aplica-se em triplo a respectiva pena."],"ti":9,"ch":"Do roubo e da extorsão"},{"n":"159","t":"Extorsão mediante sequestro","k":"sequestrar","s":"Pune quem sequestra uma pessoa para conseguir qualquer vantagem como condição ou preço do resgate. A pena é de reclusão, de 8 a 15 anos.","e":"Uma quadrilha sequestra um empresário e exige dinheiro da família para libertá-lo.","d":"Se o sequestro dura mais de 24 horas ou a vítima é menor de 18 ou maior de 60 anos, a pena é de 12 a 20 anos; se resulta morte, de 24 a 30 anos. O participante que denuncia o crime e facilita a libertação tem a pena reduzida de um a dois terços.","pena":"Reclusão, de 8 a 15 anos.","rub":"Extorsão mediante seqüestro","caput":"Seqüestrar pessoa com o fim de obter, para si ou para outrem, qualquer vantagem, como condição ou preço do resgate: Vide Lei nº 8.072, de 25.7.90","txt":["Art. 159 - Seqüestrar pessoa com o fim de obter, para si ou para outrem, qualquer vantagem, como condição ou preço do resgate: Vide Lei nº 8.072, de 25.7.90","Pena - reclusão, de oito a quinze anos.","§ 1º Se o seqüestro dura mais de 24 (vinte e quatro) horas, se o seqüestrado é menor de 18 (dezoito) ou maior de 60 (sessenta) anos, ou se o crime é cometido por bando ou quadrilha. Vide Lei nº 8.072, de 25.7.90","Pena - reclusão, de doze a vinte anos.","§ 2º - Se do fato resulta lesão corporal de natureza grave: Vide Lei nº 8.072, de 25.7.90","Pena - reclusão, de dezesseis a vinte e quatro anos.","§ 3º - Se resulta a morte:","Pena - reclusão, de vinte e quatro a trinta anos.","§ 4º - Se o crime é cometido em concurso, o concorrente que o denunciar à autoridade, facilitando a libertação do seqüestrado, terá sua pena reduzida de um a dois terços.","§ 5º Se os crimes previstos neste artigo são cometidos por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil, aumenta-se a respectiva pena em 2/3 (dois terços)."],"ti":9,"ch":"Do roubo e da extorsão"},{"n":"160","t":"Extorsão indireta","k":"exigir ou receber","s":"Pune quem se aproveita da situação difícil de alguém para exigir ou receber, como garantia de dívida, um documento que pode levar a um processo criminal contra a vítima ou outra pessoa. A pena é de reclusão, de 1 a 3 anos, e multa.","e":"Um agiota aproveita o desespero de quem precisa de dinheiro e exige, como garantia do empréstimo, uma carta em que o devedor confessa ter desviado dinheiro da empresa.","d":"Não há violência nem ameaça: o crime está em abusar da situação da vítima, e basta exigir ou receber o documento, mesmo que ele nunca seja usado.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Extorsão indireta","caput":"Exigir ou receber, como garantia de dívida, abusando da situação de alguém, documento que pode dar causa a procedimento criminal contra a vítima ou contra terceiro:","txt":["Art. 160 - Exigir ou receber, como garantia de dívida, abusando da situação de alguém, documento que pode dar causa a procedimento criminal contra a vítima ou contra terceiro:","Pena - reclusão, de um a três anos, e multa."],"ti":9,"ch":"Do roubo e da extorsão"},{"n":"161","t":"Alteração de limites","k":"suprimir ou deslocar","s":"Pune quem tira ou muda de lugar cerca, marco ou outro sinal de divisa para ficar com parte de um imóvel alheio. A pena é de detenção, de 1 a 6 meses, e multa.","e":"Um sitiante muda a cerca de lugar durante a noite para aumentar seu terreno sobre o do vizinho.","d":"Têm a mesma pena desviar águas alheias e invadir terreno com violência, grave ameaça ou mais de duas pessoas (esbulho possessório). Se a propriedade é particular e não há violência, a ação é por queixa.","pena":"Detenção, de 1 a 6 meses, e multa.","rub":"Alteração de limites","caput":"Suprimir ou deslocar tapume, marco, ou qualquer outro sinal indicativo de linha divisória, para apropriar-se, no todo ou em parte, de coisa imóvel alheia:","txt":["Art. 161 - Suprimir ou deslocar tapume, marco, ou qualquer outro sinal indicativo de linha divisória, para apropriar-se, no todo ou em parte, de coisa imóvel alheia:","Pena - detenção, de um a seis meses, e multa.","§ 1º - Na mesma pena incorre quem:","Usurpação de águas","I - desvia ou represa, em proveito próprio ou de outrem, águas alheias;","Esbulho possessório","II - invade, com violência a pessoa ou grave ameaça, ou mediante concurso de mais de duas pessoas, terreno ou edifício alheio, para o fim de esbulho possessório.","§ 2º - Se o agente usa de violência, incorre também na pena a esta cominada.","§ 3º - Se a propriedade é particular, e não há emprego de violência, somente se procede mediante queixa."],"ti":9,"ch":"Da usurpação"},{"n":"162","t":"Supressão de marca em animais","k":"suprimir ou alterar","s":"Pune quem apaga ou altera, sem direito, a marca ou sinal que mostra quem é o dono de gado ou rebanho de outra pessoa. A pena é de detenção, de 6 meses a 3 anos, e multa.","e":"Um peão apaga a marca de ferro dos bois do vizinho e coloca a marca do seu patrão.","d":"O crime está em mexer na marca de propriedade; não é preciso levar os animais embora. Se houver subtração dos animais, entra em cena o furto.","pena":"Detenção, de 6 meses a 3 anos, e multa.","rub":"Supressão ou alteração de marca em animais","caput":"Suprimir ou alterar, indevidamente, em gado ou rebanho alheio, marca ou sinal indicativo de propriedade:","txt":["Art. 162 - Suprimir ou alterar, indevidamente, em gado ou rebanho alheio, marca ou sinal indicativo de propriedade:","Pena - detenção, de seis meses a três anos, e multa."],"ti":9,"ch":"Da usurpação"},{"n":"163","t":"Dano","k":"destruir, inutilizar ou deteriorar","s":"Pune quem destrói, inutiliza ou estraga coisa de outra pessoa. A pena é de detenção, de 1 a 6 meses, ou multa.","e":"Por raiva, uma pessoa risca com a chave toda a lataria do carro do vizinho.","d":"O dano qualificado (com violência, explosivo, contra patrimônio público ou com prejuízo considerável) tem pena de 6 meses a 3 anos, e multa. Não existe dano culposo no Código Penal: estragar sem querer não é este crime.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Dano","caput":"Destruir, inutilizar ou deteriorar coisa alheia:","txt":["Art. 163 - Destruir, inutilizar ou deteriorar coisa alheia:","Pena - detenção, de um a seis meses, ou multa.","Dano qualificado","Parágrafo único - Se o crime é cometido:","I - com violência à pessoa ou grave ameaça;","II - com emprego de substância inflamável ou explosiva, se o fato não constitui crime mais grave","III - contra o patrimônio da União, de Estado, do Distrito Federal, de Município ou de autarquia, fundação pública, empresa pública, sociedade de economia mista ou empresa concessionária de serviços públicos;","IV - por motivo egoístico ou com prejuízo considerável para a vítima:","Pena - detenção, de seis meses a três anos, e multa, além da pena correspondente à violência."],"ti":9,"ch":"Do dano"},{"n":"164","t":"Abandono de animais em propriedade alheia","k":"introduzir ou deixar","s":"Pune quem coloca ou deixa animais em propriedade de outra pessoa, sem autorização, quando isso causa prejuízo. A pena é de detenção, de 15 dias a 6 meses, ou multa.","e":"Um criador solta as vacas no pasto do vizinho sem permissão e elas destroem a plantação de milho.","d":"Só há crime se houver prejuízo; sem prejuízo, o fato não é punível. A ação penal é privada, ou seja, depende de queixa da vítima.","pena":"Detenção, de 15 dias a 6 meses, ou multa.","rub":"Introdução ou abandono de animais em propriedade alheia","caput":"Introduzir ou deixar animais em propriedade alheia, sem consentimento de quem de direito, desde que o fato resulte prejuízo:","txt":["Art. 164 - Introduzir ou deixar animais em propriedade alheia, sem consentimento de quem de direito, desde que o fato resulte prejuízo:","Pena - detenção, de quinze dias a seis meses, ou multa."],"ti":9,"ch":"Do dano"},{"n":"165","t":"Dano em coisa tombada","k":"destruir coisa tombada","s":"Pune quem destrói, inutiliza ou estraga um bem tombado (protegido oficialmente) por seu valor artístico, arqueológico ou histórico. A pena é de detenção, de 6 meses a 2 anos, e multa.","e":"Um homem quebra a marretadas parte de uma escultura tombada numa praça do centro histórico.","d":"O bem precisa ter sido tombado pela autoridade competente; se não houver tombamento, o fato é dano comum.","pena":"Detenção, de 6 meses a 2 anos, e multa.","rub":"Dano em coisa de valor artístico, arqueológico ou histórico","caput":"Destruir, inutilizar ou deteriorar coisa tombada pela autoridade competente em virtude de valor artístico, arqueológico ou histórico:","txt":["Art. 165 - Destruir, inutilizar ou deteriorar coisa tombada pela autoridade competente em virtude de valor artístico, arqueológico ou histórico:","Pena - detenção, de seis meses a dois anos, e multa."],"ti":9,"ch":"Do dano"},{"n":"166","t":"Alteração de local protegido","k":"alterar o aspecto","s":"Pune quem muda a aparência de um local especialmente protegido por lei sem licença da autoridade. A pena é de detenção, de 1 mês a 1 ano, ou multa.","e":"O dono de um casarão em área protegida constrói um anexo que muda a fachada sem pedir licença à prefeitura.","d":"Aqui não é preciso destruir nada: basta alterar o aspecto do local sem licença. Se houver destruição de bem tombado, o crime é outro.","pena":"Detenção, de 1 mês a 1 ano, ou multa.","rub":"Alteração de local especialmente protegido","caput":"Alterar, sem licença da autoridade competente, o aspecto de local especialmente protegido por lei:","txt":["Art. 166 - Alterar, sem licença da autoridade competente, o aspecto de local especialmente protegido por lei:","Pena - detenção, de um mês a um ano, ou multa."],"ti":9,"ch":"Do dano"},{"n":"167","t":"Ação penal no dano","k":"queixa","s":"No dano simples, no dano por motivo egoístico ou com prejuízo considerável e no abandono de animais em propriedade alheia, o processo depende de queixa. Queixa é a ação que a própria vítima move, por meio de advogado.","e":"O dono do carro riscado pelo vizinho precisa contratar um advogado e apresentar queixa-crime para que o caso vá à Justiça.","d":"Só esses casos são de queixa; os demais tipos de dano qualificado, como o praticado com violência ou contra patrimônio público, são de ação pública.","pena":"","rub":"Ação penal","caput":"Nos casos do art. 163, do inciso IV do seu parágrafo e do art. 164, somente se procede mediante queixa.","txt":["Art. 167 - Nos casos do art. 163, do inciso IV do seu parágrafo e do art. 164, somente se procede mediante queixa."],"ti":9,"ch":"Do dano"},{"n":"168","t":"Apropriação indébita","k":"apropriar-se","s":"Pune quem fica como dono de uma coisa móvel alheia que já estava legitimamente com ele, por empréstimo, guarda ou trabalho. A pena é de reclusão, de 1 a 4 anos, e multa.","e":"Uma pessoa pega emprestado o notebook de um amigo e depois o vende, dizendo que foi roubado.","d":"Aqui a pessoa recebe a coisa de boa-fé e só depois decide ficar com ela; no furto ela subtrai e no estelionato engana antes de receber. A pena aumenta de um terço se recebeu a coisa em razão de ofício, emprego ou profissão.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Apropriação indébita","caput":"Apropriar-se de coisa alheia móvel, de que tem a posse ou a detenção:","txt":["Art. 168 - Apropriar-se de coisa alheia móvel, de que tem a posse ou a detenção:","Pena - reclusão, de um a quatro anos, e multa.","Aumento de pena","§ 1º - A pena é aumentada de um terço, quando o agente recebeu a coisa:","I - em depósito necessário;","II - na qualidade de tutor, curador, síndico, liquidatário, inventariante, testamenteiro ou depositário judicial;","III - em razão de ofício, emprego ou profissão."],"ti":9,"ch":"Da apropriação indébita"},{"n":"168-A","t":"Apropriação indébita previdenciária","k":"deixar de repassar","s":"Pune quem desconta ou recolhe contribuições destinadas à previdência social e não as repassa no prazo. A pena é de reclusão, de 2 a 5 anos, e multa.","e":"Uma empresa desconta o INSS do salário dos funcionários todo mês, mas fica com o dinheiro e não paga à previdência.","d":"A punibilidade é extinta se o agente confessa e paga espontaneamente antes do início da ação fiscal, mas isso não vale para o devedor contumaz inscrito no Cadin. Depois do início da fiscalização e antes da denúncia, o pagamento só permite ao juiz deixar de aplicar a pena ou aplicar só multa, se o réu for primário e de bons antecedentes.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Apropriação indébita previdenciária","caput":"Deixar de repassar à previdência social as contribuições recolhidas dos contribuintes, no prazo e forma legal ou convencional:","txt":["Art. 168-A. Deixar de repassar à previdência social as contribuições recolhidas dos contribuintes, no prazo e forma legal ou convencional:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","§ 1º Nas mesmas penas incorre quem deixar de:","I - recolher, no prazo legal, contribuição ou outra importância destinada à previdência social que tenha sido descontada de pagamento efetuado a segurados, a terceiros ou arrecadada do público;","II - recolher contribuições devidas à previdência social que tenham integrado despesas contábeis ou custos relativos à venda de produtos ou à prestação de serviços;","III - pagar benefício devido a segurado, quando as respectivas cotas ou valores já tiverem sido reembolsados à empresa pela previdência social.","§ 2º É extinta a punibilidade se o agente, espontaneamente, declara, confessa e efetua o pagamento das contribuições, importâncias ou valores e presta as informações devidas à previdência social, na forma definida em lei ou regulamento, antes do início da ação fiscal.","§ 3º É facultado ao juiz deixar de aplicar a pena ou aplicar somente a de multa se o agente for primário e de bons antecedentes, desde que:","I - tenha promovido, após o início da ação fiscal e antes de oferecida a denúncia, o pagamento da contribuição social previdenciária, inclusive acessórios; ou","II - o valor das contribuições devidas, inclusive acessórios, seja igual ou inferior àquele estabelecido pela previdência social, administrativamente, como sendo o mínimo para o ajuizamento de suas execuções fiscais.","§ 4º A faculdade prevista no § 3º deste artigo não se aplica aos casos de parcelamento de contribuições cujo valor, inclusive dos acessórios, seja superior àquele estabelecido, administrativamente, como sendo o mínimo para o ajuizamento de suas execuções fiscais.","§ 5º A extinção de punibilidade de que trata o § 2º deste artigo não se aplica ao agente declarado devedor contumaz em decisão administrativa definitiva e inscrito no Cadastro Informativo dos créditos não quitados do setor público federal (Cadin), previsto na Lei nº 10.522, de 19 de julho de 2002.","§ 6º O fato de o agente deixar de ser considerado devedor contumaz não afasta o disposto no § 5º deste artigo em relação aos atos praticados no período em que era assim considerado."],"ti":9,"ch":"Da apropriação indébita"},{"n":"169","t":"Apropriação de coisa havida por erro","k":"apropriar-se","s":"Pune quem fica com coisa alheia que chegou às suas mãos por engano, por acaso ou por força da natureza. A pena é de detenção, de 1 mês a 1 ano, ou multa.","e":"Uma pessoa recebe por engano um Pix de um desconhecido e gasta o dinheiro em vez de devolvê-lo.","d":"Quem acha coisa perdida comete o crime se não devolver ao dono nem entregar à autoridade dentro de 15 dias. Também é crime ficar com a parte do tesouro que pertence ao dono do terreno onde foi achado.","pena":"Detenção, de 1 mês a 1 ano, ou multa.","rub":"Apropriação de coisa havida por erro, caso fortuito ou força da natureza","caput":"Apropriar-se alguém de coisa alheia vinda ao seu poder por erro, caso fortuito ou força da natureza:","txt":["Art. 169 - Apropriar-se alguém de coisa alheia vinda ao seu poder por erro, caso fortuito ou força da natureza:","Pena - detenção, de um mês a um ano, ou multa.","Parágrafo único - Na mesma pena incorre:","Apropriação de tesouro","I - quem acha tesouro em prédio alheio e se apropria, no todo ou em parte, da quota a que tem direito o proprietário do prédio;","Apropriação de coisa achada","II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de 15 (quinze) dias."],"ti":9,"ch":"Da apropriação indébita"},{"n":"170","t":"Privilégio nas apropriações","k":"pequeno valor","s":"Manda aplicar aos crimes de apropriação deste capítulo o mesmo benefício do furto privilegiado. Se o réu é primário e a coisa é de pequeno valor, o juiz pode trocar a reclusão por detenção, diminuir a pena ou aplicar só multa.","e":"Um réu primário que ficou com uma ferramenta barata emprestada pelo vizinho pode receber apenas pena de multa.","d":"O benefício exige as duas condições ao mesmo tempo: réu primário e coisa de pequeno valor.","pena":"","rub":"","caput":"Nos crimes previstos neste Capítulo, aplica-se o disposto no art. 155, § 2º.","txt":["Art. 170 - Nos crimes previstos neste Capítulo, aplica-se o disposto no art. 155, § 2º."],"ti":9,"ch":"Da apropriação indébita"},{"n":"171","t":"Estelionato","k":"obter vantagem ilícita","s":"Pune quem engana alguém, com truque, mentira ou outro meio fraudulento, para obter vantagem ilícita causando prejuízo a outra pessoa. A pena é de reclusão, de 1 a 5 anos, e multa.","e":"Um golpista se passa por técnico da companhia de gás, diz que o fogão está com vazamento e cobra por um conserto que nunca faz.","d":"A fraude eletrônica, com dados obtidos da vítima por redes sociais, telefone ou e-mail falso, tem pena de 4 a 8 anos, e multa; contra idoso ou vulnerável a pena aumenta de 1/3 ao dobro. O parágrafo que exigia representação foi revogado, então a ação não depende do pedido da vítima.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Estelionato","caput":"Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:","txt":["Art. 171 - Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:","Pena - reclusão, de 1 (um) a 5 (cinco) anos, e multa.","§ 1º - Se o criminoso é primário, e é de pequeno valor o prejuízo, o juiz pode aplicar a pena conforme o disposto no art. 155, § 2º.","§ 2º - Nas mesmas penas incorre quem:","Disposição de coisa alheia como própria","I - vende, permuta, dá em pagamento, em locação ou em garantia coisa alheia como própria;","Alienação ou oneração fraudulenta de coisa própria","II - vende, permuta, dá em pagamento ou em garantia coisa própria inalienável, gravada de ônus ou litigiosa, ou imóvel que prometeu vender a terceiro, mediante pagamento em prestações, silenciando sobre qualquer dessas circunstâncias;","Defraudação de penhor","III - defrauda, mediante alienação não consentida pelo credor ou por outro modo, a garantia pignoratícia, quando tem a posse do objeto empenhado;","Fraude na entrega de coisa","IV - defrauda substância, qualidade ou quantidade de coisa que deve entregar a alguém;","Fraude para recebimento de indenização ou valor de seguro","V - destrói, total ou parcialmente, ou oculta coisa própria, ou lesa o próprio corpo ou a saúde, ou agrava as conseqüências da lesão ou doença, com o intuito de haver indenização ou valor de seguro;","Fraude no pagamento por meio de cheque","VI - emite cheque, sem suficiente provisão de fundos em poder do sacado, ou lhe frustra o pagamento.","Cessão de conta laranja","VII - cede, gratuita ou onerosamente, conta bancária para que nela transitem recursos destinados ao financiamento de atividade criminosa ou que dela sejam fruto.","Fraude eletrônica","§ 2º-A. A pena é de reclusão, de 4 (quatro) a 8 (oito) anos, e multa, se a fraude é cometida com a utilização de informações fornecidas pela vítima ou por terceiro induzido a erro por meio de redes sociais, contatos telefônicos, envio de correio eletrônico fraudulento, duplicação de dispositivo eletrônico ou aplicação de internet, ou por qualquer outro meio fraudulento análogo.","§ 2º-B. A pena prevista no § 2º-A deste artigo, considerada a relevância do resultado gravoso, aumenta-se de 1/3 (um terço) a 2/3 (dois terços), se o crime é praticado mediante a utilização de servidor mantido fora do território nacional.","§ 3º - A pena aumenta-se de um terço, se o crime é cometido em detrimento de entidade de direito público ou de instituto de economia popular, assistência social ou beneficência.","Estelionato contra idoso ou vulnerável","§ 4º A pena aumenta-se de 1/3 (um terço) ao dobro, se o crime é cometido contra idoso ou vulnerável, considerada a relevância do resultado gravoso.","§ 5º (Revogado).","I - (Revogado);","II - (Revogado);","III - (Revogado);","IV - (Revogado)."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"171-A","t":"Fraude com ativos virtuais","k":"organizar, gerir, ofertar","s":"Pune quem organiza, administra, oferece ou intermedeia carteiras e operações com criptomoedas, ações ou outros ativos financeiros para enganar pessoas e obter vantagem ilícita. A pena é de reclusão, de 4 a 8 anos, e multa.","e":"Uma pessoa cria um \"clube de investimento em criptomoedas\" prometendo lucro garantido, recolhe o dinheiro dos participantes e desaparece.","d":"É uma forma especial de estelionato ligada ao mercado de investimentos, com pena bem maior que a do estelionato comum.","pena":"Reclusão, de 4 a 8 anos, e multa.","rub":"Fraude com a utilização de ativos virtuais, valores mobiliários ou ativos financeiros","caput":"Organizar, gerir, ofertar ou distribuir carteiras ou intermediar operações que envolvam ativos virtuais, valores mobiliários ou quaisquer ativos financeiros com o fim de obter vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil ou qualquer outro meio fraudulento.","txt":["Art. 171-A. Organizar, gerir, ofertar ou distribuir carteiras ou intermediar operações que envolvam ativos virtuais, valores mobiliários ou quaisquer ativos financeiros com o fim de obter vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil ou qualquer outro meio fraudulento.","Pena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"172","t":"Duplicata simulada","k":"emitir","s":"Pune quem emite fatura, duplicata ou nota de venda que não corresponde à mercadoria vendida ou ao serviço prestado. Duplicata é um título de cobrança usado no comércio. A pena é de detenção, de 2 a 4 anos, e multa.","e":"Uma empresa emite duplicatas de vendas que nunca aconteceram para descontá-las no banco e conseguir dinheiro rápido.","d":"Tem a mesma pena quem falsifica ou adultera o Livro de Registro de Duplicatas. Note que a pena é de detenção, mesmo sendo de 2 a 4 anos.","pena":"Detenção, de 2 a 4 anos, e multa.","rub":"Duplicata simulada","caput":"Emitir fatura, duplicata ou nota de venda que não corresponda à mercadoria vendida, em quantidade ou qualidade, ou ao serviço prestado.","txt":["Art. 172 - Emitir fatura, duplicata ou nota de venda que não corresponda à mercadoria vendida, em quantidade ou qualidade, ou ao serviço prestado.","Pena - detenção, de 2 (dois) a 4 (quatro) anos, e multa.","Parágrafo único. Nas mesmas penas incorrerá aquêle que falsificar ou adulterar a escrituração do Livro de Registro de Duplicatas."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"173","t":"Abuso de incapazes","k":"abusar","s":"Pune quem se aproveita da necessidade, paixão ou inexperiência de um menor, ou da doença ou deficiência mental de alguém, para levá-lo a praticar ato com efeito jurídico que cause prejuízo. A pena é de reclusão, de 2 a 6 anos, e multa.","e":"Um homem convence um adolescente inexperiente a assinar documento abrindo mão da sua parte numa herança em troca de um videogame.","d":"Basta induzir a vítima a praticar o ato capaz de gerar efeito jurídico; o crime protege só menores e pessoas com alienação ou debilidade mental.","pena":"Reclusão, de 2 a 6 anos, e multa.","rub":"Abuso de incapazes","caput":"Abusar, em proveito próprio ou alheio, de necessidade, paixão ou inexperiência de menor, ou da alienação ou debilidade mental de outrem, induzindo qualquer deles à prática de ato suscetível de produzir efeito jurídico, em prejuízo próprio ou de terceiro:","txt":["Art. 173 - Abusar, em proveito próprio ou alheio, de necessidade, paixão ou inexperiência de menor, ou da alienação ou debilidade mental de outrem, induzindo qualquer deles à prática de ato suscetível de produzir efeito jurídico, em prejuízo próprio ou de terceiro:","Pena - reclusão, de dois a seis anos, e multa."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"174","t":"Induzimento à especulação","k":"abusar","s":"Pune quem se aproveita da inexperiência ou simplicidade de alguém para levá-lo a jogar, apostar ou especular com títulos ou mercadorias, sabendo ou devendo saber que a operação vai arruiná-lo. A pena é de reclusão, de 1 a 3 anos, e multa.","e":"Um falso consultor convence um trabalhador rural sem estudo a aplicar todas as economias numa operação que ele sabe que vai dar prejuízo.","d":"A vítima não precisa ser menor nem doente mental, basta ser inexperiente ou simples; e o agente precisa saber ou dever saber que a operação é ruinosa.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Induzimento à especulação","caput":"Abusar, em proveito próprio ou alheio, da inexperiência ou da simplicidade ou inferioridade mental de outrem, induzindo-o à prática de jogo ou aposta, ou à especulação com títulos ou mercadorias, sabendo ou devendo saber que a operação é ruinosa:","txt":["Art. 174 - Abusar, em proveito próprio ou alheio, da inexperiência ou da simplicidade ou inferioridade mental de outrem, induzindo-o à prática de jogo ou aposta, ou à especulação com títulos ou mercadorias, sabendo ou devendo saber que a operação é ruinosa:","Pena - reclusão, de um a três anos, e multa."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"175","t":"Fraude no comércio","k":"enganar","s":"Pune o comerciante que engana o comprador vendendo mercadoria falsificada ou estragada como se fosse boa, ou entregando um produto no lugar de outro. A pena é de detenção, de 6 meses a 2 anos, ou multa.","e":"Um lojista vende um celular falsificado dizendo que é original.","d":"Fraudes com metais e pedras preciosas, como trocar pedra verdadeira por falsa numa joia encomendada, têm pena maior: reclusão, de 1 a 5 anos, e multa. Também se aplica o benefício do furto privilegiado.","pena":"","rub":"Fraude no comércio","caput":"Enganar, no exercício de atividade comercial, o adquirente ou consumidor:","txt":["Art. 175 - Enganar, no exercício de atividade comercial, o adquirente ou consumidor:","I - vendendo, como verdadeira ou perfeita, mercadoria falsificada ou deteriorada;","II - entregando uma mercadoria por outra:","Pena - detenção, de seis meses a dois anos, ou multa.","§ 1º - Alterar em obra que lhe é encomendada a qualidade ou o peso de metal ou substituir, no mesmo caso, pedra verdadeira por falsa ou por outra de menor valor; vender pedra falsa por verdadeira; vender, como precioso, metal de ou outra qualidade:","Pena - reclusão, de um a cinco anos, e multa.","§ 2º - É aplicável o disposto no art. 155, § 2º."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"176","t":"Outras fraudes","k":"sem dispor de recursos","s":"Pune quem come em restaurante, se hospeda em hotel ou usa transporte sabendo que não tem dinheiro para pagar. A pena é de detenção, de 15 dias a 2 meses, ou multa.","e":"Uma pessoa sem nenhum dinheiro almoça num restaurante e, na hora da conta, tenta sair sem pagar.","d":"A ação depende de representação, e o juiz pode deixar de aplicar a pena conforme as circunstâncias. Quem tem dinheiro e simplesmente se recusa a pagar não comete este crime.","pena":"Detenção, de 15 dias a 2 meses, ou multa.","rub":"Outras fraudes","caput":"Tomar refeição em restaurante, alojar-se em hotel ou utilizar-se de meio de transporte sem dispor de recursos para efetuar o pagamento:","txt":["Art. 176 - Tomar refeição em restaurante, alojar-se em hotel ou utilizar-se de meio de transporte sem dispor de recursos para efetuar o pagamento:","Pena - detenção, de quinze dias a dois meses, ou multa.","Parágrafo único - Somente se procede mediante representação, e o juiz pode, conforme as circunstâncias, deixar de aplicar a pena."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"177","t":"Fraudes em sociedade por ações","k":"promover a fundação","s":"Pune quem cria uma sociedade por ações (S.A.) fazendo afirmações falsas ou escondendo fatos sobre ela em prospectos ou comunicados. Também pune diretores, gerentes e fiscais que mentem sobre a situação da empresa ou usam seus bens. A pena é de reclusão, de 1 a 4 anos, e multa, se não for crime contra a economia popular.","e":"O fundador de uma S.A. divulga um prospecto dizendo que a empresa já tem grandes contratos assinados, o que é falso, para atrair investidores.","d":"O acionista que vende o seu voto na assembleia geral tem pena menor: detenção, de 6 meses a 2 anos, e multa. O crime é subsidiário: não se aplica se o fato for crime contra a economia popular.","pena":"Reclusão, de 1 a 4 anos, e multa, se o fato não constitui crime contra a economia popular.","rub":"Fraudes e abusos na fundação ou administração de sociedade por ações","caput":"Promover a fundação de sociedade por ações, fazendo, em prospecto ou em comunicação ao público ou à assembléia, afirmação falsa sobre a constituição da sociedade, ou ocultando fraudulentamente fato a ela relativo:","txt":["Art. 177 - Promover a fundação de sociedade por ações, fazendo, em prospecto ou em comunicação ao público ou à assembléia, afirmação falsa sobre a constituição da sociedade, ou ocultando fraudulentamente fato a ela relativo:","Pena - reclusão, de um a quatro anos, e multa, se o fato não constitui crime contra a economia popular.","§ 1º - Incorrem na mesma pena, se o fato não constitui crime contra a economia popular:","I - o diretor, o gerente ou o fiscal de sociedade por ações, que, em prospecto, relatório, parecer, balanço ou comunicação ao público ou à assembléia, faz afirmação falsa sobre as condições econômicas da sociedade, ou oculta fraudulentamente, no todo ou em parte, fato a elas relativo;","II - o diretor, o gerente ou o fiscal que promove, por qualquer artifício, falsa cotação das ações ou de outros títulos da sociedade;","III - o diretor ou o gerente que toma empréstimo à sociedade ou usa, em proveito próprio ou de terceiro, dos bens ou haveres sociais, sem prévia autorização da assembléia geral;","IV - o diretor ou o gerente que compra ou vende, por conta da sociedade, ações por ela emitidas, salvo quando a lei o permite;","V - o diretor ou o gerente que, como garantia de crédito social, aceita em penhor ou em caução ações da própria sociedade;","VI - o diretor ou o gerente que, na falta de balanço, em desacordo com este, ou mediante balanço falso, distribui lucros ou dividendos fictícios;","VII - o diretor, o gerente ou o fiscal que, por interposta pessoa, ou conluiado com acionista, consegue a aprovação de conta ou parecer;","VIII - o liquidante, nos casos dos ns. I, II, III, IV, V e VII;","IX - o representante da sociedade anônima estrangeira, autorizada a funcionar no País, que pratica os atos mencionados nos ns. I e II, ou dá falsa informação ao Governo.","§ 2º - Incorre na pena de detenção, de seis meses a dois anos, e multa, o acionista que, a fim de obter vantagem para si ou para outrem, negocia o voto nas deliberações de assembléia geral."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"178","t":"Emissão irregular de warrant","k":"emitir","s":"Pune quem emite conhecimento de depósito ou warrant contra o que a lei manda. Esses são títulos emitidos por armazéns gerais que representam mercadorias guardadas e podem ser negociados. A pena é de reclusão, de 1 a 4 anos, e multa.","e":"Um armazém emite warrant de toneladas de soja que não estão guardadas no local, e o título é usado como garantia num empréstimo.","d":"É uma norma penal em branco: para saber o que é emissão irregular, é preciso consultar a lei que regula esses títulos.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Emissão irregular de conhecimento de depósito ou \"warrant\"","caput":"Emitir conhecimento de depósito ou warrant, em desacordo com disposição legal:","txt":["Art. 178 - Emitir conhecimento de depósito ou warrant, em desacordo com disposição legal:","Pena - reclusão, de um a quatro anos, e multa."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"179","t":"Fraude à execução","k":"fraudar execução","s":"Pune quem, sendo cobrado na Justiça, vende, esconde, destrói ou estraga seus bens, ou inventa dívidas, para não pagar o credor. A pena é de detenção, de 6 meses a 2 anos, ou multa.","e":"Um devedor que está sendo executado na Justiça passa o carro para o nome de um primo para evitar a penhora.","d":"A ação penal é privada: só se procede mediante queixa do credor prejudicado.","pena":"Detenção, de 6 meses a 2 anos, ou multa.","rub":"Fraude à execução","caput":"Fraudar execução, alienando, desviando, destruindo ou danificando bens, ou simulando dívidas:","txt":["Art. 179 - Fraudar execução, alienando, desviando, destruindo ou danificando bens, ou simulando dívidas:","Pena - detenção, de seis meses a dois anos, ou multa.","Parágrafo único - Somente se procede mediante queixa."],"ti":9,"ch":"Do estelionato e outras fraudes"},{"n":"180","t":"Receptação","k":"adquirir ou receber","s":"Pune quem compra, recebe, transporta, conduz ou esconde coisa que sabe ser produto de crime, ou convence alguém de boa-fé a fazer isso. A pena é de reclusão, de 2 a 6 anos, e multa.","e":"Uma pessoa compra de um conhecido, por um preço baixíssimo, um celular que ela sabe que foi roubado.","d":"Na receptação culposa, quem compra coisa que deveria presumir ser de origem criminosa (pelo preço ou por quem oferece) tem pena de detenção, de 1 mês a 1 ano, ou multa, ou ambas. O comerciante que deve saber da origem criminosa responde pela forma qualificada, de 3 a 8 anos.","pena":"Reclusão, de 2 a 6 anos, e multa.","rub":"Receptação","caput":"Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio, coisa que sabe ser produto de crime, ou influir para que terceiro, de boa-fé, a adquira, receba ou oculte:","txt":["Art. 180 - Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio, coisa que sabe ser produto de crime, ou influir para que terceiro, de boa-fé, a adquira, receba ou oculte:","Pena - reclusão, de 2 (dois) a 6 (seis) anos, e multa.","Receptação qualificada","§ 1º - Adquirir, receber, transportar, conduzir, ocultar, ter em depósito, desmontar, montar, remontar, vender, expor à venda, ou de qualquer forma utilizar, em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, coisa que deve saber ser produto de crime:","Pena - reclusão, de três a oito anos, e multa.","§ 2º - Equipara-se à atividade comercial, para efeito do parágrafo anterior, qualquer forma de comércio irregular ou clandestino, inclusive o exercício em residência.","§ 3º - Adquirir ou receber coisa que, por sua natureza ou pela desproporção entre o valor e o preço, ou pela condição de quem a oferece, deve presumir-se obtida por meio criminoso:","Pena - detenção, de um mês a um ano, ou multa, ou ambas as penas.","§ 4º - A receptação é punível, ainda que desconhecido ou isento de pena o autor do crime de que proveio a coisa.","§ 5º (Revogado).","§ 6º Tratando-se de bens do patrimônio da União, de Estado, do Distrito Federal, de Município ou de autarquia, fundação pública, empresa pública, sociedade de economia mista ou empresa concessionária de serviços públicos, aplica-se em dobro a pena prevista no caput deste artigo.","§ 7º Se a receptação for de fios, cabos ou equipamentos utilizados para fornecimento ou transmissão de energia elétrica ou de telefonia, transferência de dados, ou de cargas transportadas em modais logísticos ferroviários ou metroviários, aplica-se em dobro a pena prevista no caput ou no § 1º deste artigo, conforme o caso.","§ 8º Se os crimes previstos neste artigo são cometidos por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil, aumenta-se a respectiva pena em 2/3 (dois terços)."],"ti":9,"ch":"Da receptação"},{"n":"180-A","t":"Receptação de animal","k":"adquirir, receber, vender","s":"Pune quem compra, recebe, transporta, guarda ou vende, para produção ou comércio, animal de criação ou doméstico que sabe ou deve saber ser produto de crime, mesmo que já abatido ou em partes. A pena é de reclusão, de 3 a 8 anos, e multa.","e":"O dono de um açougue compra bois furtados de uma fazenda vizinha para revender a carne.","d":"Aqui basta que o agente deva saber da origem criminosa, mas é preciso a finalidade de produção ou comercialização.","pena":"Reclusão, de 3 a 8 anos, e multa.","rub":"Receptação de animal","caput":"Adquirir, receber, transportar, conduzir, ocultar, ter em depósito ou vender, com a finalidade de produção ou de comercialização, semovente domesticável de produção, ainda que abatido ou dividido em partes, ou animal doméstico, que sabe ou deve saber ser produto de crime:","txt":["Art. 180-A. Adquirir, receber, transportar, conduzir, ocultar, ter em depósito ou vender, com a finalidade de produção ou de comercialização, semovente domesticável de produção, ainda que abatido ou dividido em partes, ou animal doméstico, que sabe ou deve saber ser produto de crime:","Pena - reclusão, de 3 (três) a 8 (oito) anos, e multa."],"ti":9,"ch":"Da receptação"},{"n":"181","t":"Imunidade absoluta familiar","k":"isento de pena","s":"Quem comete crime contra o patrimônio em prejuízo do cônjuge, durante o casamento, ou de pai, mãe, avós, filhos ou netos fica isento de pena. Ou seja, o fato continua sendo crime, mas a pessoa não é punida.","e":"Um filho que pega escondido dinheiro da carteira do pai, que ainda não é idoso, não será punido criminalmente.","d":"A isenção não vale para roubo, extorsão ou crime com violência ou grave ameaça, nem para vítima idosa, nem para o estranho que participa do crime, conforme as exceções previstas logo adiante no Código.","pena":"","rub":"","caput":"É isento de pena quem comete qualquer dos crimes previstos neste título, em prejuízo:","txt":["Art. 181 - É isento de pena quem comete qualquer dos crimes previstos neste título, em prejuízo:","I - do cônjuge, na constância da sociedade conjugal;","II - de ascendente ou descendente, seja o parentesco legítimo ou ilegítimo, seja civil ou natural."],"ti":9,"ch":"Disposições gerais"},{"n":"182","t":"Imunidade relativa familiar","k":"representação","s":"Se o crime contra o patrimônio prejudica cônjuge separado judicialmente, irmão, ou tio ou sobrinho que mora com o agente, o processo só acontece se a vítima fizer representação, isto é, pedir a investigação.","e":"Um irmão que vende escondido o videogame do outro só será processado se o irmão prejudicado pedir.","d":"Tio e sobrinho só entram nessa regra se morarem com o agente. Diferente da imunidade do artigo anterior, aqui há punição, mas ela depende do pedido da vítima.","pena":"","rub":"","caput":"Somente se procede mediante representação, se o crime previsto neste título é cometido em prejuízo:","txt":["Art. 182 - Somente se procede mediante representação, se o crime previsto neste título é cometido em prejuízo:","I - do cônjuge desquitado ou judicialmente separado;","II - de irmão, legítimo ou ilegítimo;","III - de tio ou sobrinho, com quem o agente coabita."],"ti":9,"ch":"Disposições gerais"},{"n":"183","t":"Exceções às imunidades familiares","k":"não se aplica","s":"As imunidades familiares dos dois artigos anteriores não valem em roubo, extorsão ou qualquer crime com violência ou grave ameaça, nem para o estranho que participa do crime, nem quando a vítima tem 60 anos ou mais.","e":"Um neto que usa escondido o cartão da avó de mais de 60 anos para fazer compras responde normalmente pelo crime.","d":"A idade é igual ou superior a 60 anos, então a vítima que acabou de completar 60 já está protegida. E o amigo que ajuda o filho a furtar o pai responde pelo crime.","pena":"","rub":"","caput":"Não se aplica o disposto nos dois artigos anteriores:","txt":["Art. 183 - Não se aplica o disposto nos dois artigos anteriores:","I - se o crime é de roubo ou de extorsão, ou, em geral, quando haja emprego de grave ameaça ou violência à pessoa;","II - ao estranho que participa do crime.","III - se o crime é praticado contra pessoa com idade igual ou superior a 60 (sessenta) anos."],"ti":9,"ch":"Disposições gerais"},{"n":"183-A","t":"Aumento contra instituições financeiras","k":"instituições financeiras","s":"Nos crimes contra o patrimônio cometidos contra bancos e outras instituições financeiras ou contra empresas de segurança privada, a pena aumenta de 1/3 até o dobro.","e":"Uma quadrilha que rouba um carro-forte de uma empresa de segurança privada recebe pena aumentada.","d":"O aumento vale para todos os crimes do título, como furto, roubo e estelionato, e protege também os prestadores de segurança privada, não só os bancos.","pena":"","rub":"","caput":"Nos crimes de que trata este Título, quando cometidos contra as instituições financeiras e os prestadores de serviço de segurança privada, de que trata o Estatuto da Segurança Privada e da Segurança das Instituições Financeiras, as penas serão aumentadas de 1/3 (um terço) até o dobro.","txt":["Art. 183-A. Nos crimes de que trata este Título, quando cometidos contra as instituições financeiras e os prestadores de serviço de segurança privada, de que trata o Estatuto da Segurança Privada e da Segurança das Instituições Financeiras, as penas serão aumentadas de 1/3 (um terço) até o dobro."],"ti":9,"ch":"Disposições gerais"},{"n":"184","t":"Violação de direito autoral","k":"violar direitos de autor","s":"Pune quem desrespeita os direitos de autor de uma obra e os direitos ligados a ela, como os de artistas e produtores. A pena é de detenção, de 3 meses a 1 ano, ou multa.","e":"Uma pessoa publica na internet, como se fosse seu, um livro inteiro escrito por outra pessoa.","d":"Reproduzir obra com intuito de lucro, vender cópias piratas ou oferecer obras sob demanda pela internet sem autorização tem pena de reclusão, de 2 a 4 anos, e multa. Fazer uma única cópia para uso próprio, sem lucro, não é crime.","pena":"Detenção, de 3 meses a 1 ano, ou multa.","rub":"Violação de direito autoral","caput":"Violar direitos de autor e os que lhe são conexos:","txt":["Art. 184. Violar direitos de autor e os que lhe são conexos:","Pena - detenção, de 3 (três) meses a 1 (um) ano, ou multa","§ 1º Se a violação consistir em reprodução total ou parcial, com intuito de lucro direto ou indireto, por qualquer meio ou processo, de obra intelectual, interpretação, execução ou fonograma, sem autorização expressa do autor, do artista intérprete ou executante, do produtor, conforme o caso, ou de quem os represente:","Pena - reclusão, de 2 (dois) a 4 (quatro) anos, e multa.","§ 2º Na mesma pena do § 1º incorre quem, com o intuito de lucro direto ou indireto, distribui, vende, expõe à venda, aluga, introduz no País, adquire, oculta, tem em depósito, original ou cópia de obra intelectual ou fonograma reproduzido com violação do direito de autor, do direito de artista intérprete ou executante ou do direito do produtor de fonograma, ou, ainda, aluga original ou cópia de obra intelectual ou fonograma, sem a expressa autorização dos titulares dos direitos ou de quem os represente.","§ 3º Se a violação consistir no oferecimento ao público, mediante cabo, fibra ótica, satélite, ondas ou qualquer outro sistema que permita ao usuário realizar a seleção da obra ou produção para recebê-la em um tempo e lugar previamente determinados por quem formula a demanda, com intuito de lucro, direto ou indireto, sem autorização expressa, conforme o caso, do autor, do artista intérprete ou executante, do produtor de fonograma, ou de quem os represente:","Pena - reclusão, de 2 (dois) a 4 (quatro) anos, e multa.","§ 4º O disposto nos §§ 1º, 2º e 3º não se aplica quando se tratar de exceção ou limitação ao direito de autor ou os que lhe são conexos, em conformidade com o previsto na Lei nº 9.610, de 19 de fevereiro de 1998, nem a cópia de obra intelectual ou fonograma, em um só exemplar, para uso privado do copista, sem intuito de lucro direto ou indireto."],"ti":10,"ch":"Dos crimes contra a propriedade intelectual"},{"n":"186","t":"Ação penal na violação autoral","k":"queixa","s":"Define quem processa nos crimes contra direito autoral. A violação simples é por queixa (a vítima processa); a reprodução e venda com lucro são de ação pública incondicionada; a oferta sob demanda (como streaming) depende de representação.","e":"No caso de um camelô que vende DVDs piratas, o Ministério Público pode processar sem precisar da autorização do artista.","d":"Atenção: a oferta de obras sob demanda com lucro depende de representação, enquanto reprodução e venda de cópias piratas são incondicionadas. Contra entidades públicas, a ação é sempre incondicionada.","pena":"","rub":"","caput":"Procede-se mediante:","txt":["Art. 186. Procede-se mediante:","I - queixa, nos crimes previstos no caput do art. 184;","II - ação penal pública incondicionada, nos crimes previstos nos §§ 1º e 2º do art. 184;","III - ação penal pública incondicionada, nos crimes cometidos em desfavor de entidades de direito público, autarquia, empresa pública, sociedade de economia mista ou fundação instituída pelo Poder Público;","IV - ação penal pública condicionada à representação, nos crimes previstos no § 3º do art. 184."],"ti":10,"ch":"Dos crimes contra a propriedade intelectual"},{"n":"197","t":"Atentado contra liberdade de trabalho","k":"constranger","s":"Pune quem obriga alguém, com violência ou grave ameaça, a trabalhar ou não trabalhar, ou a exercer ou não uma profissão. A pena é de detenção, de 1 mês a 1 ano, e multa, além da pena pela violência.","e":"Um grupo ameaça espancar um motorista de ônibus se ele sair para trabalhar durante a greve.","d":"Obrigar alguém a abrir ou fechar seu estabelecimento ou a participar de greve tem pena diferente: detenção, de 3 meses a 1 ano, e multa, além da pena pela violência.","pena":"Detenção, de 1 mês a 1 ano, e multa, além da pena correspondente à violência;.","rub":"Atentado contra a liberdade de trabalho","caput":"Constranger alguém, mediante violência ou grave ameaça:","txt":["Art. 197 - Constranger alguém, mediante violência ou grave ameaça:","I - a exercer ou não exercer arte, ofício, profissão ou indústria, ou a trabalhar ou não trabalhar durante certo período ou em determinados dias:","Pena - detenção, de um mês a um ano, e multa, além da pena correspondente à violência;","II - a abrir ou fechar o seu estabelecimento de trabalho, ou a participar de parede ou paralisação de atividade econômica:","Pena - detenção, de três meses a um ano, e multa, além da pena correspondente à violência."],"ti":11,"ch":""},{"n":"198","t":"Liberdade de contrato e boicotagem","k":"constranger","s":"Pune quem obriga alguém, com violência ou grave ameaça, a assinar contrato de trabalho, ou a não vender ou não comprar matéria-prima ou produto de outra pessoa. A pena é de detenção, de 1 mês a 1 ano, e multa, além da pena pela violência.","e":"Um empresário ameaça de morte um agricultor para que ele não venda leite a um laticínio concorrente.","d":"A boicotagem só é crime aqui se for violenta, isto é, com violência ou grave ameaça; recusar-se a comprar de alguém, por si só, não é crime.","pena":"Detenção, de 1 mês a 1 ano, e multa, além da pena correspondente à violência.","rub":"Atentado contra a liberdade de contrato de trabalho e boicotagem violenta","caput":"Constranger alguém, mediante violência ou grave ameaça, a celebrar contrato de trabalho, ou a não fornecer a outrem ou não adquirir de outrem matéria-prima ou produto industrial ou agrícola:","txt":["Art. 198 - Constranger alguém, mediante violência ou grave ameaça, a celebrar contrato de trabalho, ou a não fornecer a outrem ou não adquirir de outrem matéria-prima ou produto industrial ou agrícola:","Pena - detenção, de um mês a um ano, e multa, além da pena correspondente à violência."],"ti":11,"ch":""},{"n":"199","t":"Atentado contra liberdade de associação","k":"constranger","s":"Pune quem obriga alguém, com violência ou grave ameaça, a entrar ou a sair de um sindicato ou associação profissional. A pena é de detenção, de 1 mês a 1 ano, e multa, além da pena pela violência.","e":"Um encarregado de obra ameaça bater num pedreiro se ele se filiar ao sindicato da categoria.","d":"O crime protege os dois lados: tanto forçar a participar quanto forçar a deixar de participar do sindicato.","pena":"Detenção, de 1 mês a 1 ano, e multa, além da pena correspondente à violência.","rub":"Atentado contra a liberdade de associação","caput":"Constranger alguém, mediante violência ou grave ameaça, a participar ou deixar de participar de determinado sindicato ou associação profissional:","txt":["Art. 199 - Constranger alguém, mediante violência ou grave ameaça, a participar ou deixar de participar de determinado sindicato ou associação profissional:","Pena - detenção, de um mês a um ano, e multa, além da pena correspondente à violência."],"ti":11,"ch":""},{"n":"200","t":"Paralisação de trabalho com violência","k":"participar","s":"Pune quem participa de uma paralisação ou abandono coletivo de trabalho praticando violência contra pessoas ou coisas. A pena é de detenção, de 1 mês a 1 ano, e multa, além da pena pela violência.","e":"Durante uma greve, funcionários quebram as máquinas da fábrica e agridem o vigia.","d":"Para o abandono ser coletivo, é preciso pelo menos três empregados. A greve pacífica não é crime; só a que tem violência.","pena":"Detenção, de 1 mês a 1 ano, e multa, além da pena correspondente à violência.","rub":"Paralisação de trabalho, seguida de violência ou perturbação da ordem","caput":"Participar de suspensão ou abandono coletivo de trabalho, praticando violência contra pessoa ou contra coisa:","txt":["Art. 200 - Participar de suspensão ou abandono coletivo de trabalho, praticando violência contra pessoa ou contra coisa:","Pena - detenção, de um mês a um ano, e multa, além da pena correspondente à violência.","Parágrafo único - Para que se considere coletivo o abandono de trabalho é indispensável o concurso de, pelo menos, três empregados."],"ti":11,"ch":""},{"n":"201","t":"Paralisação de trabalho de interesse coletivo","k":"participar","s":"Pune quem participa de suspensão ou abandono coletivo de trabalho que provoca a interrupção de obra pública ou de serviço de interesse coletivo. Pena: detenção, de seis meses a dois anos, e multa.","e":"Funcionários de uma empreiteira abandonam juntos o serviço e paralisam a obra de um viaduto da prefeitura.","d":"O texto exige dois elementos: participar de suspensão ou abandono coletivo e provocar a efetiva interrupção de obra pública ou serviço de interesse coletivo. Sem essa interrupção, não há este crime.","pena":"Detenção, de 6 meses a 2 anos, e multa.","rub":"Paralisação de trabalho de interesse coletivo","caput":"Participar de suspensão ou abandono coletivo de trabalho, provocando a interrupção de obra pública ou serviço de interesse coletivo:","txt":["Art. 201 - Participar de suspensão ou abandono coletivo de trabalho, provocando a interrupção de obra pública ou serviço de interesse coletivo:","Pena - detenção, de seis meses a dois anos, e multa."],"ti":11,"ch":""},{"n":"202","t":"Invasão de estabelecimento e sabotagem","k":"invadir ou ocupar","s":"Pune quem invade ou ocupa fábrica, comércio ou propriedade agrícola para impedir ou atrapalhar o trabalho normal, ou, com esse mesmo objetivo, danifica o local ou suas coisas ou dispõe delas. Pena: reclusão, de um a três anos, e multa.","e":"Um grupo ocupa uma fábrica de calçados e quebra as máquinas para impedir que a produção continue.","d":"O crime depende da finalidade de impedir ou embaraçar o trabalho; danificar coisas sem essa intenção é dano comum, não sabotagem. A pena aqui é de reclusão, mais grave que a da paralisação de trabalho do artigo anterior.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Invasão de estabelecimento industrial, comercial ou agrícola. Sabotagem","caput":"Invadir ou ocupar estabelecimento industrial, comercial ou agrícola, com o intuito de impedir ou embaraçar o curso normal do trabalho, ou com o mesmo fim danificar o estabelecimento ou as coisas nele existentes ou delas dispor:","txt":["Art. 202 - Invadir ou ocupar estabelecimento industrial, comercial ou agrícola, com o intuito de impedir ou embaraçar o curso normal do trabalho, ou com o mesmo fim danificar o estabelecimento ou as coisas nele existentes ou delas dispor:","Pena - reclusão, de um a três anos, e multa."],"ti":11,"ch":""},{"n":"203","t":"Frustração de direito trabalhista","k":"frustrar","s":"Pune quem, usando fraude (engano) ou violência, impede o trabalhador de exercer um direito garantido pela lei trabalhista. Pena: detenção de um ano a dois anos, e multa, além da pena correspondente à violência.","e":"Um empregador faz o funcionário assinar, sem perceber, um termo de renúncia a direitos disfarçado de recibo de salário.","d":"Na mesma pena incorre quem obriga o trabalhador a comprar em certo estabelecimento para prendê-lo por dívida, ou retém seus documentos para impedir que saia do serviço. A pena aumenta de um sexto a um terço se a vítima é menor de dezoito anos, idosa, gestante, indígena ou pessoa com deficiência física ou mental.","pena":"Detenção de 1 ano a 2 anos, e multa, além da pena correspondente à violência.","rub":"Frustração de direito assegurado por lei trabalhista","caput":"Frustrar, mediante fraude ou violência, direito assegurado pela legislação do trabalho:","txt":["Art. 203 - Frustrar, mediante fraude ou violência, direito assegurado pela legislação do trabalho:","Pena - detenção de um ano a dois anos, e multa, além da pena correspondente à violência.","§ 1º Na mesma pena incorre quem:","I - obriga ou coage alguém a usar mercadorias de determinado estabelecimento, para impossibilitar o desligamento do serviço em virtude de dívida;","II - impede alguém de se desligar de serviços de qualquer natureza, mediante coação ou por meio da retenção de seus documentos pessoais ou contratuais.","§ 2º A pena é aumentada de um sexto a um terço se a vítima é menor de dezoito anos, idosa, gestante, indígena ou portadora de deficiência física ou mental."],"ti":11,"ch":""},{"n":"204","t":"Frustração da nacionalização do trabalho","k":"frustrar","s":"Pune quem usa fraude ou violência para burlar uma obrigação legal de nacionalização do trabalho (regras que reservam espaço a trabalhadores brasileiros). Pena: detenção, de um mês a um ano, e multa, além da pena correspondente à violência.","e":"Uma empresa falsifica a folha de pagamento para esconder que não cumpre a proporção de empregados brasileiros exigida por lei.","d":"Usa o mesmo verbo do crime anterior (frustrar), mas o objeto é outro: a obrigação legal de nacionalização do trabalho, e não um direito trabalhista do empregado. A pena também é menor.","pena":"Detenção, de 1 mês a 1 ano, e multa, além da pena correspondente à violência.","rub":"Frustração de lei sobre a nacionalização do trabalho","caput":"Frustrar, mediante fraude ou violência, obrigação legal relativa à nacionalização do trabalho:","txt":["Art. 204 - Frustrar, mediante fraude ou violência, obrigação legal relativa à nacionalização do trabalho:","Pena - detenção, de um mês a um ano, e multa, além da pena correspondente à violência."],"ti":11,"ch":""},{"n":"205","t":"Exercício de atividade com impedimento administrativo","k":"exercer","s":"Pune quem continua exercendo uma atividade da qual foi impedido por decisão administrativa (decisão de um órgão público, não de um juiz). Pena: detenção, de três meses a dois anos, ou multa.","e":"Um médico suspenso pelo conselho profissional continua atendendo pacientes no consultório.","d":"A decisão desrespeitada aqui é administrativa; se o impedimento vier de decisão judicial, o crime é outro (desobediência a decisão judicial sobre perda ou suspensão de direito). Note que a pena é alternativa: detenção ou multa.","pena":"Detenção, de 3 meses a 2 anos, ou multa.","rub":"Exercício de atividade com infração de decisão administrativa","caput":"Exercer atividade, de que está impedido por decisão administrativa:","txt":["Art. 205 - Exercer atividade, de que está impedido por decisão administrativa:","Pena - detenção, de três meses a dois anos, ou multa."],"ti":11,"ch":""},{"n":"206","t":"Aliciamento para o fim de emigração","k":"recrutar","s":"Pune quem recruta trabalhadores usando fraude (engano) para levá-los a outro país. Pena: detenção, de 1 a 3 anos e multa.","e":"Um agenciador mente sobre salário e moradia para reunir trabalhadores e levá-los para uma lavoura na Europa.","d":"Aqui o destino é território estrangeiro e a fraude é indispensável. Aliciar trabalhadores para outra localidade dentro do Brasil é o crime do artigo seguinte, cujo caput não exige fraude.","pena":"Detenção, de 1 a 3 anos e multa.","rub":"Aliciamento para o fim de emigração","caput":"Recrutar trabalhadores, mediante fraude, com o fim de levá-los para território estrangeiro.","txt":["Art.
