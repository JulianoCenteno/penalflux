A pena será aumentada da terça parte quando os autores dos crimes previstos neste Capítulo forem ocupantes de cargos em comissão ou de função de direção ou assessoramento de órgão da administração direta, sociedade de economia mista, empresa pública ou fundação instituída pelo poder público."],"ti":18,"ch":"Praticados por funcionário público contra a administração em geral"},{"n":"328","t":"Usurpação de função pública","k":"usurpar","s":"Pune quem assume e exerce indevidamente uma função pública que não é sua. A pena é de detenção, de 3 meses a 2 anos, e multa.","e":"Um homem se passa por fiscal da prefeitura e passa a vistoriar e lacrar barracas numa feira.","d":"Se o agente obtém vantagem com o fato, a pena sobe para reclusão, de 2 a 5 anos, e multa. O crime exige praticar atos da função, e não apenas dizer que é funcionário.","pena":"Detenção, de 3 meses a 2 anos, e multa.","rub":"Usurpação de função pública","caput":"Usurpar o exercício de função pública:","txt":["Art. 328 - Usurpar o exercício de função pública:","Pena - detenção, de três meses a dois anos, e multa.","Parágrafo único - Se do fato o agente aufere vantagem:","Pena - reclusão, de dois a cinco anos, e multa."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"329","t":"Resistência","k":"opor-se","s":"Pune quem se opõe à execução de ato legal usando violência ou ameaça contra o funcionário competente ou contra quem o está ajudando. A pena é de detenção, de 2 meses a 2 anos.","e":"Na hora de ser preso com mandado judicial, o homem empurra e chuta os policiais para não ser algemado.","d":"Se, por causa da resistência, o ato não é executado, a pena passa a reclusão, de 1 a 3 anos. A pena da violência é aplicada junto. Sem violência ou ameaça, como no simples recusar-se, o caso tende a ser desobediência.","pena":"Detenção, de 2 meses a 2 anos.","rub":"Resistência","caput":"Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio:","txt":["Art. 329 - Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio:","Pena - detenção, de dois meses a dois anos.","§ 1º - Se o ato, em razão da resistência, não se executa:","Pena - reclusão, de um a três anos.","§ 2º - As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"330","t":"Desobediência","k":"desobedecer","s":"Pune quem desobedece a uma ordem legal dada por funcionário público. A pena é de detenção, de 15 dias a 6 meses, e multa.","e":"Um dono de bar se recusa a fechar o estabelecimento depois de receber ordem legal da fiscalização para interditá-lo.","d":"A ordem precisa ser legal. Diferencie da resistência (art. 329), que exige violência ou ameaça ao funcionário.","pena":"Detenção, de 15 dias a 6 meses, e multa.","rub":"Desobediência","caput":"Desobedecer a ordem legal de funcionário público:","txt":["Art. 330 - Desobedecer a ordem legal de funcionário público:","Pena - detenção, de quinze dias a seis meses, e multa."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"331","t":"Desacato","k":"desacatar","s":"Pune quem humilha, ofende ou trata com desprezo um funcionário público no exercício da função ou por causa dela. A pena é de detenção, de 6 meses a 2 anos, ou multa.","e":"Um motorista multado xinga o agente de trânsito e rasga a multa na frente dele, aos gritos, durante a fiscalização.","d":"A ofensa precisa estar ligada à função: no exercício dela ou em razão dela. A pena é alternativa, detenção ou multa.","pena":"Detenção, de 6 meses a 2 anos, ou multa.","rub":"Desacato","caput":"Desacatar funcionário público no exercício da função ou em razão dela:","txt":["Art. 331 - Desacatar funcionário público no exercício da função ou em razão dela:","Pena - detenção, de seis meses a dois anos, ou multa."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"332","t":"Tráfico de influência","k":"solicitar, exigir, cobrar ou obter","s":"Pune quem pede, exige, cobra ou obtém vantagem, ou promessa dela, dizendo que vai influenciar um ato de funcionário público no exercício da função. A pena é de reclusão, de 2 a 5 anos, e multa.","e":"Um homem cobra dinheiro de um empresário prometendo que, por ser amigo do secretário, vai conseguir a aprovação de um projeto.","d":"A pena aumenta da metade se o agente diz ou insinua que a vantagem também vai para o funcionário. Quem pratica não precisa ser funcionário público.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Tráfico de Influência","caput":"Solicitar, exigir, cobrar ou obter, para si ou para outrem, vantagem ou promessa de vantagem, a pretexto de influir em ato praticado por funcionário público no exercício da função:","txt":["Art. 332 - Solicitar, exigir, cobrar ou obter, para si ou para outrem, vantagem ou promessa de vantagem, a pretexto de influir em ato praticado por funcionário público no exercício da função:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","Parágrafo único - A pena é aumentada da metade, se o agente alega ou insinua que a vantagem é também destinada ao funcionário."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"333","t":"Corrupção ativa","k":"oferecer ou prometer","s":"Pune quem oferece ou promete vantagem indevida a funcionário público para que ele pratique, deixe de praticar ou atrase um ato do seu ofício. A pena é de reclusão, de 2 a 12 anos, e multa.","e":"Um motorista parado na blitz oferece dinheiro ao policial para não ter o carro apreendido.","d":"Os verbos são só oferecer ou prometer; não há o verbo dar. A pena aumenta de um terço se, por causa da vantagem ou promessa, o funcionário retarda, omite ou pratica o ato violando seu dever.","pena":"Reclusão, de 2 a 12 anos, e multa.","rub":"Corrupção ativa","caput":"Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício:","txt":["Art. 333 - Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício:","Pena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.","Parágrafo único - A pena é aumentada de um terço, se, em razão da vantagem ou promessa, o funcionário retarda ou omite ato de ofício, ou o pratica infringindo dever funcional."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"334","t":"Descaminho","k":"iludir","s":"Pune quem deixa de pagar, no todo ou em parte, o imposto devido pela entrada, saída ou consumo de mercadoria permitida. A pena é de reclusão, de 1 a 4 anos.","e":"Um sacoleiro traz do Paraguai eletrônicos acima da cota e passa pela alfândega sem declarar, para não pagar o imposto.","d":"No descaminho a mercadoria é permitida, o problema é o imposto; no contrabando (art. 334-A) a mercadoria é proibida. A pena é aplicada em dobro se o crime é praticado em transporte aéreo, marítimo ou fluvial.","pena":"Reclusão, de 1 a 4 anos.","rub":"Descaminho","caput":"Iludir, no todo ou em parte, o pagamento de direito ou imposto devido pela entrada, pela saída ou pelo consumo de mercadoria","txt":["Art. 334. Iludir, no todo ou em parte, o pagamento de direito ou imposto devido pela entrada, pela saída ou pelo consumo de mercadoria","Pena - reclusão, de 1 (um) a 4 (quatro) anos.","§ 1º Incorre na mesma pena quem:","I - pratica navegação de cabotagem, fora dos casos permitidos em lei;","II - pratica fato assimilado, em lei especial, a descaminho;","III - vende, expõe à venda, mantém em depósito ou, de qualquer forma, utiliza em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, mercadoria de procedência estrangeira que introduziu clandestinamente no País ou importou fraudulentamente ou que sabe ser produto de introdução clandestina no território nacional ou de importação fraudulenta por parte de outrem;","IV - adquire, recebe ou oculta, em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, mercadoria de procedência estrangeira, desacompanhada de documentação legal ou acompanhada de documentos que sabe serem falsos.","§ 2º Equipara-se às atividades comerciais, para os efeitos deste artigo, qualquer forma de comércio irregular ou clandestino de mercadorias estrangeiras, inclusive o exercido em residências.","§ 3º A pena aplica-se em dobro se o crime de descaminho é praticado em transporte aéreo, marítimo ou fluvial."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"334-A","t":"Contrabando","k":"importar ou exportar","s":"Pune quem importa ou exporta mercadoria proibida. A pena é de reclusão, de 2 a 5 anos.","e":"Um comerciante traz do exterior cigarros de marca proibida no Brasil e os revende em sua banca.","d":"Também responde quem importa ou exporta clandestinamente mercadoria que dependa de registro ou autorização de órgão público, ou reinsere no país mercadoria brasileira destinada à exportação. A pena dobra se praticado em transporte aéreo, marítimo ou fluvial.","pena":"Reclusão, de 2 a 5 anos.","rub":"Contrabando","caput":"Importar ou exportar mercadoria proibida:","txt":["Art. 334-A. Importar ou exportar mercadoria proibida:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos.","§ 1º Incorre na mesma pena quem:","I - pratica fato assimilado, em lei especial, a contrabando;","II - importa ou exporta clandestinamente mercadoria que dependa de registro, análise ou autorização de órgão público competente;","III - reinsere no território nacional mercadoria brasileira destinada à exportação;","IV - vende, expõe à venda, mantém em depósito ou, de qualquer forma, utiliza em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, mercadoria proibida pela lei brasileira;","V - adquire, recebe ou oculta, em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, mercadoria proibida pela lei brasileira.","§ 2º - Equipara-se às atividades comerciais, para os efeitos deste artigo, qualquer forma de comércio irregular ou clandestino de mercadorias estrangeiras, inclusive o exercido em residências.","§ 3º A pena aplica-se em dobro se o crime de contrabando é praticado em transporte aéreo, marítimo ou fluvial."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"335","t":"Impedimento ou fraude de concorrência","k":"impedir, perturbar ou fraudar","s":"Pune quem impede, perturba ou frauda concorrência pública ou leilão público promovido pela administração ou por entidade paraestatal, ou afasta ou tenta afastar concorrente com violência, grave ameaça, fraude ou oferta de vantagem. A pena é de detenção, de 6 meses a 2 anos, ou multa, além da pena correspondente à violência.","e":"Um empresário ameaça um concorrente para que ele não apareça no leilão de imóveis promovido pela prefeitura.","d":"Quem deixa de concorrer ou licitar por causa da vantagem oferecida recebe a mesma pena. Para licitações, compare com os arts. 337-I e 337-K, que têm penas próprias e maiores.","pena":"Detenção, de 6 meses a 2 anos, ou multa, além da pena correspondente à violência.","rub":"Impedimento, perturbação ou fraude de concorrência","caput":"Impedir, perturbar ou fraudar concorrência pública ou venda em hasta pública, promovida pela administração federal, estadual ou municipal, ou por entidade paraestatal; afastar ou procurar afastar concorrente ou licitante, por meio de violência, grave ameaça, fraude ou oferecimento de vantagem:","txt":["Art. 335 - Impedir, perturbar ou fraudar concorrência pública ou venda em hasta pública, promovida pela administração federal, estadual ou municipal, ou por entidade paraestatal; afastar ou procurar afastar concorrente ou licitante, por meio de violência, grave ameaça, fraude ou oferecimento de vantagem:","Pena - detenção, de seis meses a dois anos, ou multa, além da pena correspondente à violência.","Parágrafo único - Incorre na mesma pena quem se abstém de concorrer ou licitar, em razão da vantagem oferecida."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"336","t":"Inutilização de edital ou de sinal","k":"rasgar ou inutilizar","s":"Pune quem rasga, inutiliza ou suja edital afixado por ordem de funcionário público, ou viola ou inutiliza selo ou sinal usado por lei ou ordem de funcionário para identificar ou lacrar um objeto. A pena é de detenção, de 1 mês a 1 ano, ou multa.","e":"O dono de um bar interditado rompe o lacre colocado pela vigilância sanitária na porta para voltar a funcionar.","d":"O edital precisa ter sido afixado por ordem de funcionário público. Romper lacre oficial também está neste artigo, não sendo dano comum.","pena":"Detenção, de 1 mês a 1 ano, ou multa.","rub":"Inutilização de edital ou de sinal","caput":"Rasgar ou, de qualquer forma, inutilizar ou conspurcar edital afixado por ordem de funcionário público; violar ou inutilizar selo ou sinal empregado, por determinação legal ou por ordem de funcionário público, para identificar ou cerrar qualquer objeto:","txt":["Art. 336 - Rasgar ou, de qualquer forma, inutilizar ou conspurcar edital afixado por ordem de funcionário público; violar ou inutilizar selo ou sinal empregado, por determinação legal ou por ordem de funcionário público, para identificar ou cerrar qualquer objeto:","Pena - detenção, de um mês a um ano, ou multa."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"337","t":"Subtração ou inutilização de documento","k":"subtrair ou inutilizar","s":"Pune quem subtrai ou inutiliza, total ou parcialmente, livro oficial, processo ou documento confiado à guarda de funcionário, ou de particular em serviço público. A pena é de reclusão, de 2 a 5 anos, se o fato não constituir crime mais grave.","e":"Uma parte, ao consultar seu processo no balcão do fórum, arranca e leva páginas com provas contra ela.","d":"Este crime é praticado por particular contra a Administração. Se quem extravia ou inutiliza é o próprio funcionário que tem a guarda, o crime é o do art. 314, com pena menor.","pena":"Reclusão, de 2 a 5 anos, se o fato não constitui crime mais grave.","rub":"Subtração ou inutilização de livro ou documento","caput":"Subtrair, ou inutilizar, total ou parcialmente, livro oficial, processo ou documento confiado à custódia de funcionário, em razão de ofício, ou de particular em serviço público:","txt":["Art. 337 - Subtrair, ou inutilizar, total ou parcialmente, livro oficial, processo ou documento confiado à custódia de funcionário, em razão de ofício, ou de particular em serviço público:","Pena - reclusão, de dois a cinco anos, se o fato não constitui crime mais grave."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"337-A","t":"Sonegação de contribuição previdenciária","k":"suprimir ou reduzir","s":"Pune quem suprime ou reduz contribuição previdenciária omitindo empregados da folha de pagamento, deixando de lançar na contabilidade valores descontados ou devidos, ou omitindo receitas, lucros ou remunerações. A pena é de reclusão, de 2 a 5 anos, e multa.","e":"Uma empresa mantém metade dos funcionários sem registro na folha de pagamento para pagar menos contribuição ao INSS.","d":"A punibilidade é extinta se o agente confessa e declara espontaneamente as contribuições antes do início da ação fiscal. Mas essa vantagem não vale para o devedor contumaz declarado em decisão administrativa definitiva e inscrito no Cadin.","pena":"","rub":"Sonegação de contribuição previdenciária","caput":"Suprimir ou reduzir contribuição social previdenciária e qualquer acessório, mediante as seguintes condutas:","txt":["Art. 337-A. Suprimir ou reduzir contribuição social previdenciária e qualquer acessório, mediante as seguintes condutas:","I - omitir de folha de pagamento da empresa ou de documento de informações previsto pela legislação previdenciária segurados empregado, empresário, trabalhador avulso ou trabalhador autônomo ou a este equiparado que lhe prestem serviços;","II - deixar de lançar mensalmente nos títulos próprios da contabilidade da empresa as quantias descontadas dos segurados ou as devidas pelo empregador ou pelo tomador de serviços;","III - omitir, total ou parcialmente, receitas ou lucros auferidos, remunerações pagas ou creditadas e demais fatos geradores de contribuições sociais previdenciárias:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","§ 1º É extinta a punibilidade se o agente, espontaneamente, declara e confessa as contribuições, importâncias ou valores e presta as informações devidas à previdência social, na forma definida em lei ou regulamento, antes do início da ação fiscal.","§ 2º É facultado ao juiz deixar de aplicar a pena ou aplicar somente a de multa se o agente for primário e de bons antecedentes, desde que:","I - (VETADO)","II - o valor das contribuições devidas, inclusive acessórios, seja igual ou inferior àquele estabelecido pela previdência social, administrativamente, como sendo o mínimo para o ajuizamento de suas execuções fiscais.","§ 3º Se o empregador não é pessoa jurídica e sua folha de pagamento mensal não ultrapassa R$ 1.510,00 (um mil, quinhentos e dez reais), o juiz poderá reduzir a pena de um terço até a metade ou aplicar apenas a de multa.","§ 4º O valor a que se refere o parágrafo anterior será reajustado nas mesmas datas e nos mesmos índices do reajuste dos benefícios da previdência social.","§ 5º A extinção de punibilidade de que trata o § 1º deste artigo não se aplica ao agente declarado devedor contumaz em decisão administrativa definitiva e inscrito no Cadastro Informativo dos créditos não quitados do setor público federal (Cadin), previsto na Lei nº 10.522, de 19 de julho de 2002.","§ 6º O fato de o agente deixar de ser considerado devedor contumaz não afasta o disposto no § 5º deste artigo em relação aos atos praticados no período em que era assim considerado."],"ti":18,"ch":"Praticados por particular contra a administração em geral"},{"n":"337-B","t":"Corrupção ativa internacional","k":"prometer, oferecer ou dar","s":"Pune quem promete, oferece ou dá vantagem indevida a funcionário público estrangeiro, ou a terceira pessoa, para que ele pratique, omita ou atrase ato relacionado a transação comercial internacional. A pena é de reclusão, de 1 a 8 anos, e multa.","e":"Um executivo brasileiro paga propina a um ministro de outro país para que sua empresa vença um contrato de exportação.","d":"Diferente da corrupção ativa do art. 333, aqui existe também o verbo dar. A pena aumenta de 1/3 se o funcionário estrangeiro retarda, omite ou pratica o ato violando seu dever.","pena":"Reclusão, de 1 a 8 anos, e multa.","rub":"Corrupção ativa em transação comercial internacional","caput":"Prometer, oferecer ou dar, direta ou indiretamente, vantagem indevida a funcionário público estrangeiro, ou a terceira pessoa, para determiná-lo a praticar, omitir ou retardar ato de ofício relacionado à transação comercial internacional:","txt":["Art. 337-B. Prometer, oferecer ou dar, direta ou indiretamente, vantagem indevida a funcionário público estrangeiro, ou a terceira pessoa, para determiná-lo a praticar, omitir ou retardar ato de ofício relacionado à transação comercial internacional:","Pena - reclusão, de 1 (um) a 8 (oito) anos, e multa.","Parágrafo único. A pena é aumentada de 1/3 (um terço), se, em razão da vantagem ou promessa, o funcionário público estrangeiro retarda ou omite o ato de ofício, ou o pratica infringindo dever funcional."],"ti":18,"ch":"Praticados por particular contra a administração pública estrangeira"},{"n":"337-C","t":"Tráfico de influência internacional","k":"solicitar, exigir, cobrar ou obter","s":"Pune quem pede, exige, cobra ou obtém vantagem, ou promessa dela, dizendo que vai influenciar ato de funcionário público estrangeiro ligado a transação comercial internacional. A pena é de reclusão, de 2 a 5 anos, e multa.","e":"Um consultor cobra uma alta comissão de uma exportadora alegando que tem acesso ao funcionário estrangeiro que decide uma licitação no exterior.","d":"A pena aumenta da metade se o agente diz ou insinua que a vantagem também vai para o funcionário estrangeiro. A estrutura copia o tráfico de influência do art. 332, mudando o alvo para o funcionário estrangeiro.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Tráfico de influência em transação comercial internacional","caput":"Solicitar, exigir, cobrar ou obter, para si ou para outrem, direta ou indiretamente, vantagem ou promessa de vantagem a pretexto de influir em ato praticado por funcionário público estrangeiro no exercício de suas funções, relacionado a transação comercial internacional:","txt":["Art. 337-C. Solicitar, exigir, cobrar ou obter, para si ou para outrem, direta ou indiretamente, vantagem ou promessa de vantagem a pretexto de influir em ato praticado por funcionário público estrangeiro no exercício de suas funções, relacionado a transação comercial internacional:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","Parágrafo único. A pena é aumentada da metade, se o agente alega ou insinua que a vantagem é também destinada a funcionário estrangeiro."],"ti":18,"ch":"Praticados por particular contra a administração pública estrangeira"},{"n":"337-D","t":"Funcionário público estrangeiro","k":"funcionário público estrangeiro","s":"Define quem é funcionário público estrangeiro para o Direito Penal: quem exerce cargo, emprego ou função pública em entidade estatal ou representação diplomática de outro país, mesmo de forma temporária ou sem salário. Também se equipara quem trabalha em empresa controlada por governo estrangeiro ou em organização pública internacional.","e":"Um funcionário de uma estatal de petróleo de outro país é considerado funcionário público estrangeiro para aplicar os arts. 337-B e 337-C.","d":"A equiparação alcança empresas controladas, direta ou indiretamente, pelo governo estrangeiro e as organizações públicas internacionais, e não só órgãos do Estado estrangeiro.","pena":"","rub":"Funcionário público estrangeiro","caput":"Considera-se funcionário público estrangeiro, para os efeitos penais, quem, ainda que transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública em entidades estatais ou em representações diplomáticas de país estrangeiro.","txt":["Art. 337-D. Considera-se funcionário público estrangeiro, para os efeitos penais, quem, ainda que transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública em entidades estatais ou em representações diplomáticas de país estrangeiro.","Parágrafo único. Equipara-se a funcionário público estrangeiro quem exerce cargo, emprego ou função em empresas controladas, diretamente ou indiretamente, pelo Poder Público de país estrangeiro ou em organizações públicas internacionais."],"ti":18,"ch":"Praticados por particular contra a administração pública estrangeira"},{"n":"337-E","t":"Contratação direta ilegal","k":"admitir, possibilitar ou dar causa","s":"Pune quem admite, possibilita ou dá causa a uma contratação direta, isto é, sem licitação, fora dos casos que a lei permite. A pena é de reclusão, de 4 a 8 anos, e multa.","e":"Um secretário municipal contrata sem licitação a empresa de um aliado para reformar escolas, alegando uma urgência que não existe.","d":"Pena de reclusão, de 4 a 8 anos, igual à da fraude e da frustração do caráter competitivo da licitação. O crime é contratar sem licitação quando a lei não permitia essa dispensa.","pena":"Reclusão, de 4 a 8 anos, e multa.","rub":"Contratação direta ilegal","caput":"Admitir, possibilitar ou dar causa à contratação direta fora das hipóteses previstas em lei:","txt":["Art. 337-E. Admitir, possibilitar ou dar causa à contratação direta fora das hipóteses previstas em lei:","Pena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-F","t":"Frustração do caráter competitivo de licitação","k":"frustrar ou fraudar","s":"Pune quem frustra ou frauda a competição de uma licitação para obter, para si ou para outro, vantagem com a adjudicação, ou seja, com a entrega do objeto ao vencedor. A pena é de reclusão, de 4 a 8 anos, e multa.","e":"Três construtoras combinam entre si quem vai ganhar cada licitação de uma prefeitura e apresentam propostas de fachada.","d":"Exige a finalidade de obter vantagem decorrente da adjudicação do objeto. Não confunda com o art. 337-L, que pune fraude que causa prejuízo à Administração na licitação ou no contrato por meios específicos.","pena":"Reclusão, de 4 anos a 8 anos, e multa.","rub":"Frustração do caráter competitivo de licitação","caput":"Frustrar ou fraudar, com o intuito de obter para si ou para outrem vantagem decorrente da adjudicação do objeto da licitação, o caráter competitivo do processo licitatório:","txt":["Art. 337-F. Frustrar ou fraudar, com o intuito de obter para si ou para outrem vantagem decorrente da adjudicação do objeto da licitação, o caráter competitivo do processo licitatório:","Pena - reclusão, de 4 (quatro) anos a 8 (oito) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-G","t":"Patrocínio de contratação indevida","k":"patrocinar","s":"Pune quem defende interesse privado perante a Administração e, com isso, dá causa à abertura de licitação ou à assinatura de contrato que depois é anulado pela Justiça. A pena é de reclusão, de 6 meses a 3 anos, e multa.","e":"Um servidor pressiona colegas para abrir uma licitação feita sob medida para uma empresa amiga, e depois o Judiciário anula o contrato.","d":"O crime só se completa se a invalidação da licitação ou do contrato for decretada pelo Poder Judiciário. É uma forma especial da advocacia administrativa do art. 321, com pena maior.","pena":"Reclusão, de 6 meses a 3 anos, e multa.","rub":"Patrocínio de contratação indevida","caput":"Patrocinar, direta ou indiretamente, interesse privado perante a Administração Pública, dando causa à instauração de licitação ou à celebração de contrato cuja invalidação vier a ser decretada pelo Poder Judiciário:","txt":["Art. 337-G. Patrocinar, direta ou indiretamente, interesse privado perante a Administração Pública, dando causa à instauração de licitação ou à celebração de contrato cuja invalidação vier a ser decretada pelo Poder Judiciário:","Pena - reclusão, de 6 (seis) meses a 3 (três) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-H","t":"Modificação ou pagamento irregular em contrato","k":"admitir, possibilitar ou dar causa","s":"Pune quem admite, possibilita ou dá causa a modificação ou vantagem, inclusive prorrogação, em favor do contratado durante o contrato com a Administração sem previsão em lei, no edital ou no contrato, ou quem paga fatura furando a ordem cronológica. A pena é de reclusão, de 4 a 8 anos, e multa.","e":"Um gestor público paga primeiro a fatura de uma empresa amiga, passando na frente de fornecedores que tinham faturas vencidas há mais tempo.","d":"Pagar fatura fora da ordem cronológica de exigibilidade também é crime aqui, mesmo que o valor seja devido.","pena":"Reclusão, de 4 anos a 8 anos, e multa.","rub":"Modificação ou pagamento irregular em contrato administrativo","caput":"Admitir, possibilitar ou dar causa a qualquer modificação ou vantagem, inclusive prorrogação contratual, em favor do contratado, durante a execução dos contratos celebrados com a Administração Pública, sem autorização em lei, no edital da licitação ou nos respectivos instrumentos contratuais, ou, ainda, pagar fatura com preterição da ordem cronológica de sua exigibilidade:","txt":["Art. 337-H. Admitir, possibilitar ou dar causa a qualquer modificação ou vantagem, inclusive prorrogação contratual, em favor do contratado, durante a execução dos contratos celebrados com a Administração Pública, sem autorização em lei, no edital da licitação ou nos respectivos instrumentos contratuais, ou, ainda, pagar fatura com preterição da ordem cronológica de sua exigibilidade:","Pena - reclusão, de 4 (quatro) anos a 8 (oito) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-I","t":"Perturbação de processo licitatório","k":"impedir, perturbar ou fraudar","s":"Pune quem impede, perturba ou frauda a realização de qualquer ato de uma licitação. A pena é de detenção, de 6 meses a 3 anos, e multa.","e":"Um licitante causa tumulto e tira os documentos da mesa para impedir que a sessão de abertura das propostas aconteça.","d":"A pena aqui é de detenção, e não de reclusão como na maioria dos crimes de licitação. Basta atingir qualquer ato do processo licitatório.","pena":"Detenção, de 6 meses a 3 anos, e multa.","rub":"Perturbação de processo licitatório","caput":"Impedir, perturbar ou fraudar a realização de qualquer ato de processo licitatório:","txt":["Art. 337-I. Impedir, perturbar ou fraudar a realização de qualquer ato de processo licitatório:","Pena - detenção, de 6 (seis) meses a 3 (três) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-J","t":"Violação de sigilo em licitação","k":"devassar","s":"Pune quem viola o sigilo de proposta apresentada em licitação ou dá a outra pessoa oportunidade de violá-lo. A pena é de detenção, de 2 a 3 anos, e multa.","e":"Um membro da comissão de licitação revela a um concorrente o valor da proposta lacrada de outra empresa antes da abertura.","d":"A pena é de detenção, de 2 a 3 anos, e multa, bem maior que a do art. 326, que fala em proposta de concorrência pública.","pena":"Detenção, de 2 anos a 3 anos, e multa.","rub":"Violação de sigilo em licitação","caput":"Devassar o sigilo de proposta apresentada em processo licitatório ou proporcionar a terceiro o ensejo de devassá-lo:","txt":["Art. 337-J. Devassar o sigilo de proposta apresentada em processo licitatório ou proporcionar a terceiro o ensejo de devassá-lo:","Pena - detenção, de 2 (dois) anos a 3 (três) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-K","t":"Afastamento de licitante","k":"afastar ou tentar afastar","s":"Pune quem afasta ou tenta afastar licitante usando violência, grave ameaça, fraude ou oferta de vantagem de qualquer tipo. A pena é de reclusão, de 3 a 5 anos, e multa, além da pena correspondente à violência.","e":"Um empresário oferece dinheiro a um concorrente para que ele não entregue proposta na licitação da merenda escolar.","d":"Basta tentar afastar para o crime estar completo. Quem aceita a vantagem e se abstém ou desiste de licitar recebe a mesma pena.","pena":"Reclusão, de 3 anos a 5 anos, e multa, além da pena correspondente à violência.","rub":"Afastamento de licitante","caput":"Afastar ou tentar afastar licitante por meio de violência, grave ameaça, fraude ou oferecimento de vantagem de qualquer tipo:","txt":["Art. 337-K. Afastar ou tentar afastar licitante por meio de violência, grave ameaça, fraude ou oferecimento de vantagem de qualquer tipo:","Pena - reclusão, de 3 (três) anos a 5 (cinco) anos, e multa, além da pena correspondente à violência.","Parágrafo único. Incorre na mesma pena quem se abstém ou desiste de licitar em razão de vantagem oferecida."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-L","t":"Fraude em licitação ou contrato","k":"fraudar","s":"Pune quem frauda licitação ou contrato com a Administração, causando prejuízo a ela, por meios como entregar mercadoria ou serviço em qualidade ou quantidade diferente, fornecer produto falsificado ou vencido, trocar uma mercadoria por outra ou encarecer injustamente a proposta ou o contrato. A pena é de reclusão, de 4 a 8 anos, e multa.","e":"Uma fornecedora entrega à rede pública de escolas alimentos com prazo de validade vencido como se fossem novos.","d":"O crime exige prejuízo à Administração Pública e um dos meios listados nos incisos. A frustração do caráter competitivo da licitação fica no art. 337-F.","pena":"","rub":"Fraude em licitação ou contrato","caput":"Fraudar, em prejuízo da Administração Pública, licitação ou contrato dela decorrente, mediante:","txt":["Art. 337-L. Fraudar, em prejuízo da Administração Pública, licitação ou contrato dela decorrente, mediante:","I - entrega de mercadoria ou prestação de serviços com qualidade ou em quantidade diversas das previstas no edital ou nos instrumentos contratuais;","II - fornecimento, como verdadeira ou perfeita, de mercadoria falsificada, deteriorada, inservível para consumo ou com prazo de validade vencido;","III - entrega de uma mercadoria por outra;","IV - alteração da substância, qualidade ou quantidade da mercadoria ou do serviço fornecido;","V - qualquer meio fraudulento que torne injustamente mais onerosa para a Administração Pública a proposta ou a execução do contrato:","Pena - reclusão, de 4 (quatro) anos a 8 (oito) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-M","t":"Contratação inidônea","k":"admitir à licitação","s":"Pune quem admite em licitação empresa ou profissional declarado inidôneo, isto é, proibido de contratar com o poder público. A pena é de reclusão, de 1 a 3 anos, e multa.","e":"Um pregoeiro aceita na disputa uma empresa que ele sabe estar declarada inidônea por fraudes anteriores.","d":"Celebrar o contrato com o inidôneo é mais grave: reclusão, de 3 a 6 anos, e multa. O próprio inidôneo que participa da licitação ou contrata responde com as mesmas penas, respectivamente.","pena":"Reclusão, de 1 ano a 3 anos, e multa.","rub":"Contratação inidônea","caput":"Admitir à licitação empresa ou profissional declarado inidôneo:","txt":["Art. 337-M. Admitir à licitação empresa ou profissional declarado inidôneo:","Pena - reclusão, de 1 (um) ano a 3 (três) anos, e multa.","§ 1º Celebrar contrato com empresa ou profissional declarado inidôneo:","Pena - reclusão, de 3 (três) anos a 6 (seis) anos, e multa.","§ 2º Incide na mesma pena do caput deste artigo aquele que, declarado inidôneo, venha a participar de licitação e, na mesma pena do § 1º deste artigo, aquele que, declarado inidôneo, venha a contratar com a Administração Pública."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-N","t":"Impedimento indevido","k":"obstar, impedir ou dificultar","s":"Pune quem atrapalha sem justa causa a inscrição de um interessado no cadastro de fornecedores da Administração, ou altera, suspende ou cancela indevidamente o registro de quem já está inscrito. Pena: reclusão, de 6 meses a 2 anos, e multa.","e":"Um servidor da prefeitura segura de propósito o cadastro de uma pequena construtora para que ela não possa disputar as próximas licitações.","d":"O crime tem duas partes: barrar a inscrição de quem quer entrar e mexer indevidamente (alterar, suspender, cancelar) no registro de quem já está inscrito. As duas condutas têm a mesma pena.","pena":"Reclusão, de 6 meses a 2 anos, e multa.","rub":"Impedimento indevido","caput":"Obstar, impedir ou dificultar injustamente a inscrição de qualquer interessado nos registros cadastrais ou promover indevidamente a alteração, a suspensão ou o cancelamento de registro do inscrito:","txt":["Art. 337-N. Obstar, impedir ou dificultar injustamente a inscrição de qualquer interessado nos registros cadastrais ou promover indevidamente a alteração, a suspensão ou o cancelamento de registro do inscrito:","Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-O","t":"Omissão grave por projetista","k":"omitir, modificar ou entregar","s":"Pune quem, contratado para elaborar projeto básico, projeto executivo ou anteprojeto, omite, modifica ou entrega à Administração dados técnicos muito diferentes da realidade, prejudicando a competição ou a escolha da melhor proposta. Pena: reclusão, de 6 meses a 3 anos, e multa.","e":"Uma empresa contratada para o anteprojeto de uma ponte esconde a sondagem que mostra solo instável, o que distorce os preços de todos os licitantes.","d":"Se o crime é praticado para obter benefício, direto ou indireto, para si ou para outra pessoa, a pena é aplicada em dobro. O § 1º define \"condição de contorno\": sondagens, topografia, estudos de demanda e condições ambientais, entre outros.","pena":"Reclusão, de 6 meses a 3 anos, e multa.","rub":"Omissão grave de dado ou de informação por projetista","caput":"Omitir, modificar ou entregar à Administração Pública levantamento cadastral ou condição de contorno em relevante dissonância com a realidade, em frustração ao caráter competitivo da licitação ou em detrimento da seleção da proposta mais vantajosa para a Administração Pública, em contratação para a elaboração de projeto básico, projeto executivo ou anteprojeto, em diálogo competitivo ou em procedimento de manifestação de interesse:","txt":["Art. 337-O. Omitir, modificar ou entregar à Administração Pública levantamento cadastral ou condição de contorno em relevante dissonância com a realidade, em frustração ao caráter competitivo da licitação ou em detrimento da seleção da proposta mais vantajosa para a Administração Pública, em contratação para a elaboração de projeto básico, projeto executivo ou anteprojeto, em diálogo competitivo ou em procedimento de manifestação de interesse:","Pena - reclusão, de 6 (seis) meses a 3 (três) anos, e multa.","§ 1º Consideram-se condição de contorno as informações e os levantamentos suficientes e necessários para a definição da solução de projeto e dos respectivos preços pelo licitante, incluídos sondagens, topografia, estudos de demanda, condições ambientais e demais elementos ambientais impactantes, considerados requisitos mínimos ou obrigatórios em normas técnicas que orientam a elaboração de projetos.","§ 2º Se o crime é praticado com o fim de obter benefício, direto ou indireto, próprio ou de outrem, aplica-se em dobro a pena prevista no caput deste artigo."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"337-P","t":"Multa nos crimes de licitação","k":"pena de multa","s":"Nos crimes de licitações e contratos, a multa é calculada pelo método normal do Código Penal, mas tem um piso: não pode ficar abaixo de 2% do valor do contrato licitado ou celebrado por contratação direta.","e":"Condenado por fraude numa licitação de obra, o empresário recebe multa que não pode ficar abaixo de 2% do valor do contrato.","d":"O piso de 2% vale também para contratos feitos sem licitação (contratação direta), não só para os licitados. O cálculo segue a metodologia geral do Código, apenas com esse mínimo.","pena":"","rub":"","caput":"A pena de multa cominada aos crimes previstos neste Capítulo seguirá a metodologia de cálculo prevista neste Código e não poderá ser inferior a 2% (dois por cento) do valor do contrato licitado ou celebrado com contratação direta.","txt":["Art. 337-P. A pena de multa cominada aos crimes previstos neste Capítulo seguirá a metodologia de cálculo prevista neste Código e não poderá ser inferior a 2% (dois por cento) do valor do contrato licitado ou celebrado com contratação direta."],"ti":18,"ch":"Dos crimes em licitações e contratos administrativos"},{"n":"338","t":"Reingresso de estrangeiro expulso","k":"reingressar","s":"Pune o estrangeiro que foi expulso do Brasil e volta a entrar no território nacional. Pena: reclusão, de 1 a 4 anos, sem prejuízo de nova expulsão depois de cumprir a pena.","e":"Um estrangeiro expulso por decisão do governo brasileiro cruza a fronteira de volta pelo Paraguai alguns meses depois.","d":"Só pratica o crime o estrangeiro que foi expulso; quem foi apenas deportado ou não tinha visto não se encaixa aqui. Cumprida a pena, ele ainda pode ser expulso de novo.","pena":"Reclusão, de 1 a 4 anos, sem prejuízo de nova expulsão após o cumprimento da pena.","rub":"Reingresso de estrangeiro expulso","caput":"Reingressar no território nacional o estrangeiro que dele foi expulso:","txt":["Art. 338 - Reingressar no território nacional o estrangeiro que dele foi expulso:","Pena - reclusão, de um a quatro anos, sem prejuízo de nova expulsão após o cumprimento da pena."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"338-A","t":"Descumprimento de medidas protetivas","k":"descumprir","s":"Pune quem descumpre uma decisão judicial que concedeu medidas protetivas de urgência, como a ordem de não se aproximar da vítima. Pena: reclusão, de 2 a 5 anos, e multa.","e":"Um homem proibido pelo juiz de se aproximar da ex-companheira vai até a porta do trabalho dela.","d":"O crime existe mesmo que a medida tenha sido dada por juiz da área cível, e não criminal. Se houver prisão em flagrante, só o juiz pode conceder fiança, nunca o delegado.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Descumprimento de medidas protetivas de urgência","caput":"Descumprir decisão judicial que defere medidas protetivas de urgência:","txt":["Art. 338-A. Descumprir decisão judicial que defere medidas protetivas de urgência:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","§ 1º A configuração do crime independe da competência civil ou criminal do juiz que deferiu as medidas.","§ 2º Na hipótese de prisão em flagrante, apenas a autoridade judicial pode conceder fiança.","§ 3º O disposto neste artigo não exclui a aplicação de outras sanções cabíveis."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"339","t":"Denunciação caluniosa","k":"dar causa","s":"Pune quem faz começar uma investigação ou processo (inquérito policial, processo judicial, processo disciplinar, inquérito civil, ação de improbidade etc.) contra alguém, acusando-o de crime, infração ético-disciplinar ou ato ímprobo, sabendo que ele é inocente. Pena: reclusão, de 2 a 8 anos, e multa.","e":"Uma pessoa registra boletim de ocorrência dizendo que o vizinho furtou sua moto, sabendo que é mentira, e a polícia abre inquérito contra ele.","d":"A pena aumenta de sexta parte se o agente usa anonimato ou nome falso, e diminui de metade se a acusação for de contravenção. Diferente da calúnia, aqui é preciso que a mentira provoque a abertura de investigação ou processo.","pena":"Reclusão, de 2 a 8 anos, e multa.","rub":"Denunciação caluniosa","caput":"Dar causa à instauração de inquérito policial, de procedimento investigatório criminal, de processo judicial, de processo administrativo disciplinar, de inquérito civil ou de ação de improbidade administrativa contra alguém, imputando-lhe crime, infração ético-disciplinar ou ato ímprobo de que o sabe inocente:","txt":["Art. 339. Dar causa à instauração de inquérito policial, de procedimento investigatório criminal, de processo judicial, de processo administrativo disciplinar, de inquérito civil ou de ação de improbidade administrativa contra alguém, imputando-lhe crime, infração ético-disciplinar ou ato ímprobo de que o sabe inocente:","Pena - reclusão, de dois a oito anos, e multa.","§ 1º - A pena é aumentada de sexta parte, se o agente se serve de anonimato ou de nome suposto.","§ 2º - A pena é diminuída de metade, se a imputação é de prática de contravenção."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"340","t":"Comunicação falsa de crime","k":"provocar a ação","s":"Pune quem faz a autoridade agir comunicando um crime ou contravenção que sabe que não aconteceu. Pena: detenção, de 1 a 6 meses, ou multa.","e":"Um motorista registra que seu carro foi roubado, quando na verdade o vendeu, só para receber o seguro.","d":"Aqui não se aponta um culpado: só se inventa o fato. Se o agente acusa uma pessoa determinada e isso gera investigação contra ela, o crime passa a ser denunciação caluniosa.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Comunicação falsa de crime ou de contravenção","caput":"Provocar a ação de autoridade, comunicando-lhe a ocorrência de crime ou de contravenção que sabe não se ter verificado:","txt":["Art. 340 - Provocar a ação de autoridade, comunicando-lhe a ocorrência de crime ou de contravenção que sabe não se ter verificado:","Pena - detenção, de um a seis meses, ou multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"341","t":"Autoacusação falsa","k":"acusar-se","s":"Pune quem se acusa, perante a autoridade, de um crime que não existiu ou que foi praticado por outra pessoa. Pena: detenção, de 3 meses a 2 anos, ou multa.","e":"Um pai vai à delegacia e assume ter causado o atropelamento para livrar o filho, que era quem dirigia.","d":"Vale para crime inexistente ou praticado por outra pessoa, mas o texto fala só em crime: acusar-se falsamente de contravenção não se encaixa aqui.","pena":"Detenção, de 3 meses a 2 anos, ou multa.","rub":"Auto-acusação falsa","caput":"Acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem:","txt":["Art. 341 - Acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem:","Pena - detenção, de três meses a dois anos, ou multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"342","t":"Falso testemunho ou falsa perícia","k":"fazer afirmação falsa","s":"Pune a testemunha, perito, contador, tradutor ou intérprete que mente, nega ou cala a verdade em processo judicial ou administrativo, inquérito policial ou arbitragem. Pena: reclusão, de 2 a 4 anos, e multa.","e":"Uma testemunha jura em audiência que o réu estava com ela no dia do crime, sabendo que isso é falso.","d":"O fato deixa de ser punível se o agente se retrata ou diz a verdade antes da sentença no processo em que mentiu. A pena aumenta de um sexto a um terço se houver suborno ou se o objetivo for produzir prova em processo penal ou em processo civil com ente da administração pública como parte.","pena":"Reclusão, de 2 a 4 anos, e multa.","rub":"Falso testemunho ou falsa perícia","caput":"Fazer afirmação falsa, ou negar ou calar a verdade como testemunha, perito, contador, tradutor ou intérprete em processo judicial, ou administrativo, inquérito policial, ou em juízo arbitral:","txt":["Art. 342. Fazer afirmação falsa, ou negar ou calar a verdade como testemunha, perito, contador, tradutor ou intérprete em processo judicial, ou administrativo, inquérito policial, ou em juízo arbitral:","Pena - reclusão, de 2 (dois) a 4 (quatro) anos, e multa.","§ 1º As penas aumentam-se de um sexto a um terço, se o crime é praticado mediante suborno ou se cometido com o fim de obter prova destinada a produzir efeito em processo penal, ou em processo civil em que for parte entidade da administração pública direta ou indireta.","§ 2º O fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"343","t":"Suborno de testemunha ou perito","k":"dar, oferecer ou prometer","s":"Pune quem dá, oferece ou promete dinheiro ou outra vantagem a testemunha, perito, contador, tradutor ou intérprete para que minta, negue ou cale a verdade. Pena: reclusão, de 3 a 4 anos, e multa.","e":"O réu oferece dinheiro à testemunha para que ela diga ao juiz que não viu nada.","d":"A pena mínima de quem suborna é maior que a da própria testemunha que mente no falso testemunho. A simples oferta ou promessa já consuma o crime, mesmo que a testemunha recuse.","pena":"Reclusão, de 3 a 4 anos, e multa.","rub":"","caput":"Dar, oferecer ou prometer dinheiro ou qualquer outra vantagem a testemunha, perito, contador, tradutor ou intérprete, para fazer afirmação falsa, negar ou calar a verdade em depoimento, perícia, cálculos, tradução ou interpretação:","txt":["Art. 343. Dar, oferecer ou prometer dinheiro ou qualquer outra vantagem a testemunha, perito, contador, tradutor ou intérprete, para fazer afirmação falsa, negar ou calar a verdade em depoimento, perícia, cálculos, tradução ou interpretação:","Pena - reclusão, de três a quatro anos, e multa","Parágrafo único. As penas aumentam-se de um sexto a um terço, se o crime é cometido com o fim de obter prova destinada a produzir efeito em processo penal ou em processo civil em que for parte entidade da administração pública direta ou indireta."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"344","t":"Coação no curso do processo","k":"usar de violência","s":"Pune quem usa violência ou grave ameaça contra juiz, parte, testemunha ou qualquer pessoa que atua num processo judicial, policial, administrativo ou arbitral, para favorecer interesse próprio ou de outro. Pena: reclusão, de 1 a 4 anos, e multa, além da pena da violência.","e":"O acusado manda recado à vítima dizendo que vai machucar a família dela se ela confirmar o depoimento em juízo.","d":"A pena aumenta de 1/3 até a metade se o processo envolver crime contra a dignidade sexual. A pena da violência é somada à deste crime.","pena":"Reclusão, de 1 a 4 anos, e multa, além da pena correspondente à violência.","rub":"Coação no curso do processo","caput":"Usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade, parte, ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, ou em juízo arbitral:","txt":["Art. 344 - Usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade, parte, ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, ou em juízo arbitral:","Pena - reclusão, de um a quatro anos, e multa, além da pena correspondente à violência.","Parágrafo único. A pena aumenta-se de 1/3 (um terço) até a metade se o processo envolver crime contra a dignidade sexual."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"345","t":"Exercício arbitrário das próprias razões","k":"fazer justiça","s":"Pune quem faz justiça com as próprias mãos para conseguir algo que acha que é seu direito, mesmo que a pretensão seja legítima, salvo quando a lei permite. Pena: detenção, de 15 dias a 1 mês, ou multa, além da pena da violência.","e":"O dono de uma oficina retém à força o celular de um cliente até que ele pague o conserto atrasado.","d":"Se não houver violência, a ação é privada: só se processa mediante queixa da vítima. O crime existe mesmo que a dívida ou o direito cobrado seja verdadeiro.","pena":"Detenção, de 15 dias a 1 mês, ou multa, além da pena correspondente à violência.","rub":"Exercício arbitrário das próprias razões","caput":"Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite:","txt":["Art. 345 - Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite:","Pena - detenção, de quinze dias a um mês, ou multa, além da pena correspondente à violência.","Parágrafo único - Se não há emprego de violência, somente se procede mediante queixa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"346","t":"Subtração de coisa própria em poder alheio","k":"tirar ou destruir","s":"Pune quem tira, suprime, destrói ou danifica uma coisa que é dele mesmo, mas que está com outra pessoa por ordem judicial ou por contrato. Pena: detenção, de 6 meses a 2 anos, e multa.","e":"O devedor tem o carro penhorado e deixado com um depositário, e vai à noite buscá-lo escondido.","d":"A coisa é do próprio agente, por isso não é furto nem dano comum; o crime é atingir a posse que um terceiro tem por determinação judicial ou convenção.","pena":"Detenção, de 6 meses a 2 anos, e multa.","rub":"","caput":"Tirar, suprimir, destruir ou danificar coisa própria, que se acha em poder de terceiro por determinação judicial ou convenção:","txt":["Art. 346 - Tirar, suprimir, destruir ou danificar coisa própria, que se acha em poder de terceiro por determinação judicial ou convenção:","Pena - detenção, de seis meses a dois anos, e multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"347","t":"Fraude processual","k":"inovar artificiosamente","s":"Pune quem altera de forma ardilosa o estado de um lugar, coisa ou pessoa durante um processo civil ou administrativo, para enganar o juiz ou o perito. Pena: detenção, de 3 meses a 2 anos, e multa.","e":"Antes da perícia em ação de indenização, o dono de um imóvel conserta escondido as rachaduras para negar o problema.","d":"Se a fraude for para produzir efeito em processo penal, a pena é aplicada em dobro, e isso vale mesmo que o processo penal ainda nem tenha começado.","pena":"Detenção, de 3 meses a 2 anos, e multa.","rub":"Fraude processual","caput":"Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito:","txt":["Art. 347 - Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito:","Pena - detenção, de três meses a dois anos, e multa.","Parágrafo único - Se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"348","t":"Favorecimento pessoal","k":"auxiliar a subtrair-se","s":"Pune quem ajuda o autor de um crime a fugir ou se esconder da ação da autoridade. Se o crime do auxiliado tem pena de reclusão, a pena é detenção, de 1 a 6 meses, e multa.","e":"Um amigo esconde em sua chácara o rapaz procurado pela polícia por roubo.","d":"Se o crime do auxiliado não tiver pena de reclusão, a pena cai para detenção, de 15 dias a 3 meses, e multa. Ascendente, descendente, cônjuge ou irmão que presta o auxílio fica isento de pena.","pena":"Detenção, de 1 a 6 meses, e multa.","rub":"Favorecimento pessoal","caput":"Auxiliar a subtrair-se à ação de autoridade pública autor de crime a que é cominada pena de reclusão:","txt":["Art. 348 - Auxiliar a subtrair-se à ação de autoridade pública autor de crime a que é cominada pena de reclusão:","Pena - detenção, de um a seis meses, e multa.","§ 1º - Se ao crime não é cominada pena de reclusão:","Pena - detenção, de quinze dias a três meses, e multa.","§ 2º - Se quem presta o auxílio é ascendente, descendente, cônjuge ou irmão do criminoso, fica isento de pena."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"349","t":"Favorecimento real","k":"prestar auxílio","s":"Pune quem ajuda o criminoso a garantir o proveito do crime, como guardar o dinheiro ou o objeto obtido, fora dos casos de coautoria ou receptação. Pena: detenção, de 1 a 6 meses, e multa.","e":"Um conhecido guarda em casa, como favor, o dinheiro que o assaltante tirou de uma loja.","d":"No favorecimento real se protege o proveito do crime; no pessoal, a pessoa do criminoso. Se o agente age para lucrar para si, tende a ser receptação; aqui o auxílio é em favor do criminoso, e não há isenção para parentes.","pena":"Detenção, de 1 a 6 meses, e multa.","rub":"Favorecimento real","caput":"Prestar a criminoso, fora dos casos de co-autoria ou de receptação, auxílio destinado a tornar seguro o proveito do crime:","txt":["Art. 349 - Prestar a criminoso, fora dos casos de co-autoria ou de receptação, auxílio destinado a tornar seguro o proveito do crime:","Pena - detenção, de um a seis meses, e multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"349-A","t":"Celular em presídio","k":"ingressar ou facilitar","s":"Pune quem entra, promove, intermedeia, ajuda ou facilita a entrada de celular, rádio ou aparelho parecido em presídio sem autorização legal. Pena: detenção, de 3 meses a 1 ano.","e":"Uma visitante tenta entrar na penitenciária com um celular escondido na sola do sapato para entregar ao marido preso.","d":"Vale para qualquer pessoa, inclusive visitantes e particulares. Se for o diretor ou agente penitenciário que deixa de impedir o acesso, há tipo próprio entre os crimes de funcionário público.","pena":"Detenção, de 3 meses a 1 ano..","rub":"","caput":"Ingressar, promover, intermediar, auxiliar ou facilitar a entrada de aparelho telefônico de comunicação móvel, de rádio ou similar, sem autorização legal, em estabelecimento prisional..","txt":["Art. 349-A. Ingressar, promover, intermediar, auxiliar ou facilitar a entrada de aparelho telefônico de comunicação móvel, de rádio ou similar, sem autorização legal, em estabelecimento prisional.","Pena: detenção, de 3 (três) meses a 1 (um) ano."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"351","t":"Fuga de pessoa presa","k":"promover ou facilitar","s":"Pune quem promove ou facilita a fuga de pessoa legalmente presa ou internada por medida de segurança. Pena: detenção, de 6 meses a 2 anos.","e":"Um parente serra as grades da cela pelo lado de fora da cadeia pública para o preso escapar.","d":"Com arma, mais de uma pessoa ou arrombamento, a pena vira reclusão, de 2 a 6 anos; se quem facilita é o próprio guarda, reclusão de 1 a 4 anos. Existe forma culposa para o funcionário da custódia: detenção, de 3 meses a 1 ano, ou multa.","pena":"Detenção, de 6 meses a 2 anos.","rub":"Fuga de pessoa presa ou submetida a medida de segurança","caput":"Promover ou facilitar a fuga de pessoa legalmente presa ou submetida a medida de segurança detentiva:","txt":["Art. 351 - Promover ou facilitar a fuga de pessoa legalmente presa ou submetida a medida de segurança detentiva:","Pena - detenção, de seis meses a dois anos.","§ 1º - Se o crime é praticado a mão armada, ou por mais de uma pessoa, ou mediante arrombamento, a pena é de reclusão, de 2 (dois) a 6 (seis) anos.","§ 2º - Se há emprego de violência contra pessoa, aplica-se também a pena correspondente à violência.","§ 3º - A pena é de reclusão, de um a quatro anos, se o crime é praticado por pessoa sob cuja custódia ou guarda está o preso ou o internado.","§ 4º - No caso de culpa do funcionário incumbido da custódia ou guarda, aplica-se a pena de detenção, de 3 (três) meses a 1 (um) ano, ou multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"352","t":"Evasão mediante violência","k":"evadir-se","s":"Pune o preso ou internado em medida de segurança que foge ou tenta fugir usando violência contra a pessoa. Pena: detenção, de 3 meses a 1 ano, além da pena da violência.","e":"Durante a escolta para o fórum, o preso agride o agente penitenciário para conseguir correr.","d":"A tentativa de fuga tem a mesma pena da fuga consumada. Fugir sem violência contra a pessoa não é este crime.","pena":"Detenção, de 3 meses a 1 ano, além da pena correspondente à violência.","rub":"Evasão mediante violência contra a pessoa","caput":"Evadir-se ou tentar evadir-se o preso ou o indivíduo submetido a medida de segurança detentiva, usando de violência contra a pessoa:","txt":["Art. 352 - Evadir-se ou tentar evadir-se o preso ou o indivíduo submetido a medida de segurança detentiva, usando de violência contra a pessoa:","Pena - detenção, de três meses a um ano, além da pena correspondente à violência."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"353","t":"Arrebatamento de preso","k":"arrebatar","s":"Pune quem tira um preso à força de quem o guarda com a intenção de maltratá-lo. Pena: reclusão, de 1 a 4 anos, além da pena da violência.","e":"Moradores revoltados invadem a delegacia e arrancam o suspeito da cela para espancá-lo.","d":"O que define o crime é a finalidade de maltratar o preso; tirá-lo da custódia para libertá-lo é o crime de fuga de pessoa presa.","pena":"Reclusão, de 1 a 4 anos, além da pena correspondente à violência.","rub":"Arrebatamento de preso","caput":"Arrebatar preso, a fim de maltratá-lo, do poder de quem o tenha sob custódia ou guarda:","txt":["Art. 353 - Arrebatar preso, a fim de maltratá-lo, do poder de quem o tenha sob custódia ou guarda:","Pena - reclusão, de um a quatro anos, além da pena correspondente à violência."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"354","t":"Motim de presos","k":"amotinar-se","s":"Pune os presos que se rebelam juntos, perturbando a ordem ou a disciplina da prisão. Pena: detenção, de 6 meses a 2 anos, além da pena da violência.","e":"Detentos de uma galeria tomam o pavilhão, queimam colchões e se recusam a voltar às celas.","d":"É crime de concurso necessário: precisa de vários presos agindo juntos. Um preso sozinho causando tumulto não comete motim.","pena":"Detenção, de 6 meses a 2 anos, além da pena correspondente à violência.","rub":"Motim de presos","caput":"Amotinarem-se presos, perturbando a ordem ou disciplina da prisão:","txt":["Art. 354 - Amotinarem-se presos, perturbando a ordem ou disciplina da prisão:","Pena - detenção, de seis meses a dois anos, além da pena correspondente à violência."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"355","t":"Patrocínio infiel","k":"trair","s":"Pune o advogado ou procurador que trai o dever profissional e prejudica o cliente numa causa judicial que lhe foi confiada. Pena: detenção, de 6 meses a 3 anos, e multa.","e":"O advogado combina com a parte contrária e deixa o prazo do recurso do cliente passar de propósito.","d":"O parágrafo único traz o patrocínio simultâneo ou tergiversação: defender, na mesma causa, partes contrárias, ao mesmo tempo ou uma depois da outra, com a mesma pena.","pena":"Detenção, de 6 meses a 3 anos, e multa.","rub":"Patrocínio infiel","caput":"Trair, na qualidade de advogado ou procurador, o dever profissional, prejudicando interesse, cujo patrocínio, em juízo, lhe é confiado:","txt":["Art. 355 - Trair, na qualidade de advogado ou procurador, o dever profissional, prejudicando interesse, cujo patrocínio, em juízo, lhe é confiado:","Pena - detenção, de seis meses a três anos, e multa.","Patrocínio simultâneo ou tergiversação","Parágrafo único - Incorre na pena deste artigo o advogado ou procurador judicial que defende na mesma causa, simultânea ou sucessivamente, partes contrárias."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"356","t":"Sonegação de papel probatório","k":"inutilizar ou deixar de restituir","s":"Pune o advogado ou procurador que destrói, total ou parcialmente, ou não devolve autos, documento ou objeto de valor como prova que recebeu nessa qualidade. Pena: detenção, de 6 meses a 3 anos, e multa.","e":"O advogado retira os autos físicos do cartório e se recusa a devolvê-los para atrasar o processo.","d":"Só o advogado ou procurador pode cometer este crime, e só quanto ao que recebeu nessa qualidade. Basta deixar de restituir; não é preciso destruir.","pena":"Detenção, de 6 meses a 3 anos, e multa.","rub":"Sonegação de papel ou objeto de valor probatório","caput":"Inutilizar, total ou parcialmente, ou deixar de restituir autos, documento ou objeto de valor probatório, que recebeu na qualidade de advogado ou procurador:","txt":["Art. 356 - Inutilizar, total ou parcialmente, ou deixar de restituir autos, documento ou objeto de valor probatório, que recebeu na qualidade de advogado ou procurador:","Pena - detenção, de seis meses a três anos, e multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"357","t":"Exploração de prestígio","k":"solicitar ou receber","s":"Pune quem pede ou recebe dinheiro ou outra vantagem dizendo que vai influenciar juiz, jurado, promotor, funcionário da Justiça, perito, tradutor, intérprete ou testemunha. Pena: reclusão, de 1 a 5 anos, e multa.","e":"Um homem cobra uma quantia alta de um réu dizendo ser amigo do juiz e que garante a absolvição.","d":"A pena aumenta de um terço se o agente diz ou insinua que o dinheiro também vai para a autoridade. Diferente do tráfico de influência, aqui as pessoas mencionadas são ligadas à Justiça.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Exploração de prestígio","caput":"Solicitar ou receber dinheiro ou qualquer outra utilidade, a pretexto de influir em juiz, jurado, órgão do Ministério Público, funcionário de justiça, perito, tradutor, intérprete ou testemunha:","txt":["Art. 357 - Solicitar ou receber dinheiro ou qualquer outra utilidade, a pretexto de influir em juiz, jurado, órgão do Ministério Público, funcionário de justiça, perito, tradutor, intérprete ou testemunha:","Pena - reclusão, de um a cinco anos, e multa.","Parágrafo único - As penas aumentam-se de um terço, se o agente alega ou insinua que o dinheiro ou utilidade também se destina a qualquer das pessoas referidas neste artigo."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"358","t":"Fraude em arrematação judicial","k":"impedir, perturbar ou fraudar","s":"Pune quem impede, perturba ou frauda leilão judicial, ou afasta ou tenta afastar concorrente por violência, grave ameaça, fraude ou oferta de vantagem. Pena: detenção, de 2 meses a 1 ano, ou multa, além da pena da violência.","e":"Um interessado oferece dinheiro aos outros participantes para que não deem lances no leilão judicial de um apartamento.","d":"Basta procurar afastar o concorrente: a tentativa de afastá-lo já consuma o crime. O tipo trata de arrematação judicial, não de licitação pública, que tem crimes próprios.","pena":"Detenção, de 2 meses a 1 ano, ou multa, além da pena correspondente à violência.","rub":"Violência ou fraude em arrematação judicial","caput":"Impedir, perturbar ou fraudar arrematação judicial; afastar ou procurar afastar concorrente ou licitante, por meio de violência, grave ameaça, fraude ou oferecimento de vantagem:","txt":["Art. 358 - Impedir, perturbar ou fraudar arrematação judicial; afastar ou procurar afastar concorrente ou licitante, por meio de violência, grave ameaça, fraude ou oferecimento de vantagem:","Pena - detenção, de dois meses a um ano, ou multa, além da pena correspondente à violência."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"359","t":"Desobediência a decisão sobre direito","k":"exercer","s":"Pune quem continua exercendo função, atividade, direito, autoridade ou múnus (encargo público) de que foi suspenso ou privado por decisão judicial. Pena: detenção, de 3 meses a 2 anos, ou multa.","e":"Um motorista com o direito de dirigir suspenso por sentença continua trabalhando como motorista de aplicativo.","d":"A suspensão ou privação precisa vir de decisão judicial; se vier de ato administrativo, não se encaixa neste artigo.","pena":"Detenção, de 3 meses a 2 anos, ou multa.","rub":"Desobediência a decisão judicial sobre perda ou suspensão de direito","caput":"Exercer função, atividade, direito, autoridade ou múnus, de que foi suspenso ou privado por decisão judicial:","txt":["Art. 359 - Exercer função, atividade, direito, autoridade ou múnus, de que foi suspenso ou privado por decisão judicial:","Pena - detenção, de três meses a dois anos, ou multa."],"ti":18,"ch":"Dos crimes contra a administração da justiça"},{"n":"359-A","t":"Contratação de operação de crédito","k":"ordenar, autorizar ou realizar","s":"Pune o agente público que ordena, autoriza ou faz empréstimo (operação de crédito), interno ou externo, sem autorização prévia do Poder Legislativo. Pena: reclusão, de 1 a 2 anos.","e":"Um prefeito contrata empréstimo com um banco sem que a Câmara Municipal tenha aprovado a lei autorizando.","d":"Tem a mesma pena quem faz a operação desrespeitando limite, condição ou montante previsto em lei ou resolução do Senado, ou quando a dívida consolidada já ultrapassa o limite legal.","pena":"Reclusão, de 1 a 2 anos.","rub":"Contratação de operação de crédito","caput":"Ordenar, autorizar ou realizar operação de crédito, interno ou externo, sem prévia autorização legislativa:","txt":["Art. 359-A. Ordenar, autorizar ou realizar operação de crédito, interno ou externo, sem prévia autorização legislativa:","Pena - reclusão, de 1 (um) a 2 (dois) anos.","Parágrafo único. Incide na mesma pena quem ordena, autoriza ou realiza operação de crédito, interno ou externo:","I - com inobservância de limite, condição ou montante estabelecido em lei ou em resolução do Senado Federal;","II - quando o montante da dívida consolidada ultrapassa o limite máximo autorizado por lei."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-B","t":"Restos a pagar sem empenho","k":"ordenar ou autorizar","s":"Pune quem manda ou autoriza inscrever em restos a pagar (dívidas deixadas para o ano seguinte) despesa que não foi empenhada antes, isto é, sem a reserva prévia do dinheiro, ou que passa do limite legal. Pena: detenção, de 6 meses a 2 anos.","e":"No fim do ano, o secretário de finanças joga para o ano seguinte uma compra que nunca teve o dinheiro reservado no orçamento.","d":"São duas hipóteses: despesa não empenhada previamente ou despesa que excede limite legal. A pena é de detenção, diferente de vários crimes vizinhos, punidos com reclusão.","pena":"Detenção, de 6 meses a 2 anos.","rub":"Inscrição de despesas não empenhadas em restos a pagar","caput":"Ordenar ou autorizar a inscrição em restos a pagar, de despesa que não tenha sido previamente empenhada ou que exceda limite estabelecido em lei:","txt":["Art. 359-B. Ordenar ou autorizar a inscrição em restos a pagar, de despesa que não tenha sido previamente empenhada ou que exceda limite estabelecido em lei:","Pena - detenção, de 6 (seis) meses a 2 (dois) anos."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-C","t":"Obrigação no último ano do mandato","k":"ordenar ou autorizar","s":"Pune quem, nos dois últimos quadrimestres do último ano do mandato, assume obrigação que não pode ser paga no mesmo ano ou que deixa parcela para o ano seguinte sem dinheiro em caixa suficiente. Pena: reclusão, de 1 a 4 anos.","e":"Em setembro do último ano de mandato, o prefeito contrata uma grande obra sabendo que não haverá caixa para pagá-la.","d":"O período proibido são os dois últimos quadrimestres do último ano do mandato ou legislatura, e não os cento e oitenta dias finais, que é o prazo do crime de aumento de despesa com pessoal.","pena":"Reclusão, de 1 a 4 anos.","rub":"Assunção de obrigação no último ano do mandato ou legislatura","caput":"Ordenar ou autorizar a assunção de obrigação, nos dois últimos quadrimestres do último ano do mandato ou legislatura, cuja despesa não possa ser paga no mesmo exercício financeiro ou, caso reste parcela a ser paga no exercício seguinte, que não tenha contrapartida suficiente de disponibilidade de caixa:","txt":["Art. 359-C. Ordenar ou autorizar a assunção de obrigação, nos dois últimos quadrimestres do último ano do mandato ou legislatura, cuja despesa não possa ser paga no mesmo exercício financeiro ou, caso reste parcela a ser paga no exercício seguinte, que não tenha contrapartida suficiente de disponibilidade de caixa:","Pena - reclusão, de 1 (um) a 4 (quatro) anos."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-D","t":"Ordenação de despesa não autorizada","k":"ordenar despesa","s":"Pune o agente público que manda fazer um gasto que a lei não autoriza. Pena: reclusão, de 1 a 4 anos.","e":"O presidente da Câmara Municipal manda pagar uma festa de fim de ano sem previsão no orçamento.","d":"O verbo é só \"ordenar\": basta a ordem de despesa sem autorização legal, sem exigir que o agente lucre com isso.","pena":"Reclusão, de 1 a 4 anos.","rub":"Ordenação de despesa não autorizada","caput":"Ordenar despesa não autorizada por lei:","txt":["Art. 359-D. Ordenar despesa não autorizada por lei:","Pena - reclusão, de 1 (um) a 4 (quatro) anos."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-E","t":"Prestação de garantia graciosa","k":"prestar garantia","s":"Pune quem dá garantia em operação de crédito sem exigir contragarantia de valor igual ou maior. Pena: detenção, de 3 meses a 1 ano.","e":"O governador garante com recursos do Estado o empréstimo de uma estatal sem exigir dela qualquer bem em contrapartida.","d":"\"Graciosa\" quer dizer de graça, sem contragarantia suficiente. É a menor pena entre os crimes contra as finanças públicas.","pena":"Detenção, de 3 meses a 1 ano.","rub":"Prestação de garantia graciosa","caput":"Prestar garantia em operação de crédito sem que tenha sido constituída contragarantia em valor igual ou superior ao valor da garantia prestada, na forma da lei:","txt":["Art. 359-E. Prestar garantia em operação de crédito sem que tenha sido constituída contragarantia em valor igual ou superior ao valor da garantia prestada, na forma da lei:","Pena - detenção, de 3 (três) meses a 1 (um) ano."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-F","t":"Não cancelamento de restos a pagar","k":"deixar de ordenar","s":"Pune quem deixa de ordenar, autorizar ou promover o cancelamento de restos a pagar inscritos acima do valor que a lei permite. Pena: detenção, de 6 meses a 2 anos.","e":"O novo secretário percebe que há dívidas inscritas além do limite e simplesmente não as cancela.","d":"É crime omissivo: o agente é punido por não agir. Não confundir com a inscrição indevida de despesa não empenhada, que é conduta ativa.","pena":"Detenção, de 6 meses a 2 anos.","rub":"Não cancelamento de restos a pagar","caput":"Deixar de ordenar, de autorizar ou de promover o cancelamento do montante de restos a pagar inscrito em valor superior ao permitido em lei:","txt":["Art. 359-F. Deixar de ordenar, de autorizar ou de promover o cancelamento do montante de restos a pagar inscrito em valor superior ao permitido em lei:","Pena - detenção, de 6 (seis) meses a 2 (dois) anos."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-G","t":"Aumento de despesa com pessoal","k":"ordenar, autorizar ou executar","s":"Pune quem ordena, autoriza ou executa ato que aumente a despesa total com pessoal nos cento e oitenta dias anteriores ao fim do mandato ou da legislatura. Pena: reclusão, de 1 a 4 anos.","e":"Nos meses finais do mandato, o prefeito concede aumento geral aos servidores.","d":"O prazo aqui é de cento e oitenta dias antes do fim do mandato; no crime de assunção de obrigação, o período é o dos dois últimos quadrimestres.","pena":"Reclusão, de 1 a 4 anos.","rub":"Aumento de despesa total com pessoal no último ano do mandato ou legislatura","caput":"Ordenar, autorizar ou executar ato que acarrete aumento de despesa total com pessoal, nos cento e oitenta dias anteriores ao final do mandato ou da legislatura:","txt":["Art. 359-G. Ordenar, autorizar ou executar ato que acarrete aumento de despesa total com pessoal, nos cento e oitenta dias anteriores ao final do mandato ou da legislatura:","Pena - reclusão, de 1 (um) a 4 (quatro) anos."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-H","t":"Oferta irregular de títulos públicos","k":"ordenar, autorizar ou promover","s":"Pune quem ordena, autoriza ou promove a venda ao mercado de títulos da dívida pública que não foram criados por lei ou não estão registrados em sistema centralizado de liquidação e custódia. Pena: reclusão, de 1 a 4 anos.","e":"Um governo estadual lança títulos para captar dinheiro de investidores sem lei que os crie.","d":"Basta uma das falhas: título não criado por lei ou título não registrado no sistema centralizado. Não precisa das duas.","pena":"Reclusão, de 1 a 4 anos.","rub":"Oferta pública ou colocação de títulos no mercado","caput":"Ordenar, autorizar ou promover a oferta pública ou a colocação no mercado financeiro de títulos da dívida pública sem que tenham sido criados por lei ou sem que estejam registrados em sistema centralizado de liquidação e de custódia:","txt":["Art. 359-H. Ordenar, autorizar ou promover a oferta pública ou a colocação no mercado financeiro de títulos da dívida pública sem que tenham sido criados por lei ou sem que estejam registrados em sistema centralizado de liquidação e de custódia:","Pena - reclusão, de 1 (um) a 4 (quatro) anos."],"ti":18,"ch":"Dos crimes contra as finanças públicas"},{"n":"359-I","t":"Atentado à soberania","k":"negociar","s":"Pune quem negocia com governo ou grupo estrangeiro, ou seus agentes, para provocar atos de guerra contra o Brasil ou invadi-lo. Pena: reclusão, de 3 a 8 anos.","e":"Um brasileiro negocia com militares de outro país um plano para invasão de uma região de fronteira.","d":"A pena aumenta de metade até o dobro se a guerra for declarada por causa da conduta. Quem participa de operação bélica para submeter o território ao domínio de outro país tem pena de reclusão, de 4 a 12 anos.","pena":"Reclusão, de 3 a 8 anos.","rub":"Atentado à soberania","caput":"Negociar com governo ou grupo estrangeiro, ou seus agentes, com o fim de provocar atos típicos de guerra contra o País ou invadi-lo:","txt":["Art. 359-I. Negociar com governo ou grupo estrangeiro, ou seus agentes, com o fim de provocar atos típicos de guerra contra o País ou invadi-lo:","Pena - reclusão, de 3 (três) a 8 (oito) anos.","§ 1º Aumenta-se a pena de metade até o dobro, se declarada guerra em decorrência das condutas previstas no caput deste artigo.","§ 2º Se o agente participa de operação bélica com o fim de submeter o território nacional, ou parte dele, ao domínio ou à soberania de outro país:","Pena - reclusão, de 4 (quatro) a 12 (doze) anos."],"ti":19,"ch":"Dos crimes contra a soberania nacional"},{"n":"359-J","t":"Atentado à integridade nacional","k":"praticar violência","s":"Pune quem usa violência ou grave ameaça para separar parte do território brasileiro e formar um país independente. Pena: reclusão, de 2 a 6 anos, além da pena da violência.","e":"Um grupo armado ataca prédios públicos para forçar a separação de um estado e criar um novo país.","d":"Defender ideias separatistas sem violência ou grave ameaça não é este crime: o tipo exige violência ou grave ameaça.","pena":"Reclusão, de 2 a 6 anos, além da pena correspondente à violência.","rub":"Atentado à integridade nacional","caput":"Praticar violência ou grave ameaça com a finalidade de desmembrar parte do território nacional para constituir país independente:","txt":["Art. 359-J. Praticar violência ou grave ameaça com a finalidade de desmembrar parte do território nacional para constituir país independente:","Pena - reclusão, de 2 (dois) a 6 (seis) anos, além da pena correspondente à violência."],"ti":19,"ch":"Dos crimes contra a soberania nacional"},{"n":"359-K","t":"Espionagem","k":"entregar","s":"Pune quem entrega a governo estrangeiro, seus agentes ou organização criminosa estrangeira documento ou informação classificados como secretos ou ultrassecretos, cuja revelação possa pôr em perigo a ordem constitucional ou a soberania. Pena: reclusão, de 3 a 12 anos.","e":"Um servidor do Ministério da Defesa vende a um agente estrangeiro planos militares classificados como secretos.","d":"Se houver violação do dever de sigilo, a pena sobe para reclusão, de 6 a 15 anos. Não é crime entregar ou publicar informações para expor a prática de crime ou violação de direitos humanos.","pena":"Reclusão, de 3 a 12 anos.","rub":"Espionagem","caput":"Entregar a governo estrangeiro, a seus agentes, ou a organização criminosa estrangeira, em desacordo com determinação legal ou regulamentar, documento ou informação classificados como secretos ou ultrassecretos nos termos da lei, cuja revelação possa colocar em perigo a preservação da ordem constitucional ou a soberania nacional:","txt":["Art. 359-K. Entregar a governo estrangeiro, a seus agentes, ou a organização criminosa estrangeira, em desacordo com determinação legal ou regulamentar, documento ou informação classificados como secretos ou ultrassecretos nos termos da lei, cuja revelação possa colocar em perigo a preservação da ordem constitucional ou a soberania nacional:","Pena - reclusão, de 3 (três) a 12 (doze) anos.","§ 1º Incorre na mesma pena quem presta auxílio a espião, conhecendo essa circunstância, para subtraí-lo à ação da autoridade pública.","§ 2º Se o documento, dado ou informação é transmitido ou reve
