o não cabe mais recurso.","pena":"","rub":"","caput":"O perdão, no processo ou fora dele, expresso ou tácito:","txt":["Art. 106 - O perdão, no processo ou fora dele, expresso ou tácito:","I - se concedido a qualquer dos querelados, a todos aproveita;","II - se concedido por um dos ofendidos, não prejudica o direito dos outros;","III - se o querelado o recusa, não produz efeito.","§ 1º - Perdão tácito é o que resulta da prática de ato incompatível com a vontade de prosseguir na ação.","§ 2º - Não é admissível o perdão depois que passa em julgado a sentença condenatória."],"ti":6,"ch":""},{"n":"107","t":"Extinção da punibilidade","k":"extingue-se a punibilidade","s":"Lista as situações em que o Estado perde o direito de punir: morte do agente; anistia, graça ou indulto; lei nova que deixa de considerar o fato crime; prescrição, decadência ou perempção; renúncia ou perdão aceito nos crimes de ação privada; retratação, quando a lei permite; e perdão judicial.","e":"Se o réu morre durante o processo, o juiz declara extinta a punibilidade e o caso é encerrado.","d":"O perdão do ofendido só extingue a punibilidade se for aceito e se o crime for de ação privada; já a retratação só vale nos casos em que a lei a admite. A lista salta do inciso VI para o IX, porque os incisos intermediários não estão mais em vigor.","pena":"","rub":"Extinção da punibilidade","caput":"Extingue-se a punibilidade:","txt":["Art. 107 - Extingue-se a punibilidade:","I - pela morte do agente;","II - pela anistia, graça ou indulto;","III - pela retroatividade de lei que não mais considera o fato como criminoso;","IV - pela prescrição, decadência ou perempção;","V - pela renúncia do direito de queixa ou pelo perdão aceito, nos crimes de ação privada;","VI - pela retratação do agente, nos casos em que a lei a admite;","IX - pelo perdão judicial, nos casos previstos em lei."],"ti":7,"ch":""},{"n":"108","t":"Extinção em crimes ligados","k":"crimes conexos","s":"Se um crime serve de base ou de agravante para outro, a extinção da punibilidade do primeiro não se estende ao segundo. Em crimes conexos (ligados entre si), extinguir a punibilidade de um não impede o aumento de pena no outro por causa da ligação.","e":"O furto de um celular prescreve, mas quem depois recebeu o aparelho sabendo da origem ilícita continua podendo ser punido por receptação.","d":"A extinção da punibilidade é individual a cada crime: a do crime-pressuposto não beneficia o crime que dele depende.","pena":"","rub":"","caput":"A extinção da punibilidade de crime que é pressuposto, elemento constitutivo ou circunstância agravante de outro não se estende a este. Nos crimes conexos, a extinção da punibilidade de um deles não impede, quanto aos outros, a agravação da pena resultante da conexão.","txt":["Art. 108 - A extinção da punibilidade de crime que é pressuposto, elemento constitutivo ou circunstância agravante de outro não se estende a este. Nos crimes conexos, a extinção da punibilidade de um deles não impede, quanto aos outros, a agravação da pena resultante da conexão."],"ti":7,"ch":""},{"n":"109","t":"Prescrição antes da sentença definitiva","k":"prescrição","s":"Prescrição é a perda do direito de punir pelo passar do tempo. Antes da sentença definitiva, o prazo é calculado pela pena máxima prevista para o crime: 20 anos se o máximo passa de 12; 16 anos se passa de 8 e vai até 12; 12 anos se passa de 4 e vai até 8; 8 anos se passa de 2 e vai até 4; 4 anos se é de 1 ou vai até 2; e 3 anos se é inferior a 1 ano.","e":"Um crime com pena máxima de 4 anos prescreve em 8 anos se o processo não andar dentro dos marcos legais.","d":"Pena máxima inferior a 1 ano prescreve em 3 anos, e não em 2. As penas restritivas de direitos seguem os mesmos prazos das privativas de liberdade.","pena":"","rub":"Prescrição antes de transitar em julgado a sentença","caput":"A prescrição, antes de transitar em julgado a sentença final, salvo o disposto no § 1º do art. 110 deste Código, regula-se pelo máximo da pena privativa de liberdade cominada ao crime, verificando-se:.","txt":["Art. 109. A prescrição, antes de transitar em julgado a sentença final, salvo o disposto no § 1º do art. 110 deste Código, regula-se pelo máximo da pena privativa de liberdade cominada ao crime, verificando-se:.","I - em vinte anos, se o máximo da pena é superior a doze;","II - em dezesseis anos, se o máximo da pena é superior a oito anos e não excede a doze;","III - em doze anos, se o máximo da pena é superior a quatro anos e não excede a oito;","IV - em oito anos, se o máximo da pena é superior a dois anos e não excede a quatro;","V - em quatro anos, se o máximo da pena é igual a um ano ou, sendo superior, não excede a dois;","VI - em 3 (três) anos, se o máximo da pena é inferior a 1 (um) ano.","Prescrição das penas restritivas de direito","Parágrafo único - Aplicam-se às penas restritivas de direito os mesmos prazos previstos para as privativas de liberdade."],"ti":7,"ch":""},{"n":"110","t":"Prescrição após condenação definitiva","k":"pena aplicada","s":"Depois da condenação definitiva, a prescrição é calculada pela pena que o juiz efetivamente aplicou, usando a tabela do artigo anterior. Se o condenado é reincidente, os prazos aumentam de um terço.","e":"Um réu reincidente condenado definitivamente que não é encontrado para cumprir a pena terá o prazo da tabela do artigo anterior, calculado sobre a pena aplicada, aumentado de um terço.","d":"O § 1º proíbe que a prescrição pela pena aplicada tenha como termo inicial data anterior à denúncia ou queixa. O aumento de um terço pela reincidência vale para a prescrição depois do trânsito em julgado.","pena":"","rub":"Prescrição depois de transitar em julgado sentença final condenatória","caput":"A prescrição depois de transitar em julgado a sentença condenatória regula-se pela pena aplicada e verifica-se nos prazos fixados no artigo anterior, os quais se aumentam de um terço, se o condenado é reincidente.","txt":["Art. 110 - A prescrição depois de transitar em julgado a sentença condenatória regula-se pela pena aplicada e verifica-se nos prazos fixados no artigo anterior, os quais se aumentam de um terço, se o condenado é reincidente.","§ 1º A prescrição, depois da sentença condenatória com trânsito em julgado para a acusação ou depois de improvido seu recurso, regula-se pela pena aplicada, não podendo, em nenhuma hipótese, ter por termo inicial data anterior à da denúncia ou queixa.","§ 2º (Revogado)."],"ti":7,"ch":""},{"n":"111","t":"Início da prescrição antes da sentença","k":"começa a correr","s":"Define quando a prescrição começa a contar antes da sentença definitiva: do dia da consumação; na tentativa, do dia em que parou a atividade criminosa; nos crimes permanentes, de quando cessa a permanência; na bigamia e na falsificação de registro civil, de quando o fato se torna conhecido.","e":"Num sequestro que dura vários dias, a prescrição só começa a correr quando a vítima é libertada.","d":"Nos crimes contra a dignidade sexual ou que envolvam violência contra criança e adolescente, a prescrição só começa quando a vítima completa 18 anos, salvo se a ação penal já tiver sido proposta antes.","pena":"","rub":"Termo inicial da prescrição antes de transitar em julgado a sentença final","caput":"A prescrição, antes de transitar em julgado a sentença final, começa a correr:","txt":["Art. 111 - A prescrição, antes de transitar em julgado a sentença final, começa a correr:","I - do dia em que o crime se consumou;","II - no caso de tentativa, do dia em que cessou a atividade criminosa;","III - nos crimes permanentes, do dia em que cessou a permanência;","IV - nos de bigamia e nos de falsificação ou alteração de assentamento do registro civil, da data em que o fato se tornou conhecido.","V - nos crimes contra a dignidade sexual ou que envolvam violência contra a criança e o adolescente, previstos neste Código ou em legislação especial, da data em que a vítima completar 18 (dezoito) anos, salvo se a esse tempo já houver sido proposta a ação penal."],"ti":7,"ch":""},{"n":"112","t":"Início da prescrição após condenação","k":"começa a correr","s":"Depois da condenação, a prescrição começa a correr do dia em que a sentença transita em julgado para a acusação, ou da decisão que revoga o sursis ou o livramento condicional. Também começa do dia em que a execução da pena é interrompida.","e":"Se o condenado foge da prisão, a prescrição volta a correr a partir do dia da fuga.","d":"O termo inicial é o trânsito em julgado para a acusação, e não para as duas partes.","pena":"","rub":"Termo inicial da prescrição após a sentença condenatória irrecorrível","caput":"No caso do art. 110 deste Código, a prescrição começa a correr:","txt":["Art. 112 - No caso do art. 110 deste Código, a prescrição começa a correr:","I - do dia em que transita em julgado a sentença condenatória, para a acusação, ou a que revoga a suspensão condicional da pena ou o livramento condicional;","II - do dia em que se interrompe a execução, salvo quando o tempo da interrupção deva computar-se na pena."],"ti":7,"ch":""},{"n":"113","t":"Prescrição: fuga ou revogação do livramento","k":"tempo que resta","s":"Se o condenado foge ou tem o livramento condicional revogado, a prescrição passa a ser calculada pelo tempo de pena que ainda falta cumprir, e não pela pena total.","e":"Um condenado que foge depois de cumprir boa parte da pena tem a prescrição calculada apenas sobre o tempo que ainda faltava cumprir.","d":"Conta-se o restante da pena, não a pena inteira aplicada na sentença.","pena":"","rub":"Prescrição no caso de evasão do condenado ou de revogação do livramento condicional","caput":"No caso de evadir-se o condenado ou de revogar-se o livramento condicional, a prescrição é regulada pelo tempo que resta da pena.","txt":["Art. 113 - No caso de evadir-se o condenado ou de revogar-se o livramento condicional, a prescrição é regulada pelo tempo que resta da pena."],"ti":7,"ch":""},{"n":"114","t":"Prescrição da multa","k":"prescrição da multa","s":"A pena de multa prescreve em 2 anos quando é a única pena prevista ou aplicada. Quando vem junto com a prisão ou como alternativa a ela, prescreve no mesmo prazo da pena privativa de liberdade.","e":"Se o réu é condenado apenas a pagar multa e o Estado não a cobra em 2 anos, ela prescreve.","d":"O prazo de 2 anos vale só quando a multa é a única pena; se for alternativa ou cumulativa, segue o prazo da prisão.","pena":"","rub":"Prescrição da multa","caput":"A prescrição da pena de multa ocorrerá:","txt":["Art. 114 - A prescrição da pena de multa ocorrerá:","I - em 2 (dois) anos, quando a multa for a única cominada ou aplicada;","II - no mesmo prazo estabelecido para prescrição da pena privativa de liberdade, quando a multa for alternativa ou cumulativamente cominada ou cumulativamente aplicada."],"ti":7,"ch":""},{"n":"115","t":"Redução dos prazos de prescrição","k":"reduzidos de metade","s":"Os prazos de prescrição caem pela metade se o autor tinha menos de 21 anos na data do crime ou mais de 70 anos na data da sentença. A redução não vale se o crime envolver violência sexual contra a mulher.","e":"Um jovem com menos de 21 anos que comete um furto terá o prazo de prescrição reduzido pela metade.","d":"Atenção aos momentos: menor de 21 é na data do crime; maior de 70 é na data da sentença. E há exceção para crime que envolva violência sexual contra a mulher.","pena":"","rub":"Redução dos prazos de prescrição","caput":"São reduzidos de metade os prazos de prescrição quando o criminoso era, ao tempo do crime, menor de 21 (vinte e um) anos ou, na data da sentença, maior de 70 (setenta) anos, salvo se o crime envolver violência sexual contra a mulher.","txt":["Art. 115. São reduzidos de metade os prazos de prescrição quando o criminoso era, ao tempo do crime, menor de 21 (vinte e um) anos ou, na data da sentença, maior de 70 (setenta) anos, salvo se o crime envolver violência sexual contra a mulher."],"ti":7,"ch":""},{"n":"116","t":"Causas impeditivas da prescrição","k":"não corre","s":"Lista situações em que a prescrição fica parada antes da sentença definitiva: enquanto se resolve em outro processo questão de que dependa a existência do crime; enquanto o agente cumpre pena no exterior; durante embargos de declaração ou recursos inadmissíveis aos tribunais superiores; e enquanto o acordo de não persecução penal não for cumprido ou rescindido.","e":"Enquanto o investigado cumpre o acordo de não persecução penal, pagando prestações à vítima, o prazo de prescrição fica suspenso.","d":"Impedir ou suspender é diferente de interromper: aqui o prazo para e depois continua de onde parou, sem zerar. Após a condenação definitiva, a prescrição não corre enquanto o condenado está preso por outro motivo.","pena":"","rub":"Causas impeditivas da prescrição","caput":"Antes de passar em julgado a sentença final, a prescrição não corre:","txt":["Art. 116 - Antes de passar em julgado a sentença final, a prescrição não corre:","I - enquanto não resolvida, em outro processo, questão de que dependa o reconhecimento da existência do crime;","II - enquanto o agente cumpre pena no exterior;","III - na pendência de embargos de declaração ou de recursos aos Tribunais Superiores, quando inadmissíveis; e","IV - enquanto não cumprido ou não rescindido o acordo de não persecução penal.","Parágrafo único - Depois de passada em julgado a sentença condenatória, a prescrição não corre durante o tempo em que o condenado está preso por outro motivo."],"ti":7,"ch":""},{"n":"117","t":"Causas interruptivas da prescrição","k":"interrompe-se","s":"A prescrição é interrompida pelo recebimento da denúncia ou queixa, pela pronúncia, pela decisão que confirma a pronúncia, pela publicação de sentença ou acórdão condenatórios recorríveis, pelo início ou continuação do cumprimento da pena e pela reincidência. Interrompida, a contagem recomeça do zero.","e":"Quando o juiz recebe a denúncia, o prazo de prescrição que já vinha correndo é zerado e começa a contar de novo.","d":"É o recebimento da denúncia que interrompe, não o oferecimento. Os incisos V e VI (cumprimento da pena e reincidência) não se estendem aos demais autores do crime.","pena":"","rub":"Causas interruptivas da prescrição","caput":"O curso da prescrição interrompe-se:","txt":["Art. 117 - O curso da prescrição interrompe-se:","I - pelo recebimento da denúncia ou da queixa;","II - pela pronúncia;","III - pela decisão confirmatória da pronúncia;","IV - pela publicação da sentença ou acórdão condenatórios recorríveis;.","V - pelo início ou continuação do cumprimento da pena;","VI - pela reincidência.","§ 1º - Excetuados os casos dos incisos V e VI deste artigo, a interrupção da prescrição produz efeitos relativamente a todos os autores do crime. Nos crimes conexos, que sejam objeto do mesmo processo, estende-se aos demais a interrupção relativa a qualquer deles.","§ 2º - Interrompida a prescrição, salvo a hipótese do inciso V deste artigo, todo o prazo começa a correr, novamente, do dia da interrupção."],"ti":7,"ch":""},{"n":"118","t":"Prescrição das penas mais leves","k":"penas mais leves","s":"Quando um crime tem penas de gravidade diferente aplicadas juntas, a mais leve prescreve junto com a mais grave.","e":"Se alguém é condenado a prisão e multa, a multa prescreve no mesmo prazo da prisão.","d":"A pena mais leve acompanha a mais grave; não se calcula prazo separado para ela.","pena":"","rub":"","caput":"As penas mais leves prescrevem com as mais graves.","txt":["Art. 118 - As penas mais leves prescrevem com as mais graves."],"ti":7,"ch":""},{"n":"119","t":"Prescrição no concurso de crimes","k":"isoladamente","s":"Quando a pessoa comete vários crimes, a extinção da punibilidade, inclusive a prescrição, é analisada para a pena de cada crime separadamente, e não pela soma das penas.","e":"Quem comete um furto e uma lesão corporal tem a prescrição de cada crime calculada separadamente, pela pena de cada um.","d":"Não se soma a pena total nem se usa o aumento do crime continuado ou do concurso formal para calcular a prescrição: cada crime é visto isoladamente.","pena":"","rub":"","caput":"No caso de concurso de crimes, a extinção da punibilidade incidirá sobre a pena de cada um, isoladamente.","txt":["Art. 119 - No caso de concurso de crimes, a extinção da punibilidade incidirá sobre a pena de cada um, isoladamente."],"ti":7,"ch":""},{"n":"120","t":"Perdão judicial","k":"perdão judicial","s":"Quando o juiz concede perdão judicial, ou seja, deixa de aplicar a pena nos casos que a lei permite, essa sentença não conta para gerar reincidência.","e":"Um pai que causa culposamente a morte do próprio filho em um acidente recebe perdão judicial e, se cometer outro crime depois, não será considerado reincidente por isso.","d":"O perdão judicial não depende da vontade da vítima (diferente do perdão do ofendido) e só cabe nos casos previstos em lei.","pena":"","rub":"Perdão judicial","caput":"A sentença que conceder perdão judicial não será considerada para efeitos de reincidência.","txt":["Art. 120 - A sentença que conceder perdão judicial não será considerada para efeitos de reincidência."],"ti":7,"ch":""},{"n":"121","t":"Homicídio","k":"matar","s":"Proíbe matar alguém. O homicídio simples tem pena de reclusão, de 6 a 20 anos; o qualificado, de 12 a 30 anos; e o culposo (sem intenção, por descuido), de detenção, de 1 a 3 anos.","e":"Durante uma briga de trânsito, um motorista atira e mata o outro.","d":"O homicídio cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, nas condições do § 2º-D, tem pena de 20 a 40 anos. No homicídio culposo, o juiz pode deixar de aplicar a pena se as consequências atingirem o próprio agente de forma muito grave.","pena":"Reclusão, de 6 a 20 anos.","rub":"Homicídio simples","caput":"Matar alguem:","txt":["Art. 121. Matar alguem:","Pena - reclusão, de seis a vinte anos.","Caso de diminuição de pena","§ 1º Se o agente comete o crime impelido por motivo de relevante valor social ou moral, ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.","Homicídio qualificado","§ 2º Se o homicídio é cometido:","I - mediante paga ou promessa de recompensa, ou por outro motivo torpe;","II - por motivo futil;","III - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel, ou de que possa resultar perigo comum;","IV - à traição, de emboscada, ou mediante dissimulação ou outro recurso que dificulte ou torne impossivel a defesa do ofendido;","V - para assegurar a execução, a ocultação, a impunidade ou vantagem de outro crime:","Pena - reclusão, de doze a trinta anos.","VII - contra:","a) autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal, integrantes do sistema prisional e da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até o terceiro grau, em razão dessa condição;","b) membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição;","VIII - com emprego de arma de fogo de uso restrito ou proibido:","Homicídio contra menor de 14 (quatorze) anos","IX - contra menor de 14 (quatorze) anos:","X - nas dependências de instituição de ensino:","Pena - reclusão, de doze a trinta anos.","§ 2º-B. A pena do homicídio contra menor de 14 (quatorze) anos é aumentada de:","I - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que implique o aumento de sua vulnerabilidade;","II - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela.","III - 2/3 (dois terços) se o crime for praticado em instituição de educação básica pública ou privada.","§ 2º-C. A pena do homicídio cometido nas dependências de instituição de ensino é aumentada de:","I - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental;","II - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tem autoridade sobre ela ou, ainda, se é professor ou funcionário da instituição de ensino.","§ 2º-D. Se o homicídio doloso é cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.","Pena - reclusão, de 20 (vinte) a 40 (quarenta anos).","Homicídio culposo","§ 3º Se o homicídio é culposo:","Pena - detenção, de um a três anos.","Aumento de pena","§ 4º No homicídio culposo, a pena é aumentada de 1/3 (um terço), se o crime resulta de inobservância de regra técnica de profissão, arte ou ofício, ou se o agente deixa de prestar imediato socorro à vítima, não procura diminuir as conseqüências do seu ato, ou foge para evitar prisão em flagrante. Sendo doloso o homicídio, a pena é aumentada de 1/3 (um terço) se o crime é praticado contra pessoa menor de 14 (quatorze) ou maior de 60 (sessenta) anos.","§ 5º - Na hipótese de homicídio culposo, o juiz poderá deixar de aplicar a pena, se as conseqüências da infração atingirem o próprio agente de forma tão grave que a sanção penal se torne desnecessária.","§ 6º A pena é aumentada de 1/3 (um terço) até a metade se o crime for praticado por milícia privada, sob o pretexto de prestação de serviço de segurança, ou por grupo de extermínio."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"121-A","t":"Feminicídio","k":"matar mulher","s":"Pune quem mata mulher por razões da condição do sexo feminino, com reclusão, de 20 a 40 anos. Isso ocorre quando o crime envolve violência doméstica e familiar ou menosprezo ou discriminação à condição de mulher.","e":"Um homem mata a ex-companheira por não aceitar o fim do relacionamento.","d":"Feminicídio hoje é crime autônomo, não mais uma qualificadora do homicídio. As razões da condição do sexo feminino se comunicam ao coautor ou partícipe.","pena":"Reclusão, de 20 a 40 anos.","rub":"Feminicídio","caput":"Matar mulher por razões da condição do sexo feminino:","txt":["Art. 121-A. Matar mulher por razões da condição do sexo feminino:","Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.","§ 1º Considera-se que há razões da condição do sexo feminino quando o crime envolve:","I - violência doméstica e familiar;","II - menosprezo ou discriminação à condição de mulher.","§ 2º A pena do feminicídio é aumentada de 1/3 (um terço) até a metade se o crime é praticado:","I - durante a gestação, nos 3 (três) meses posteriores ao parto ou se a vítima é a mãe ou a responsável por criança, adolescente ou pessoa com deficiência de qualquer idade;","II - contra pessoa menor de 14 (catorze) anos, maior de 60 (sessenta) anos, com deficiência ou portadora de doenças degenerativas que acarretem condição limitante ou de vulnerabilidade física ou mental;","III - na presença física ou virtual de descendente ou de ascendente da vítima;","IV - em descumprimento das medidas protetivas de urgência previstas nos incisos I, II e III do caput do art. 22 da Lei nº 11.340, de 7 de agosto de 2006 (Lei Maria da Penha);","V - nas circunstâncias previstas nos incisos III, IV e VIII do § 2º do art. 121 deste Código.","Coautoria","§ 3º Comunicam-se ao coautor ou partícipe as circunstâncias pessoais elementares do crime previstas no § 1º deste artigo."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"121-B","t":"Vicaricídio","k":"matar","s":"Pune quem mata filho, pai ou mãe, dependente, enteado ou pessoa sob guarda ou responsabilidade direta de uma mulher, com o fim de causar sofrimento, punição ou controle a ela, no contexto de violência doméstica e familiar. A pena é de reclusão, de 20 a 40 anos.","e":"Para se vingar da ex-mulher que pediu a separação, o homem mata o filho dela.","d":"A vítima morta não é a mulher, e sim alguém ligado a ela; o que define o crime é a finalidade de atingir a mulher. A pena aumenta de 1/3 até a metade se o crime é praticado na presença dela ou em descumprimento de medida protetiva.","pena":"Reclusão, de 20 a 40 anos.","rub":"Vicaricídio","caput":"Matar descendente, ascendente, dependente, enteado ou pessoa sob guarda ou responsabilidade direta da mulher, com o fim específico de causar-lhe sofrimento, punição ou controle, no contexto de violência doméstica e familiar.","txt":["Art. 121-B. Matar descendente, ascendente, dependente, enteado ou pessoa sob guarda ou responsabilidade direta da mulher, com o fim específico de causar-lhe sofrimento, punição ou controle, no contexto de violência doméstica e familiar.","Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.","Parágrafo único. A pena do vicaricídio é aumentada de 1/3 (um terço) até a metade se o crime for praticado:","I - na presença da mulher a quem se pretende causar sofrimento, punição ou controle;","II - contra criança ou adolescente ou pessoa idosa ou com deficiência;","III - em descumprimento de medida protetiva de urgência."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"122","t":"Induzimento ou auxílio a suicídio","k":"induzir, instigar ou auxiliar","s":"Pune quem induz (faz nascer a ideia), instiga (reforça a ideia) ou ajuda materialmente alguém a se suicidar ou a se automutilar. A pena é de reclusão, de 6 meses a 2 anos, e sobe se resultar lesão grave ou gravíssima ou morte.","e":"Um rapaz incentiva repetidamente, por mensagens, uma colega a se machucar.","d":"Se a vítima for menor de 14 anos ou sem discernimento e morrer, o agente responde por homicídio. A pena aumenta até o dobro se a conduta for feita pela internet, rede social ou transmitida em tempo real.","pena":"Reclusão, de 6 meses a 2 anos.","rub":"Induzimento, instigação ou auxílio a suicídio ou a automutilação","caput":"Induzir ou instigar alguém a suicidar-se ou a praticar automutilação ou prestar-lhe auxílio material para que o faça:","txt":["Art. 122. Induzir ou instigar alguém a suicidar-se ou a praticar automutilação ou prestar-lhe auxílio material para que o faça:","Pena - reclusão, de 6 (seis) meses a 2 (dois) anos.","§ 1º Se da automutilação ou da tentativa de suicídio resulta lesão corporal de natureza grave ou gravíssima, nos termos dos §§ 1º e 2º do art. 129 deste Código:","Pena - reclusão, de 1 (um) a 3 (três) anos.","§ 2º Se o suicídio se consuma ou se da automutilação resulta morte:","Pena - reclusão, de 2 (dois) a 6 (seis) anos.","§ 3º A pena é duplicada:","I - se o crime é praticado por motivo egoístico, torpe ou fútil;","II - se a vítima é menor ou tem diminuída, por qualquer causa, a capacidade de resistência.","§ 4º A pena é aumentada até o dobro se a conduta é realizada por meio da rede de computadores, de rede social ou transmitida em tempo real.","§ 5º Aplica-se a pena em dobro se o autor é líder, coordenador ou administrador de grupo, de comunidade ou de rede virtual, ou por estes é responsável.","§ 6º Se o crime de que trata o § 1º deste artigo resulta em lesão corporal de natureza gravíssima e é cometido contra menor de 14 (quatorze) anos ou contra quem, por enfermidade ou deficiência mental, não tem o necessário discernimento para a prática do ato, ou que, por qualquer outra causa, não pode oferecer resistência, responde o agente pelo crime descrito no § 2º do art. 129 deste Código.","§ 7º Se o crime de que trata o § 2º deste artigo é cometido contra menor de 14 (quatorze) anos ou contra quem não tem o necessário discernimento para a prática do ato, ou que, por qualquer outra causa, não pode oferecer resistência, responde o agente pelo crime de homicídio, nos termos do art. 121 deste Código."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"123","t":"Infanticídio","k":"matar o próprio filho","s":"Pune a mãe que mata o próprio filho durante o parto ou logo após, sob a influência do estado puerperal (alteração psíquica causada pelo parto). A pena é de detenção, de 2 a 6 anos.","e":"","d":"Sem a influência do estado puerperal, o crime é homicídio, não infanticídio. A pena é de detenção, bem menor que a do homicídio.","pena":"Detenção, de 2 a 6 anos.","rub":"Infanticídio","caput":"Matar, sob a influência do estado puerperal, o próprio filho, durante o parto ou logo após:","txt":["Art. 123 - Matar, sob a influência do estado puerperal, o próprio filho, durante o parto ou logo após:","Pena - detenção, de dois a seis anos."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"124","t":"Autoaborto ou aborto consentido","k":"provocar aborto em si","s":"Pune a gestante que provoca aborto em si mesma ou que permite que outra pessoa o provoque. A pena é de detenção, de 1 a 3 anos.","e":"Uma gestante toma por conta própria um medicamento abortivo comprado ilegalmente.","d":"A gestante que consente responde por este artigo, enquanto quem realiza o aborto com consentimento responde pelo art. 126, com pena maior.","pena":"Detenção, de 1 a 3 anos.","rub":"Aborto provocado pela gestante ou com seu consentimento","caput":"Provocar aborto em si mesma ou consentir que outrem lho provoque:","txt":["Art. 124 - Provocar aborto em si mesma ou consentir que outrem lho provoque:","Pena - detenção, de um a três anos."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"125","t":"Aborto sem consentimento","k":"provocar aborto","s":"Pune quem provoca aborto sem o consentimento da gestante. A pena é de reclusão, de 3 a 10 anos, a mais grave entre os crimes de aborto.","e":"Um homem coloca escondido na bebida da companheira grávida um remédio abortivo.","d":"A falta de consentimento torna a pena bem maior. Também se aplica esta pena se o consentimento foi obtido por fraude, grave ameaça ou violência, ou nas demais hipóteses do parágrafo único do art. 126, como gestante alienada ou débil mental.","pena":"Reclusão, de 3 a 10 anos.","rub":"Aborto provocado por terceiro","caput":"Provocar aborto, sem o consentimento da gestante:","txt":["Art. 125 - Provocar aborto, sem o consentimento da gestante:","Pena - reclusão, de três a dez anos."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"126","t":"Aborto com consentimento da gestante","k":"provocar aborto","s":"Pune quem provoca aborto em uma gestante que concordou com isso. A pena é de reclusão, de 1 a 4 anos.","e":"Uma pessoa sem autorização legal realiza um aborto clandestino em uma gestante que pediu o procedimento.","d":"Se a gestante não é maior de quatorze anos, é alienada ou débil mental, ou se o consentimento foi obtido por fraude, grave ameaça ou violência, aplica-se a pena do aborto sem consentimento (art. 125). A gestante que consente responde pelo art. 124, não por este.","pena":"Reclusão, de 1 a 4 anos.","rub":"","caput":"Provocar aborto com o consentimento da gestante:","txt":["Art. 126 - Provocar aborto com o consentimento da gestante:","Pena - reclusão, de um a quatro anos.","Parágrafo único. Aplica-se a pena do artigo anterior, se a gestante não é maior de quatorze anos, ou é alienada ou debil mental, ou se o consentimento é obtido mediante fraude, grave ameaça ou violência"],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"127","t":"Aborto: forma qualificada","k":"lesão grave ou morte","s":"Nos crimes de aborto praticados por terceiro (arts. 125 e 126), a pena aumenta de um terço se a gestante sofre lesão corporal grave e é duplicada se ela morre, por causa do aborto ou dos meios usados.","e":"Num aborto clandestino feito sem condições de higiene, a gestante sofre uma infecção grave e morre, e a pena de quem fez o procedimento é duplicada.","d":"O aumento vale só para os dois artigos anteriores (aborto feito por terceiro), não para a gestante que pratica o autoaborto. Lesão grave aumenta de um terço; morte duplica a pena.","pena":"","rub":"Forma qualificada","caput":"As penas cominadas nos dois artigos anteriores são aumentadas de um terço, se, em conseqüência do aborto ou dos meios empregados para provocá-lo, a gestante sofre lesão corporal de natureza grave; e são duplicadas, se, por qualquer dessas causas, lhe sobrevém a morte.","txt":["Art. 127 - As penas cominadas nos dois artigos anteriores são aumentadas de um terço, se, em conseqüência do aborto ou dos meios empregados para provocá-lo, a gestante sofre lesão corporal de natureza grave; e são duplicadas, se, por qualquer dessas causas, lhe sobrevém a morte."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"128","t":"Aborto legal","k":"não se pune","s":"O aborto feito por médico não é punido em dois casos: quando não há outro meio de salvar a vida da gestante (aborto necessário) e quando a gravidez resulta de estupro e há consentimento da gestante ou, se incapaz, do seu representante legal.","e":"Durante uma complicação grave na gravidez, o médico interrompe a gestação porque é a única forma de salvar a vida da paciente.","d":"O texto exige que o aborto seja praticado por médico. No aborto necessário o texto não exige consentimento; no caso de estupro, o consentimento é obrigatório.","pena":"","rub":"","caput":"Não se pune o aborto praticado por médico:","txt":["Art. 128 - Não se pune o aborto praticado por médico:","Aborto necessário","I - se não há outro meio de salvar a vida da gestante;","Aborto no caso de gravidez resultante de estupro","II - se a gravidez resulta de estupro e o aborto é precedido de consentimento da gestante ou, quando incapaz, de seu representante legal."],"ti":8,"ch":"Dos crimes contra a vida"},{"n":"129","t":"Lesão corporal","k":"ofender a integridade corporal","s":"Pune quem machuca o corpo ou prejudica a saúde de outra pessoa. A lesão leve tem pena de detenção, de 3 meses a 1 ano; a pena cresce conforme o resultado: grave, gravíssima ou seguida de morte.","e":"Durante uma discussão no bar, um homem dá um soco no outro e quebra o seu nariz.","d":"Incapacidade para as ocupações habituais por mais de trinta dias é lesão grave (§ 1º), mas incapacidade permanente para o trabalho é do § 2º, com pena de 2 a 8 anos. Contra a mulher por razões da condição do sexo feminino, a pena é de reclusão, de 2 a 5 anos.","pena":"Detenção, de 3 meses a 1 ano.","rub":"Lesão corporal","caput":"Ofender a integridade corporal ou a saúde de outrem:","txt":["Art. 129. Ofender a integridade corporal ou a saúde de outrem:","Pena - detenção, de três meses a um ano.","Lesão corporal de natureza grave","§ 1º Se resulta:","I - Incapacidade para as ocupações habituais, por mais de trinta dias;","II - perigo de vida;","III - debilidade permanente de membro, sentido ou função;","IV - aceleração de parto:","Pena - reclusão, de um a cinco anos.","§ 2º Se resulta:","I - Incapacidade permanente para o trabalho;","II - enfermidade incuravel;","III - perda ou inutilização do membro, sentido ou função;","IV - deformidade permanente;","V - aborto:","Pena - reclusão, de dois a oito anos.","Lesão corporal seguida de morte","§ 3º Se resulta morte e as circunstâncias evidenciam que o agente não quís o resultado, nem assumiu o risco de produzí-lo:","Pena - reclusão, de quatro a doze anos.","§ 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil:","Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos.","Diminuição de pena","§ 4º Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.","Substituição da pena","§ 5º O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa, de duzentos mil réis a dois contos de réis:","I - se ocorre qualquer das hipóteses do parágrafo anterior;","II - se as lesões são recíprocas.","Lesão corporal culposa","§ 6º Se a lesão é culposa:","Pena - detenção, de dois meses a um ano.","Aumento de pena","§ 7º Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4º e 6º do art. 121 deste Código.","§ 8º - Aplica-se à lesão culposa o disposto no § 5º do art. 121","§ 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.","Violência Doméstica","§ 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos.","§ 10. Nos casos previstos nos §§ 1º a 3º deste artigo, se as circunstâncias são as indicadas no § 9º deste artigo, aumenta-se a pena em 1/3 (um terço).","§ 11. Na hipótese do § 9º deste artigo, a pena será aumentada de um terço se o crime for cometido contra pessoa portadora de deficiência.","§ 12. Aumenta-se a pena de:","I - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:","a) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa condição;","b) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição; ou","c) nas dependências de instituição de ensino;","II - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição de ensino e:","a) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental; ou","b) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda, for professor ou funcionário da instituição de ensino.","§ 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos."],"ti":8,"ch":"Das lesões corporais"},{"n":"130","t":"Perigo de contágio venéreo","k":"expor a contágio","s":"Pune quem, sabendo ou devendo saber que tem doença sexualmente transmissível, expõe outra pessoa ao risco de contágio por relação sexual ou ato libidinoso. A pena é de detenção, de 3 meses a 1 ano, ou multa.","e":"Uma pessoa que sabe estar com sífilis mantém relação sem proteção e sem avisar o parceiro.","d":"Basta expor ao perigo, não precisa transmitir. Se a intenção é transmitir a doença, a pena sobe para reclusão, de 1 a 4 anos, e multa; e a ação depende de representação da vítima.","pena":"Detenção, de 3 meses a 1 ano, ou multa.","rub":"Perigo de contágio venéreo","caput":"Expor alguém, por meio de relações sexuais ou qualquer ato libidinoso, a contágio de moléstia venérea, de que sabe ou deve saber que está contaminado:","txt":["Art. 130 - Expor alguém, por meio de relações sexuais ou qualquer ato libidinoso, a contágio de moléstia venérea, de que sabe ou deve saber que está contaminado:","Pena - detenção, de três meses a um ano, ou multa.","§ 1º - Se é intenção do agente transmitir a moléstia:","Pena - reclusão, de um a quatro anos, e multa.","§ 2º - Somente se procede mediante representação."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"131","t":"Perigo de contágio de moléstia grave","k":"praticar ato de contágio","s":"Pune quem, sabendo que tem uma doença grave, pratica um ato capaz de transmiti-la a outra pessoa com essa intenção. A pena é de reclusão, de 1 a 4 anos, e multa.","e":"Uma pessoa infectada com uma doença grave cospe de propósito na comida de um colega para contaminá-lo.","d":"Exige a intenção de transmitir e não depende do contágio de fato. Diferente do art. 130, aqui a doença é grave (não só venérea) e o meio pode ser qualquer ato.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Perigo de contágio de moléstia grave","caput":"Praticar, com o fim de transmitir a outrem moléstia grave de que está contaminado, ato capaz de produzir o contágio:","txt":["Art. 131 - Praticar, com o fim de transmitir a outrem moléstia grave de que está contaminado, ato capaz de produzir o contágio:","Pena - reclusão, de um a quatro anos, e multa."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"132","t":"Perigo para a vida ou saúde","k":"expor a perigo","s":"Pune quem expõe a vida ou a saúde de outra pessoa a um perigo direto e iminente (concreto e imediato). A pena é de detenção, de 3 meses a 1 ano, se o fato não for crime mais grave.","e":"Um patrão manda um funcionário trabalhar no alto de um prédio sem cinto de segurança.","d":"É um crime subsidiário: só se aplica se não houver crime mais grave. A pena aumenta de um sexto a um terço no transporte irregular de pessoas para prestação de serviços.","pena":"Detenção, de 3 meses a 1 ano, se o fato não constitui crime mais grave.","rub":"Perigo para a vida ou saúde de outrem","caput":"Expor a vida ou a saúde de outrem a perigo direto e iminente:","txt":["Art. 132 - Expor a vida ou a saúde de outrem a perigo direto e iminente:","Pena - detenção, de três meses a um ano, se o fato não constitui crime mais grave.","Parágrafo único. A pena é aumentada de um sexto a um terço se a exposição da vida ou da saúde de outrem a perigo decorre do transporte de pessoas para a prestação de serviços em estabelecimentos de qualquer natureza, em desacordo com as normas legais."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"133","t":"Abandono de incapaz","k":"abandonar","s":"Pune quem abandona pessoa que está sob seu cuidado, guarda, vigilância ou autoridade e que não consegue se defender dos riscos do abandono. A pena é de reclusão, de 2 a 5 anos.","e":"Uma cuidadora deixa sozinho em casa, por dias, um idoso acamado que dependia dela.","d":"Se resulta lesão grave, a pena é de 3 a 7 anos; se resulta morte, de 8 a 14 anos. Aumenta de um terço em lugar ermo, se o autor é parente próximo, tutor ou curador, ou se a vítima tem mais de 60 anos.","pena":"Reclusão, de 2 a 5 anos.","rub":"Abandono de incapaz","caput":"Abandonar pessoa que está sob seu cuidado, guarda, vigilância ou autoridade, e, por qualquer motivo, incapaz de defender-se dos riscos resultantes do abandono:","txt":["Art. 133 - Abandonar pessoa que está sob seu cuidado, guarda, vigilância ou autoridade, e, por qualquer motivo, incapaz de defender-se dos riscos resultantes do abandono:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos.","§ 1º - Se do abandono resulta lesão corporal de natureza grave:","Pena - reclusão, de 3 (três) a 7 (sete) anos.","§ 2º - Se resulta a morte:","Pena - reclusão, de 8 (oito) a 14 (quatorze) anos.","Aumento de pena","§ 3º - As penas cominadas neste artigo aumentam-se de um terço:","I - se o abandono ocorre em lugar ermo;","II - se o agente é ascendente ou descendente, cônjuge, irmão, tutor ou curador da vítima.","III - se a vítima é maior de 60 (sessenta) anos"],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"134","t":"Exposição ou abandono de recém-nascido","k":"expor ou abandonar","s":"Pune quem expõe ou abandona recém-nascido para esconder desonra própria. A pena é de detenção, de 6 meses a 2 anos.","e":"","d":"A finalidade de ocultar desonra própria é o que diferencia este crime do abandono de incapaz, que tem pena maior. Se resulta morte, a pena é de detenção, de 2 a 6 anos.","pena":"Detenção, de 6 meses a 2 anos.","rub":"Exposição ou abandono de recém-nascido","caput":"Expor ou abandonar recém-nascido, para ocultar desonra própria:","txt":["Art. 134 - Expor ou abandonar recém-nascido, para ocultar desonra própria:","Pena - detenção, de seis meses a dois anos.","§ 1º - Se do fato resulta lesão corporal de natureza grave:","Pena - detenção, de um a três anos.","§ 2º - Se resulta a morte:","Pena - detenção, de dois a seis anos."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"135","t":"Omissão de socorro","k":"deixar de prestar assistência","s":"Pune quem deixa de ajudar, quando pode fazê-lo sem risco pessoal, criança abandonada ou perdida, pessoa inválida ou ferida, desamparada ou em grave perigo, ou quem nem sequer chama a autoridade pública. A pena é de detenção, de 1 a 6 meses, ou multa.","e":"Um motorista vê um ciclista ferido caído na estrada e segue viagem sem ajudar nem ligar para o socorro.","d":"Se houver risco pessoal, não há o dever de ajudar diretamente, mas continua o dever de pedir socorro à autoridade. A pena aumenta de metade se resulta lesão grave e é triplicada se resulta morte.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Omissão de socorro","caput":"Deixar de prestar assistência, quando possível fazê-lo sem risco pessoal, à criança abandonada ou extraviada, ou à pessoa inválida ou ferida, ao desamparo ou em grave e iminente perigo; ou não pedir, nesses casos, o socorro da autoridade pública:","txt":["Art. 135 - Deixar de prestar assistência, quando possível fazê-lo sem risco pessoal, à criança abandonada ou extraviada, ou à pessoa inválida ou ferida, ao desamparo ou em grave e iminente perigo; ou não pedir, nesses casos, o socorro da autoridade pública:","Pena - detenção, de um a seis meses, ou multa.","Parágrafo único - A pena é aumentada de metade, se da omissão resulta lesão corporal de natureza grave, e triplicada, se resulta a morte.","Condicionamento de atendimento médico-hospitalar emergencial."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"135-A","t":"Condicionamento de atendimento emergencial","k":"exigir garantia","s":"Pune quem exige cheque-caução, nota promissória ou qualquer garantia, ou o preenchimento prévio de formulários, como condição para atender uma emergência médica. A pena é de detenção, de 3 meses a 1 ano, e multa.","e":"Um hospital particular só aceita atender um paciente infartando se a família deixar um cheque-caução.","d":"O crime vale para atendimento emergencial e inclui até a exigência de formulários administrativos. A pena aumenta até o dobro se resulta lesão grave e até o triplo se resulta morte.","pena":"Detenção, de 3 meses a 1 ano, e multa..","rub":"","caput":"Exigir cheque-caução, nota promissória ou qualquer garantia, bem como o preenchimento prévio de formulários administrativos, como condição para o atendimento médico-hospitalar emergencial:.","txt":["Art. 135-A. Exigir cheque-caução, nota promissória ou qualquer garantia, bem como o preenchimento prévio de formulários administrativos, como condição para o atendimento médico-hospitalar emergencial:.","Pena - detenção, de 3 (três) meses a 1 (um) ano, e multa.","Parágrafo único. A pena é aumentada até o dobro se da negativa de atendimento resulta lesão corporal de natureza grave, e até o triplo se resulta a morte."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"136","t":"Maus-tratos","k":"expor a perigo","s":"Pune quem expõe a perigo a vida ou a saúde de pessoa sob sua autoridade, guarda ou vigilância, para fins de educação, ensino, tratamento ou custódia, privando-a de comida ou cuidados, impondo trabalho excessivo ou abusando de meios de correção. A pena é de reclusão, de 2 a 5 anos.","e":"Uma babá deixa a criança sem comer o dia inteiro como castigo por mau comportamento.","d":"Exige a relação de autoridade com finalidade de educação, ensino, tratamento ou custódia. A pena aumenta de um terço se a vítima é menor de 14 anos.","pena":"Reclusão, de 2 a 5 anos.","rub":"Maus-tratos","caput":"Expor a perigo a vida ou a saúde de pessoa sob sua autoridade, guarda ou vigilância, para fim de educação, ensino, tratamento ou custódia, quer privando-a de alimentação ou cuidados indispensáveis, quer sujeitando-a a trabalho excessivo ou inadequado, quer abusando de meios de correção ou disciplina:","txt":["Art. 136 - Expor a perigo a vida ou a saúde de pessoa sob sua autoridade, guarda ou vigilância, para fim de educação, ensino, tratamento ou custódia, quer privando-a de alimentação ou cuidados indispensáveis, quer sujeitando-a a trabalho excessivo ou inadequado, quer abusando de meios de correção ou disciplina:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos.","§ 1º - Se do fato resulta lesão corporal de natureza grave:","Pena - reclusão, de 3 (três) a 7 (sete) anos.","§ 2º - Se resulta a morte:","Pena - reclusão, de 8 (oito) a 14 (quatorze) anos.","§ 3º - Aumenta-se a pena de um terço, se o crime é praticado contra pessoa menor de 14 (catorze) anos."],"ti":8,"ch":"Da periclitação da vida e da saúde"},{"n":"137","t":"Rixa","k":"participar de rixa","s":"Pune quem participa de uma briga confusa entre várias pessoas, exceto quem entra só para separar. A pena é de detenção, de 15 dias a 2 meses, ou multa.","e":"Várias torcidas rivais trocam socos e pontapés na saída do estádio, sem que se saiba quem bate em quem.","d":"Se da rixa resulta morte ou lesão grave, todos os participantes recebem detenção, de 6 meses a 2 anos, apenas por terem participado. Quem entra para separar os brigões não comete o crime.","pena":"Detenção, de 15 dias a 2 meses, ou multa.","rub":"Rixa","caput":"Participar de rixa, salvo para separar os contendores:","txt":["Art. 137 - Participar de rixa, salvo para separar os contendores:","Pena - detenção, de quinze dias a dois meses, ou multa.","Parágrafo único - Se ocorre morte ou lesão corporal de natureza grave, aplica-se, pelo fato da participação na rixa, a pena de detenção, de seis meses a dois anos."],"ti":8,"ch":"Da rixa"},{"n":"138","t":"Calúnia","k":"caluniar","s":"Pune quem atribui falsamente a alguém um fato definido como crime. A pena é de detenção, de 6 meses a 2 anos, e multa.","e":"Um vizinho espalha no grupo do condomínio que o síndico desviou dinheiro do caixa, sabendo que isso é mentira.","d":"Calúnia é imputar falsamente um crime; se o fato é só ofensivo à reputação, é difamação. É punível até a calúnia contra os mortos, e quem espalha sabendo ser falsa responde com a mesma pena.","pena":"Detenção, de 6 meses a 2 anos, e multa.","rub":"Calúnia","caput":"Caluniar alguém, imputando-lhe falsamente fato definido como crime:","txt":["Art. 138 - Caluniar alguém, imputando-lhe falsamente fato definido como crime:","Pena - detenção, de seis meses a dois anos, e multa.","§ 1º - Na mesma pena incorre quem, sabendo falsa a imputação, a propala ou divulga.","§ 2º - É punível a calúnia contra os mortos.","Exceção da verdade","§ 3º - Admite-se a prova da verdade, salvo:","I - se, constituindo o fato imputado crime de ação privada, o ofendido não foi condenado por sentença irrecorrível;","II - se o fato é imputado a qualquer das pessoas indicadas no nº I do art. 141;","III - se do crime imputado, embora de ação pública, o ofendido foi absolvido por sentença irrecorrível."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"139","t":"Difamação","k":"difamar","s":"Pune quem atribui a alguém um fato ofensivo à sua reputação, ainda que não seja crime. A pena é de detenção, de 3 meses a 1 ano, e multa.","e":"Uma colega conta para todo o escritório que o gerente chega bêbado ao trabalho toda segunda-feira.","d":"Na difamação não importa se o fato é verdadeiro. A exceção da verdade (provar que é verdade) só é admitida se o ofendido for funcionário público e a ofensa for ligada às suas funções.","pena":"Detenção, de 3 meses a 1 ano, e multa.","rub":"Difamação","caput":"Difamar alguém, imputando-lhe fato ofensivo à sua reputação:","txt":["Art. 139 - Difamar alguém, imputando-lhe fato ofensivo à sua reputação:","Pena - detenção, de três meses a um ano, e multa.","Exceção da verdade","Parágrafo único - A exceção da verdade somente se admite se o ofendido é funcionário público e a ofensa é relativa ao exercício de suas funções."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"140","t":"Injúria","k":"injuriar","s":"Pune quem ofende a dignidade ou o decoro de alguém, xingando ou atribuindo qualidades negativas, sem contar um fato. A pena é de detenção, de 1 a 6 meses, ou multa.","e":"Durante uma discussão de trânsito, um motorista chama o outro de ladrão e vagabundo.","d":"Injúria não descreve fato, atinge a honra pessoal. Se usa elementos ligados a religião ou à condição de pessoa idosa ou com deficiência, a pena é de reclusão, de 1 a 3 anos, e multa; e o juiz pode deixar de aplicar a pena se houve provocação ou retorsão imediata.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Injúria","caput":"Injuriar alguém, ofendendo-lhe a dignidade ou o decoro:","txt":["Art. 140 - Injuriar alguém, ofendendo-lhe a dignidade ou o decoro:","Pena - detenção, de um a seis meses, ou multa.","§ 1º - O juiz pode deixar de aplicar a pena:","I - quando o ofendido, de forma reprovável, provocou diretamente a injúria;","II - no caso de retorsão imediata, que consista em outra injúria.","§ 2º - Se a injúria consiste em violência ou vias de fato, que, por sua natureza ou pelo meio empregado, se considerem aviltantes:","Pena - detenção, de três meses a um ano, e multa, além da pena correspondente à violência.","§ 3º Se a injúria consiste na utilização de elementos referentes a religião ou à condição de pessoa idosa ou com deficiência:","Pena - reclusão, de 1 (um) a 3 (três) anos, e multa."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"141","t":"Crimes contra a honra: aumentos","k":"aumentam-se","s":"As penas de calúnia, difamação e injúria aumentam de um terço se o crime for contra o Presidente da República ou chefe de governo estrangeiro, contra funcionário público por causa das funções, na frente de várias pessoas ou por meio que facilite a divulgação, ou contra criança, adolescente, pessoa maior de 60 anos ou com deficiência.","e":"Um homem ofende uma servidora do posto de saúde por causa do atendimento, na frente de toda a fila, e terá a pena aumentada.","d":"Se o crime é cometido ou divulgado em redes sociais, a pena é aplicada em triplo; se é mediante paga ou contra a mulher por razões da condição do sexo feminino, em dobro.","pena":"","rub":"Disposições comuns","caput":"As penas cominadas neste Capítulo aumentam-se de um terço, se qualquer dos crimes é cometido:","txt":["Art. 141 - As penas cominadas neste Capítulo aumentam-se de um terço, se qualquer dos crimes é cometido:","I - contra o Presidente da República, ou contra chefe de governo estrangeiro;","II - contra funcionário público, em razão de suas funções, ou contra os Presidentes do Senado Federal, da Câmara dos Deputados ou do Supremo Tribunal Federal;","III - na presença de várias pessoas, ou por meio que facilite a divulgação da calúnia, da difamação ou da injúria.","IV - contra criança, adolescente, pessoa maior de 60 (sessenta) anos ou pessoa com deficiência, exceto na hipótese prevista no § 3º do art. 140 deste Código.","§ 1º - Se o crime é cometido mediante paga ou promessa de recompensa, aplica-se a pena em dobro.","§ 2º Se o crime é cometido ou divulgado em quaisquer modalidades das redes sociais da rede mundial de computadores, aplica-se em triplo a pena.","§ 3º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código, aplica-se a pena em dobro."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"142","t":"Exclusão do crime","k":"não constituem","s":"Não são injúria nem difamação puníveis: a ofensa feita em juízo pela parte ou advogado na discussão da causa, a crítica literária, artística ou científica sem intenção clara de ofender, e o conceito desfavorável dado por funcionário público no cumprimento do dever.","e":"Um crítico de cinema escreve que um filme é fraco e mal dirigido, sem intenção de ofender o diretor.","d":"A exclusão não alcança a calúnia, só a injúria e a difamação. Nos casos dos incisos I e III, quem dá publicidade à ofensa responde por ela.","pena":"","rub":"Exclusão do crime","caput":"Não constituem injúria ou difamação punível:","txt":["Art. 142 - Não constituem injúria ou difamação punível:","I - a ofensa irrogada em juízo, na discussão da causa, pela parte ou por seu procurador;","II - a opinião desfavorável da crítica literária, artística ou científica, salvo quando inequívoca a intenção de injuriar ou difamar;","III - o conceito desfavorável emitido por funcionário público, em apreciação ou informação que preste no cumprimento de dever do ofício.","Parágrafo único - Nos casos dos ns. I e III, responde pela injúria ou pela difamação quem lhe dá publicidade."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"143","t":"Retratação","k":"retratar-se","s":"Quem é processado por calúnia ou difamação e, antes da sentença, volta atrás por completo no que disse fica isento de pena.","e":"Um blogueiro processado por difamação publica, antes da sentença, um texto desmentindo totalmente o que havia escrito.","d":"A retratação não vale para a injúria, só para calúnia e difamação. Se a ofensa foi feita por meios de comunicação, a retratação pode ser feita pelos mesmos meios, se o ofendido quiser.","pena":"","rub":"Retratação","caput":"O querelado que, antes da sentença, se retrata cabalmente da calúnia ou da difamação, fica isento de pena.","txt":["Art. 143 - O querelado que, antes da sentença, se retrata cabalmente da calúnia ou da difamação, fica isento de pena.","Parágrafo único. Nos casos em que o querelado tenha praticado a calúnia ou a difamação utilizando-se de meios de comunicação, a retratação dar-se-á, se assim desejar o ofendido, pelos mesmos meios em que se praticou a ofensa."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"144","t":"Pedido de explicações","k":"pedir explicações","s":"Se alguém faz referências ou insinuações que podem ser calúnia, difamação ou injúria, quem se sentir ofendido pode pedir explicações na Justiça. Quem se recusa a explicar, ou explica de forma insatisfatória para o juiz, responde pela ofensa.","e":"Um vereador insinua em discurso que um colega \"tem negócios estranhos\", e o colega pede em juízo que ele explique o que quis dizer.","d":"O pedido de explicações é opcional e serve para ofensas ambíguas, ditas por meio de alusões ou frases indiretas.","pena":"","rub":"","caput":"Se, de referências, alusões ou frases, se infere calúnia, difamação ou injúria, quem se julga ofendido pode pedir explicações em juízo. Aquele que se recusa a dá-las ou, a critério do juiz, não as dá satisfatórias, responde pela ofensa.","txt":["Art. 144 - Se, de referências, alusões ou frases, se infere calúnia, difamação ou injúria, quem se julga ofendido pode pedir explicações em juízo. Aquele que se recusa a dá-las ou, a critério do juiz, não as dá satisfatórias, responde pela ofensa."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"145","t":"Ação penal: crimes contra a honra","k":"queixa","s":"Nos crimes contra a honra, em regra, só se processa mediante queixa, ou seja, a própria vítima move a ação por meio de advogado. A exceção é a injúria real (com violência) da qual resulta lesão corporal.","e":"Quem é xingado por um vizinho precisa contratar advogado e apresentar queixa-crime; o promotor não age sozinho.","d":"Contra o Presidente da República ou chefe de governo estrangeiro, depende de requisição do Ministro da Justiça; contra funcionário público em razão das funções e na injúria do § 3º do art. 140, depende de representação do ofendido.","pena":"","rub":"","caput":"Nos crimes previstos neste Capítulo somente se procede mediante queixa, salvo quando, no caso do art. 140, § 2º, da violência resulta lesão corporal.","txt":["Art. 145 - Nos crimes previstos neste Capítulo somente se procede mediante queixa, salvo quando, no caso do art. 140, § 2º, da violência resulta lesão corporal.","Parágrafo único. Procede-se mediante requisição do Ministro da Justiça, no caso do inciso I do caput do art. 141 deste Código, e mediante representação do ofendido, no caso do inciso II do mesmo artigo, bem como no caso do § 3º do art. 140 deste Código."],"ti":8,"ch":"Dos crimes contra a honra"},{"n":"146","t":"Constrangimento ilegal","k":"constranger","s":"Pune quem obriga alguém, com violência, grave ameaça ou reduzindo sua capacidade de resistência, a não fazer o que a lei permite ou a fazer o que ela não manda. A pena é de detenção, de 3 meses a 1 ano, ou multa.","e":"Um homem impede, sob ameaça de agressão, que o vizinho estacione na própria vaga.","d":"As penas são aplicadas juntas e em dobro se mais de três pessoas se reúnem ou se há uso de armas. Não é crime a intervenção médica sem consentimento em iminente perigo de vida nem a coação para impedir suicídio.","pena":"Detenção, de 3 meses a 1 ano, ou multa.","rub":"Constrangimento ilegal","caput":"Constranger alguém, mediante violência ou grave ameaça, ou depois de lhe haver reduzido, por qualquer outro meio, a capacidade de resistência, a não fazer o que a lei permite, ou a fazer o que ela não manda:","txt":["Art. 146 - Constranger alguém, mediante violência ou grave ameaça, ou depois de lhe haver reduzido, por qualquer outro meio, a capacidade de resistência, a não fazer o que a lei permite, ou a fazer o que ela não manda:","Pena - detenção, de três meses a um ano, ou multa.","Aumento de pena","§ 1º - As penas aplicam-se cumulativamente e em dobro, quando, para a execução do crime, se reúnem mais de três pessoas, ou há emprego de armas.","§ 2º - Além das penas cominadas, aplicam-se as correspondentes à violência.","§ 3º - Não se compreendem na disposição deste artigo:","I - a intervenção médica ou cirúrgica, sem o consentimento do paciente ou de seu representante legal, se justificada por iminente perigo de vida;","II - a coação exercida para impedir suicídio."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"146-A","t":"Intimidação sistemática (bullying)","k":"intimidar sistematicamente","s":"Pune quem intimida outra pessoa de forma intencional e repetitiva, sem motivo evidente, sozinho ou em grupo, com violência física ou psicológica, humilhação ou discriminação. A pena é só de multa, se não houver crime mais grave.","e":"Um grupo de alunos humilha todos os dias o mesmo colega na escola, com apelidos e empurrões.","d":"O bullying presencial tem pena apenas de multa, mas o cyberbullying (pela internet, redes sociais, aplicativos ou jogos on-line) tem reclusão, de 2 a 4 anos, e multa.","pena":"Multa, se a conduta não constituir crime mais grave.","rub":"Intimidação sistemática (bullying)","caput":"Intimidar sistematicamente, individualmente ou em grupo, mediante violência física ou psicológica, uma ou mais pessoas, de modo intencional e repetitivo, sem motivação evidente, por meio de atos de intimidação, de humilhação ou de discriminação ou de ações verbais, morais, sexuais, sociais, psicológicas, físicas, materiais ou virtuais:","txt":["Art. 146-A. Intimidar sistematicamente, individualmente ou em grupo, mediante violência física ou psicológica, uma ou mais pessoas, de modo intencional e repetitivo, sem motivação evidente, por meio de atos de intimidação, de humilhação ou de discriminação ou de ações verbais, morais, sexuais, sociais, psicológicas, físicas, materiais ou virtuais:","Pena - multa, se a conduta não constituir crime mais grave.","Intimidação sistemática virtual (cyberbullying)","Parágrafo único. Se a conduta é realizada por meio da rede de computadores, de rede social, de aplicativos, de jogos on-line ou por qualquer outro meio ou ambiente digital, ou transmitida em tempo real:","Pena - reclusão, de 2 (dois) anos a 4 (quatro) anos, e multa, se a conduta não constituir crime mais grave."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"147","t":"Ameaça","k":"ameaçar","s":"Pune quem ameaça alguém, por palavra, escrito, gesto ou outro meio, de causar um mal injusto e grave. A pena é de detenção, de 1 a 6 meses, ou multa.","e":"Após uma discussão, um homem manda mensagem ao vizinho dizendo que vai \"acabar com a vida dele\".","d":"Em regra a ação depende de representação da vítima, mas, se a ameaça é contra a mulher por razões da condição do sexo feminino, a pena é em dobro e não depende de representação.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Ameaça","caput":"Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave:","txt":["Art. 147 - Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave:","Pena - detenção, de um a seis meses, ou multa.","§ 1º Se o crime é cometido contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código, aplica-se a pena em dobro.","§ 2º Somente se procede mediante representação, exceto na hipótese prevista no § 1º deste artigo."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"147-A","t":"Perseguição","k":"perseguir","s":"Pune quem persegue alguém de forma repetida e por qualquer meio, ameaçando sua integridade física ou psicológica, restringindo sua liberdade de ir e vir ou invadindo sua privacidade. A pena é de reclusão, de 6 meses a 2 anos, e multa.","e":"Um ex-namorado passa semanas seguindo a ex pela cidade e mandando dezenas de mensagens por dia.","d":"Exige reiteração: um ato isolado não basta. A pena aumenta de metade contra criança, adolescente, idoso ou mulher por razões da condição de sexo feminino, ou com 2 ou mais pessoas ou arma; e a ação depende de representação.","pena":"Reclusão, de 6 meses a 2 anos, e multa.","rub":"Perseguição","caput":"Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade.","txt":["Art. 147-A. Perseguir alguém, reiteradamente e por qualquer meio, ameaçando-lhe a integridade física ou psicológica, restringindo-lhe a capacidade de locomoção ou, de qualquer forma, invadindo ou perturbando sua esfera de liberdade ou privacidade.","Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa.","§ 1º A pena é aumentada de metade se o crime é cometido:","I - contra criança, adolescente ou idoso;","II - contra mulher por razões da condição de sexo feminino, nos termos do § 2º-A do art. 121 deste Código;","III - mediante concurso de 2 (duas) ou mais pessoas ou com o emprego de arma.","§ 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência.","§ 3º Somente se procede mediante representação."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"147-B","t":"Violência psicológica contra a mulher","k":"causar dano emocional","s":"Pune quem causa dano emocional à mulher para degradá-la ou controlar suas ações e decisões, usando ameaça, humilhação, manipulação, isolamento, chantagem ou meio parecido. A pena é de reclusão, de 6 meses a 2 anos, e multa, se a conduta não for crime mais grave.","e":"Um marido proíbe a esposa de ver as amigas, vigia o celular dela todos os dias e a humilha na frente dos filhos para controlar o que ela faz.","d":"A pena aumenta de metade se o crime usa inteligência artificial ou outro recurso que altere a imagem ou o som da vítima. Além disso, o crime é subsidiário: só se aplica se a conduta não for crime mais grave.","pena":"Reclusão, de 6 meses a 2 anos, e multa, se a conduta não constitui crime mais grave.","rub":"Violência psicológica contra a mulher","caput":"Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação:","txt":["Art. 147-B. Causar dano emocional à mulher que a prejudique e perturbe seu pleno desenvolvimento ou que vise a degradar ou a controlar suas ações, comportamentos, crenças e decisões, mediante ameaça, constrangimento, humilhação, manipulação, isolamento, chantagem, ridicularização, limitação do direito de ir e vir ou qualquer outro meio que cause prejuízo à sua saúde psicológica e autodeterminação:","Pena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa, se a conduta não constitui crime mais grave.","Parágrafo único. A pena é aumentada de metade se o crime é cometido mediante uso de inteligência artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da vítima."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"147-C","t":"Ameaça ligada ao crime organizado","k":"ameaçar","s":"Pune quem ameaça alguém de mal injusto e grave, por palavra, escrito, gesto ou outro meio, quando a ameaça faz parte da atuação do crime organizado ou serve aos fins dele. A pena é de reclusão, de 1 a 3 anos.","e":"Um integrante de facção manda recado a um comerciante dizendo que vai incendiar a loja se ele não obedecer às regras impostas pelo grupo no bairro.","d":"Não confunda com a ameaça comum: aqui a ameaça precisa estar ligada às condutas da lei do marco legal do combate ao crime organizado, por isso a pena é de reclusão, de 1 a 3 anos, bem mais alta.","pena":"Reclusão, de 1 a 3 anos.","rub":"","caput":"Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil:","txt":["Art. 147-C. Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil:","Pena - reclusão, de 1 (um) a 3 (três) anos."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"148","t":"Sequestro e cárcere privado","k":"privar da liberdade","s":"Pune quem tira a liberdade de alguém, prendendo a pessoa em algum lugar ou impedindo que ela saia. A pena é de reclusão, de 1 a 3 anos.","e":"Um fazendeiro tranca um vizinho num galpão por dois dias para impedir que ele vá à delegacia denunciar uma briga.","d":"A pena sobe para 2 a 5 anos se a vítima é ascendente, descendente, cônjuge, companheiro, maior de 60 ou menor de 18 anos, se há internação em hospital, se dura mais de 15 dias ou se há fins libidinosos. Se o autor é de milícia ou organização criminosa ultraviolenta, a pena é de 12 a 20 anos.","pena":"Reclusão, de 1 a 3 anos.","rub":"Seqüestro e cárcere privado","caput":"Privar alguém de sua liberdade, mediante seqüestro ou cárcere privado:","txt":["Art. 148 - Privar alguém de sua liberdade, mediante seqüestro ou cárcere privado:","Pena - reclusão, de um a três anos.","§ 1º - A pena é de reclusão, de dois a cinco anos:","I - se a vítima é ascendente, descendente, cônjuge ou companheiro do agente ou maior de 60 (sessenta) anos;","II - se o crime é praticado mediante internação da vítima em casa de saúde ou hospital;","III - se a privação da liberdade dura mais de 15 (quinze) dias.","IV - se o crime é praticado contra menor de 18 (dezoito) anos;","V - se o crime é praticado com fins libidinosos.","§ 2º - Se resulta à vítima, em razão de maus-tratos ou da natureza da detenção, grave sofrimento físico ou moral:","Pena - reclusão, de dois a oito anos.","§ 3º Se cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil:","Pena - reclusão, de 12 (doze) a 20 (vinte) anos."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"149","t":"Redução a condição de escravo","k":"reduzir à condição análoga","s":"Pune quem trata alguém como escravo: obriga a trabalhos forçados ou jornada exaustiva, impõe condições degradantes de trabalho ou prende o trabalhador por causa de dívida com o patrão. A pena é de reclusão, de 2 a 8 anos, e multa, além da pena pela violência.","e":"Um fazendeiro guarda os documentos dos trabalhadores e diz que eles só podem ir embora depois de pagar a comida que ele vendeu a preço abusivo no alojamento.","d":"Não é preciso acorrentar ninguém: jornada exaustiva ou condições degradantes já bastam para o crime. A pena aumenta de metade se a vítima é criança ou adolescente ou se há preconceito de raça, cor, etnia, religião ou origem.","pena":"Reclusão, de 2 a 8 anos, e multa, além da pena correspondente à violência.","rub":"Redução a condição análoga à de escravo","caput":"Reduzir alguém a condição análoga à de escravo, quer submetendo-o a trabalhos forçados ou a jornada exaustiva, quer sujeitando-o a condições degradantes de trabalho, quer restringindo, por qualquer meio, sua locomoção em razão de dívida contraída com o empregador ou preposto:","txt":["Art. 149. Reduzir alguém a condição análoga à de escravo, quer submetendo-o a trabalhos forçados ou a jornada exaustiva, quer sujeitando-o a condições degradantes de trabalho, quer restringindo, por qualquer meio, sua locomoção em razão de dívida contraída com o empregador ou preposto:","Pena - reclusão, de dois a oito anos, e multa, além da pena correspondente à violência.","§ 1º Nas mesmas penas incorre quem:","I - cerceia o uso de qualquer meio de transporte por parte do trabalhador, com o fim de retê-lo no local de trabalho;","II - mantém vigilância ostensiva no local de trabalho ou se apodera de documentos ou objetos pessoais do trabalhador, com o fim de retê-lo no local de trabalho.","§ 2º A pena é aumentada de metade, se o crime é cometido:","I - contra criança ou adolescente;","II - por motivo de preconceito de raça, cor, etnia, religião ou origem."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"149-A","t":"Tráfico de pessoas","k":"agenciar ou aliciar","s":"Pune quem recruta, transporta, compra, aloja ou acolhe uma pessoa com ameaça, violência, fraude ou abuso, para remover órgãos, explorar como escravo, impor servidão, adoção ilegal ou exploração sexual. A pena é de reclusão, de 4 a 8 anos, e multa.","e":"Um aliciador promete a uma jovem um emprego de garçonete no exterior e, quando ela chega lá, toma o passaporte dela para explorá-la.","d":"A pena é reduzida de um a dois terços se o agente for primário e não integrar organização criminosa. Já se a vítima for levada para fora do país, a pena aumenta de um terço até a metade.","pena":"","rub":"Tráfico de Pessoas","caput":"Agenciar, aliciar, recrutar, transportar, transferir, comprar, alojar ou acolher pessoa, mediante grave ameaça, violência, coação, fraude ou abuso, com a finalidade de:","txt":["Art. 149-A. Agenciar, aliciar, recrutar, transportar, transferir, comprar, alojar ou acolher pessoa, mediante grave ameaça, violência, coação, fraude ou abuso, com a finalidade de:","I - remover-lhe órgãos, tecidos ou partes do corpo;","II - submetê-la a trabalho em condições análogas à de escravo;","III - submetê-la a qualquer tipo de servidão;","IV - adoção ilegal; ou","V - exploração sexual.","Pena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa.","§ 1º A pena é aumentada de um terço até a metade se:","I - o crime for cometido por funcionário público no exercício de suas funções ou a pretexto de exercê-las;","II - o crime for cometido contra criança, adolescente ou pessoa idosa ou com deficiência;","III - o agente se prevalecer de relações de parentesco, domésticas, de coabitação, de hospitalidade, de dependência econômica, de autoridade ou de superioridade hierárquica inerente ao exercício de emprego, cargo ou função; ou","IV - a vítima do tráfico de pessoas for retirada do território nacional.","§ 2º A pena é reduzida de um a dois terços se o agente for primário e não integrar organização criminosa."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"150","t":"Violação de domicílio","k":"entrar ou permanecer","s":"Pune quem entra ou fica na casa de outra pessoa, ou em suas dependências, escondido, com esperteza ou contra a vontade do morador. A pena é de detenção, de 1 a 3 meses, ou multa.","e":"Um ex-companheiro usa uma cópia antiga da chave e entra na casa da ex contra a vontade dela.","d":"Não é crime entrar de dia, com as formalidades legais, para prender alguém, nem a qualquer hora quando um crime está acontecendo lá dentro. Escritório fechado ao público conta como \"casa\", mas hotel aberto e bar não contam.","pena":"Detenção, de 1 a 3 meses, ou multa.","rub":"Violação de domicílio","caput":"Entrar ou permanecer, clandestina ou astuciosamente, ou contra a vontade expressa ou tácita de quem de direito, em casa alheia ou em suas dependências:","txt":["Art. 150 - Entrar ou permanecer, clandestina ou astuciosamente, ou contra a vontade expressa ou tácita de quem de direito, em casa alheia ou em suas dependências:","Pena - detenção, de um a três meses, ou multa.","§ 1º - Se o crime é cometido durante a noite, ou em lugar ermo, ou com o emprego de violência ou de arma, ou por duas ou mais pessoas:","Pena - detenção, de seis meses a dois anos, além da pena correspondente à violência.","§ 3º - Não constitui crime a entrada ou permanência em casa alheia ou em suas dependências:","I - durante o dia, com observância das formalidades legais, para efetuar prisão ou outra diligência;","II - a qualquer hora do dia ou da noite, quando algum crime está sendo ali praticado ou na iminência de o ser.","§ 4º - A expressão \"casa\" compreende:","I - qualquer compartimento habitado;","II - aposento ocupado de habitação coletiva;","III - compartimento não aberto ao público, onde alguém exerce profissão ou atividade.","§ 5º - Não se compreendem na expressão \"casa\":","I - hospedaria, estalagem ou qualquer outra habitação coletiva, enquanto aberta, salvo a restrição do n.º II do parágrafo anterior;","II - taverna, casa de jogo e outras do mesmo gênero."],"ti":8,"ch":"Dos crimes contra a liberdade individual"},{"n":"151","t":"Violação de correspondência","k":"devassar","s":"Pune quem abre e lê, sem direito, uma correspondência fechada dirigida a outra pessoa. A pena é de detenção, de 1 a 6 meses, ou multa.","e":"Uma pessoa abre a carta lacrada endereçada ao colega de apartamento para ler o que está escrito.","d":"Em regra a ação depende de representação (pedido da vítima), salvo no uso irregular de aparelho radioelétrico e quando há abuso de função no serviço postal ou telefônico. Nesse último caso a pena é de detenção, de 1 a 3 anos.","pena":"Detenção, de 1 a 6 meses, ou multa.","rub":"Violação de correspondência","caput":"Devassar indevidamente o conteúdo de correspondência fechada, dirigida a outrem:","txt":["Art. 151 - Devassar indevidamente o conteúdo de correspondência fechada, dirigida a outrem:","Pena - detenção, de um a seis meses, ou multa.","Sonegação ou destruição de correspondência","§ 1º - Na mesma pena incorre:","I - quem se apossa indevidamente de correspondência alheia, embora não fechada e, no todo ou em parte, a sonega ou destrói;","Violação de comunicação telegráfica, radioelétrica ou telefônica","II - quem indevidamente divulga, transmite a outrem ou utiliza abu
