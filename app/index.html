206 - Recrutar trabalhadores, mediante fraude, com o fim de levá-los para território estrangeiro.","Pena - detenção, de 1 (um) a 3 (três) anos e multa."],"ti":11,"ch":""},{"n":"207","t":"Aliciamento de trabalhadores no território nacional","k":"aliciar","s":"Pune quem alicia (atrai, convence) trabalhadores para levá-los de uma localidade para outra dentro do Brasil. Pena: detenção de um a três anos, e multa.","e":"Um intermediário convence trabalhadores do Maranhão a irem para uma fazenda no Pará com promessas de emprego.","d":"O § 1º pune também quem recruta fora da localidade do trabalho mediante fraude ou cobrança de qualquer quantia do trabalhador, ou não garante o retorno dele ao local de origem. A pena aumenta de um sexto a um terço se a vítima é menor de dezoito anos, idosa, gestante, indígena ou pessoa com deficiência física ou mental.","pena":"Detenção de 1 a 3 anos, e multa.","rub":"Aliciamento de trabalhadores de um local para outro do território nacional","caput":"Aliciar trabalhadores, com o fim de levá-los de uma para outra localidade do território nacional:","txt":["Art. 207 - Aliciar trabalhadores, com o fim de levá-los de uma para outra localidade do território nacional:","Pena - detenção de um a três anos, e multa.","§ 1º Incorre na mesma pena quem recrutar trabalhadores fora da localidade de execução do trabalho, dentro do território nacional, mediante fraude ou cobrança de qualquer quantia do trabalhador, ou, ainda, não assegurar condições do seu retorno ao local de origem.","§ 2º A pena é aumentada de um sexto a um terço se a vítima é menor de dezoito anos, idosa, gestante, indígena ou portadora de deficiência física ou mental."],"ti":11,"ch":""},{"n":"208","t":"Ultraje a culto","k":"escarnecer, perturbar, vilipendiar","s":"Pune três condutas: zombar publicamente de alguém por sua crença ou função religiosa; impedir ou perturbar cerimônia ou culto religioso; e vilipendiar (desrespeitar, aviltar) publicamente ato ou objeto de culto. Pena: detenção, de um mês a um ano, ou multa.","e":"Uma pessoa invade um terreiro de candomblé aos gritos e interrompe a cerimônia em andamento.","d":"A zombaria precisa ser pública e dirigida a alguém por motivo de crença ou função religiosa; criticar uma religião, por si só, não é crime. Com violência, a pena aumenta de um terço, somada à pena da violência.","pena":"Detenção, de 1 mês a 1 ano, ou multa.","rub":"Ultraje a culto e impedimento ou perturbação de ato a ele relativo","caput":"Escarnecer de alguém publicamente, por motivo de crença ou função religiosa; impedir ou perturbar cerimônia ou prática de culto religioso; vilipendiar publicamente ato ou objeto de culto religioso:","txt":["Art. 208 - Escarnecer de alguém publicamente, por motivo de crença ou função religiosa; impedir ou perturbar cerimônia ou prática de culto religioso; vilipendiar publicamente ato ou objeto de culto religioso:","Pena - detenção, de um mês a um ano, ou multa.","Parágrafo único - Se há emprego de violência, a pena é aumentada de um terço, sem prejuízo da correspondente à violência."],"ti":12,"ch":"Dos crimes contra o sentimento religioso"},{"n":"209","t":"Perturbação de cerimônia funerária","k":"impedir ou perturbar","s":"Pune quem impede ou atrapalha enterro ou cerimônia funerária, como um velório. Pena: detenção, de um mês a um ano, ou multa.","e":"Um credor aparece no velório e faz escândalo cobrando a dívida do falecido, interrompendo a cerimônia.","d":"Tem a mesma pena e o mesmo aumento de um terço com violência do ultraje a culto. Não confunda com violação de sepultura, que atinge o túmulo e tem pena de reclusão.","pena":"Detenção, de 1 mês a 1 ano, ou multa.","rub":"Impedimento ou perturbação de cerimônia funerária","caput":"Impedir ou perturbar enterro ou cerimônia funerária:","txt":["Art. 209 - Impedir ou perturbar enterro ou cerimônia funerária:","Pena - detenção, de um mês a um ano, ou multa.","Parágrafo único - Se há emprego de violência, a pena é aumentada de um terço, sem prejuízo da correspondente à violência."],"ti":12,"ch":"Dos crimes contra o respeito aos mortos"},{"n":"210","t":"Violação de sepultura","k":"violar ou profanar","s":"Pune quem viola (abre, rompe) ou profana (desrespeita) sepultura ou urna funerária. Pena: reclusão, de um a três anos, e multa.","e":"Pessoas arrombam um túmulo no cemitério durante a noite para procurar objetos de valor.","d":"O objeto protegido é a sepultura ou a urna, não o corpo. Destruir, subtrair, ocultar ou vilipendiar o próprio cadáver são crimes de outros artigos.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Violação de sepultura","caput":"Violar ou profanar sepultura ou urna funerária:","txt":["Art. 210 - Violar ou profanar sepultura ou urna funerária:","Pena - reclusão, de um a três anos, e multa."],"ti":12,"ch":"Dos crimes contra o respeito aos mortos"},{"n":"211","t":"Destruição, subtração ou ocultação de cadáver","k":"destruir, subtrair ou ocultar","s":"Pune quem destrói, subtrai (leva embora) ou esconde um cadáver ou parte dele. Pena: reclusão, de um a três anos, e multa.","e":"Depois de um atropelamento fatal, o motorista esconde o corpo da vítima num matagal para não ser descoberto.","d":"Vale também para apenas uma parte do cadáver. Quem mata e depois esconde o corpo responde pelo homicídio e também por este crime.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Destruição, subtração ou ocultação de cadáver","caput":"Destruir, subtrair ou ocultar cadáver ou parte dele:","txt":["Art. 211 - Destruir, subtrair ou ocultar cadáver ou parte dele:","Pena - reclusão, de um a três anos, e multa."],"ti":12,"ch":"Dos crimes contra o respeito aos mortos"},{"n":"212","t":"Vilipêndio a cadáver","k":"vilipendiar","s":"Pune quem trata com desprezo ou ultraje um cadáver ou suas cinzas. Pena: detenção, de um a três anos, e multa.","e":"Um funcionário de funerária tira fotos zombando de um corpo e publica nas redes sociais.","d":"A pena tem os mesmos números dos crimes vizinhos (um a três anos), mas aqui é detenção, não reclusão. E o texto protege também as cinzas.","pena":"Detenção, de 1 a 3 anos, e multa.","rub":"Vilipêndio a cadáver","caput":"Vilipendiar cadáver ou suas cinzas:","txt":["Art. 212 - Vilipendiar cadáver ou suas cinzas:","Pena - detenção, de um a três anos, e multa."],"ti":12,"ch":"Dos crimes contra o respeito aos mortos"},{"n":"213","t":"Estupro","k":"constranger","s":"Pune quem obriga alguém, com violência ou grave ameaça, a ter relação sexual ou a praticar ou permitir outro ato libidinoso (ato de natureza sexual). Pena: reclusão, de 6 a 10 anos.","e":"","d":"A pena sobe para 8 a 12 anos se resulta lesão grave ou se a vítima tem entre 14 e 18 anos, e para 12 a 30 anos se resulta morte. Se a vítima é menor de 14 anos, o crime é outro: estupro de vulnerável.","pena":"Reclusão, de 6 a 10 anos.","rub":"Estupro","caput":"Constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou a praticar ou permitir que com ele se pratique outro ato libidinoso:","txt":["Art. 213. Constranger alguém, mediante violência ou grave ameaça, a ter conjunção carnal ou a praticar ou permitir que com ele se pratique outro ato libidinoso:","Pena - reclusão, de 6 (seis) a 10 (dez) anos.","§ 1º Se da conduta resulta lesão corporal de natureza grave ou se a vítima é menor de 18 (dezoito) ou maior de 14 (catorze) anos:","Pena - reclusão, de 8 (oito) a 12 (doze) anos.","§ 2º Se da conduta resulta morte:","Pena - reclusão, de 12 (doze) a 30 (trinta) anos"],"ti":13,"ch":"Dos crimes contra a liberdade sexual"},{"n":"215","t":"Violação sexual mediante fraude","k":"mediante fraude","s":"Pune quem tem relação sexual ou pratica outro ato libidinoso com alguém usando fraude (engano) ou outro meio que impeça ou dificulte a livre vontade da vítima. Pena: reclusão, de 2 a 6 anos.","e":"Um falso médico convence a paciente de que um toque íntimo faz parte do exame.","d":"Aqui não há violência nem grave ameaça, o que seria estupro; o meio é o engano. Se o crime visa vantagem econômica, aplica-se também multa.","pena":"Reclusão, de 2 a 6 anos.","rub":"Violação sexual mediante fraude","caput":"Ter conjunção carnal ou praticar outro ato libidinoso com alguém, mediante fraude ou outro meio que impeça ou dificulte a livre manifestação de vontade da vítima:","txt":["Art. 215. Ter conjunção carnal ou praticar outro ato libidinoso com alguém, mediante fraude ou outro meio que impeça ou dificulte a livre manifestação de vontade da vítima:","Pena - reclusão, de 2 (dois) a 6 (seis) anos.","Parágrafo único. Se o crime é cometido com o fim de obter vantagem econômica, aplica-se também multa."],"ti":13,"ch":"Dos crimes contra a liberdade sexual"},{"n":"215-A","t":"Importunação sexual","k":"praticar ato libidinoso","s":"Pune quem pratica contra alguém, sem consentimento, ato libidinoso para satisfazer o próprio desejo sexual ou o de outra pessoa. Pena: reclusão, de 1 a 5 anos, se o ato não constitui crime mais grave.","e":"Um passageiro se aproveita do ônibus lotado para tocar de forma sexual uma mulher sem o consentimento dela.","d":"É crime subsidiário: só se aplica se o fato não for crime mais grave, como o estupro. A diferença central é que aqui não há violência nem grave ameaça.","pena":"Reclusão, de 1 a 5 anos, se o ato não constitui crime mais grave.","rub":"Importunação sexual","caput":"Praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer a própria lascívia ou a de terceiro:","txt":["Art. 215-A. Praticar contra alguém e sem a sua anuência ato libidinoso com o objetivo de satisfazer a própria lascívia ou a de terceiro:","Pena - reclusão, de 1 (um) a 5 (cinco) anos, se o ato não constitui crime mais grave."],"ti":13,"ch":"Dos crimes contra a liberdade sexual"},{"n":"216-A","t":"Assédio sexual","k":"constranger","s":"Pune quem, aproveitando-se de ser superior hierárquico ou de ter ascendência no emprego, cargo ou função, constrange alguém para obter vantagem ou favor sexual. Pena: detenção, de 1 a 2 anos.","e":"Um gerente insinua à funcionária que ela só será promovida se aceitar sair com ele.","d":"Exige relação de hierarquia ou ascendência ligada ao trabalho; entre colegas do mesmo nível ou entre desconhecidos, não é este crime. A pena aumenta em até um terço se a vítima é menor de 18 anos.","pena":"Detenção, de 1 a 2 anos.","rub":"Assédio sexual","caput":"Constranger alguém com o intuito de obter vantagem ou favorecimento sexual, prevalecendo-se o agente da sua condição de superior hierárquico ou ascendência inerentes ao exercício de emprego, cargo ou função.\"","txt":["Art. 216-A. Constranger alguém com o intuito de obter vantagem ou favorecimento sexual, prevalecendo-se o agente da sua condição de superior hierárquico ou ascendência inerentes ao exercício de emprego, cargo ou função.","Pena - detenção, de 1 (um) a 2 (dois) anos.","Parágrafo único. (VETADO)","§ 2º A pena é aumentada em até um terço se a vítima é menor de 18 (dezoito) anos."],"ti":13,"ch":"Dos crimes contra a liberdade sexual"},{"n":"216-B","t":"Registro não autorizado da intimidade sexual","k":"registrar","s":"Pune quem produz, fotografa, filma ou registra, por qualquer meio, cena íntima de nudez ou ato sexual sem autorização dos participantes. Pena: detenção, de 6 meses a 1 ano, e multa.","e":"Um homem esconde o celular no quarto e grava, sem avisar, um momento íntimo com a parceira.","d":"O parágrafo único dá a mesma pena a quem faz montagem em foto, vídeo ou áudio para incluir alguém em cena íntima. Divulgar esse conteúdo já é outro crime, bem mais grave.","pena":"Detenção, de 6 meses a 1 ano, e multa.","rub":"Registro não autorizado da intimidade sexual","caput":"Produzir, fotografar, filmar ou registrar, por qualquer meio, conteúdo com cena de nudez ou ato sexual ou libidinoso de caráter íntimo e privado sem autorização dos participantes:","txt":["Art. 216-B. Produzir, fotografar, filmar ou registrar, por qualquer meio, conteúdo com cena de nudez ou ato sexual ou libidinoso de caráter íntimo e privado sem autorização dos participantes:","Pena - detenção, de 6 (seis) meses a 1 (um) ano, e multa.","Parágrafo único. Na mesma pena incorre quem realiza montagem em fotografia, vídeo, áudio ou qualquer outro registro com o fim de incluir pessoa em cena de nudez ou ato sexual ou libidinoso de caráter íntimo."],"ti":13,"ch":"Da exposição da intimidade sexual"},{"n":"217-A","t":"Estupro de vulnerável","k":"ter conjunção carnal","s":"Pune qualquer relação sexual ou ato libidinoso com menor de 14 anos, ou com pessoa que, por enfermidade ou deficiência mental, não tem discernimento, ou que por qualquer outra causa não pode resistir. Pena: reclusão, de 10 a 18 anos, e multa.","e":"","d":"Não importam consentimento, experiência sexual anterior ou gravidez: a lei diz que a presunção de vulnerabilidade é absoluta. Com lesão grave, a pena vai a 12 a 24 anos; com morte, a 20 a 40 anos.","pena":"Reclusão, de 10 a 18 anos, e multa.","rub":"Estupro de vulnerável","caput":"Ter conjunção carnal ou praticar outro ato libidinoso com menor de 14 (catorze) anos:","txt":["Art. 217-A. Ter conjunção carnal ou praticar outro ato libidinoso com menor de 14 (catorze) anos:","Pena - reclusão, de 10 (dez) a 18 (dezoito) anos, e multa.","§ 1º Incorre na mesma pena quem pratica as ações descritas no caput com alguém que, por enfermidade ou deficiência mental, não tem o necessário discernimento para a prática do ato, ou que, por qualquer outra causa, não pode oferecer resistência.","§ 2º (VETADO)","§ 3º Se da conduta resulta lesão corporal de natureza grave:","Pena - reclusão, de 12 (doze) a 24 (vinte e quatro) anos, e multa.","§ 4º Se da conduta resulta morte:","Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos, e multa.","§ 4º-A. É absoluta a presunção de vulnerabilidade da vítima e inadmissível sua relativização.","§ 5º As penas previstas no caput e nos §§ 1º, 3º e 4º deste artigo aplicam-se independentemente do consentimento da vítima, de sua experiência sexual, do fato de ela ter mantido relações sexuais anteriormente ao crime ou da ocorrência de gravidez resultante da prática do crime."],"ti":13,"ch":"Dos crimes sexuais contra vulnerável"},{"n":"218","t":"Corrupção de menores","k":"induzir","s":"Pune quem induz (convence, leva) menor de 14 anos a satisfazer o desejo sexual de outra pessoa. Pena: reclusão, de 6 a 14 anos, e multa.","e":"","d":"Não confunda com a corrupção de menores do Estatuto da Criança e do Adolescente, que é levar menor a praticar crime. Aqui o agente induz menor de 14 anos a servir à lascívia de terceiro.","pena":"Reclusão, de 6 a 14 anos, e multa.","rub":"Corrupção de menores","caput":"Induzir alguém menor de 14 (catorze) anos a satisfazer a lascívia de outrem:","txt":["Art. 218. Induzir alguém menor de 14 (catorze) anos a satisfazer a lascívia de outrem:","Pena - reclusão, de 6 (seis) a 14 (quatorze) anos, e multa.","Parágrafo único. (VETADO)."],"ti":13,"ch":"Dos crimes sexuais contra vulnerável"},{"n":"218-A","t":"Lascívia na presença de criança","k":"praticar na presença","s":"Pune quem pratica relação sexual ou ato libidinoso na presença de menor de 14 anos, ou o induz a assistir, para satisfazer desejo sexual próprio ou de outra pessoa. Pena: reclusão, de 5 a 12 anos, e multa.","e":"","d":"Aqui não há contato físico com a vítima: ela é levada a presenciar o ato. Se houver ato libidinoso com o próprio menor, o crime passa a ser estupro de vulnerável.","pena":"Reclusão, de 5 a 12 anos, e multa.","rub":"Satisfação de lascívia mediante presença de criança ou adolescente","caput":"Praticar, na presença de alguém menor de 14 (catorze) anos, ou induzi-lo a presenciar, conjunção carnal ou outro ato libidinoso, a fim de satisfazer lascívia própria ou de outrem:","txt":["Art. 218-A. Praticar, na presença de alguém menor de 14 (catorze) anos, ou induzi-lo a presenciar, conjunção carnal ou outro ato libidinoso, a fim de satisfazer lascívia própria ou de outrem:","Pena - reclusão, de 5 (cinco) a 12 (doze) anos, e multa."],"ti":13,"ch":"Dos crimes sexuais contra vulnerável"},{"n":"218-B","t":"Favorecimento da exploração sexual de vulnerável","k":"submeter, induzir ou atrair","s":"Pune quem submete, induz ou atrai à prostituição ou a outra forma de exploração sexual menor de 18 anos ou pessoa sem discernimento por enfermidade ou deficiência mental, ou quem facilita essa exploração ou impede ou dificulta que a vítima a abandone. Pena: reclusão, de 7 a 16 anos, e multa.","e":"","d":"Responde com a mesma pena quem pratica ato sexual com vítima entre 14 e 18 anos nessa situação, e também o dono, gerente ou responsável pelo local. Para o dono do local, a condenação cassa obrigatoriamente a licença de funcionamento do estabelecimento.","pena":"Reclusão, de 7 a 16 anos, e multa.","rub":"","caput":"Submeter, induzir ou atrair à prostituição ou outra forma de exploração sexual alguém menor de 18 (dezoito) anos ou que, por enfermidade ou deficiência mental, não tem o necessário discernimento para a prática do ato, facilitá-la, impedir ou dificultar que a abandone:","txt":["Art. 218-B. Submeter, induzir ou atrair à prostituição ou outra forma de exploração sexual alguém menor de 18 (dezoito) anos ou que, por enfermidade ou deficiência mental, não tem o necessário discernimento para a prática do ato, facilitá-la, impedir ou dificultar que a abandone:","Pena - reclusão, de 7 (sete) a 16 (dezesseis) anos, e multa.","§ 1º (Revogado).","§ 2º Incorre nas mesmas penas:","I - quem pratica conjunção carnal ou outro ato libidinoso com alguém menor de 18 (dezoito) e maior de 14 (catorze) anos na situação descrita no caput deste artigo;","II - o proprietário, o gerente ou o responsável pelo local em que se verifiquem as práticas referidas no caput deste artigo.","§ 3º Na hipótese do inciso II do § 2º, constitui efeito obrigatório da condenação a cassação da licença de localização e de funcionamento do estabelecimento."],"ti":13,"ch":"Dos crimes sexuais contra vulnerável"},{"n":"218-C","t":"Divulgação de cena de estupro","k":"divulgar","s":"Pune quem oferece, vende, publica ou divulga, por qualquer meio, inclusive internet, foto ou vídeo com cena de estupro (ou que faça apologia a ele) ou, sem consentimento da vítima, cena de sexo, nudez ou pornografia. Pena: reclusão, de 4 a 10 anos, e multa, se o fato não constitui crime mais grave.","e":"Depois do fim do namoro, um rapaz envia a grupos de mensagens um vídeo íntimo da ex-namorada, sem a autorização dela.","d":"A pena aumenta de 1/3 a 2/3 se o autor teve relação íntima de afeto com a vítima ou agiu por vingança ou humilhação. Não há crime em publicação jornalística, científica, cultural ou acadêmica que impeça identificar a vítima; a identificação só é possível com autorização prévia dela, se maior de 18 anos.","pena":"Reclusão, de 4 a 10 anos, e multa, se o fato não constitui crime mais grave.","rub":"Divulgação de cena de estupro ou de cena de estupro de vulnerável, de cena de sexo ou de pornografia","caput":"Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir, publicar ou divulgar, por qualquer meio - inclusive por meio de comunicação de massa ou sistema de informática ou telemática -, fotografia, vídeo ou outro registro audiovisual que contenha cena de estupro ou de estupro de vulnerável ou que faça apologia ou induza a sua prática, ou, sem o consentimento da vítima, cena de sexo, nudez ou pornografia:","txt":["Art. 218-C. Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir, publicar ou divulgar, por qualquer meio - inclusive por meio de comunicação de massa ou sistema de informática ou telemática -, fotografia, vídeo ou outro registro audiovisual que contenha cena de estupro ou de estupro de vulnerável ou que faça apologia ou induza a sua prática, ou, sem o consentimento da vítima, cena de sexo, nudez ou pornografia:","Pena - reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o fato não constitui crime mais grave.","Aumento de pena","§ 1º A pena é aumentada de 1/3 (um terço) a 2/3 (dois terços) se o crime é praticado por agente que mantém ou tenha mantido relação íntima de afeto com a vítima ou com o fim de vingança ou humilhação.","Exclusão de ilicitude","§ 2º Não há crime quando o agente pratica as condutas descritas no caput deste artigo em publicação de natureza jornalística, científica, cultural ou acadêmica com a adoção de recurso que impossibilite a identificação da vítima, ressalvada sua prévia autorização, caso seja maior de 18 (dezoito) anos."],"ti":13,"ch":"Dos crimes sexuais contra vulnerável"},{"n":"225","t":"Ação penal nos crimes sexuais","k":"ação pública incondicionada","s":"Nos crimes contra a liberdade sexual e nos crimes sexuais contra vulnerável (Capítulos I e II do título), a ação penal é pública incondicionada. Isso quer dizer que o Ministério Público processa o autor sem depender de autorização ou representação da vítima.","e":"Mesmo que a vítima de estupro não queira levar o caso adiante, o Ministério Público pode denunciar o agressor.","d":"Não há mais nesses capítulos crimes que dependam de representação da vítima: todos são de ação pública incondicionada. A regra vale para os Capítulos I e II, não para todos os crimes do título.","pena":"","rub":"Ação penal","caput":"Nos crimes definidos nos Capítulos I e II deste Título, procede-se mediante ação penal pública incondicionada.","txt":["Art. 225. Nos crimes definidos nos Capítulos I e II deste Título, procede-se mediante ação penal pública incondicionada.","Parágrafo único. (Revogado)."],"ti":13,"ch":"Disposições gerais"},{"n":"226","t":"Aumento de pena nos crimes sexuais","k":"aumento de pena","s":"Lista causas que aumentam a pena dos crimes sexuais. Aumenta de quarta parte com concurso de 2 ou mais pessoas, e de metade se o agente é parente próximo, cônjuge, companheiro, tutor, curador, empregador ou tem autoridade sobre a vítima. Aumenta de 1/3 a 2/3 no estupro coletivo (2 ou mais agentes) e no estupro corretivo (para controlar o comportamento social ou sexual da vítima).","e":"Se o crime sexual é praticado pelo empregador da vítima, a pena é aumentada de metade.","d":"O concurso de 2 ou mais pessoas aparece duas vezes: no inciso I (quarta parte) e no estupro coletivo do inciso IV (1/3 a 2/3). Para o estupro praticado por 2 ou mais agentes, vale o aumento específico do estupro coletivo.","pena":"","rub":"Aumento de pena","caput":"A pena é aumentada:","txt":["Art. 226. A pena é aumentada:","I - de quarta parte, se o crime é cometido com o concurso de 2 (duas) ou mais pessoas;","II - de metade, se o agente é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela;","IV - de 1/3 (um terço) a 2/3 (dois terços), se o crime é praticado:","Estupro coletivo","a) mediante concurso de 2 (dois) ou mais agentes;","Estupro corretivo","b) para controlar o comportamento social ou sexual da vítima."],"ti":13,"ch":"Disposições gerais"},{"n":"227","t":"Mediação para servir à lascívia","k":"induzir","s":"Pune quem induz (convence) alguém a satisfazer o desejo sexual de outra pessoa. Pena: reclusão, de um a três anos.","e":"Uma pessoa convence uma conhecida adulta a ter encontros íntimos com um empresário para agradá-lo.","d":"A pena sobe para dois a cinco anos se a vítima tem entre 14 e 18 anos ou se o agente é parente, cônjuge, tutor ou responsável por ela, e para dois a oito anos com violência, grave ameaça ou fraude. Com fim de lucro, aplica-se também multa.","pena":"Reclusão, de 1 a 3 anos.","rub":"Mediação para servir a lascívia de outrem","caput":"Induzir alguém a satisfazer a lascívia de outrem:","txt":["Art. 227 - Induzir alguém a satisfazer a lascívia de outrem:","Pena - reclusão, de um a três anos.","§ 1º Se a vítima é maior de 14 (catorze) e menor de 18 (dezoito) anos, ou se o agente é seu ascendente, descendente, cônjuge ou companheiro, irmão, tutor ou curador ou pessoa a quem esteja confiada para fins de educação, de tratamento ou de guarda:","Pena - reclusão, de dois a cinco anos.","§ 2º - Se o crime é cometido com emprego de violência, grave ameaça ou fraude:","Pena - reclusão, de dois a oito anos, além da pena correspondente à violência.","§ 3º - Se o crime é cometido com o fim de lucro, aplica-se também multa."],"ti":13,"ch":"Do lenocínio e do tráfico de pessoa para exploração sexual"},{"n":"228","t":"Favorecimento da prostituição","k":"induzir ou atrair","s":"Pune quem induz ou atrai alguém à prostituição ou a outra forma de exploração sexual, facilita essa prática ou impede ou dificulta que a pessoa a abandone. Pena: reclusão, de 2 a 5 anos, e multa.","e":"Um homem ameaça uma mulher adulta para impedir que ela deixe de se prostituir.","d":"A prostituição em si não é crime; pune-se quem leva a ela, facilita ou impede a saída. A pena sobe para 3 a 8 anos se o agente é parente, cônjuge, tutor, empregador ou tem dever de cuidado, e para quatro a dez anos com violência, grave ameaça ou fraude.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Favorecimento da prostituição ou outra forma de exploração sexual","caput":"Induzir ou atrair alguém à prostituição ou outra forma de exploração sexual, facilitá-la, impedir ou dificultar que alguém a abandone:","txt":["Art. 228. Induzir ou atrair alguém à prostituição ou outra forma de exploração sexual, facilitá-la, impedir ou dificultar que alguém a abandone:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","§ 1º Se o agente é ascendente, padrasto, madrasta, irmão, enteado, cônjuge, companheiro, tutor ou curador, preceptor ou empregador da vítima, ou se assumiu, por lei ou outra forma, obrigação de cuidado, proteção ou vigilância:","Pena - reclusão, de 3 (três) a 8 (oito) anos.","§ 2º - Se o crime, é cometido com emprego de violência, grave ameaça ou fraude:","Pena - reclusão, de quatro a dez anos, além da pena correspondente à violência.","§ 3º - Se o crime é cometido com o fim de lucro, aplica-se também multa."],"ti":13,"ch":"Do lenocínio e do tráfico de pessoa para exploração sexual"},{"n":"229","t":"Casa de prostituição","k":"manter","s":"Pune quem mantém, por conta própria ou de outra pessoa, estabelecimento onde ocorra exploração sexual. Pena: reclusão, de dois a cinco anos, e multa.","e":"O dono de um bar mantém nos fundos quartos onde mulheres são exploradas sexualmente sob seu controle.","d":"Não importa se há intuito de lucro nem se o dono ou gerente faz a mediação direta: basta manter o estabelecimento. O texto exige que no local ocorra exploração sexual.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Casa de prostituição","caput":"Manter, por conta própria ou de terceiro, estabelecimento em que ocorra exploração sexual, haja, ou não, intuito de lucro ou mediação direta do proprietário ou gerente:","txt":["Art. 229. Manter, por conta própria ou de terceiro, estabelecimento em que ocorra exploração sexual, haja, ou não, intuito de lucro ou mediação direta do proprietário ou gerente:","Pena - reclusão, de dois a cinco anos, e multa."],"ti":13,"ch":"Do lenocínio e do tráfico de pessoa para exploração sexual"},{"n":"230","t":"Rufianismo","k":"tirar proveito","s":"Pune quem lucra com a prostituição de outra pessoa, participando diretamente dos ganhos ou sendo sustentado, no todo ou em parte, por quem se prostitui. Pena: reclusão, de um a quatro anos, e multa.","e":"Um homem passa a viver do dinheiro que a companheira ganha com a prostituição, exigindo parte de cada pagamento.","d":"O rufião vive à custa da prostituição alheia; não precisa ter induzido ninguém. A pena vai a 3 a 6 anos se a vítima tem entre 14 e 18 anos ou o agente é parente ou responsável, e a 2 a 8 anos com violência, grave ameaça ou fraude.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Rufianismo","caput":"Tirar proveito da prostituição alheia, participando diretamente de seus lucros ou fazendo-se sustentar, no todo ou em parte, por quem a exerça:","txt":["Art. 230 - Tirar proveito da prostituição alheia, participando diretamente de seus lucros ou fazendo-se sustentar, no todo ou em parte, por quem a exerça:","Pena - reclusão, de um a quatro anos, e multa.","§ 1º Se a vítima é menor de 18 (dezoito) e maior de 14 (catorze) anos ou se o crime é cometido por ascendente, padrasto, madrasta, irmão, enteado, cônjuge, companheiro, tutor ou curador, preceptor ou empregador da vítima, ou por quem assumiu, por lei ou outra forma, obrigação de cuidado, proteção ou vigilância:","Pena - reclusão, de 3 (três) a 6 (seis) anos, e multa.","§ 2º Se o crime é cometido mediante violência, grave ameaça, fraude ou outro meio que impeça ou dificulte a livre manifestação da vontade da vítima:","Pena - reclusão, de 2 (dois) a 8 (oito) anos, sem prejuízo da pena correspondente à violência."],"ti":13,"ch":"Do lenocínio e do tráfico de pessoa para exploração sexual"},{"n":"232-A","t":"Promoção de migração ilegal","k":"promover","s":"Pune quem promove, por qualquer meio e para obter vantagem econômica, a entrada ilegal de estrangeiro no Brasil ou de brasileiro em outro país. Pena: reclusão, de 2 a 5 anos, e multa.","e":"Um coiote cobra dinheiro de brasileiros para fazê-los atravessar clandestinamente a fronteira do México com os Estados Unidos.","d":"Sem o fim de obter vantagem econômica, não há este crime. O § 1º pune também quem promove a saída de estrangeiro do Brasil para entrar ilegalmente em outro país, e a pena aumenta de 1/6 a 1/3 com violência ou condição desumana ou degradante.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Promoção de migração ilegal","caput":"Promover, por qualquer meio, com o fim de obter vantagem econômica, a entrada ilegal de estrangeiro em território nacional ou de brasileiro em país estrangeiro:","txt":["Art. 232-A. Promover, por qualquer meio, com o fim de obter vantagem econômica, a entrada ilegal de estrangeiro em território nacional ou de brasileiro em país estrangeiro:","Pena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.","§ 1º Na mesma pena incorre quem promover, por qualquer meio, com o fim de obter vantagem econômica, a saída de estrangeiro do território nacional para ingressar ilegalmente em país estrangeiro.","§ 2º A pena é aumentada de 1/6 (um sexto) a 1/3 (um terço) se:","I - o crime é cometido com violência; ou","II - a vítima é submetida a condição desumana ou degradante.","§ 3º A pena prevista para o crime será aplicada sem prejuízo das correspondentes às infrações conexas."],"ti":13,"ch":"Do lenocínio e do tráfico de pessoa para exploração sexual"},{"n":"233","t":"Ato obsceno","k":"praticar ato obsceno","s":"Pune quem pratica ato obsceno (de conotação sexual, que ofende o pudor) em lugar público, aberto ou exposto ao público. Pena: detenção, de três meses a um ano, ou multa.","e":"Um homem tira a roupa e se exibe nu no meio de uma praça movimentada.","d":"Não precisa haver uma vítima específica; basta o lugar ser público, aberto ou exposto ao público. Se o ato libidinoso for praticado contra uma pessoa sem sua anuência, pode ser importunação sexual, crime mais grave.","pena":"Detenção, de 3 meses a 1 ano, ou multa.","rub":"Ato obsceno","caput":"Praticar ato obsceno em lugar público, ou aberto ou exposto ao público:","txt":["Art. 233 - Praticar ato obsceno em lugar público, ou aberto ou exposto ao público:","Pena - detenção, de três meses a um ano, ou multa."],"ti":13,"ch":"Do ultraje público ao pudor"},{"n":"234","t":"Escrito ou objeto obsceno","k":"fazer, importar ou expor","s":"Pune quem faz, importa, exporta, adquire ou guarda escrito, desenho, pintura ou objeto obsceno para vender, distribuir ou expor ao público. Pena: detenção, de seis meses a dois anos, ou multa.","e":"Um comerciante expõe na vitrine de uma banca, à vista de quem passa, cartazes obscenos.","d":"Ter o objeto só é crime se for para comércio, distribuição ou exposição pública; guardar para uso pessoal não é. O § 1º dá a mesma pena a quem vende ou expõe esses objetos ou faz espetáculo ou audição obscena em local público ou pelo rádio.","pena":"Detenção, de 6 meses a 2 anos, ou multa.","rub":"Escrito ou objeto obsceno","caput":"Fazer, importar, exportar, adquirir ou ter sob sua guarda, para fim de comércio, de distribuição ou de exposição pública, escrito, desenho, pintura, estampa ou qualquer objeto obsceno:","txt":["Art. 234 - Fazer, importar, exportar, adquirir ou ter sob sua guarda, para fim de comércio, de distribuição ou de exposição pública, escrito, desenho, pintura, estampa ou qualquer objeto obsceno:","Pena - detenção, de seis meses a dois anos, ou multa.","§ 1º. Incorre na mesma pena quem:","I - vende, distribui ou expõe à venda ou ao público qualquer dos objetos referidos neste artigo;","II - realiza, em lugar público ou acessível ao público, representação teatral, ou exibição cinematográfica de caráter obsceno, ou qualquer outro espetáculo, que tenha o mesmo caráter;","III - realiza, em lugar público ou acessível ao público, ou pelo rádio, audição ou recitação de caráter obsceno."],"ti":13,"ch":"Do ultraje público ao pudor"},{"n":"234-A","t":"Aumento de pena: gravidez e doença","k":"aumento de pena","s":"Aumenta a pena dos crimes contra a dignidade sexual: de metade a 2/3 se do crime resulta gravidez. E de 1/3 a 2/3 se o agente transmite à vítima doença sexualmente transmissível que sabe ou deveria saber que tem, ou se a vítima é idosa ou pessoa com deficiência.","e":"Se a vítima de um crime sexual contrai uma doença sexualmente transmissível que o autor sabia ter, a pena aumenta de 1/3 a 2/3.","d":"Para a doença, basta que o agente saiba ou deveria saber que é portador; não é preciso querer transmitir. Os incisos I e II foram vetados, então só valem os incisos III e IV.","pena":"","rub":"Aumento de pena","caput":"Nos crimes previstos neste Título a pena é aumentada:","txt":["Art. 234-A. Nos crimes previstos neste Título a pena é aumentada:","I - (VETADO);","II - (VETADO);","III - de metade a 2/3 (dois terços), se do crime resulta gravidez;","IV - de 1/3 (um terço) a 2/3 (dois terços), se o agente transmite à vítima doença sexualmente transmissível de que sabe ou deveria saber ser portador, ou se a vítima é idosa ou pessoa com deficiência."],"ti":13,"ch":"Disposições gerais"},{"n":"234-B","t":"Segredo de justiça nos crimes sexuais","k":"segredo de justiça","s":"Os processos de crimes contra a dignidade sexual correm em segredo de justiça. Mas, após condenação em primeira instância por crimes como estupro, estupro de vulnerável e favorecimento da prostituição, o nome completo, o CPF do réu e a pena ficam públicos na consulta processual, e o condenado passa a ser monitorado por dispositivo eletrônico.","e":"Depois da sentença que condena um réu por estupro, qualquer pessoa pode consultar no site do tribunal o nome, o CPF e a pena dele.","d":"A publicidade começa já na condenação em primeira instância, mas o juiz pode manter o sigilo de forma fundamentada, e o sigilo volta se o réu for absolvido em recurso. A lista é fechada: importunação sexual e assédio sexual, por exemplo, ficam de fora.","pena":"","rub":"","caput":"Os processos em que se apuram crimes definidos neste Título correrão em segredo de justiça.","txt":["Art. 234-B. Os processos em que se apuram crimes definidos neste Título correrão em segredo de justiça.","§ 1º O sistema de consulta processual tornará de acesso público o nome completo do réu, seu número de inscrição no Cadastro de Pessoas Físicas (CPF) e a tipificação penal do fato a partir da condenação em primeira instância pelos crimes tipificados nos arts. 213, 216-B, 217-A, 218-B, 227, 228, 229 e 230 deste Código, inclusive com os dados da pena ou da medida de segurança imposta, ressalvada a possibilidade de o juiz fundamentadamente determinar a manutenção do sigilo.","§ 2º Caso o réu seja absolvido em grau recursal, será restabelecido o sigilo sobre as informações a que se refere o § 1º deste artigo.","§ 3º O réu condenado passará a ser monitorado por dispositivo eletrônico."],"ti":13,"ch":"Disposições gerais"},{"n":"234-C","t":"Dispositivo vetado","k":"vetado","s":"Este artigo foi vetado e não tem nenhum conteúdo em vigor.","e":"","d":"Não existe regra no art. 234-C: qualquer alternativa de prova que atribua conteúdo a ele está errada.","pena":"","rub":"","caput":"(VETADO).","txt":["Art. 234-C. (VETADO)."],"ti":13,"ch":"Disposições gerais"},{"n":"235","t":"Bigamia","k":"contrair","s":"Pune quem, já sendo casado, se casa de novo. Pena: reclusão, de dois a seis anos.","e":"Um homem casado no civil em Minas Gerais se muda para a Bahia e se casa novamente no cartório, escondendo o primeiro casamento.","d":"Quem não é casado, mas se casa com pessoa casada sabendo disso, tem pena menor: reclusão ou detenção, de um a três anos. Se o primeiro casamento for anulado por qualquer motivo, considera-se que o crime não existe.","pena":"Reclusão, de 2 a 6 anos.","rub":"Bigamia","caput":"Contrair alguém, sendo casado, novo casamento:","txt":["Art. 235 - Contrair alguém, sendo casado, novo casamento:","Pena - reclusão, de dois a seis anos.","§ 1º - Aquele que, não sendo casado, contrai casamento com pessoa casada, conhecendo essa circunstância, é punido com reclusão ou detenção, de um a três anos.","§ 2º - Anulado por qualquer motivo o primeiro casamento, ou o outro por motivo que não a bigamia, considera-se inexistente o crime."],"ti":14,"ch":"Dos crimes contra o casamento"},{"n":"236","t":"Induzimento a erro essencial","k":"induzir em erro","s":"Pune quem se casa enganando o outro sobre algo essencial ou escondendo dele um impedimento que não seja casamento anterior. Pena: detenção, de seis meses a dois anos.","e":"Um homem se casa usando nome e história de vida inventados, enganando a noiva sobre quem ele realmente é.","d":"A ação penal depende de queixa do cônjuge enganado e só pode começar depois que a sentença que anula o casamento transitar em julgado (não couber mais recurso). Se o impedimento escondido for casamento anterior, o crime é bigamia.","pena":"Detenção, de 6 meses a 2 anos.","rub":"Induzimento a erro essencial e ocultação de impedimento","caput":"Contrair casamento, induzindo em erro essencial o outro contraente, ou ocultando-lhe impedimento que não seja casamento anterior:","txt":["Art. 236 - Contrair casamento, induzindo em erro essencial o outro contraente, ou ocultando-lhe impedimento que não seja casamento anterior:","Pena - detenção, de seis meses a dois anos.","Parágrafo único - A ação penal depende de queixa do contraente enganado e não pode ser intentada senão depois de transitar em julgado a sentença que, por motivo de erro ou impedimento, anule o casamento."],"ti":14,"ch":"Dos crimes contra o casamento"},{"n":"237","t":"Conhecimento prévio de impedimento","k":"contrair casamento","s":"Pune quem se casa sabendo que existe um impedimento que torna o casamento absolutamente nulo. Pena: detenção, de três meses a um ano.","e":"Dois irmãos que sabem do parentesco escondem a relação no cartório e se casam.","d":"Aqui basta o agente saber do impedimento, sem precisar enganar o outro; e o impedimento deve causar nulidade absoluta. Se o impedimento for casamento anterior, o crime é bigamia, mais grave.","pena":"Detenção, de 3 meses a 1 ano.","rub":"Conhecimento prévio de impedimento","caput":"Contrair casamento, conhecendo a existência de impedimento que lhe cause a nulidade absoluta:","txt":["Art. 237 - Contrair casamento, conhecendo a existência de impedimento que lhe cause a nulidade absoluta:","Pena - detenção, de três meses a um ano."],"ti":14,"ch":"Dos crimes contra o casamento"},{"n":"238","t":"Simulação de autoridade para casamento","k":"atribuir-se falsamente","s":"Pune quem finge ter autoridade para celebrar casamento, como um falso juiz de paz. Pena: detenção, de um a três anos, se o fato não constitui crime mais grave.","e":"Um homem se apresenta como juiz de paz e conduz a cerimônia de um casal que acredita estar se casando de verdade.","d":"É crime subsidiário: só se aplica se não houver crime mais grave. Não confunda com simulação de casamento: aqui quem mente é o falso celebrante; lá, quem simula o casamento engana outra pessoa.","pena":"Detenção, de 1 a 3 anos, se o fato não constitui crime mais grave.","rub":"Simulação de autoridade para celebração de casamento","caput":"Atribuir-se falsamente autoridade para celebração de casamento:","txt":["Art. 238 - Atribuir-se falsamente autoridade para celebração de casamento:","Pena - detenção, de um a três anos, se o fato não constitui crime mais grave."],"ti":14,"ch":"Dos crimes contra o casamento"},{"n":"239","t":"Simulação de casamento","k":"simular","s":"Pune quem finge um casamento enganando outra pessoa, que acredita estar se casando de verdade. Pena: detenção, de um a três anos, se o fato não constitui elemento de crime mais grave.","e":"Um homem organiza uma cerimônia falsa, com celebrante contratado, para convencer a namorada de que estão casados.","d":"Também é subsidiário: se a simulação for parte de um crime mais grave, como um estelionato, responde-se pelo mais grave. Exige que outra pessoa seja enganada.","pena":"Detenção, de 1 a 3 anos, se o fato não constitui elemento de crime mais grave.","rub":"Simulação de casamento","caput":"Simular casamento mediante engano de outra pessoa:","txt":["Art. 239 - Simular casamento mediante engano de outra pessoa:","Pena - detenção, de um a três anos, se o fato não constitui elemento de crime mais grave."],"ti":14,"ch":"Dos crimes contra o casamento"},{"n":"241","t":"Registro de nascimento inexistente","k":"promover inscrição","s":"Pune quem registra no cartório o nascimento de uma criança que nunca nasceu. Pena: reclusão, de dois a seis anos.","e":"Uma pessoa registra um filho que não existe para receber benefício social em nome dele.","d":"O nascimento precisa ser inexistente; registrar como seu o filho de outra pessoa, que existe, é o crime do artigo seguinte.","pena":"Reclusão, de 2 a 6 anos.","rub":"Registro de nascimento inexistente","caput":"Promover no registro civil a inscrição de nascimento inexistente:","txt":["Art. 241 - Promover no registro civil a inscrição de nascimento inexistente:","Pena - reclusão, de dois a seis anos."],"ti":14,"ch":"Dos crimes contra o estado de filiação"},{"n":"242","t":"Parto suposto e alteração de estado","k":"registrar como seu","s":"Pune quem apresenta parto de outra mulher como próprio, registra como seu o filho de outra pessoa, ou esconde ou troca recém-nascido, suprimindo ou alterando seus direitos ligados ao estado civil. Pena: reclusão, de dois a seis anos.","e":"Um casal registra como filho biológico um bebê entregue pela mãe, sem passar pelo processo de adoção.","d":"Se o crime é praticado por motivo de reconhecida nobreza, a pena cai para detenção, de um a dois anos, e o juiz pode deixar de aplicá-la. É o caso típico da chamada adoção à brasileira.","pena":"Reclusão, de 2 a 6 anos.","rub":"Parto suposto. Supressão ou alteração de direito inerente ao estado civil de recém-nascido","caput":"Dar parto alheio como próprio; registrar como seu o filho de outrem; ocultar recém-nascido ou substituí-lo, suprimindo ou alterando direito inerente ao estado civil:","txt":["Art. 242 - Dar parto alheio como próprio; registrar como seu o filho de outrem; ocultar recém-nascido ou substituí-lo, suprimindo ou alterando direito inerente ao estado civil:","Pena - reclusão, de dois a seis anos.","Parágrafo único - Se o crime é praticado por motivo de reconhecida nobreza:","Pena - detenção, de um a dois anos, podendo o juiz deixar de aplicar a pena."],"ti":14,"ch":"Dos crimes contra o estado de filiação"},{"n":"243","t":"Sonegação de estado de filiação","k":"ocultar filiação","s":"Pune quem deixa filho, próprio ou de outra pessoa, em abrigo ou instituição de assistência, escondendo sua filiação ou atribuindo-lhe outra, para prejudicar seus direitos de estado civil. Pena: reclusão, de um a cinco anos, e multa.","e":"Um pai deixa o filho num abrigo dizendo que é filho de desconhecidos, para que a criança não possa reivindicar a herança dele.","d":"Exige a finalidade de prejudicar direito ligado ao estado civil; deixar a criança na instituição sem esconder ou trocar a filiação não é este crime.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Sonegação de estado de filiação","caput":"Deixar em asilo de expostos ou outra instituição de assistência filho próprio ou alheio, ocultando-lhe a filiação ou atribuindo-lhe outra, com o fim de prejudicar direito inerente ao estado civil:","txt":["Art. 243 - Deixar em asilo de expostos ou outra instituição de assistência filho próprio ou alheio, ocultando-lhe a filiação ou atribuindo-lhe outra, com o fim de prejudicar direito inerente ao estado civil:","Pena - reclusão, de um a cinco anos, e multa."],"ti":14,"ch":"Dos crimes contra o estado de filiação"},{"n":"244","t":"Abandono material","k":"deixar de prover","s":"Pune quem, sem justa causa, deixa de sustentar cônjuge, filho menor de 18 anos ou inapto para o trabalho, ou ascendente inválido ou maior de 60 anos, inclusive deixando de pagar pensão alimentícia fixada pela Justiça; ou deixa de socorrer descendente ou ascendente gravemente doente. Pena: detenção, de 1 a 4 anos e multa, de uma a dez vezes o maior salário mínimo vigente no País.","e":"Um pai com bom salário deixa de pagar por meses a pensão que o juiz fixou para o filho pequeno.","d":"Também responde quem, tendo condições (solvente), frustra o pagamento da pensão de qualquer modo, inclusive largando o emprego sem justificativa. A multa tem cálculo próprio: de uma a dez vezes o maior salário mínimo.","pena":"Detenção, de 1 a 4 anos e multa, de 1 a dez vezes o maior salário mínimo vigente no País.","rub":"Abandono material","caput":"Deixar, sem justa causa, de prover a subsistência do cônjuge, ou de filho menor de 18 (dezoito) anos ou inapto para o trabalho, ou de ascendente inválido ou maior de 60 (sessenta) anos, não lhes proporcionando os recursos necessários ou faltando ao pagamento de pensão alimentícia judicialmente acordada, fixada ou majorada; deixar, sem justa causa, de socorrer descendente ou ascendente, gravemente enfermo:","txt":["Art. 244. Deixar, sem justa causa, de prover a subsistência do cônjuge, ou de filho menor de 18 (dezoito) anos ou inapto para o trabalho, ou de ascendente inválido ou maior de 60 (sessenta) anos, não lhes proporcionando os recursos necessários ou faltando ao pagamento de pensão alimentícia judicialmente acordada, fixada ou majorada; deixar, sem justa causa, de socorrer descendente ou ascendente, gravemente enfermo:","Pena - detenção, de 1 (um) a 4 (quatro) anos e multa, de uma a dez vezes o maior salário mínimo vigente no País.","Parágrafo único - Nas mesmas penas incide quem, sendo solvente, frustra ou ilide, de qualquer modo, inclusive por abandono injustificado de emprego ou função, o pagamento de pensão alimentícia judicialmente acordada, fixada ou majorada."],"ti":14,"ch":"Dos crimes contra a assistência familiar"},{"n":"245","t":"Entrega de filho a pessoa inidônea","k":"entregar","s":"Pune quem entrega filho menor de 18 anos a pessoa com quem sabe ou deveria saber que ele ficará em perigo moral ou material. Pena: detenção, de 1 a 2 anos.","e":"Uma mãe deixa o filho morando com um vizinho que ela sabe usar a casa para vender drogas.","d":"A pena passa a reclusão, de 1 a 4 anos, se o agente busca lucro ou se o menor é enviado para o exterior. Quem ajuda, por lucro, a enviar menor ao exterior responde mesmo sem perigo moral ou material.","pena":"Detenção, de 1 a 2 anos.","rub":"Entrega de filho menor a pessoa inidônea","caput":"Entregar filho menor de 18 (dezoito) anos a pessoa em cuja companhia saiba ou deva saber que o menor fica moral ou materialmente em perigo:","txt":["Art. 245 - Entregar filho menor de 18 (dezoito) anos a pessoa em cuja companhia saiba ou deva saber que o menor fica moral ou materialmente em perigo:","Pena - detenção, de 1 (um) a 2 (dois) anos.","§ 1º - A pena é de 1 (um) a 4 (quatro) anos de reclusão, se o agente pratica delito para obter lucro, ou se o menor é enviado para o exterior.","§ 2º - Incorre, também, na pena do parágrafo anterior quem, embora excluído o perigo moral ou material, auxilia a efetivação de ato destinado ao envio de menor para o exterior, com o fito de obter lucro."],"ti":14,"ch":"Dos crimes contra a assistência familiar"},{"n":"246","t":"Abandono intelectual","k":"deixar de prover","s":"Pune quem, sem justa causa, deixa de garantir a instrução primária (o ensino básico) ao filho em idade escolar. Pena: detenção, de quinze dias a um mês, ou multa.","e":"Pais que moram perto da escola mantêm o filho em idade escolar em casa, sem matrícula, apenas por desinteresse.","d":"A expressão sem justa causa é parte do crime: se não houve matrícula por falta de vaga ou de condições reais, não há crime. Não confunda com abandono material, que é deixar de sustentar.","pena":"Detenção, de 15 dias a 1 mês, ou multa.","rub":"Abandono intelectual","caput":"Deixar, sem justa causa, de prover à instrução primária de filho em idade escolar:","txt":["Art. 246 - Deixar, sem justa causa, de prover à instrução primária de filho em idade escolar:","Pena - detenção, de quinze dias a um mês, ou multa."],"ti":14,"ch":"Dos crimes contra a assistência familiar"},{"n":"247","t":"Abandono moral de menor","k":"permitir","s":"Pune quem permite que menor de dezoito anos sob seu poder, guarda ou vigilância frequente casa de jogo ou mal-afamada, conviva com pessoa viciosa, frequente espetáculo impróprio, more ou trabalhe em casa de prostituição, ou mendigue. Pena: detenção, de um a três meses, ou multa.","e":"Um pai permite que o filho adolescente peça esmolas no semáforo para despertar pena dos motoristas.","d":"O verbo é permitir: só responde quem tem o menor sob seu poder, guarda ou vigilância e tolera a situação. As situações estão listadas nos incisos e a lista é fechada.","pena":"","rub":"","caput":"Permitir alguém que menor de dezoito anos, sujeito a seu poder ou confiado à sua guarda ou vigilância:","txt":["Art. 247 - Permitir alguém que menor de dezoito anos, sujeito a seu poder ou confiado à sua guarda ou vigilância:","I - freqüente casa de jogo ou mal-afamada, ou conviva com pessoa viciosa ou de má vida;","II - freqüente espetáculo capaz de pervertê-lo ou de ofender-lhe o pudor, ou participe de representação de igual natureza;","III - resida ou trabalhe em casa de prostituição;","IV - mendigue ou sirva a mendigo para excitar a comiseração pública:","Pena - detenção, de um a três meses, ou multa."],"ti":14,"ch":"Dos crimes contra a assistência familiar"},{"n":"248","t":"Induzimento a fuga de incapazes","k":"induzir a fugir","s":"Pune quem induz menor de dezoito anos ou interdito (pessoa declarada incapaz pela Justiça) a fugir de onde deve estar; quem o entrega a outra pessoa sem ordem do pai, tutor ou curador; ou quem, sem justa causa, não o devolve a quem legitimamente o reclama. Pena: detenção, de um mês a um ano, ou multa.","e":"Após o fim de semana de visita, o pai se recusa, sem justificativa, a devolver o filho à mãe que tem a guarda.","d":"Aqui o agente convence o menor a fugir, o entrega a terceiro ou deixa de devolvê-lo. Tirar o menor de quem tem a guarda é subtração de incapazes, o crime do artigo seguinte.","pena":"Detenção, de 1 mês a 1 ano, ou multa.","rub":"Induzimento a fuga, entrega arbitrária ou sonegação de incapazes","caput":"Induzir menor de dezoito anos, ou interdito, a fugir do lugar em que se acha por determinação de quem sobre ele exerce autoridade, em virtude de lei ou de ordem judicial; confiar a outrem sem ordem do pai, do tutor ou do curador algum menor de dezoito anos ou interdito, ou deixar, sem justa causa, de entregá-lo a quem legitimamente o reclame:","txt":["Art. 248 - Induzir menor de dezoito anos, ou interdito, a fugir do lugar em que se acha por determinação de quem sobre ele exerce autoridade, em virtude de lei ou de ordem judicial; confiar a outrem sem ordem do pai, do tutor ou do curador algum menor de dezoito anos ou interdito, ou deixar, sem justa causa, de entregá-lo a quem legitimamente o reclame:","Pena - detenção, de um mês a um ano, ou multa."],"ti":14,"ch":"Dos crimes contra o pátrio poder, tutela ou curatela"},{"n":"249","t":"Subtração de incapazes","k":"subtrair","s":"Pune quem tira menor de dezoito anos ou interdito do poder de quem tem sua guarda por lei ou ordem judicial. Pena: detenção, de dois meses a dois anos, se o fato não constitui elemento de outro crime.","e":"Uma mãe que perdeu a guarda pega o filho na saída da escola e o leva para outra cidade sem autorização.","d":"Até pai, tutor ou curador pode cometer o crime se tiver sido destituído ou privado temporariamente do poder familiar, tutela, curatela ou guarda. Se o menor for devolvido sem ter sofrido maus-tratos ou privações, o juiz pode deixar de aplicar a pena.","pena":"Detenção, de 2 meses a 2 anos, se o fato não constitui elemento de outro crime.","rub":"Subtração de incapazes","caput":"Subtrair menor de dezoito anos ou interdito ao poder de quem o tem sob sua guarda em virtude de lei ou de ordem judicial:","txt":["Art. 249 - Subtrair menor de dezoito anos ou interdito ao poder de quem o tem sob sua guarda em virtude de lei ou de ordem judicial:","Pena - detenção, de dois meses a dois anos, se o fato não constitui elemento de outro crime.","§ 1º - O fato de ser o agente pai ou tutor do menor ou curador do interdito não o exime de pena, se destituído ou temporariamente privado do pátrio poder, tutela, curatela ou guarda.","§ 2º - No caso de restituição do menor ou do interdito, se este não sofreu maus-tratos ou privações, o juiz pode deixar de aplicar pena."],"ti":14,"ch":"Dos crimes contra o pátrio poder, tutela ou curatela"},{"n":"250","t":"Incêndio","k":"causar incêndio","s":"Pune quem provoca incêndio que coloca em perigo a vida, a integridade física ou o patrimônio de outras pessoas. Pena: reclusão, de três a seis anos, e multa.","e":"Por vingança, um homem põe fogo no carro do vizinho estacionado na garagem do prédio, colocando os moradores em risco.","d":"É crime de perigo: precisa expor outras pessoas ou bens a perigo. A pena aumenta de um terço se há intuito de vantagem pecuniária ou se o fogo atinge locais como casa habitada, mata ou transporte coletivo, e existe forma culposa, com detenção de 6 meses a 2 anos.","pena":"Reclusão, de 3 a 6 anos, e multa.","rub":"Incêndio","caput":"Causar incêndio, expondo a perigo a vida, a integridade física ou o patrimônio de outrem:","txt":["Art. 250 - Causar incêndio, expondo a perigo a vida, a integridade física ou o patrimônio de outrem:","Pena - reclusão, de três a seis anos, e multa.","Aumento de pena","§ 1º - As penas aumentam-se de um terço:","I - se o crime é cometido com intuito de obter vantagem pecuniária em proveito próprio ou alheio;","II - se o incêndio é:","a) em casa habitada ou destinada a habitação;","b) em edifício público ou destinado a uso público ou a obra de assistência social ou de cultura;","c) em embarcação, aeronave, comboio ou veículo de transporte coletivo;","d) em estação ferroviária ou aeródromo;","e) em estaleiro, fábrica ou oficina;","f) em depósito de explosivo, combustível ou inflamável;","g) em poço petrolífico ou galeria de mineração;","h) em lavoura, pastagem, mata ou floresta.","Incêndio culposo","§ 2º - Se culposo o incêndio, é pena de detenção, de 6 (seis) meses a 2 (dois) anos."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"251","t":"Explosão","k":"expor a perigo","s":"Pune quem expõe a perigo a vida, a integridade física ou o patrimônio de outros com explosão, arremesso ou simples colocação de dinamite ou substância de efeito parecido. Pena: reclusão, de três a seis anos, e multa.","e":"Criminosos colocam dinamite num caixa eletrônico de madrugada, colocando em risco os moradores próximos.","d":"Basta a simples colocação do explosivo, mesmo sem explodir. Se a substância não é dinamite nem de efeito análogo, a pena cai para um a quatro anos; na forma culposa, é detenção de 6 meses a 2 anos com dinamite, ou de 3 meses a 1 ano nos demais casos.","pena":"Reclusão, de 3 a 6 anos, e multa.","rub":"Explosão","caput":"Expor a perigo a vida, a integridade física ou o patrimônio de outrem, mediante explosão, arremesso ou simples colocação de engenho de dinamite ou de substância de efeitos análogos:","txt":["Art. 251 - Expor a perigo a vida, a integridade física ou o patrimônio de outrem, mediante explosão, arremesso ou simples colocação de engenho de dinamite ou de substância de efeitos análogos:","Pena - reclusão, de três a seis anos, e multa.","§ 1º - Se a substância utilizada não é dinamite ou explosivo de efeitos análogos:","Pena - reclusão, de um a quatro anos, e multa.","Aumento de pena","§ 2º - As penas aumentam-se de um terço, se ocorre qualquer das hipóteses previstas no § 1º, I, do artigo anterior, ou é visada ou atingida qualquer das coisas enumeradas no nº II do mesmo parágrafo.","Modalidade culposa","§ 3º - No caso de culpa, se a explosão é de dinamite ou substância de efeitos análogos, a pena é de detenção, de 6 (seis) meses a 2 (dois) anos; nos demais casos, é de detenção, de 3 (três) meses a 1 (um) ano."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"252","t":"Uso de gás tóxico ou asfixiante","k":"expor a perigo","s":"Pune quem coloca em perigo a vida, a integridade física ou o patrimônio de outras pessoas usando gás tóxico ou asfixiante. Pena: reclusão, de um a quatro anos, e multa.","e":"Uma pessoa solta gás tóxico no sistema de ventilação de um shopping lotado.","d":"Admite forma culposa, com pena de detenção, de três meses a um ano. É crime de perigo: não é preciso que alguém se machuque.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Uso de gás tóxico ou asfixiante","caput":"Expor a perigo a vida, a integridade física ou o patrimônio de outrem, usando de gás tóxico ou asfixiante:","txt":["Art. 252 - Expor a perigo a vida, a integridade física ou o patrimônio de outrem, usando de gás tóxico ou asfixiante:","Pena - reclusão, de um a quatro anos, e multa.","Modalidade Culposa","Parágrafo único - Se o crime é culposo:","Pena - detenção, de três meses a um ano."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"253","t":"Explosivos ou gás tóxico","k":"fabricar, possuir ou transportar","s":"Proíbe fabricar, fornecer, comprar, guardar ou transportar explosivo, gás tóxico ou asfixiante (que sufoca), ou o material para fazê-los, sem licença da autoridade. A pena é detenção, de 6 meses a 2 anos, e multa.","e":"Um homem guarda dinamite em casa, sem nenhuma licença, para vender a garimpeiros clandestinos.","d":"O crime existe mesmo sem explosão ou perigo concreto: basta ter ou transportar o material sem licença. Não confunda com o crime de explosão, que exige expor pessoas ou bens a perigo.","pena":"Detenção, de 6 meses a 2 anos, e multa.","rub":"Fabrico, fornecimento, aquisição posse ou transporte de explosivos ou gás tóxico, ou asfixiante","caput":"Fabricar, fornecer, adquirir, possuir ou transportar, sem licença da autoridade, substância ou engenho explosivo, gás tóxico ou asfixiante, ou material destinado à sua fabricação:","txt":["Art. 253 - Fabricar, fornecer, adquirir, possuir ou transportar, sem licença da autoridade, substância ou engenho explosivo, gás tóxico ou asfixiante, ou material destinado à sua fabricação:","Pena - detenção, de seis meses a dois anos, e multa."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"254","t":"Inundação","k":"causar inundação","s":"Pune quem provoca uma inundação que põe em perigo a vida, a saúde ou os bens de outras pessoas. Se foi de propósito, a pena é reclusão, de 3 a 6 anos, e multa; se foi por descuido (culpa), detenção, de 6 meses a 2 anos.","e":"Um fazendeiro abre de propósito as comportas de um açude e alaga as casas da vizinhança.","d":"A própria cabeça do artigo já traz as duas penas, dolosa e culposa, sem parágrafo separado. E a forma culposa não tem multa.","pena":"Reclusão, de 3 a 6 anos, e multa, no caso de dolo, ou detenção, de 6 meses a 2 anos, no caso de culpa.","rub":"Inundação","caput":"Causar inundação, expondo a perigo a vida, a integridade física ou o patrimônio de outrem:","txt":["Art. 254 - Causar inundação, expondo a perigo a vida, a integridade física ou o patrimônio de outrem:","Pena - reclusão, de três a seis anos, e multa, no caso de dolo, ou detenção, de seis meses a dois anos, no caso de culpa."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"255","t":"Perigo de inundação","k":"remover, destruir ou inutilizar","s":"Pune quem remove, destrói ou inutiliza uma barreira natural ou obra feita para impedir enchentes, expondo pessoas ou bens a perigo, mesmo que o terreno seja do próprio agente. A pena é reclusão, de 1 a 3 anos, e multa.","e":"Um dono de sítio derruba o dique que protegia o bairro vizinho das cheias do rio.","d":"Aqui a inundação ainda não aconteceu: se ela ocorrer, o crime passa a ser o de inundação. Vale também em prédio próprio, e não há forma culposa.","pena":"Reclusão, de 1 a 3 anos, e multa.","rub":"Perigo de inundação","caput":"Remover, destruir ou inutilizar, em prédio próprio ou alheio, expondo a perigo a vida, a integridade física ou o patrimônio de outrem, obstáculo natural ou obra destinada a impedir inundação:","txt":["Art. 255 - Remover, destruir ou inutilizar, em prédio próprio ou alheio, expondo a perigo a vida, a integridade física ou o patrimônio de outrem, obstáculo natural ou obra destinada a impedir inundação:","Pena - reclusão, de um a três anos, e multa."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"256","t":"Desabamento ou desmoronamento","k":"causar desabamento","s":"Pune quem provoca a queda de construção ou de terra, pondo em perigo a vida, a saúde ou os bens de outras pessoas. A pena é reclusão, de 1 a 4 anos, e multa.","e":"Um construtor retira colunas de sustentação de um prédio para ganhar espaço e parte da estrutura desaba sobre a calçada.","d":"Existe forma culposa (por descuido), com pena de detenção, de 6 meses a 1 ano, sem multa. Esse é o caso mais comum em obras feitas sem cuidado técnico.","pena":"Reclusão, de 1 a 4 anos, e multa.","rub":"Desabamento ou desmoronamento","caput":"Causar desabamento ou desmoronamento, expondo a perigo a vida, a integridade física ou o patrimônio de outrem:","txt":["Art. 256 - Causar desabamento ou desmoronamento, expondo a perigo a vida, a integridade física ou o patrimônio de outrem:","Pena - reclusão, de um a quatro anos, e multa.","Modalidade culposa","Parágrafo único - Se o crime é culposo:","Pena - detenção, de seis meses a um ano."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"257","t":"Subtração de material de salvamento","k":"subtrair, ocultar ou inutilizar","s":"Pune quem, durante incêndio, enchente, naufrágio ou outra tragédia, furta, esconde ou estraga equipamento de socorro, ou atrapalha o trabalho de salvamento. A pena é reclusão, de 2 a 5 anos, e multa.","e":"Durante um incêndio num prédio, alguém esconde os extintores para que os bombeiros não os encontrem.","d":"O crime só existe se a conduta ocorre por ocasião de desastre ou calamidade. Também é crime apenas impedir ou dificultar o socorro, sem mexer em equipamento algum.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Subtração, ocultação ou inutilização de material de salvamento","caput":"Subtrair, ocultar ou inutilizar, por ocasião de incêndio, inundação, naufrágio, ou outro desastre ou calamidade, aparelho, material ou qualquer meio destinado a serviço de combate ao perigo, de socorro ou salvamento; ou impedir ou dificultar serviço de tal natureza:","txt":["Art. 257 - Subtrair, ocultar ou inutilizar, por ocasião de incêndio, inundação, naufrágio, ou outro desastre ou calamidade, aparelho, material ou qualquer meio destinado a serviço de combate ao perigo, de socorro ou salvamento; ou impedir ou dificultar serviço de tal natureza:","Pena - reclusão, de dois a cinco anos, e multa."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"258","t":"Formas qualificadas de perigo comum","k":"resultado lesão ou morte","s":"Aumenta a pena dos crimes de perigo comum quando alguém se fere gravemente ou morre. No crime doloso, lesão grave aumenta a pena de metade e morte a dobra; no culposo, qualquer lesão aumenta de metade e a morte leva à pena do homicídio culposo aumentada de um terço.","e":"Se um incêndio provocado de propósito causa a morte de um morador, a pena do incêndio é aplicada em dobro.","d":"No crime doloso, só lesão grave aumenta a pena; no culposo, basta lesão corporal de qualquer tipo. E na morte culposa não se dobra a pena: usa-se a do homicídio culposo, aumentada de um terço.","pena":"","rub":"Formas qualificadas de crime de perigo comum","caput":"Se do crime doloso de perigo comum resulta lesão corporal de natureza grave, a pena privativa de liberdade é aumentada de metade; se resulta morte, é aplicada em dobro. No caso de culpa, se do fato resulta lesão corporal, a pena aumenta-se de metade; se resulta morte, aplica-se a pena cominada ao homicídio culposo, aumentada de um terço.","txt":["Art. 258 - Se do crime doloso de perigo comum resulta lesão corporal de natureza grave, a pena privativa de liberdade é aumentada de metade; se resulta morte, é aplicada em dobro. No caso de culpa, se do fato resulta lesão corporal, a pena aumenta-se de metade; se resulta morte, aplica-se a pena cominada ao homicídio culposo, aumentada de um terço."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"259","t":"Difusão de doença ou praga","k":"difundir","s":"Pune quem espalha doença ou praga capaz de prejudicar florestas, plantações ou animais de valor econômico. A pena é reclusão, de 2 a 5 anos, e multa.","e":"Um produtor solta de propósito insetos infectados na lavoura de café do concorrente.","d":"Na forma culposa, a pena é detenção, de 1 a 6 meses, ou multa (alternativa, não as duas). O crime protege florestas, plantações e animais de utilidade econômica, e não a saúde das pessoas.","pena":"Reclusão, de 2 a 5 anos, e multa.","rub":"Difusão de doença ou praga","caput":"Difundir doença ou praga que possa causar dano a floresta, plantação ou animais de utilidade econômica:","txt":["Art. 259 - Difundir doença ou praga que possa causar dano a floresta, plantação ou animais de utilidade econômica:","Pena - reclusão, de dois a cinco anos, e multa.","Modalidade culposa","Parágrafo único - No caso de culpa, a pena é de detenção, de um a seis meses, ou multa."],"ti":15,"ch":"Dos crimes de perigo comum"},{"n":"260","t":"Perigo de desastre ferroviário","k":"impedir ou perturbar","s":"Pune quem impede ou atrapalha o serviço de trem, por exemplo danificando trilhos, colocando obstáculo na linha ou dando falso aviso sobre o movimento dos veículos. A pena é reclusão, de 2 a 5 anos, e multa.","e":"Um jovem coloca pedras grandes sobre os trilhos do trem metropolitano para ver o que acontece.","d":"Se o desastre de fato acontece, a pena sobe para reclusão, de 4 a 12 anos, e multa; a forma culposa só é punida se houver desastre. Para a lei, estrada de ferro inclui qualquer veículo de tração mecânica em trilhos ou por cabo aéreo, como bondinho e metrô.","pena":"","rub":"Perigo de desastre ferroviário","caput":"Impedir ou perturbar serviço de estrada de ferro:","txt":["Art. 260 - Impedir ou perturbar serviço de estrada de ferro:","I - destruindo, danificando ou desarranjando, total ou parcialmente, linha férrea, material rodante ou de tração, obra-de-arte ou instalação;","II - colocando obstáculo na linha;","III - transmitindo falso aviso acerca do movimento dos veículos ou interrompendo ou embaraçando o funcionamento de telégrafo, telefone ou radiotelegrafia;","IV - praticando outro ato de que possa resultar desastre:","Pena - reclusão, de dois a cinco anos, e multa.","Desastre ferroviário","§ 1º - Se do fato resulta desastre:","Pena - reclusão, de quatro a doze anos e multa.","§ 2º - No caso de culpa, ocorrendo desastre:","Pena - detenção, de seis meses a dois anos.","§ 3º - Para os efeitos deste artigo, entende-se por estrada de ferro qualquer via de comunicação em que circulem veículos de tração mecânica, em trilhos ou por meio de cabo aéreo."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"261","t":"Atentado a transporte marítimo ou aéreo","k":"expor a perigo","s":"Pune quem põe em perigo navio, barco ou avião, mesmo que seja seu, ou faz algo para impedir ou dificultar a navegação por mar, rio ou ar. A pena é reclusão, de 2 a 5 anos.","e":"Uma pessoa aponta um laser potente para a cabine de um avião durante o pouso.","d":"Se resultar naufrágio, encalhe ou queda de aeronave, a pena é reclusão, de 4 a 12 anos. A multa só entra se o agente agiu para obter vantagem econômica.","pena":"Reclusão, de 2 a 5 anos.","rub":"Atentado contra a segurança de transporte marítimo, fluvial ou aéreo","caput":"Expor a perigo embarcação ou aeronave, própria ou alheia, ou praticar qualquer ato tendente a impedir ou dificultar navegação marítima, fluvial ou aérea:","txt":["Art. 261 - Expor a perigo embarcação ou aeronave, própria ou alheia, ou praticar qualquer ato tendente a impedir ou dificultar navegação marítima, fluvial ou aérea:","Pena - reclusão, de dois a cinco anos.","Sinistro em transporte marítimo, fluvial ou aéreo","§ 1º - Se do fato resulta naufrágio, submersão ou encalhe de embarcação ou a queda ou destruição de aeronave:","Pena - reclusão, de quatro a doze anos.","Prática do crime com o fim de lucro","§ 2º - Aplica-se, também, a pena de multa, se o agente pratica o crime com intuito de obter vantagem econômica, para si ou para outrem.","Modalidade culposa","§ 3º - No caso de culpa, se ocorre o sinistro:","Pena - detenção, de seis meses a dois anos."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"262","t":"Atentado contra outro meio de transporte","k":"expor a perigo","s":"Pune quem põe em perigo outro meio de transporte público (como ônibus), ou impede ou dificulta seu funcionamento. A pena é detenção, de 1 a 2 anos.","e":"Um grupo bloqueia e danifica os freios de um ônibus urbano estacionado na garagem antes da saída.","d":"A pena simples é de detenção, mas se resulta desastre vira reclusão, de 2 a 5 anos. Na forma culposa com desastre, a pena é detenção, de 3 meses a 1 ano.","pena":"Detenção, de 1 a 2 anos.","rub":"Atentado contra a segurança de outro meio de transporte","caput":"Expor a perigo outro meio de transporte público, impedir-lhe ou dificultar-lhe o funcionamento:","txt":["Art. 262 - Expor a perigo outro meio de transporte público, impedir-lhe ou dificultar-lhe o funcionamento:","Pena - detenção, de um a dois anos.","§ 1º - Se do fato resulta desastre, a pena é de reclusão, de dois a cinco anos.","§ 2º - No caso de culpa, se ocorre desastre:","Pena - detenção, de três meses a um ano."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"263","t":"Forma qualificada","k":"lesão ou morte","s":"Diz que, nos crimes contra trens e outros transportes (arts. 260 a 262), se o desastre ou sinistro causar lesão ou morte, aplicam-se os aumentos de pena do art. 258.","e":"Se um descarrilamento provocado de propósito mata passageiros, a pena do desastre ferroviário é aplicada em dobro, conforme o art. 258.","d":"O artigo não cria pena nova: apenas manda aplicar o art. 258. E só vale quando houve desastre ou sinistro, não no mero perigo.","pena":"","rub":"Forma qualificada","caput":"Se de qualquer dos crimes previstos nos arts. 260 a 262, no caso de desastre ou sinistro, resulta lesão corporal ou morte, aplica-se o disposto no art. 258.","txt":["Art. 263 - Se de qualquer dos crimes previstos nos arts. 260 a 262, no caso de desastre ou sinistro, resulta lesão corporal ou morte, aplica-se o disposto no art. 258."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"264","t":"Arremesso de projétil","k":"arremessar","s":"Pune quem atira objeto contra veículo de transporte público em movimento, seja por terra, água ou ar. A pena é detenção, de 1 a 6 meses.","e":"Um adolescente joga uma pedra contra um ônibus lotado que passava pela avenida.","d":"O veículo precisa estar em movimento e ser de transporte público; pedra em carro particular não entra aqui. Se houver lesão, a pena é detenção, de 6 meses a 2 anos; se houver morte, a do homicídio culposo aumentada de um terço.","pena":"Detenção, de 1 a 6 meses.","rub":"Arremesso de projétil","caput":"Arremessar projétil contra veículo, em movimento, destinado ao transporte público por terra, por água ou pelo ar:","txt":["Art. 264 - Arremessar projétil contra veículo, em movimento, destinado ao transporte público por terra, por água ou pelo ar:","Pena - detenção, de um a seis meses.","Parágrafo único - Se do fato resulta lesão corporal, a pena é de detenção, de 6 (seis) meses a 2 (dois) anos; se resulta morte, a pena é a do art. 121, § 3º, aumentada de um terço."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"265","t":"Atentado contra serviço de utilidade pública","k":"atentar","s":"Pune quem ataca a segurança ou o funcionamento de serviço de água, luz, força, calor ou outro de utilidade pública. A pena é reclusão, de 1 a 5 anos, e multa.","e":"Uma pessoa sabota a estação de bombeamento que abastece de água um bairro inteiro.","d":"A pena aumenta de 1/3 até a metade se o dano vier do furto de material essencial ao serviço, como cabos de energia. Serviço de telefone e internet tem crime próprio, no artigo seguinte.","pena":"Reclusão, de 1 a 5 anos, e multa.","rub":"Atentado contra a segurança de serviço de utilidade pública","caput":"Atentar contra a segurança ou o funcionamento de serviço de água, luz, força ou calor, ou qualquer outro de utilidade pública:","txt":["Art. 265 - Atentar contra a segurança ou o funcionamento de serviço de água, luz, força ou calor, ou qualquer outro de utilidade pública:","Pena - reclusão, de um a cinco anos, e multa.","Parágrafo único - Aumentar-se-á a pena de 1/3 (um terço) até a metade, se o dano ocorrer em virtude de subtração de material essencial ao funcionamento dos serviços."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"266","t":"Interrupção de serviço telefônico ou informático","k":"interromper ou perturbar","s":"Pune quem interrompe ou atrapalha serviço telegráfico, radiotelegráfico ou telefônico, ou impede que ele volte a funcionar. A pena é reclusão, de 2 a 4 anos, e multa. A mesma pena vale para quem interrompe serviço telemático (internet e redes de dados) ou de informação de utilidade pública.","e":"Um grupo corta os cabos de fibra óptica de uma operadora e deixa uma cidade sem telefone e internet.","d":"A pena é aplicada em dobro se o crime ocorrer durante calamidade pública ou por furto, dano ou destruição de equipamento instalado em estrutura de telecomunicações, como torres. Note que para o serviço telemático o texto fala só em interromper, não em perturbar.","pena":"Reclusão, de 2 a 4 anos, e multa.","rub":"Interrupção ou perturbação de serviço telegráfico, telefônico, informático, telemático ou de informação de utilidade pública","caput":"Interromper ou perturbar serviço telegráfico, radiotelegráfico ou telefônico, impedir ou dificultar-lhe o restabelecimento:","txt":["Art. 266 - Interromper ou perturbar serviço telegráfico, radiotelegráfico ou telefônico, impedir ou dificultar-lhe o restabelecimento:","Pena - reclusão, de 2 (dois) a 4 (quatro) anos, e multa.","§ 1º Incorre na mesma pena quem interrompe serviço telemático ou de informação de utilidade pública, ou impede ou dificulta-lhe o restabelecimento.","§ 2º Aplicam-se as penas em dobro se o crime é cometido:","I - por ocasião de calamidade pública;","II - mediante subtração, dano ou destruição de equipamento instalado em estrutura utilizada para a prestação de serviços de telecomunicações."],"ti":15,"ch":"Contra a segurança dos meios de comunicação e transporte"},{"n":"267","t":"Epidemia","k":"causar epidemia","s":"Pune quem provoca uma epidemia espalhando germes que causam doença. A pena é reclusão, de 10 a 15 anos.","e":"Um laboratório clandestino libera de propósito um vírus contagioso no sistema de ventilação de um shopping.","d":"Se resultar morte, a pena é aplicada em dobro. Na forma culposa, detenção, de 1 a 2 anos, ou de 2 a 4 anos se houver morte; por isso, a regra geral de aumento por morte dos crimes contra a saúde pública não se aplica aqui.","pena":"Reclusão, de 10 a 15 anos.","rub":"Epidemia","caput":"Causar epidemia, mediante a propagação de germes patogênicos:","txt":["Art. 267 - Causar epidemia, mediante a propagação de germes patogênicos:","Pena - reclusão, de dez a quinze anos.","§ 1º - Se do fato resulta morte, a pena é aplicada em dobro.","§ 2º - No caso de culpa, a pena é de detenção, de um a dois anos, ou, se resulta morte, de dois a quatro anos."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"268","t":"Infração de medida sanitária preventiva","k":"infringir determinação","s":"Pune quem desobedece a uma ordem do poder público feita para impedir a entrada ou a propagação de doença contagiosa. A pena é detenção, de 1 mês a 1 ano, e multa.","e":"Durante uma epidemia, um comerciante mantém a loja aberta e lotada contrariando decreto que mandou fechá-la.","d":"A pena aumenta de um terço se o agente for funcionário da saúde pública, médico, farmacêutico, dentista ou enfermeiro. É crime que depende de uma determinação do poder público para ser completado.","pena":"Detenção, de 1 mês a 1 ano, e multa.","rub":"Infração de medida sanitária preventiva","caput":"Infringir determinação do poder público, destinada a impedir introdução ou propagação de doença contagiosa:","txt":["Art. 268 - Infringir determinação do poder público, destinada a impedir introdução ou propagação de doença contagiosa:","Pena - detenção, de um mês a um ano, e multa.","Parágrafo único - A pena é aumentada de um terço, se o agente é funcionário da saúde pública ou exerce a profissão de médico, farmacêutico, dentista ou enfermeiro."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"269","t":"Omissão de notificação de doença","k":"deixar de denunciar","s":"Pune o médico que deixa de comunicar à autoridade pública uma doença cuja notificação é obrigatória. A pena é detenção, de 6 meses a 2 anos, e multa.","e":"Um médico atende vários casos de sarampo e não avisa a vigilância sanitária, como a lei exige.","d":"É crime próprio: só o médico pode cometê-lo, e não o enfermeiro ou o farmacêutico. É crime omissivo, consumado pela simples falta de comunicação.","pena":"Detenção, de 6 meses a 2 anos, e multa.","rub":"Omissão de notificação de doença","caput":"Deixar o médico de denunciar à autoridade pública doença cuja notificação é compulsória:","txt":["Art. 269 - Deixar o médico de denunciar à autoridade pública doença cuja notificação é compulsória:","Pena - detenção, de 6 (seis) meses a 2 (dois) anos, e multa."],"ti":15,"ch":"Dos crimes contra a saúde pública"},{"n":"270","t":"Envenenamento de água ou alimento","k":"envenenar","s":"Pune quem envenena água potável ou alimento ou remédio destinado a consumo. A pena é reclusão, de 10 a 15 anos.","e":"Uma pessoa coloca veneno na caixa d'água de um condomínio.","d":"Também responde quem entrega a consumo ou guarda para distribuir a água ou o produto envenenado. A forma culposa tem pena muito menor: detenção, de 6 meses a 2 anos.","pena":"Reclusão, de 10 a 15 anos.","rub":"Envenenamento de água potável ou de substância alimentícia ou medicinal","caput":"Envenenar água potável, de uso comum ou particular, ou substância alimentícia ou medicinal destinada a consumo:","txt":["Art. 270 - Envenenar água potável, de uso comum ou particular, ou substância alimentícia ou medicinal destinada a consumo:","Pena - reclusão, de dez a quinze anos.","§ 1º - Está sujeito à mesma pena quem entrega a consumo ou tem em depósito, para o fim de ser distribuída, a água ou a substância envenenada.","Modalidade culposa","§ 2º - Se o crime é
