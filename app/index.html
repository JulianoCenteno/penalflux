lado com violação do dever de sigilo:","Pena - reclusão, de 6 (seis) a 15 (quinze) anos.","§ 3º Facilitar a prática de qualquer dos crimes previstos neste artigo mediante atribuição, fornecimento ou empréstimo de senha, ou de qualquer outra forma de acesso de pessoas não autorizadas a sistemas de informações:","Pena - detenção, de 1 (um) a 4 (quatro) anos.","§ 4º Não constitui crime a comunicação, a entrega ou a publicação de informações ou de documentos com o fim de expor a prática de crime ou a violação de direitos humanos."],"ti":19,"ch":"Dos crimes contra a soberania nacional"},{"n":"359-L","t":"Abolição violenta do Estado Democrático","k":"tentar abolir","s":"Pune quem tenta, com violência ou grave ameaça, acabar com o Estado Democrático de Direito, impedindo ou restringindo o funcionamento dos poderes constitucionais. Pena: reclusão, de 4 a 8 anos, além da pena da violência.","e":"Um grupo invade com violência o prédio do Congresso para impedir as votações e fechar o Parlamento.","d":"É crime de atentado: a própria tentativa já é o crime consumado. Difere do golpe de Estado, cujo alvo é depor o governo legitimamente constituído.","pena":"Reclusão, de 4 a 8 anos, além da pena correspondente à violência.","rub":"Abolição violenta do Estado Democrático de Direito","caput":"Tentar, com emprego de violência ou grave ameaça, abolir o Estado Democrático de Direito, impedindo ou restringindo o exercício dos poderes constitucionais:","txt":["Art. 359-L. Tentar, com emprego de violência ou grave ameaça, abolir o Estado Democrático de Direito, impedindo ou restringindo o exercício dos poderes constitucionais:","Pena - reclusão, de 4 (quatro) a 8 (oito) anos, além da pena correspondente à violência."],"ti":19,"ch":"Dos crimes contra as instituições democráticas"},{"n":"359-M","t":"Golpe de Estado","k":"tentar depor","s":"Pune quem tenta derrubar, com violência ou grave ameaça, o governo legitimamente constituído. Pena: reclusão, de 4 a 12 anos, além da pena da violência.","e":"Militares e civis armados cercam o palácio do governo para forçar a saída do presidente eleito.","d":"Os arts. 359-M-A e 359-M-B mandam aplicar o concurso formal próprio (primeira parte do art. 70) quando os crimes do Capítulo ocorrem no mesmo contexto, vedando a soma do art. 69, e reduzem a pena de 1/3 a 2/3 em contexto de multidão, salvo para quem financiou ou liderou.","pena":"Reclusão, de 4 a 12 anos, além da pena correspondente à violência.","rub":"Golpe de Estado","caput":"Tentar depor, por meio de violência ou grave ameaça, o governo legitimamente constituído:","txt":["Art. 359-M. Tentar depor, por meio de violência ou grave ameaça, o governo legitimamente constituído:","Pena - reclusão, de 4 (quatro) a 12 (doze) anos, além da pena correspondente à violência.","Art. 359-M-A. Quando os delitos deste Capítulo estão inseridos no mesmo contexto, a pena deverá ser aplicada, ainda que existente desígnio autônomo, na forma do concurso formal próprio de que trata a primeira parte do art. 70, vedando-se a aplicação do cômputo cumulativo previsto na segunda parte desse dispositivo e no art. 69, todos deste Código.","Art. 359-M-B. Quando os crimes previstos neste Capítulo forem praticados em contexto de multidão, a pena será reduzida de 1/3 (um terço) a 2/3 (dois terços), desde que o agente não tenha praticado ato de financiamento ou exercido papel de liderança."],"ti":19,"ch":"Dos crimes contra as instituições democráticas"},{"n":"359-N","t":"Interrupção do processo eleitoral","k":"impedir ou perturbar","s":"Pune quem impede ou perturba a eleição ou a apuração do resultado violando indevidamente os mecanismos de segurança da urna eletrônica e do sistema de votação da Justiça Eleitoral. Pena: reclusão, de 3 a 6 anos, e multa.","e":"Um hacker invade o sistema de totalização da Justiça Eleitoral para travar a divulgação dos resultados.","d":"O meio é específico: violação dos mecanismos de segurança do sistema eletrônico de votação. Tumultuar a eleição de outra forma não se encaixa neste artigo.","pena":"Reclusão, de 3 a 6 anos, e multa.","rub":"Interrupção do processo eleitoral","caput":"Impedir ou perturbar a eleição ou a aferição de seu resultado, mediante violação indevida de mecanismos de segurança do sistema eletrônico de votação estabelecido pela Justiça Eleitoral:","txt":["Art. 359-N. Impedir ou perturbar a eleição ou a aferição de seu resultado, mediante violação indevida de mecanismos de segurança do sistema eletrônico de votação estabelecido pela Justiça Eleitoral:","Pena - reclusão, de 3 (três) a 6 (seis) anos, e multa."],"ti":19,"ch":"Contra o funcionamento das instituições democráticas no processo eleitoral"},{"n":"359-O","t":"Dispositivo vetado","k":"veto","s":"Este artigo foi vetado pelo Presidente da República e nunca entrou em vigor. Não há crime nem regra aqui.","e":"Ao abrir o vade mecum e ver o art. 359-O marcado como vetado, o estudante sabe que não precisa decorar nada nele.","d":"Em prova, nenhuma conduta pode ser enquadrada em artigo vetado: o veto significa que o texto não virou lei.","pena":"","rub":"","caput":"(VETADO).","txt":["Art. 359-O. (VETADO)."],"ti":19,"ch":"Contra o funcionamento das instituições democráticas no processo eleitoral"},{"n":"359-P","t":"Violência política","k":"restringir, impedir ou dificultar","s":"Pune quem usa violência física, sexual ou psicológica para restringir, impedir ou dificultar que alguém exerça seus direitos políticos por causa de sexo, raça, cor, etnia, religião ou procedência nacional. Pena: reclusão, de 3 a 6 anos, e multa, além da pena da violência.","e":"Um grupo ameaça e intimida repetidamente uma candidata negra para que ela desista de concorrer a vereadora.","d":"O crime exige a motivação discriminatória (sexo, raça, cor, etnia, religião ou procedência nacional). A violência psicológica também conta, não só a física.","pena":"Reclusão, de 3 a 6 anos, e multa, além da pena correspondente à violência.","rub":"Violência política","caput":"Restringir, impedir ou dificultar, com emprego de violência física, sexual ou psicológica, o exercício de direitos políticos a qualquer pessoa em razão de seu sexo, raça, cor, etnia, religião ou procedência nacional:","txt":["Art. 359-P. Restringir, impedir ou dificultar, com emprego de violência física, sexual ou psicológica, o exercício de direitos políticos a qualquer pessoa em razão de seu sexo, raça, cor, etnia, religião ou procedência nacional:","Pena - reclusão, de 3 (três) a 6 (seis) anos, e multa, além da pena correspondente à violência."],"ti":19,"ch":"Contra o funcionamento das instituições democráticas no processo eleitoral"},{"n":"359-Q","t":"Dispositivo vetado","k":"veto","s":"Este artigo foi vetado pelo Presidente da República e nunca entrou em vigor. Não há crime nem regra aqui.","e":"Ao abrir o vade mecum e ver o art. 359-Q marcado como vetado, o estudante sabe que não precisa decorar nada nele.","d":"Em prova, nenhuma conduta pode ser enquadrada em artigo vetado: o veto significa que o texto não virou lei.","pena":"","rub":"","caput":"(VETADO).","txt":["Art. 359-Q. (VETADO)."],"ti":19,"ch":"Contra o funcionamento das instituições democráticas no processo eleitoral"},{"n":"359-R","t":"Sabotagem","k":"destruir ou inutilizar","s":"Pune quem destrói ou inutiliza meios de comunicação ao público, estabelecimentos, instalações ou serviços de defesa nacional com o objetivo de abolir o Estado Democrático de Direito. Pena: reclusão, de 2 a 8 anos.","e":"Um grupo explode antenas de transmissão de TV para facilitar a tomada do poder.","d":"Sem a finalidade de abolir o Estado Democrático de Direito, a destruição pode ser dano ou outro crime, mas não sabotagem.","pena":"Reclusão, de 2 a 8 anos.","rub":"Sabotagem","caput":"Destruir ou inutilizar meios de comunicação ao público, estabelecimentos, instalações ou serviços destinados à defesa nacional, com o fim de abolir o Estado Democrático de Direito:","txt":["Art. 359-R. Destruir ou inutilizar meios de comunicação ao público, estabelecimentos, instalações ou serviços destinados à defesa nacional, com o fim de abolir o Estado Democrático de Direito:","Pena - reclusão, de 2 (dois) a 8 (oito) anos."],"ti":19,"ch":"Dos crimes contra o funcionamento dos serviços essenciais"},{"n":"359-T","t":"Manifestação crítica não é crime","k":"manifestação crítica","s":"Deixa claro que criticar os poderes, fazer jornalismo ou reivindicar direitos por passeatas, reuniões, greves, aglomerações ou outra manifestação política com propósitos sociais não é crime contra o Estado Democrático de Direito.","e":"Uma greve de professores com passeata em frente à Assembleia Legislativa não pode ser enquadrada como crime contra as instituições democráticas.","d":"A exclusão vale para os crimes deste Título (contra o Estado Democrático de Direito); não autoriza, por si só, crimes comuns praticados durante a manifestação.","pena":"","rub":"","caput":"Não constitui crime previsto neste Título a manifestação crítica aos poderes constitucionais nem a atividade jornalística ou a reivindicação de direitos e garantias constitucionais por meio de passeatas, de reuniões, de greves, de aglomerações ou de qualquer outra forma de manifestação política com propósitos sociais.","txt":["Art. 359-T. Não constitui crime previsto neste Título a manifestação crítica aos poderes constitucionais nem a atividade jornalística ou a reivindicação de direitos e garantias constitucionais por meio de passeatas, de reuniões, de greves, de aglomerações ou de qualquer outra forma de manifestação política com propósitos sociais."],"ti":19,"ch":"Disposições comuns"},{"n":"359-U","t":"Dispositivo vetado","k":"veto","s":"Este artigo foi vetado pelo Presidente da República e nunca entrou em vigor. Não há crime nem regra aqui.","e":"Ao abrir o vade mecum e ver o art. 359-U marcado como vetado, o estudante sabe que não precisa decorar nada nele.","d":"Em prova, nenhuma conduta pode ser enquadrada em artigo vetado: o veto significa que o texto não virou lei.","pena":"","rub":"","caput":"(VETADO).\"","txt":["Art. 359-U. (VETADO)."],"ti":19,"ch":"Disposições comuns"},{"n":"360","t":"Legislação especial ressalvada","k":"revogação","s":"Revoga as normas anteriores contrárias ao Código, mas preserva as leis especiais sobre crimes contra a segurança do Estado, economia popular, imprensa, falência, crimes de responsabilidade e crimes militares.","e":"Um crime militar continua sendo julgado pelo Código Penal Militar, e não pelo Código Penal comum.","d":"O Código não substituiu as leis especiais ressalvadas: elas continuam valendo ao lado dele em suas matérias.","pena":"","rub":"","caput":"Ressalvada a legislação especial sobre os crimes contra a existência, a segurança e a integridade do Estado e contra a guarda e o emprego da economia popular, os crimes de imprensa e os de falência, os de responsabilidade do Presidente da República e dos Governadores ou Interventores, e os crimes militares, revogam-se as disposições em contrário.","txt":["Art. 360 - Ressalvada a legislação especial sobre os crimes contra a existência, a segurança e a integridade do Estado e contra a guarda e o emprego da economia popular, os crimes de imprensa e os de falência, os de responsabilidade do Presidente da República e dos Governadores ou Interventores, e os crimes militares, revogam-se as disposições em contrário."],"ti":20,"ch":""},{"n":"361","t":"Entrada em vigor","k":"vigência","s":"Fixa a data em que o Código Penal começou a valer: 1º de janeiro de 1942.","e":"Um fato praticado no fim do ano anterior a 1942 não era julgado por este Código, que só começou a valer em 1º de janeiro de 1942.","d":"Cuidado: o Código foi editado bem antes de entrar em vigor; a data de vigência é 1º de janeiro de 1942, não a data de sua publicação.","pena":"","rub":"","caput":"Este Código entrará em vigor no dia 1º de janeiro de 1942.","txt":["Art. 361 - Este Código entrará em vigor no dia 1º de janeiro de 1942."],"ti":20,"ch":""}];

const SIMPENAL=[{"q": "Uma lei nova, publicada depois do trânsito em julgado da condenação de Caio, reduz a pena do crime que ele praticou. De acordo com o Código Penal, essa lei:", "o": ["aplica-se somente se o condenado ainda não tiver começado a cumprir a pena.", "aplica-se ao fato, ainda que já decidido por sentença condenatória transitada em julgado.", "aplica-se apenas se o processo ainda estiver em fase de recurso.", "não se aplica, pois a coisa julgada impede a retroatividade da lei penal."], "a": 1, "c": "O parágrafo único do art. 2º manda aplicar a lei posterior que de qualquer modo favorecer o agente aos fatos anteriores, ainda que decididos por sentença transitada em julgado. O erro comum é achar que a coisa julgada barra a retroatividade benéfica.", "ref": "Art. 2º, parágrafo único", "tema": "Lei penal no tempo"}, {"q": "Durante uma calamidade, editou-se lei temporária, com vigência de seis meses, que criou um crime. Tício praticou a conduta dentro desse período, mas só foi julgado depois que a lei deixou de vigorar. Assinale a alternativa correta.", "o": ["A lei temporária aplica-se ao fato praticado durante sua vigência, mesmo depois de decorrido o período de sua duração.", "Houve abolitio criminis com o fim da vigência, extinguindo-se a punibilidade.", "A lei temporária só se aplica se o julgamento ocorrer durante sua vigência.", "Deve ser aplicada a situação anterior à lei temporária, por ser mais benéfica, conforme o art. 2º."], "a": 0, "c": "O art. 3º garante a ultratividade da lei excepcional ou temporária: ela continua alcançando os fatos praticados durante sua vigência. O erro comum é tratar o fim da vigência como se fosse lei nova que deixou de considerar o fato crime.", "ref": "Art. 3º", "tema": "Lei penal no tempo"}, {"q": "Mévio, com 17 anos, efetuou disparos contra a vítima, que foi hospitalizada e morreu dois meses depois, quando Mévio já havia completado 18 anos. Pelo Código Penal:", "o": ["Mévio responde por homicídio, pois o crime se considera praticado no momento do resultado.", "Mévio é penalmente inimputável, pois o crime se considera praticado no momento da ação, ainda que outro seja o momento do resultado.", "Mévio responde por homicídio com a pena reduzida de metade, por ter sido menor de 21 anos na data do fato.", "Mévio responde apenas por tentativa de homicídio, já que a morte ocorreu depois da maioridade."], "a": 1, "c": "O art. 4º adota a teoria da atividade: vale o momento da ação ou omissão; como Mévio tinha 17 anos ao atirar, aplica-se o art. 27 (menores de 18 anos são inimputáveis). O erro comum é usar a data da morte.", "ref": "Art. 4º", "tema": "Lei penal no tempo"}, {"q": "Uma carta-bomba é postada no Paraguai e explode no Brasil, ferindo o destinatário. Quanto ao lugar do crime, o Código Penal considera praticado o crime:", "o": ["apenas no lugar em que ocorreu a ação ou omissão.", "tanto no lugar em que ocorreu a ação ou omissão, no todo ou em parte, quanto onde se produziu ou deveria produzir-se o resultado.", "no lugar definido pela nacionalidade do agente.", "apenas no lugar em que se produziu o resultado."], "a": 1, "c": "O art. 6º adota a ubiquidade para o lugar do crime, enquanto o art. 4º adota a atividade para o tempo do crime. Inverter as duas regras é o erro mais cobrado.", "ref": "Art. 6º", "tema": "Lei penal no espaço"}, {"q": "Um estrangeiro atenta contra a vida do Presidente da República durante viagem oficial ao exterior e é absolvido pela justiça local. Segundo o Código Penal:", "o": ["a absolvição no estrangeiro impede a aplicação da lei brasileira.", "a lei brasileira se aplica, e o agente é punido segundo ela, ainda que absolvido no estrangeiro.", "a lei brasileira só se aplica se o agente entrar no território nacional.", "a lei brasileira só se aplica mediante requisição do Ministro da Justiça."], "a": 1, "c": "Crime contra a vida do Presidente está no art. 7º, I, a, e o § 1º diz que, nos casos do inciso I, o agente é punido segundo a lei brasileira, ainda que absolvido ou condenado no estrangeiro. As condições do § 2º (como entrar no território nacional) valem só para o inciso II.", "ref": "Art. 7º, I, a, e § 1º", "tema": "Lei penal no espaço"}, {"q": "Uma babá contratada para cuidar de uma criança percebe que ela está se afogando na piscina e, podendo agir sem dificuldade, nada faz. A criança morre. A omissão da babá é penalmente relevante porque:", "o": ["o dever de agir existe apenas para quem tem obrigação legal, como os pais.", "toda omissão é penalmente relevante, independentemente de dever de agir.", "a omissão só seria relevante se a babá tivesse criado o risco com comportamento anterior.", "ela assumiu a responsabilidade de impedir o resultado e devia e podia agir para evitá-lo."], "a": 3, "c": "Pelo art. 13, § 2º, a omissão é relevante quando o omitente devia e podia agir; o dever incumbe também a quem, de outra forma, assumiu a responsabilidade de impedir o resultado (alínea b). O erro comum é limitar o dever de agir à obrigação legal.", "ref": "Art. 13, § 2º, b", "tema": "Crime"}, {"q": "Salvo disposição em contrário, a tentativa é punida com:", "o": ["metade da pena correspondente ao crime consumado.", "a pena correspondente ao crime consumado, diminuída de um a dois terços.", "a pena correspondente ao crime consumado, diminuída de um sexto a dois terços.", "a pena correspondente ao crime consumado, diminuída de um sexto a um terço."], "a": 1, "c": "É a regra do parágrafo único do art. 14. A fração de um sexto a um terço pertence a outros institutos, como a participação de menor importância (art. 29, § 1º) e o erro de proibição evitável (art. 21).", "ref": "Art. 14, parágrafo único", "tema": "Tentativa"}, {"q": "Fulano, querendo matar Beltrano, desfere um golpe de faca que o fere levemente. Podendo continuar, decide por vontade própria parar e vai embora. Beltrano sobrevive com lesão leve. Fulano responde por:", "o": ["lesão corporal, pois, na desistência voluntária, o agente só responde pelos atos já praticados.", "nenhum crime, pois a desistência voluntária apaga também os atos já praticados.", "tentativa de homicídio, pois iniciou a execução com intenção de matar.", "tentativa de homicídio com a pena reduzida pelo arrependimento posterior."], "a": 0, "c": "O art. 15 diz que quem voluntariamente desiste de prosseguir na execução só responde pelos atos já praticados; aqui, a lesão. Não há tentativa porque a não consumação decorreu da vontade do agente, e não de circunstâncias alheias.", "ref": "Art. 15", "tema": "Desistência e arrependimento"}, {"q": "Caio furtou uma bicicleta e, arrependido, devolveu-a voluntariamente à vítima depois de oferecida a denúncia, mas antes de seu recebimento pelo juiz. Pelo Código Penal:", "o": ["incide o arrependimento eficaz, e Caio responde apenas pelos atos já praticados.", "não há benefício algum, pois a denúncia já havia sido oferecida.", "incide o arrependimento posterior, com redução da pena de um a dois terços.", "a punibilidade é extinta pela restituição da coisa."], "a": 2, "c": "O art. 16 exige crime sem violência ou grave ameaça, reparação ou restituição por ato voluntário e prazo até o recebimento da denúncia ou da queixa. O erro comum é usar o oferecimento da denúncia como marco final.", "ref": "Art. 16", "tema": "Desistência e arrependimento"}, {"q": "Tício, querendo matar um desafeto, coloca açúcar no café dele acreditando tratar-se de veneno. A vítima toma o café e nada sofre. Trata-se de:", "o": ["crime impossível, por ineficácia absoluta do meio, não se punindo a tentativa.", "crime impossível por absoluta impropriedade do objeto.", "tentativa de homicídio, com a pena diminuída de um a dois terços.", "desistência voluntária, respondendo Tício pelos atos já praticados."], "a": 0, "c": "Pelo art. 17, não se pune a tentativa quando, por ineficácia absoluta do meio, é impossível consumar o crime. O meio (açúcar) é que era absolutamente ineficaz; impropriedade do objeto seria, por exemplo, tentar matar quem já está morto.", "ref": "Art. 17", "tema": "Tentativa"}, {"q": "Fulano, por descuido ao manobrar, amassa o carro do vizinho. Quanto ao crime de dano (art. 163):", "o": ["Fulano responde por dano simples, pois o dolo se presume nos crimes patrimoniais.", "Fulano responde por dano culposo, com pena reduzida.", "não há crime, pois o art. 163 não prevê forma culposa e, salvo os casos expressos em lei, só se pune o fato praticado dolosamente.", "Fulano responde por dano qualificado, pelo prejuízo considerável à vítima."], "a": 2, "c": "O parágrafo único do art. 18 diz que ninguém é punido por fato previsto como crime senão quando o pratica dolosamente, salvo os casos expressos em lei. O art. 163 não traz forma culposa, então o descuido gera só responsabilidade civil.", "ref": "Art. 18, parágrafo único", "tema": "Crime"}, {"q": "Um caçador atira em um arbusto pensando ser um animal, mas atinge uma pessoa escondida, que morre. Com mais cautela, o erro poderia ter sido evitado. O caçador responde por:", "o": ["homicídio doloso com a pena diminuída de um sexto a um terço.", "nenhum crime, pois todo erro de tipo isenta de pena.", "homicídio doloso, pois o erro de tipo evitável não exclui o dolo.", "homicídio culposo, pois o erro sobre elemento do tipo exclui o dolo, mas permite a punição por crime culposo previsto em lei."], "a": 3, "c": "O art. 20, caput, afasta o dolo no erro de tipo e permite a punição por culpa se houver forma culposa; o homicídio culposo existe (art. 121, § 3º). A diminuição de um sexto a um terço é do erro de proibição evitável (art. 21), não do erro de tipo.", "ref": "Art. 20, caput", "tema": "Erro"}, {"q": "Querendo matar o próprio pai, Fulano atira em um homem muito parecido com ele, que era um desconhecido. A vítima morre. Segundo o Código Penal:", "o": ["consideram-se apenas as condições da vítima efetivamente atingida.", "o erro quanto à pessoa isenta Fulano de pena.", "consideram-se as condições da pessoa que Fulano queria atingir, incidindo a agravante de crime contra ascendente.", "Fulano responde por tentativa de homicídio contra o pai e homicídio culposo contra o desconhecido."], "a": 2, "c": "Pelo art. 20, § 3º, o erro sobre a pessoa não isenta de pena e consideram-se as qualidades da vítima visada, não as da atingida; por isso incide a agravante do art. 61, II, e. O erro comum é olhar para a vítima real.", "ref": "Art. 20, § 3º", "tema": "Erro"}, {"q": "Sobre o erro sobre a ilicitude do fato (erro de proibição), é correto afirmar que:", "o": ["se evitável, isenta de pena.", "se inevitável, diminui a pena de um a dois terços.", "o desconhecimento da lei é escusável quando o agente tem pouca instrução.", "se evitável, poderá diminuir a pena de um sexto a um terço."], "a": 3, "c": "O art. 21 diz que o desconhecimento da lei é inescusável; o erro sobre a ilicitude, se inevitável, isenta de pena e, se evitável, pode diminuí-la de um sexto a um terço. A banca costuma trocar as consequências do evitável e do inevitável.", "ref": "Art. 21", "tema": "Erro"}, {"q": "Um gerente de banco abre o cofre para criminosos que mantêm sua família sob a mira de armas, ameaçando matá-la. Quanto ao gerente, aplica-se:", "o": ["a coação irresistível, sendo punível apenas o autor da coação.", "o estado de necessidade com redução obrigatória da pena de um a dois terços.", "a obediência hierárquica, sendo punível apenas quem deu a ordem.", "apenas a atenuante de ter agido sob coação a que podia resistir."], "a": 0, "c": "O art. 22 diz que, se o fato é cometido sob coação irresistível, só é punível o autor da coação. A atenuante do art. 65, III, c, vale para a coação a que o agente podia resistir, o que não é o caso.", "ref": "Art. 22", "tema": "Excludentes"}, {"q": "Um bombeiro de serviço, diante de um incêndio, foge para salvar a própria vida e deixa de socorrer vítimas que poderia salvar enfrentando o risco próprio da função. Sobre o estado de necessidade:", "o": ["não pode alegá-lo quem tinha o dever legal de enfrentar o perigo.", "pode ser alegado por qualquer pessoa que proteja direito próprio.", "exclui o crime, mas obriga o juiz a reduzir a pena de um a dois terços.", "só se aplica quando o perigo foi provocado pela vontade do próprio agente."], "a": 0, "c": "O art. 24, § 1º, veda o estado de necessidade a quem tinha o dever legal de enfrentar o perigo. O caput, aliás, exige perigo que o agente não provocou por sua vontade, o contrário do que diz uma das alternativas.", "ref": "Art. 24, § 1º", "tema": "Excludentes"}, {"q": "Sobre a legítima defesa, assinale a alternativa correta.", "o": ["Exige agressão atual; a agressão apenas iminente autoriza somente o estado de necessidade.", "Pode ser exercida contra injusta agressão atual ou iminente, a direito próprio ou de outrem, usando moderadamente dos meios necessários.", "Só pode ser exercida em defesa de direito próprio.", "Dispensa a moderação quando quem se defende é agente de segurança pública."], "a": 1, "c": "O art. 25 abrange agressão atual ou iminente e direito seu ou de outrem. O parágrafo único, que trata do agente de segurança pública que repele agressão a vítima refém, exige expressamente que sejam observados os requisitos do caput, inclusive a moderação.", "ref": "Art. 25", "tema": "Excludentes"}, {"q": "Depois de desarmar e imobilizar o agressor, que já não oferece perigo, Fulano continua a golpeá-lo. Segundo o art. 23 do Código Penal:", "o": ["Fulano responde pelo excesso doloso ou culposo.", "toda a conduta fica coberta pela legítima defesa, pois a agressão partiu da vítima.", "o excesso só é punido nas hipóteses de estado de necessidade.", "o excesso só é punido se for doloso."], "a": 0, "c": "O parágrafo único do art. 23 diz que o agente, em qualquer das excludentes, responde pelo excesso doloso ou culposo. O erro comum é pensar que só o excesso doloso é punido.", "ref": "Art. 23, parágrafo único", "tema": "Excludentes"}, {"q": "Fulano, por vontade própria, ingeriu bebida alcoólica até ficar completamente embriagado e, nesse estado, agrediu um desconhecido. Quanto à imputabilidade:", "o": ["Fulano é inimputável, recebendo o mesmo tratamento da doença mental.", "a embriaguez voluntária não exclui a imputabilidade penal.", "Fulano tem a pena reduzida de um a dois terços.", "Fulano é isento de pena, por estar inteiramente incapaz de entender o caráter ilícito do fato."], "a": 1, "c": "O art. 28, II, diz que a embriaguez voluntária ou culposa não exclui a imputabilidade. Só isenta de pena a embriaguez completa proveniente de caso fortuito ou força maior (§ 1º).", "ref": "Art. 28, II", "tema": "Imputabilidade"}, {"q": "Fulano e Beltrano combinam furtar uma casa que acreditam estar vazia. Durante a ação, sem que Fulano soubesse ou pudesse prever, Beltrano encontra o morador e o ameaça com uma arma para levar os bens. Quanto a Fulano:", "o": ["não responde por crime algum, pois o plano original não foi executado.", "aplica-se a pena do crime menos grave do qual quis participar.", "responde por roubo, pois quem concorre para o crime incide nas penas a ele cominadas.", "responde por roubo com a pena diminuída de um sexto a um terço."], "a": 1, "c": "O art. 29, § 2º, manda aplicar ao concorrente a pena do crime menos grave que quis praticar; a pena só é aumentada até metade se o resultado mais grave era previsível. A diminuição de um sexto a um terço é da participação de menor importância (§ 1º).", "ref": "Art. 29, § 2º", "tema": "Concurso de pessoas"}, {"q": "Um funcionário público, em coautoria com um amigo particular que conhecia sua condição, apropria-se de um computador da repartição que estava sob sua posse em razão do cargo. O particular:", "o": ["responde por apropriação indébita, pois não é funcionário público.", "não responde por crime, pois só o funcionário pode praticar peculato.", "responde por peculato, pois a condição de funcionário público, elementar do crime, comunica-se ao coautor.", "responde por furto, pois condições pessoais nunca se comunicam."], "a": 2, "c": "O art. 30 diz que as condições de caráter pessoal não se comunicam, salvo quando elementares do crime; ser funcionário público é elementar do peculato (art. 312). O erro comum é esquecer a ressalva final do art. 30.", "ref": "Art. 30", "tema": "Concurso de pessoas"}, {"q": "Fulano instiga Beltrano a matar um desafeto. Beltrano aceita, mas desiste da ideia antes de iniciar qualquer ato de execução. Fulano:", "o": ["responde por tentativa de homicídio, como partícipe.", "responde por homicídio consumado, pois concorreu de qualquer modo para o crime.", "não é punível, pois a instigação não se pune se o crime não chega, pelo menos, a ser tentado.", "responde pela instigação, com a pena diminuída de um a dois terços."], "a": 2, "c": "O art. 31 diz que o ajuste, a determinação ou instigação e o auxílio não são puníveis se o crime não chega, pelo menos, a ser tentado, salvo disposição expressa em contrário. Sem início de execução, não há o que punir.", "ref": "Art. 31", "tema": "Concurso de pessoas"}, {"q": "Réu não reincidente foi condenado a 6 anos de reclusão. Segundo o art. 33, § 2º, do Código Penal, quanto ao regime inicial, ele:", "o": ["poderá, desde o princípio, cumprir a pena em regime semiaberto.", "deverá começar a cumprir a pena obrigatoriamente em regime fechado.", "poderá começar a cumprir a pena em regime aberto.", "deverá começar em regime aberto, por ser primário."], "a": 0, "c": "Pelo art. 33, § 2º, b, o não reincidente com pena superior a 4 e que não exceda 8 anos poderá começar no semiaberto; o fechado obrigatório é para pena superior a 8 anos, e o aberto para pena igual ou inferior a 4 anos.", "ref": "Art. 33, § 2º", "tema": "Penas"}, {"q": "Réu não reincidente em crime doloso, com circunstâncias judiciais favoráveis, foi condenado a 5 anos de pena privativa de liberdade por crime culposo. Quanto à substituição por pena restritiva de direitos:", "o": ["é possível, pois, nos crimes culposos, cabe a substituição qualquer que seja a pena aplicada.", "é vedada, cabendo apenas a suspensão condicional da pena.", "é vedada, pois a pena aplicada supera quatro anos.", "é possível apenas se a pena não superar dois anos."], "a": 0, "c": "O art. 44, I, limita a substituição a pena não superior a quatro anos em crime sem violência ou grave ameaça, mas ressalva: qualquer que seja a pena aplicada, se o crime for culposo. O erro comum é aplicar o limite de quatro anos ao crime culposo.", "ref": "Art. 44, I", "tema": "Penas"}, {"q": "Qual o prazo de prescrição da pretensão punitiva, antes do trânsito em julgado, para o furto simples (art. 155, caput), tomando por base a pena máxima cominada e sem causas que alterem o prazo?", "o": ["8 anos.", "4 anos.", "16 anos.", "12 anos."], "a": 3, "c": "O furto simples tem pena máxima de 6 anos; pelo art. 109, III, se o máximo é superior a 4 e não excede 8 anos, a prescrição ocorre em 12 anos. O erro comum é usar a pena antiga do furto e marcar 8 anos.", "ref": "Art. 109, III", "tema": "Prescrição"}, {"q": "Agente que tinha 20 anos na data do fato é processado por crime de furto. Quanto aos prazos de prescrição:", "o": ["são reduzidos de um terço.", "não sofrem redução, pois a idade funciona apenas como atenuante.", "são reduzidos de metade, pois ele era menor de 21 anos ao tempo do crime.", "só seriam reduzidos se ele ainda fosse menor de 21 anos na data da sentença."], "a": 2, "c": "O art. 115 reduz de metade os prazos quando o criminoso era, ao tempo do crime, menor de 21 anos ou, na data da sentença, maior de 70 anos, salvo se o crime envolver violência sexual contra a mulher. A banca costuma trocar os marcos temporais das duas idades.", "ref": "Art. 115", "tema": "Prescrição"}, {"q": "Interrompe o curso da prescrição:", "o": ["a citação do réu.", "o recebimento da denúncia ou da queixa.", "o oferecimento da denúncia.", "a instauração do inquérito policial."], "a": 1, "c": "O art. 117, I, fala em recebimento da denúncia ou da queixa, ato do juiz, e não em oferecimento, ato do Ministério Público. Inquérito e citação não estão no rol.", "ref": "Art. 117, I", "tema": "Prescrição"}, {"q": "Fulano mata a ex-companheira em contexto de violência doméstica e familiar. Pela legislação em vigor, ele responde por:", "o": ["homicídio qualificado pelo feminicídio (art. 121, § 2º), com pena de reclusão de 12 a 30 anos.", "feminicídio, crime autônomo, com pena de reclusão de 12 a 30 anos.", "homicídio simples com a agravante de violência contra a mulher.", "feminicídio, crime autônomo previsto no art. 121-A, com pena de reclusão de 20 a 40 anos."], "a": 3, "c": "O feminicídio é hoje o art. 121-A, crime autônomo, com pena de reclusão de 20 a 40 anos, e a violência doméstica e familiar é uma das razões da condição do sexo feminino (§ 1º, I). O erro comum é tratá-lo ainda como qualificadora do homicídio.", "ref": "Art. 121-A", "tema": "Vida"}, {"q": "Uma mãe, sob a influência do estado puerperal, mata o próprio filho logo após o parto. O crime e a pena cominada são:", "o": ["homicídio simples, com a atenuante de violenta emoção.", "homicídio qualificado, com pena de reclusão de 12 a 30 anos.", "infanticídio, com pena de reclusão de 6 a 20 anos.", "infanticídio, com pena de detenção de 2 a 6 anos."], "a": 3, "c": "O verbo é matar, mas o art. 123 exige estado puerperal, próprio filho e momento durante o parto ou logo após, com pena de detenção de 2 a 6 anos. Faltando um desses elementos, volta-se ao homicídio.", "ref": "Art. 123", "tema": "Vida"}, {"q": "Fulano instiga, por meio de rede social, uma pessoa adulta e com plena capacidade a se suicidar, e o suicídio se consuma. Fulano responde por:", "o": ["induzimento, instigação ou auxílio a suicídio (art. 122, § 2º), com pena aumentada até o dobro pelo uso de rede social.", "homicídio doloso, pois instigar equivale a matar.", "omissão de socorro, com pena triplicada pelo resultado morte.", "nenhum crime, pois o suicídio não é punível."], "a": 0, "c": "Os verbos do art. 122 são induzir, instigar ou prestar auxílio; consumado o suicídio, a pena é de 2 a 6 anos (§ 2º), aumentada até o dobro se a conduta é realizada por rede social (§ 4º). Só haveria homicídio nas hipóteses do § 7º, como vítima menor de 14 anos.", "ref": "Art. 122, §§ 2º e 4º", "tema": "Vida"}, {"q": "Na lesão corporal, configura a forma de natureza grave do § 1º do art. 129, e não a do § 2º, o resultado:", "o": ["incapacidade para as ocupações habituais por mais de trinta dias.", "enfermidade incurável.", "deformidade permanente.", "perda ou inutilização de membro, sentido ou função."], "a": 0, "c": "A incapacidade por mais de trinta dias está no § 1º (pena de 1 a 5 anos). Deformidade permanente, perda ou inutilização e enfermidade incurável estão no § 2º (pena de 2 a 8 anos); cuidado com debilidade permanente, que é § 1º, versus perda, que é § 2º.", "ref": "Art. 129, § 1º, I", "tema": "Lesão corporal"}, {"q": "Fulano dá um soco em Beltrano, sem querer matá-lo e sem assumir esse risco. Beltrano cai, bate a cabeça no meio-fio e morre. Fulano responde por:", "o": ["homicídio simples, com pena de reclusão de 6 a 20 anos.", "lesão corporal seguida de morte, com pena de reclusão de 4 a 12 anos.", "lesão corporal grave, com pena de reclusão de 1 a 5 anos.", "homicídio culposo, com pena de detenção de 1 a 3 anos."], "a": 1, "c": "Há dolo na lesão e culpa na morte: é o art. 129, § 3º, que exige que as circunstâncias evidenciem que o agente não quis nem assumiu o risco do resultado. O homicídio culposo não serve porque a agressão inicial foi dolosa.", "ref": "Art. 129, § 3º", "tema": "Lesão corporal"}, {"q": "Em uma reunião, Fulano afirma, sabendo ser mentira, que o colega Beltrano furtou o notebook da empresa na semana passada. Pelo verbo e pelo conteúdo da imputação, trata-se de:", "o": ["denunciação caluniosa, pois atribui crime a quem sabe inocente.", "injúria, pois ofende a dignidade de Beltrano.", "calúnia, pois imputa falsamente a Beltrano fato definido como crime.", "difamação, pois atinge a reputação de Beltrano."], "a": 2, "c": "Imputar falsamente fato definido como crime é calúnia (art. 138). Seria denunciação caluniosa (art. 339) só se Fulano desse causa à instauração de inquérito ou processo contra Beltrano, o que não ocorreu.", "ref": "Art. 138", "tema": "Honra"}, {"q": "Fulano conta a vários vizinhos que Beltrana chega embriagada ao trabalho todos os dias. Beltrana não é funcionária pública. Trata-se de:", "o": ["calúnia, pois imputa a Beltrana fato determinado.", "difamação, pois imputa a Beltrana fato ofensivo à sua reputação que não é crime.", "fato atípico, se Fulano provar que a afirmação é verdadeira.", "injúria, pois não há imputação de fato."], "a": 1, "c": "Fato determinado e ofensivo à reputação, mas que não é crime, caracteriza difamação (art. 139). A prova da verdade só é admitida se o ofendido é funcionário público e a ofensa se refere às suas funções, o que não é o caso.", "ref": "Art. 139", "tema": "Honra"}, {"q": "Durante uma discussão de trânsito, Fulano chama Beltrano, um particular, de incompetente e desonesto, sem narrar qualquer fato. Trata-se de:", "o": ["difamação, pois atinge a reputação de Beltrano perante terceiros.", "desacato, pois a ofensa foi proferida em via pública.", "calúnia, pois chamar alguém de desonesto atribui crime.", "injúria, pois ofende a dignidade ou o decoro de Beltrano sem imputar fato."], "a": 3, "c": "Xingamento sem descrição de fato é injúria (art. 140): o verbo injuriar ofende a dignidade ou o decoro. Calúnia e difamação exigem imputação de fato, e desacato exige funcionário público no exercício da função ou em razão dela.", "ref": "Art. 140", "tema": "Honra"}, {"q": "Sobre a exceção da verdade nos crimes contra a honra, assinale a alternativa correta.", "o": ["É admitida na injúria quando o ofendido provoca a ofensa.", "Na calúnia, não é admitida em hipótese alguma.", "Na difamação, é admitida em qualquer caso.", "Na difamação, somente se admite se o ofendido é funcionário público e a ofensa é relativa ao exercício de suas funções."], "a": 3, "c": "O parágrafo único do art. 139 restringe a exceção da verdade na difamação ao funcionário público ofendido em razão das funções. Na calúnia, a regra é admiti-la, salvo as exceções do art. 138, § 3º.", "ref": "Art. 139, parágrafo único", "tema": "Honra"}, {"q": "Em regra, nos crimes contra a honra previstos no Código Penal, a ação penal é:", "o": ["pública condicionada à requisição do Ministro da Justiça.", "pública condicionada à representação, em todos os casos.", "privada, procedendo-se mediante queixa.", "pública incondicionada."], "a": 2, "c": "O art. 145 diz que nesses crimes somente se procede mediante queixa. As exceções são a injúria real com lesão corporal, a requisição no caso do Presidente da República e a representação no caso de funcionário público ofendido em razão das funções e da injúria do art. 140, § 3º.", "ref": "Art. 145", "tema": "Honra"}, {"q": "Fulano, mediante grave ameaça, obriga Beltrano a não comparecer a uma assembleia de condomínio, sem nenhuma finalidade econômica. Dias depois, também sob grave ameaça, obriga Beltrano a transferir-lhe dinheiro pelo aplicativo do banco. Os crimes são, respectivamente:", "o": ["extorsão e roubo.", "constrangimento ilegal e furto mediante fraude.", "constrangimento ilegal e extorsão.", "ameaça e roubo."], "a": 2, "c": "Nos dois casos o verbo é constranger; o que muda é o intuito de obter indevida vantagem econômica, que transforma o constrangimento ilegal (art. 146) em extorsão (art. 158). Na extorsão a vítima faz algo (a transferência); no roubo o agente subtrai.", "ref": "Art. 158", "tema": "Patrimônio"}, {"q": "Quanto à ação penal no crime de ameaça (art. 147), é correto afirmar:", "o": ["é privada, procedendo-se mediante queixa.", "procede-se sempre mediante representação, sem exceções.", "é sempre pública incondicionada.", "procede-se mediante representação, exceto se o crime for cometido contra a mulher por razões da condição do sexo feminino."], "a": 3, "c": "O art. 147, § 2º, exige representação, exceto na hipótese do § 1º (ameaça contra a mulher por razões da condição do sexo feminino), em que a pena é aplicada em dobro e a ação é pública incondicionada.", "ref": "Art. 147, § 2º", "tema": "Liberdade"}, {"q": "Fulano mantém um desafeto adulto trancado em um galpão por 20 dias, sem exigir nada em troca. Pelo Código Penal, a pena cominada é de:", "o": ["reclusão, de 8 a 15 anos, por se tratar de extorsão mediante sequestro.", "reclusão, de 2 a 5 anos, porque a privação da liberdade durou mais de 15 dias.", "reclusão, de 1 a 3 anos, pois a duração só qualifica o crime acima de 30 dias.", "reclusão, de 2 a 8 anos, pela simples duração da privação."], "a": 1, "c": "O art. 148, § 1º, III, prevê reclusão de 2 a 5 anos se a privação dura mais de 15 dias. Não há extorsão mediante sequestro porque não houve fim de obter vantagem como preço do resgate; a pena de 2 a 8 anos é do § 2º (grave sofrimento físico ou moral).", "ref": "Art. 148, § 1º, III", "tema": "Liberdade"}, {"q": "No mesmo ônibus, Fulano retira, sem que ninguém perceba, a carteira do bolso de um passageiro distraído, enquanto Beltrano aponta uma faca para outra passageira e toma-lhe o celular. Pelo verbo e pelo meio empregado:", "o": ["ambos cometem furto, pois nenhum deles feriu a vítima.", "ambos cometem roubo, pois agiram contra pessoas presentes.", "Fulano comete roubo impróprio e Beltrano comete extorsão.", "Fulano comete furto e Beltrano comete roubo, pois só Beltrano subtraiu mediante grave ameaça."], "a": 3, "c": "O verbo é o mesmo (subtrair); o que separa furto (art. 155) de roubo (art. 157) é a violência ou grave ameaça à pessoa. A destreza de Fulano pode qualificar o furto (art. 155, § 4º, II), mas não o transforma em roubo.", "ref": "Art. 157", "tema": "Patrimônio"}, {"q": "Fulano subtrai, sem violência, a bolsa de uma pessoa distraída. Logo depois, perseguido pela vítima, empurra-a violentamente para garantir que ficará com a bolsa. Fulano responde por:", "o": ["roubo, na forma do art. 157, § 1º.", "furto qualificado pelo emprego de violência.", "extorsão, pois a violência foi posterior à subtração.", "furto, em concurso com lesão corporal."], "a": 0, "c": "O art. 157, § 1º, aplica a pena do roubo a quem, logo depois de subtraída a coisa, emprega violência ou grave ameaça para assegurar a impunidade ou a detenção da coisa (roubo impróprio). O erro comum é separar os fatos em furto mais lesão.", "ref": "Art. 157, § 1º", "tema": "Patrimônio"}, {"q": "No roubo, se da violência resulta morte (latrocínio), fora das hipóteses que envolvem organização criminosa, milícia ou grupo paramilitar, a pena cominada é de:", "o": ["reclusão, de 12 a 30 anos, e multa.", "reclusão, de 20 a 30 anos, e multa.", "reclusão, de 7 a 18 anos, e multa.", "reclusão, de 24 a 30 anos, e multa."], "a": 3, "c": "O art. 157, § 3º, II, prevê reclusão de 24 a 30 anos, e multa. A pena de 7 a 18 anos é a do roubo com lesão corporal grave (inciso I); o erro comum é marcar a pena antiga do latrocínio.", "ref": "Art. 157, § 3º, II", "tema": "Patrimônio"}, {"q": "Criminosos mantêm a vítima dentro do carro dela, restringindo sua liberdade, e a obrigam a sacar dinheiro em caixas eletrônicos, sendo essa restrição necessária para obter a vantagem. Pelo Código Penal, o crime e a pena são:", "o": ["extorsão com restrição da liberdade da vítima, com pena de reclusão de 6 a 12 anos, além da multa.", "extorsão mediante sequestro, com pena de reclusão de 8 a 15 anos.", "sequestro e cárcere privado, com pena de reclusão de 1 a 3 anos.", "roubo simples, com pena de reclusão de 6 a 10 anos, e multa."], "a": 0, "c": "O art. 158, § 3º, trata da extorsão cometida mediante restrição da liberdade quando essa condição é necessária para obter a vantagem, com reclusão de 6 a 12 anos, além da multa. Não é o art. 159, que exige vantagem como condição ou preço do resgate.", "ref": "Art. 158, § 3º", "tema": "Patrimônio"}, {"q": "Uma pessoa adulta é sequestrada e só é libertada depois de três dias, quando a família paga o resgate exigido. O crime e a pena cominada são:", "o": ["extorsão mediante sequestro simples, com reclusão de 8 a 15 anos.", "extorsão mediante sequestro qualificada, com reclusão de 12 a 20 anos, porque o sequestro durou mais de 24 horas.", "sequestro e cárcere privado qualificado, com reclusão de 2 a 5 anos.", "extorsão com restrição da liberdade, com reclusão de 6 a 12 anos."], "a": 1, "c": "O verbo sequestrar com o fim de obter vantagem como preço do resgate caracteriza o art. 159; se o sequestro dura mais de 24 horas, a pena passa a reclusão de 12 a 20 anos (§ 1º).", "ref": "Art. 159, § 1º", "tema": "Patrimônio"}, {"q": "Fulano empresta seu notebook a Beltrano por uma semana. Terminado o prazo, Beltrano decide ficar com o aparelho e se recusa a devolvê-lo. Pelo verbo, Beltrano comete:", "o": ["estelionato, pois enganou Fulano ao pedir o empréstimo.", "apropriação de coisa achada.", "furto, pois ficou com coisa alheia móvel sem autorização.", "apropriação indébita, pois se apropriou de coisa alheia móvel de que já tinha a posse."], "a": 3, "c": "No art. 168 o agente já tem a posse ou a detenção lícita e depois inverte o ânimo, passando a agir como dono; no furto (art. 155) ele subtrai, isto é, tira a coisa de quem a tinha. Só haveria estelionato se a intenção fraudulenta existisse desde o início.", "ref": "Art. 168", "tema": "Patrimônio"}, {"q": "Uma servidora pública, responsável pelo almoxarifado de um órgão, leva para casa e passa a usar como seus notebooks que estavam sob sua guarda em razão do cargo. Trata-se de:", "o": ["apropriação indébita com a pena aumentada por ter recebido a coisa em razão de emprego.", "peculato mediante erro de outrem.", "peculato, pois a funcionária se apropriou de bem de que tinha a posse em razão do cargo.", "furto qualificado pelo abuso de confiança."], "a": 2, "c": "Os verbos são os mesmos da apropriação indébita, mas o art. 312 exige funcionário público com posse em razão do cargo, e por isso prevalece. Peculato mediante erro de outrem (art. 313) exige que o bem tenha chegado ao funcionário por erro de terceiro.", "ref": "Art. 312", "tema": "Administração pública"}, {"q": "No peculato culposo, a reparação do dano feita antes da sentença irrecorrível:", "o": ["reduz a pena de um a dois terços, como arrependimento posterior.", "reduz de metade a pena imposta.", "extingue a punibilidade.", "não produz efeito penal, apenas civil."], "a": 2, "c": "O art. 312, § 3º, diz que a reparação antes da sentença irrecorrível extingue a punibilidade; se posterior, reduz de metade a pena imposta. O benefício vale só para o peculato culposo (§ 2º).", "ref": "Art. 312, § 3º", "tema": "Administração pública"}, {"q": "Fulano vende a Beltrano, adulto, com menos de 60 anos e sem parentesco com ele, um carro que não existe, recebendo o pagamento adiantado. Quanto ao crime e à ação penal:", "o": ["trata-se de estelionato, de ação penal pública incondicionada, pois o § 5º do art. 171 foi revogado e a lei não declara outra espécie de ação.", "trata-se de furto mediante fraude, de ação penal pública incondicionada.", "trata-se de estelionato, de ação penal pública condicionada à representação.", "trata-se de estelionato, de ação penal privada."], "a": 0, "c": "O agente obtém vantagem ilícita induzindo a vítima em erro (art. 171). Com a revogação do § 5º, aplica-se a regra do art. 100: a ação é pública, sem condição. Ficam ressalvados casos como os do art. 182 (vítima irmão, por exemplo).", "ref": "Art. 171", "tema": "Patrimônio"}, {"q": "Fulano compra de um desconhecido, por preço muito abaixo do mercado, um celular que sabe ser produto de roubo. O autor do roubo nunca foi identificado. Fulano:", "o": ["responde por receptação, com pena de reclusão de 1 a 4 anos, e multa.", "não responde por crime, pois não se sabe quem praticou o roubo.", "responde por receptação, com pena de reclusão de 2 a 6 anos, e multa, pois a receptação é punível ainda que desconhecido o autor do crime anterior.", "responde apenas pela forma do § 3º do art. 180, com pena de detenção de 1 mês a 1 ano."], "a": 2, "c": "Adquirir coisa que sabe ser produto de crime é o caput do art. 180, com reclusão de 2 a 6 anos, e multa; o § 4º torna a receptação punível ainda que desconhecido ou isento de pena o autor do crime anterior. O § 3º é para quem deve presumir a origem criminosa, não para quem sabe.", "ref": "Art. 180, caput e § 4º", "tema": "Patrimônio"}, {"q": "Um filho de 25 anos subtrai, sem violência, joias da mãe, que tem 50 anos. Depois, subtrai, também sem violência, dinheiro do avô, que tem 70 anos. Quanto à isenção de pena do art. 181:", "o": ["é isento de pena nos dois fatos, pois ambas as vítimas são ascendentes.", "não é isento em nenhum dos fatos, pois o furto não admite isenção.", "é isento apenas no segundo fato, por se tratar de ascendente de segundo grau.", "é isento de pena no primeiro fato, mas não no segundo, porque a isenção não se aplica se a vítima tem 60 anos ou mais."], "a": 3, "c": "O art. 181, II, isenta de pena quem comete crime patrimonial contra ascendente ou descendente, mas o art. 183, III, afasta a isenção se a vítima tem idade igual ou superior a 60 anos. Também não há isenção em roubo, extorsão ou crimes com violência ou grave ameaça.", "ref": "Arts. 181 e 183", "tema": "Patrimônio"}, {"q": "Nos crimes contra a liberdade sexual (Capítulo I do Título VI da Parte Especial), como o estupro, a ação penal é:", "o": ["pública condicionada à representação, salvo se a vítima for vulnerável.", "privada, mediante queixa.", "pública condicionada à representação.", "pública incondicionada."], "a": 3, "c": "O art. 225 diz que nos crimes dos Capítulos I e II desse Título procede-se mediante ação penal pública incondicionada. O erro comum é lembrar a antiga regra de representação.", "ref": "Art. 225", "tema": "Dignidade sexual"}, {"q": "Quanto ao crime de estupro de vulnerável (art. 217-A), segundo o texto legal:", "o": ["a vulnerabilidade por idade alcança vítimas menores de 18 anos.", "a presunção de vulnerabilidade é relativa e pode ser afastada pelo consentimento da vítima.", "a presunção de vulnerabilidade é absoluta, e as penas se aplicam independentemente do consentimento da vítima ou de sua experiência sexual anterior.", "a pena do caput é de reclusão, de 6 a 10 anos."], "a": 2, "c": "O § 4º-A declara absoluta a presunção de vulnerabilidade e inadmissível sua relativização, e o § 5º afasta a relevância do consentimento e da experiência anterior. O caput fala em menor de 14 anos, com reclusão de 10 a 18 anos, e multa.", "ref": "Art. 217-A, §§ 4º-A e 5º", "tema": "Dignidade sexual"}, {"q": "Um chefe constrange uma subordinada com o intuito de obter favorecimento sexual, prevalecendo-se de sua condição de superior hierárquico. Trata-se de:", "o": ["assédio sexual, com pena de reclusão de 2 a 6 anos.", "constrangimento ilegal, com pena de detenção de 3 meses a 1 ano, ou multa.", "assédio sexual, com pena de detenção de 1 a 2 anos.", "importunação sexual, com pena de reclusão de 1 a 5 anos."], "a": 2, "c": "O art. 216-A exige que o agente se prevaleça da condição de superior hierárquico ou ascendência inerente ao emprego, cargo ou função. A importunação sexual (art. 215-A) exige a prática de ato libidinoso sem anuência, o que não é o caso.", "ref": "Art. 216-A", "tema": "Dignidade sexual"}, {"q": "Em escritura pública lavrada regularmente em cartório, Fulano faz inserir declaração falsa sobre seu estado civil, com o fim de prejudicar direito de terceiro. O documento é formalmente verdadeiro. Fulano comete:", "o": ["falsificação de documento público, pois a escritura é documento público.", "falsa identidade, pois mentiu sobre dado pessoal.", "falsidade ideológica, pois o vício está no conteúdo da declaração, e não na forma do documento.", "uso de documento falso."], "a": 2, "c": "No art. 299 o verbo é inserir ou fazer inserir declaração falsa em documento formalmente perfeito; no art. 297 o verbo é falsificar ou alterar o próprio documento, um vício material. Essa diferença entre falso ideológico e falso material é o ponto mais cobrado.", "ref": "Art. 299", "tema": "Fé pública"}, {"q": "Em uma blitz, um policial diz ao motorista: ou me paga 500 reais, ou vou apreender o carro. Em outra blitz, um policial pergunta discretamente se o motorista não quer ajudar com um cafezinho para liberar a multa. Em uma terceira, um motorista, por iniciativa própria, oferece dinheiro ao policial para não ser multado. Pelos verbos, os crimes são, respectivamente:", "o": ["corrupção passiva nos três casos.", "concussão, corrupção passiva e corrupção ativa.", "corrupção passiva, concussão e corrupção ativa.", "concussão, corrupção ativa e corrupção passiva."], "a": 1, "c": "Exigir é concussão (art. 316); solicitar, receber ou aceitar promessa é corrupção passiva (art. 317); oferecer ou prometer, pelo particular, é corrupção ativa (art. 333). A troca entre exigir e solicitar é a pegadinha clássica.", "ref": "Arts. 316, 317 e 333", "tema": "Administração pública"}, {"q": "Um servidor deixa de praticar ato de ofício para se vingar do requerente, de quem é inimigo, sem receber nem solicitar qualquer vantagem e sem pedido de ninguém. Trata-se de:", "o": ["concussão.", "prevaricação.", "corrupção passiva na forma do § 2º do art. 317.", "condescendência criminosa."], "a": 1, "c": "O art. 319 pune quem retarda ou deixa de praticar ato de ofício para satisfazer interesse ou sentimento pessoal. Na corrupção passiva do § 2º do art. 317, o funcionário age cedendo a pedido ou influência de outrem, o que não houve.", "ref": "Art. 319", "tema": "Administração pública"}, {"q": "Ao ser abordado, Fulano xinga o policial com palavras humilhantes, em razão da função. Beltrano, recebendo do policial ordem legal para retirar o carro de local proibido, simplesmente a ignora, sem violência. Sicrano empurra o policial para impedir sua própria prisão legal. Os crimes são, respectivamente:", "o": ["desacato, desobediência e resistência.", "desacato, resistência e desobediência.", "desobediência, desacato e resistência.", "injúria, resistência e desobediência."], "a": 0, "c": "Desacatar funcionário no exercício da função ou em razão dela é desacato (art. 331); desobedecer ordem legal sem violência é desobediência (art. 330); opor-se à execução de ato legal mediante violência ou ameaça é resistência (art. 329).", "ref": "Arts. 329, 330 e 331", "tema": "Administração pública"}, {"q": "Para os efeitos penais, considera-se funcionário público:", "o": ["quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública.", "apenas o ocupante de cargo efetivo ou em comissão, excluídos os empregados públicos.", "apenas quem recebe remuneração dos cofres públicos.", "apenas o servidor efetivo, aprovado em concurso público."], "a": 0, "c": "O art. 327 adota conceito amplo: basta exercer cargo, emprego ou função pública, ainda que de forma transitória ou sem remuneração. O § 1º ainda equipara quem trabalha em entidade paraestatal ou em empresa contratada para atividade típica da Administração.", "ref": "Art. 327", "tema": "Administração pública"}, {"q": "Fulano dá causa à instauração de inquérito policial contra Beltrano, imputando-lhe crime de que o sabe inocente. Sicrano, por sua vez, comunica à polícia um roubo que sabe não ter ocorrido, sem apontar nenhum autor. Os crimes são, respectivamente:", "o": ["comunicação falsa de crime e denunciação caluniosa.", "calúnia e falso testemunho.", "calúnia e denunciação caluniosa.", "denunciação caluniosa e comunicação falsa de crime."], "a": 3, "c": "Denunciação caluniosa (art. 339) exige dar causa a investigação ou processo contra pessoa determinada que se sabe inocente; na comunicação falsa (art. 340) o agente provoca a ação da autoridade sobre crime que não ocorreu, sem acusar alguém específico.", "ref": "Arts. 339 e 340", "tema": "Administração pública"}];
const SIMCF=[{"q": "Nos termos do art. 1º da Constituição Federal, são fundamentos da República Federativa do Brasil:", "o": ["a soberania, a cidadania, a dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa e o pluralismo partidário.", "a soberania, a cidadania, a dignidade da pessoa humana, a garantia do desenvolvimento nacional e o pluralismo político.", "a soberania, a cidadania, a dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa e o pluralismo político.", "a independência nacional, a cidadania, a dignidade da pessoa humana, os valores sociais do trabalho e da livre iniciativa e o pluralismo político."], "a": 2, "c": "O art. 1º, I a V, lista soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo político. As pegadinhas comuns trocam pluralismo político por partidário, ou misturam um objetivo do art. 3º (desenvolvimento nacional) ou um princípio do art. 4º (independência nacional).", "ref": "Art. 1º, I a V"}, {"q": "Constitui objetivo fundamental da República Federativa do Brasil, segundo o art. 3º da Constituição:", "o": ["erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais.", "erradicar as desigualdades sociais e regionais e reduzir a pobreza e a marginalização.", "a prevalência dos direitos humanos.", "a dignidade da pessoa humana."], "a": 0, "c": "O art. 3º, III, manda erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais. A inversão dos verbos (erradicar as desigualdades) é a pegadinha clássica; prevalência dos direitos humanos é princípio das relações internacionais (art. 4º, II) e dignidade da pessoa humana é fundamento (art. 1º, III).", "ref": "Art. 3º, III"}, {"q": "A República Federativa do Brasil rege-se nas suas relações internacionais, entre outros, pelo seguinte princípio expresso no art. 4º da Constituição:", "o": ["soberania.", "pluralismo político.", "garantir o desenvolvimento nacional.", "concessão de asilo político."], "a": 3, "c": "A concessão de asilo político está no art. 4º, X. Soberania e pluralismo político são fundamentos (art. 1º, I e V) e garantir o desenvolvimento nacional é objetivo fundamental (art. 3º, II): o erro comum é confundir os róis dos arts. 1º, 3º e 4º.", "ref": "Art. 4º, X"}, {"q": "De acordo com o art. 5º, XI, da Constituição, a casa é asilo inviolável do indivíduo. Sem consentimento do morador, durante a noite, é possível nela penetrar:", "o": ["por determinação judicial, a qualquer hora do dia ou da noite.", "apenas em caso de flagrante delito ou desastre, ou para prestar socorro.", "por determinação da autoridade policial, desde que fundamentada por escrito.", "em caso de flagrante delito, desastre, para prestar socorro ou por determinação judicial."], "a": 1, "c": "O art. 5º, XI, admite a entrada sem consentimento em flagrante delito, desastre ou para prestar socorro a qualquer hora, mas a determinação judicial só autoriza o ingresso durante o dia. O erro mais comum é estender a ordem judicial ao período noturno.", "ref": "Art. 5º, XI"}, {"q": "Quanto ao sigilo previsto no art. 5º, XII, da Constituição, é correto afirmar, segundo o texto constitucional:", "o": ["a quebra do sigilo das comunicações telefônicas pode ser determinada por ordem judicial para fins de investigação criminal ou instrução processual civil ou penal.", "a ressalva por ordem judicial refere-se às comunicações telefônicas, nas hipóteses e na forma que a lei estabelecer, para fins de investigação criminal ou instrução processual penal.", "a quebra do sigilo das comunicações telefônicas pode ser determinada pelo delegado de polícia, em caso de urgência, para fins de investigação criminal.", "o sigilo da correspondência é absoluto, ao passo que o das comunicações telefônicas pode ser afastado por comissão parlamentar ou por autoridade policial."], "a": 1, "c": "O art. 5º, XII, ressalva \"no último caso\" (comunicações telefônicas) a ordem judicial, para fins de investigação criminal ou instrução processual penal. Os erros comuns são incluir o processo civil ou atribuir a decisão a autoridade não judicial.", "ref": "Art. 5º, XII"}, {"q": "O art. 5º, XXXVIII, da Constituição reconhece a instituição do júri, assegurando:", "o": ["a ampla defesa, a publicidade das votações, a soberania dos veredictos e a competência para o julgamento dos crimes dolosos contra a vida.", "a plenitude de defesa, o sigilo das votações, a soberania dos veredictos e a competência para o julgamento dos crimes contra a vida, dolosos ou culposos.", "a plenitude de defesa, o sigilo das votações, a soberania dos veredictos e a competência para o julgamento dos crimes hediondos.", "a plenitude de defesa, o sigilo das votações, a soberania dos veredictos e a competência para o julgamento dos crimes dolosos contra a vida."], "a": 3, "c": "As alíneas a a d do art. 5º, XXXVIII, asseguram plenitude de defesa, sigilo das votações, soberania dos veredictos e competência para os crimes dolosos contra a vida. Cuidado com a troca de plenitude por ampla defesa, de sigilo por publicidade e com a inclusão dos crimes culposos.", "ref": "Art. 5º, XXXVIII"}, {"q": "Segundo o art. 5º da Constituição, são crimes inafiançáveis e imprescritíveis:", "o": ["a prática do racismo e a ação de grupos armados, civis ou militares, contra a ordem constitucional e o Estado Democrático.", "a prática da tortura e o terrorismo.", "o tráfico ilícito de entorpecentes e a prática do racismo.", "os crimes hediondos e a ação de grupos armados, civis ou militares, contra a ordem constitucional e o Estado Democrático."], "a": 0, "c": "Apenas o racismo (art. 5º, XLII) e a ação de grupos armados contra a ordem constitucional e o Estado Democrático (art. 5º, XLIV) são imprescritíveis. Tortura, tráfico, terrorismo e hediondos (inciso XLIII) são inafiançáveis e insuscetíveis de graça ou anistia, mas não imprescritíveis: é o erro mais cobrado.", "ref": "Art. 5º, XLII e XLIV"}, {"q": "Nos termos do art. 5º, XLIII, da Constituição, a prática da tortura, o tráfico ilícito de entorpecentes e drogas afins, o terrorismo e os crimes definidos como hediondos serão considerados pela lei:", "o": ["crimes inafiançáveis e imprescritíveis, por eles respondendo os mandantes e os executores.", "crimes imprescritíveis e insuscetíveis de graça ou anistia, por eles respondendo apenas os executores.", "crimes inafiançáveis e insuscetíveis de graça ou anistia, por eles respondendo os mandantes, os executores e os que, podendo evitá-los, se omitirem.", "crimes afiançáveis, porém insuscetíveis de graça ou anistia, por eles respondendo os mandantes, os executores e os que, podendo evitá-los, se omitirem."], "a": 2, "c": "O art. 5º, XLIII, fala em crimes inafiançáveis e insuscetíveis de graça ou anistia e responsabiliza mandantes, executores e omitentes que podiam evitá-los. A imprescritibilidade fica reservada aos incisos XLII e XLIV.", "ref": "Art. 5º, XLIII"}, {"q": "Sobre a extradição, conforme o art. 5º, LI e LII, da Constituição, é correto afirmar:", "o": ["o brasileiro nato pode ser extraditado em caso de comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins.", "o brasileiro naturalizado pode ser extraditado por crime comum praticado após a naturalização.", "o estrangeiro pode ser extraditado por crime político ou de opinião, desde que haja tratado com o Estado requerente.", "o brasileiro naturalizado pode ser extraditado em caso de crime comum praticado antes da naturalização ou de comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei."], "a": 3, "c": "O inciso LI só permite extraditar o naturalizado, por crime comum anterior à naturalização ou por comprovado envolvimento em tráfico, a qualquer tempo; o nato nunca é extraditado. O inciso LII veda a extradição de estrangeiro por crime político ou de opinião, sem exceção por tratado.", "ref": "Art. 5º, LI e LII"}, {"q": "Assinale a alternativa que associa corretamente o remédio constitucional à hipótese de cabimento prevista no art. 5º da Constituição:", "o": ["Habeas data: proteger direito líquido e certo quando o responsável pela ilegalidade for autoridade pública.", "Habeas corpus: sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder.", "Mandado de injunção: assegurar a retificação de dados constantes de registros de entidades governamentais.", "Mandado de segurança: suprir a falta de norma regulamentadora que torne inviável o exercício de direitos constitucionais."], "a": 1, "c": "O art. 5º, LXVIII, prevê o habeas corpus para violência ou coação, sofrida ou ameaçada, na liberdade de locomoção. As demais trocam as hipóteses: direito líquido e certo é mandado de segurança (LXIX), retificação de dados é habeas data (LXXII, b) e falta de norma regulamentadora é mandado de injunção (LXXI).", "ref": "Art. 5º, LXVIII"}, {"q": "De acordo com o art. 5º, LXX, da Constituição, o mandado de segurança coletivo pode ser impetrado por:", "o": ["partido político com representação no Congresso Nacional e por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus membros ou associados.", "partido político com representação no Congresso Nacional e por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos dois anos, em defesa dos interesses de seus membros ou associados.", "qualquer partido político com registro na Justiça Eleitoral, independentemente de representação no Congresso Nacional, e por associação em funcionamento há pelo menos um ano.", "partido político com representação no Congresso Nacional e por associação legalmente constituída, desde que previamente autorizada pelo Poder Executivo."], "a": 0, "c": "O art. 5º, LXX, exige do partido representação no Congresso Nacional (alínea a) e da organização sindical, entidade de classe ou associação funcionamento há pelo menos um ano (alínea b). O prazo de um ano e a exigência de representação no Congresso são os detalhes mais trocados.", "ref": "Art. 5º, LXX"}, {"q": "Conforme o art. 5º, LVII, da Constituição, ninguém será considerado culpado:", "o": ["até a confirmação da condenação em segunda instância.", "até a prolação de sentença penal condenatória de primeiro grau.", "até o trânsito em julgado de sentença penal condenatória.", "até o recebimento da denúncia pelo juiz competente."], "a": 2, "c": "O art. 5º, LVII, fixa o marco no trânsito em julgado da sentença penal condenatória (presunção de inocência). Condenação em segunda instância ou sentença de primeiro grau não bastam pelo texto constitucional.", "ref": "Art. 5º, LVII"}, {"q": "Nos termos do art. 5º, LXI, da Constituição, ninguém será preso senão:", "o": ["em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária ou policial competente.", "em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária competente, salvo nos casos de qualquer crime praticado por militar.", "em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária competente, salvo nos casos de transgressão militar ou crime propriamente militar, definidos em lei.", "em flagrante delito ou por ordem verbal de autoridade judiciária competente, em casos de urgência, ratificada por escrito em seguida."], "a": 2, "c": "O art. 5º, LXI, exige flagrante ou ordem escrita e fundamentada de autoridade judiciária, com exceção apenas para transgressão militar e crime propriamente militar definidos em lei. Delegado não expede ordem de prisão e a exceção não alcança qualquer crime praticado por militar.", "ref": "Art. 5º, LXI"}, {"q": "Sobre os direitos do preso previstos no art. 5º da Constituição, é correto afirmar:", "o": ["a prisão de qualquer pessoa e o local onde se encontre serão comunicados imediatamente ao juiz competente e à família do preso ou à pessoa por ele indicada.", "a prisão será comunicada em até vinte e quatro horas ao juiz competente e ao Ministério Público.", "a prisão ilegal será imediatamente relaxada pela autoridade policial que a efetuou.", "o preso será informado de seus direitos, entre os quais o de permanecer calado, assegurada a assistência de advogado apenas na fase judicial."], "a": 0, "c": "O art. 5º, LXII, exige comunicação imediata ao juiz competente e à família do preso ou à pessoa por ele indicada. O relaxamento da prisão ilegal cabe à autoridade judiciária (LXV) e a assistência da família e de advogado não é limitada à fase judicial (LXIII).", "ref": "Art. 5º, LXII"}, {"q": "Segundo a literalidade do art. 5º, LXVII, da Constituição, não haverá prisão civil por dívida, salvo a:", "o": ["do responsável pelo inadimplemento de qualquer obrigação alimentícia, ainda que involuntário, e a do devedor de tributos.", "do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentícia e a do depositário infiel.", "do devedor de tributos e a do depositário infiel.", "do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentícia, apenas."], "a": 1, "c": "O texto do art. 5º, LXVII, ressalva o devedor de alimentos (inadimplemento voluntário e inescusável) e o depositário infiel. Atenção: o STF, em súmula vinculante, considera ilícita a prisão do depositário infiel, de modo que questões sobre jurisprudência admitem só a do devedor de alimentos; quando se pede a literalidade, as duas hipóteses constam do texto.", "ref": "Art. 5º, LXVII"}, {"q": "Quanto às penas, o art. 5º, XLVII, da Constituição estabelece que:", "o": ["não haverá pena de caráter perpétuo, salvo para crimes hediondos.", "não haverá pena de trabalhos forçados, salvo em caso de guerra declarada.", "não haverá pena de banimento, salvo para o brasileiro naturalizado.", "não haverá pena de morte, salvo em caso de guerra declarada, nos termos do art. 84, XIX."], "a": 3, "c": "A única exceção do art. 5º, XLVII, é a pena de morte em guerra declarada (alínea a). As penas de caráter perpétuo, de trabalhos forçados, de banimento e cruéis (alíneas b a e) são vedadas sem qualquer ressalva.", "ref": "Art. 5º, XLVII"}, {"q": "Sobre o direito de reunião, previsto no art. 5º, XVI, da Constituição, é correto afirmar que todos podem reunir-se pacificamente, sem armas, em locais abertos ao público:", "o": ["independentemente de autorização, desde que não frustrem outra reunião anteriormente convocada para o mesmo local, sendo apenas exigido prévio aviso à autoridade competente.", "mediante autorização prévia da autoridade competente, desde que não frustrem outra reunião anteriormente convocada para o mesmo local.", "independentemente de autorização ou de aviso, ainda que frustrem outra reunião anteriormente convocada para o mesmo local.", "independentemente de autorização, sendo exigido prévio aviso à autoridade judiciária competente."], "a": 0, "c": "O art. 5º, XVI, dispensa autorização e exige apenas prévio aviso à autoridade competente, sem frustrar reunião anteriormente convocada para o mesmo local. O erro comum é confundir aviso com autorização.", "ref": "Art. 5º, XVI"}, {"q": "De acordo com os incisos XXXIX e XL do art. 5º da Constituição:", "o": ["a lei penal não retroagirá em nenhuma hipótese, ainda que mais benéfica ao réu.", "não há crime sem lei anterior que o defina, mas a pena pode ser cominada por lei posterior ao fato.", "a lei penal mais grave retroagirá quando se tratar de crime hediondo.", "não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal, e a lei penal não retroagirá, salvo para beneficiar o réu."], "a": 3, "c": "O inciso XXXIX consagra a legalidade e a anterioridade penal (crime e pena) e o inciso XL proíbe a retroatividade da lei penal, salvo para beneficiar o réu. A retroatividade benéfica é a exceção mais cobrada.", "ref": "Art. 5º, XXXIX e XL"}, {"q": "Nos termos do art. 5º, LXXIII, da Constituição, a ação popular que vise a anular ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural pode ser proposta por:", "o": ["qualquer pessoa, física ou jurídica, ficando o autor isento de custas judiciais e do ônus da sucumbência, mesmo se comprovada má-fé.", "qualquer cidadão, arcando o autor com as custas judiciais e com o ônus da sucumbência em caso de improcedência.", "qualquer cidadão, ficando o autor, salvo comprovada má-fé, isento de custas judiciais e do ônus da sucumbência.", "partido político com representação no Congresso Nacional, salvo comprovada má-fé."], "a": 2, "c": "O art. 5º, LXXIII, confere legitimidade a qualquer cidadão e isenta o autor de custas e sucumbência, salvo comprovada má-fé. Erros comuns: estender a legitimidade a qualquer pessoa ou manter a isenção mesmo havendo má-fé.", "ref": "Art. 5º, LXXIII"}, {"q": "Conforme o art. 5º, § 3º, da Constituição, os tratados e convenções internacionais sobre direitos humanos serão equivalentes às emendas constitucionais se aprovados:", "o": ["em cada Casa do Congresso Nacional, em turno único, por dois terços dos votos dos respectivos membros.", "em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros.", "em sessão conjunta do Congresso Nacional, em dois turnos, por três quintos dos votos dos seus membros.", "em cada Casa do Congresso Nacional, em dois turnos, por maioria absoluta dos votos dos respectivos membros."], "a": 1, "c": "O art. 5º, § 3º, exige aprovação em cada Casa, em dois turnos, por três quintos dos votos dos respectivos membros. As pegadinhas trocam o quórum, o número de turnos ou falam em sessão conjunta.", "ref": "Art. 5º, § 3º"}, {"q": "Não figura expressamente no rol de direitos sociais do art. 6º da Constituição:", "o": ["o transporte.", "a propriedade.", "a moradia.", "a segurança."], "a": 1, "c": "O art. 6º lista educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados. A propriedade é direito individual garantido no art. 5º, caput e XXII, e não aparece no rol do art. 6º.", "ref": "Art. 6º"}, {"q": "Na redação vigente do art. 7º, XIII, da Constituição, é direito dos trabalhadores urbanos e rurais a duração do trabalho normal não superior a:", "o": ["8 horas diárias e 44 horas semanais, facultada a compensação de horários e a redução da jornada, mediante acordo ou convenção coletiva de trabalho.", "6 horas diárias e 36 horas semanais, vedada a compensação de horários.", "8 horas diárias e 40 horas semanais, facultada a compensação de horários e a redução da jornada, mediante acordo ou convenção coletiva de trabalho.", "8 horas diárias e 48 horas semanais, facultada a compensação de horários mediante acordo individual."], "a": 2, "c": "Na redação vigente, o art. 7º, XIII, fixa 8 horas diárias e 40 horas semanais, com compensação e redução por acordo ou convenção coletiva. As 44 horas semanais correspondem à redação anterior e são a armadilha para quem estudou por material desatualizado; a jornada de 6 horas é a dos turnos ininterruptos de revezamento (inciso XIV).", "ref": "Art. 7º, XIII"}, {"q": "O art. 7º, XXXIII, da Constituição proíbe:", "o": ["o trabalho noturno, perigoso ou insalubre a menores de dezesseis anos e qualquer trabalho a menores de quatorze anos, salvo na condição de aprendiz, a partir de doze anos.", "o trabalho noturno, perigoso ou insalubre a menores de dezoito anos e qualquer trabalho a menores de quatorze anos, salvo na condição de aprendiz, a partir de doze anos.", "qualquer trabalho a menores de dezoito anos, salvo na condição de aprendiz, a partir de dezesseis anos.", "o trabalho noturno, perigoso ou insalubre a menores de dezoito anos e qualquer trabalho a menores de dezesseis anos, salvo na condição de aprendiz, a partir de quatorze anos."], "a": 3, "c": "Pelo art. 7º, XXXIII, os limites são: dezoito anos para trabalho noturno, perigoso ou insalubre; dezesseis para qualquer trabalho; e quatorze para o aprendiz. A troca dessas três idades é o erro mais frequente.", "ref": "Art. 7º, XXXIII"}, {"q": "Nos termos do art. 12, § 3º, da Constituição, é cargo privativo de brasileiro nato:", "o": ["Ministro de Estado da Defesa.", "Senador da República.", "Ministro do Superior Tribunal de Justiça.", "Deputado Federal."], "a": 0, "c": "O art. 12, § 3º, VII, inclui o Ministro de Estado da Defesa entre os cargos privativos de nato. Senadores e Deputados não estão no rol (só os Presidentes do Senado e da Câmara, incisos II e III) e, no Judiciário, apenas os Ministros do STF (inciso IV).", "ref": "Art. 12, § 3º"}, {"q": "Quanto à naturalização, o art. 12, II, da Constituição estabelece que:", "o": ["os estrangeiros de qualquer nacionalidade residentes no Brasil há mais de dez anos ininterruptos e sem condenação penal serão naturalizados, desde que requeiram.", "os estrangeiros residentes no Brasil há mais de quinze anos ininterruptos serão naturalizados, ainda que tenham condenação penal.", "dos originários de países de língua portuguesa exigem-se apenas residência por dois anos ininterruptos e idoneidade moral.", "dos originários de países de língua portuguesa exigem-se apenas residência por um ano ininterrupto e idoneidade moral."], "a": 3, "c": "O art. 12, II, a, exige dos originários de países de língua portuguesa apenas um ano ininterrupto de residência e idoneidade moral; a alínea b exige dos demais estrangeiros mais de quinze anos ininterruptos de residência e ausência de condenação penal, mediante requerimento. Os prazos de um e quinze anos são os mais trocados.", "ref": "Art. 12, II"}, {"q": "Segundo a redação vigente do art. 12, § 4º, da Constituição, será declarada a perda da nacionalidade do brasileiro que:", "o": ["fizer pedido expresso de perda da nacionalidade brasileira perante autoridade brasileira competente, ressalvadas situações que acarretem apatridia.", "adquirir outra nacionalidade, em qualquer hipótese.", "tiver cancelada sua naturalização por ato do Ministro da Justiça, em virtude de atividade nociva ao interesse nacional.", "sendo nato, for condenado por crime hediondo com sentença transitada em julgado."], "a": 0, "c": "Na redação vigente, o art. 12, § 4º, prevê a perda por cancelamento da naturalização por sentença judicial (fraude no processo de naturalização ou atentado contra a ordem constitucional e o Estado Democrático) e por pedido expresso, ressalvada a apatridia. A perda pela simples aquisição de outra nacionalidade não consta mais do texto, e o cancelamento exige sentença judicial, não ato administrativo.", "ref": "Art. 12, § 4º"}, {"q": "De acordo com o art. 14, § 1º, da Constituição, o alistamento eleitoral e o voto são facultativos para:", "o": ["os analfabetos, os maiores de sessenta e cinco anos e os maiores de dezesseis e menores de dezoito anos.", "os analfabetos, os maiores de setenta anos e os conscritos durante o serviço militar obrigatório.", "os analfabetos, os maiores de setenta anos e os maiores de dezesseis e menores de dezoito anos.", "os maiores de setenta anos, os maiores de dezesseis e menores de dezoito anos e os estrangeiros residentes no País."], "a": 2, "c": "O art. 14, § 1º, II, torna facultativos o alistamento e o voto para analfabetos, maiores de setenta anos e maiores de dezesseis e menores de dezoito. Estrangeiros e conscritos, durante o serviço militar obrigatório, não podem alistar-se (art. 14, § 2º), o que é diferente de voto facultativo.", "ref": "Art. 14, § 1º, II"}, {"q": "Conforme o art. 14, § 3º, VI, da Constituição, é condição de elegibilidade a idade mínima de:", "o": ["trinta e cinco anos para Governador e Vice-Governador de Estado e do Distrito Federal.", "trinta anos para Governador e Vice-Governador de Estado e do Distrito Federal.", "trinta anos para Senador.", "vinte e um anos para Vereador."], "a": 1, "c": "O art. 14, § 3º, VI, fix
