<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A33">
<title>PenalFlux — Código Penal pelo Método do Verbo-Chave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1A33; --navy2:#16264A; --navy3:#22355F;
  --gold:#B8913A; --gold2:#D6B467; --goldhl:#EAD8A6; --goldbg:#F7F0DE;
  --wine:#7B1E2B; --winebg:#F6E8EA;
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#0E1A33; --ink2:#4E5A73; --ink3:#8A93A8; --line:#E2E5EC;
  --green:#1E7F5C; --greenbg:#E4F2EC; --blue:#2F4C9A;
  --shadow:0 1px 0 rgba(14,26,51,.04),0 10px 28px -16px rgba(14,26,51,.28);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --serif:'DM Serif Display',Georgia,serif; --law:'Source Serif 4',Georgia,serif;
}
[data-theme=dark]{
  --bg:#0A1226; --surface:#111C36; --surface2:#16233F; --ink:#EEF1F7; --ink2:#A3ADC4; --ink3:#6F7A94; --line:#22304F;
  --goldbg:#2A2414; --winebg:#35161C; --greenbg:#0F2E24; --goldhl:#5A4A22; --shadow:0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--blue)} [data-theme=dark] a{color:var(--gold2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.shell>div{min-width:0}
.rail{background:var(--navy);color:#B7C0D6;position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;color:#fff;text-decoration:none}
.seal{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E7CB86,#B8913A 60%,#8E6C24);display:grid;place-items:center;color:var(--navy);font-family:var(--serif);font-size:22px;box-shadow:0 0 0 3px rgba(214,180,103,.25),inset 0 -2px 0 rgba(0,0,0,.2);flex:none}
.brand b{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:#8590AA;margin-top:-2px}
.rgroup{font-size:12px;color:#6F7B98;font-weight:700;padding:16px 12px 6px}
.rl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;width:100%;text-align:left;transition:background .15s,color .15s}
.rl svg{width:19px;height:19px;flex:none;opacity:.85}
.rl:hover{background:rgba(255,255,255,.05);color:#fff}
.rl.on{background:linear-gradient(90deg,rgba(214,180,103,.18),rgba(214,180,103,.04));color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
.rl .cnt{margin-left:auto;font-size:12px;color:#6F7B98;font-weight:700}
.rail-card{margin-top:auto;border:1px solid rgba(214,180,103,.25);border-radius:16px;padding:16px;font-size:14px;background:rgba(214,180,103,.06)}
.rail-card b{color:#fff;display:block;font-size:15px}
.content{padding:30px 44px 70px;max-width:1200px;width:100%}
.topbar,.tabbar{display:none}
.page{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .content{padding:14px 16px calc(100px + var(--safe-b))}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 10px;background:var(--navy);color:#fff}
  .topbar .brand{padding:0}
  .topbar .seal{width:34px;height:34px;font-size:18px}
  .topbar .brand b{font-size:21px}
  .topbar .brand small{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--navy);padding:8px 4px calc(8px + var(--safe-b));border-top:1px solid rgba(214,180,103,.2)}
  .tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#8590AA;padding:5px 0}
  .tb svg{width:22px;height:22px}
  .tb.on{color:var(--gold2)}
}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:#fff;position:relative}
.ibtn svg{width:20px;height:20px}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:99px;background:var(--gold2)}

/* Type */
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.08;letter-spacing:-.3px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,27px);line-height:1.15}
h3{font-size:16px;font-weight:800;letter-spacing:-.1px}
.muted{color:var(--ink2)} .small{font-size:14px} .xs{font-size:12.5px}
.lede{color:var(--ink2);max-width:640px;margin-top:8px}
.mark{background:linear-gradient(100deg,transparent 2%,var(--goldhl) 4%,var(--goldhl) 96%,transparent 98%) no-repeat 0 85%/100% 45%;padding:0 .1em}
.sec{margin-top:36px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.link{font-weight:700;font-size:14px;color:var(--blue);text-decoration:none}
[data-theme=dark] .link{color:var(--gold2)}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:800;font-size:15px;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.navy{background:var(--navy);color:#fff}
[data-theme=dark] .btn.navy{background:var(--gold);color:var(--navy)}
.btn.gold{background:linear-gradient(180deg,#D6B467,#B8913A);color:var(--navy);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.btn.go{background:var(--green);color:#fff}
.btn.soft{background:var(--surface);border:1px solid var(--line)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff}
.btn.block{width:100%} .btn.sm{padding:9px 14px;font-size:14px;border-radius:11px}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.gold{background:var(--goldbg);color:#8A6A1F;border-color:transparent}
[data-theme=dark] .chip.gold{color:var(--gold2)}
.chip.ok{background:var(--greenbg);color:var(--green);border-color:transparent}
.chip.wine{background:var(--winebg);color:var(--wine);border-color:transparent}
[data-theme=dark] .chip.wine{color:#E89AA5}
.chip svg{width:13px;height:13px}

/* Home */
.hero{background:var(--navy);color:#fff;border-radius:26px;padding:30px;position:relative;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr;gap:26px}
.hero::before{content:"§";position:absolute;right:-24px;bottom:-110px;font-family:var(--serif);font-size:360px;line-height:1;color:rgba(214,180,103,.07);pointer-events:none}
.hero .eb{color:var(--gold2);font-weight:700;font-size:14px}
.verb{font-family:var(--serif);font-size:clamp(56px,8.5vw,96px);line-height:.95;margin:10px 0 16px;color:#fff}
.verb span{background:linear-gradient(100deg,transparent 1%,var(--gold) 3%,var(--gold) 97%,transparent 99%) no-repeat 0 96%/100% 12%;padding:0 .04em}
.hero p{color:#C3CBDD;max-width:480px}
.hero .btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero-stats{display:grid;gap:12px;align-content:start;position:relative}
.hstat{background:rgba(255,255,255,.05);border:1px solid rgba(214,180,103,.18);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}
.hstat .n{font-family:var(--serif);font-size:34px;line-height:1;color:var(--gold2)}
.hstat .l{font-size:14px;color:#C3CBDD}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:24px}}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.week{display:flex;gap:6px;margin-top:4px}
.week i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12)}
.week i.on{background:var(--gold2)}
.remind{display:flex;gap:14px;align-items:center;background:var(--goldbg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:18px;padding:14px 16px;margin-top:16px}
.remind svg{width:24px;height:24px;color:var(--gold);flex:none}
.remind b{display:block}
.remind .btn{margin-left:auto}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:150px;position:relative}
.mod:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.mod .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.mod .ic svg{width:22px;height:22px}
.mod p{font-size:14px;color:var(--ink2)}
.mod .lock{position:absolute;top:14px;right:14px}
.trail{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.trail:last-child{border-bottom:0}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}

/* Code browser */
.parts{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:18px}
.parts button{padding:9px 18px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink2)}
.parts button.on{background:var(--navy);color:#fff}
[data-theme=dark] .parts button.on{background:var(--gold);color:var(--navy)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-top:14px;box-shadow:var(--shadow)}
.search svg{width:20px;height:20px;color:var(--ink3);flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}
.title-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}
.title-head{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;width:100%;text-align:left}
.roman{width:54px;height:54px;border-radius:14px;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:19px}
.title-head .meta{min-width:0}
.title-head .meta b{display:block;font-size:16px;font-weight:800}
.title-head .chev{transition:transform .2s;color:var(--ink3)}
.title-card.open .chev{transform:rotate(180deg)}
.chap{padding:10px 18px 4px;font-size:13px;font-weight:800;color:var(--gold);border-top:1px solid var(--line);background:var(--surface2)}
.arow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .12s}
.arow:hover{background:var(--surface2)}
.arow .no{font-family:var(--serif);font-size:22px;line-height:1;color:var(--ink)}
.arow .no small{display:block;font-family:Manrope;font-size:11px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.arow .t{font-weight:700;font-size:15.5px;display:block}
.arow .v{font-size:13.5px;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .st{display:flex;gap:6px;align-items:center}
.tick{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:var(--greenbg);color:var(--green)}
.tick svg{width:14px;height:14px}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}

/* Article */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink2);font-size:15px;margin-bottom:16px}
.back svg{width:18px;height:18px}
.crumbs{font-size:13px;color:var(--ink3);font-weight:600;margin-bottom:10px}
.art-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
@media (max-width:1050px){.art-wrap{grid-template-columns:1fr}}
.art-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.art-num{flex:none;background:var(--navy);color:#fff;border-radius:18px;padding:12px 14px;text-align:center;min-width:92px;border-bottom:4px solid var(--gold)}
.art-num small{display:block;font-size:12px;color:var(--gold2);font-weight:700}
.art-num b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.kv{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.kv .lbl{font-size:13px;font-weight:700;color:var(--ink2)}
.kv .w{font-family:var(--serif);font-size:clamp(32px,5.5vw,48px);line-height:1.08;margin-top:2px}
.layers{display:grid;gap:12px}
.layer{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 18px 14px}
.layer .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.layer h3{margin-bottom:4px}
.law{font-family:var(--law);font-size:18px;line-height:1.65}
.layer.simple .k{background:var(--greenbg);color:var(--green);border-color:transparent}
.layer.case .k{background:#E8ECF7;color:var(--blue);border-color:transparent}
[data-theme=dark] .layer.case .k{background:#1D2A4D;color:#9DB0E6}
.layer.trap{background:var(--goldbg);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.layer.trap .k{background:var(--gold);color:#fff;border-color:transparent}
.pena{display:flex;gap:14px;align-items:center;background:var(--winebg);border-radius:18px;padding:16px 18px;margin-top:12px}
.pena .ic{width:42px;height:42px;border-radius:12px;background:var(--wine);color:#fff;display:grid;place-items:center;flex:none}
.pena .ic svg{width:22px;height:22px}
.pena b{display:block;font-size:17px}
.pena span{font-size:13px;color:var(--ink2);font-weight:700}
details.full{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}
details.full summary{cursor:pointer;padding:16px 18px;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.full summary::-webkit-details-marker{display:none}
details.full[open] summary{border-bottom:1px solid var(--line)}
.lawtxt{padding:8px 18px 18px;font-family:var(--law);font-size:16.5px;line-height:1.7}
.lawtxt p{padding:6px 0}
.lawtxt p.rub{font-family:Manrope;font-size:13px;font-weight:800;color:var(--gold);padding-top:14px}
.lawtxt p.pn{color:var(--wine);font-weight:600}
[data-theme=dark] .lawtxt p.pn{color:#E89AA5}
.lawtxt p.par{padding-left:14px;border-left:2px solid var(--line)}
.side{display:grid;gap:12px;position:sticky;top:20px}
.confuse{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.prevnext{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* Mapa mental */
.mm{display:grid;grid-template-columns:220px 280px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-top:20px;min-height:540px}
.mm-col{border-right:1px solid var(--line);overflow:auto;max-height:72vh}
.mm-col:last-child{border-right:0}
.mm-node{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;position:relative}
.mm-node:hover{background:var(--surface2)}
.mm-node.on{background:var(--goldbg)}
.mm-node.on::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:3px;background:var(--gold)}
.mm-node .r{font-family:var(--serif);font-weight:400;color:var(--gold);min-width:30px;font-size:17px}
.mm-node small{display:block;font-weight:600;color:var(--ink3);font-size:12px}
.mm-leaf{padding:14px 18px;border-bottom:1px solid var(--line)}
.mm-leaf h4{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:8px}
.mm-chips{display:flex;flex-wrap:wrap;gap:6px}
.mm-chips a{text-decoration:none;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600}
.mm-chips a b{font-family:var(--serif);font-weight:400;color:var(--gold);margin-right:4px}
.mm-chips a:hover{border-color:var(--gold)}
@media (max-width:900px){.mm{grid-template-columns:1fr;min-height:0}.mm-col{max-height:none;border-right:0}.mm-col.hide-m{display:none}}

/* Tabela de penas */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink2);font-weight:800;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line);position:sticky;top:0;cursor:pointer;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--serif);font-size:18px;white-space:nowrap}
.tbl td.p{color:var(--wine);font-weight:600}
[data-theme=dark] .tbl td.p{color:#E89AA5}
.tbl tr:hover td{background:var(--surface2)}
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:70vh;margin-top:14px;box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.filters select{max-width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}

/* Compare */
.cmp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cmp-card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.cmp-card .vs{font-family:var(--serif);font-size:22px;line-height:1.2}
.cmp-card .vs em{font-family:Manrope;font-style:normal;font-size:13px;color:var(--ink3);font-weight:700;margin:0 4px}
.cmp-cols{display:grid;gap:14px;margin-top:20px}
.cmp-col{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cmp-col .w{font-family:var(--serif);font-size:30px;line-height:1.1}
.cmp-col .f{font-size:12.5px;font-weight:800;color:var(--ink3)}
.rule{background:var(--navy);color:#fff;border-radius:20px;padding:22px;margin-top:16px;border-left:6px solid var(--gold)}
.rule .lbl{color:var(--gold2);font-size:14px;font-weight:700}
.rule p{font-family:var(--serif);font-size:clamp(20px,2.6vw,26px);line-height:1.3;margin-top:6px}

/* Train */
.mode{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.mode .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;font-family:var(--serif);font-size:22px;background:var(--navy);color:var(--gold2)}
.mode .meta{flex:1;min-width:0}
.quiz{max-width:740px;margin:0 auto}
.qbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.qtext{font-size:clamp(18px,2.4vw,22px);font-weight:700;line-height:1.4;margin:22px 0 18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;font-weight:500;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .l{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:800;font-size:13px;border:1px solid var(--line)}
.opt.right{border-color:var(--green);background:var(--greenbg)} .opt.right .l{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--wine);background:var(--winebg)} .opt.wrong .l{background:var(--wine);color:#fff;border-color:var(--wine)}
.opt:disabled{cursor:default}
.comment{border-radius:16px;padding:16px;margin-top:4px;background:var(--goldbg);border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line))}
.comment.locked{background:var(--surface2);border:1px dashed var(--line);display:flex;gap:12px;align-items:center}
.score{font-family:var(--serif);font-size:110px;line-height:1;color:var(--ink)}
.fc{max-width:580px;margin:20px auto 0;height:390px;cursor:pointer}
.face{height:100%;border-radius:26px;padding:28px;display:flex;flex-direction:column}
.fc .back,.fc.flip .front{display:none}
.fc.flip .back{display:flex;animation:fl .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fl{from{transform:rotateY(80deg);opacity:.3}}
.face.front{background:var(--navy);color:#fff;justify-content:center;align-items:center;text-align:center;border:1px solid rgba(214,180,103,.3)}
.face.front .w{font-family:var(--serif);font-size:54px;line-height:1.05;margin:12px 0;color:var(--gold2)}
.face.back{background:var(--surface);border:1px solid var(--line);overflow:auto;gap:10px}
.fc-act{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:580px;margin:16px auto 0}
.btn.bad{background:var(--winebg);color:var(--wine)} .btn.good{background:var(--greenbg);color:var(--green)}
.trap-card{max-width:640px;margin:20px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}
.trap-card .af{font-family:var(--law);font-size:21px;line-height:1.5;margin:10px 0 20px}

/* Store */
.prod{display:flex;gap:16px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.prod:hover{transform:translateY(-2px)}
.cover{width:86px;flex:none;border-radius:8px 14px 14px 8px;background:var(--c);position:relative;padding:12px 10px 10px 16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 6px 0 0 rgba(0,0,0,.25),inset 0 -3px 0 rgba(0,0,0,.15);min-height:114px;overflow:hidden}
.cover::before{content:"";position:absolute;left:10px;right:8px;top:8px;bottom:8px;border:1px solid rgba(214,180,103,.6);border-radius:4px}
.cover b{font-family:var(--serif);font-weight:400;font-size:15px;line-height:1.1;position:relative}
.cover small{font-size:9.5px;color:var(--gold2);font-weight:800;position:relative}
.prod .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:2px 0}
.prod .meta p{font-size:14px;color:var(--ink2)}
.prod .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:8px;flex-wrap:wrap}
.price{font-weight:800;font-size:17px}
.price s{color:var(--ink3);font-weight:500;font-size:13px;margin-right:4px}
.plan-hero{background:var(--navy);color:#fff;border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-bottom:4px solid var(--gold)}
@media (max-width:900px){.plan-hero{grid-template-columns:1fr}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,30,.6);z-index:60;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 22px calc(22px + var(--safe-b));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:901px){.scrim{align-items:center}.sheet{border-radius:26px;padding:24px 26px 26px}.sheet .grab{display:none}}
.sheet ul{list-style:none;display:grid;gap:10px;margin:16px 0}
.sheet li{display:flex;gap:10px;align-items:flex-start}
.sheet li svg{width:20px;height:20px;color:var(--green);flex:none;margin-top:2px}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.field input{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);outline:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:var(--surface2)}
.opts button.on{border-color:var(--navy);background:var(--navy);color:#fff}
[data-theme=dark] .opts button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pay button{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.pay button.on{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.note{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:80;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;border:1px solid rgba(214,180,103,.35)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media (min-width:901px){.toast{bottom:28px}}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--green)} .switch.on::after{transform:translateX(20px)}
.chat{display:grid;gap:10px;margin:16px 0}
.bub{max-width:88%;padding:12px 14px;border-radius:16px;font-size:15px}
.bub.me{justify-self:end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bub.bot{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.legal{margin-top:44px;font-size:12.5px;color:var(--ink3);line-height:1.6;max-width:820px}
.rank{font-family:var(--serif);font-size:28px;color:var(--gold);min-width:44px;text-align:center}
</style>
</head>

<script>
const ARTS=[{"n":"1","t":"Anterioridade da lei","k":"lei anterior","s":"Só existe crime se uma lei, feita antes do fato, disser que aquela conduta é crime. E só pode haver pena se a lei já a previa antes.","e":"Se uma nova lei passar a punir certa conduta hoje, quem a praticou no mês passado não pode ser processado por ela.","d":"O artigo traz duas garantias juntas: não há crime sem lei anterior e não há pena sem prévia cominação legal (pena previamente fixada em lei). Não basta a conduta ser imoral ou prejudicial: precisa estar descrita em lei.","pena":"","rub":"Anterioridade da Lei","caput":"Não há crime sem lei anterior que o defina. Não há pena sem prévia cominação legal.","txt":["Art. 1º - Não há crime sem lei anterior que o defina. Não há pena sem prévia cominação legal."],"ti":0,"ch":""},{"n":"2","t":"Lei penal no tempo","k":"lei posterior","s":"Se uma lei nova deixa de considerar algo crime, ninguém mais pode ser punido por isso, e a execução da pena e os efeitos penais da condenação acabam. Qualquer lei nova que favoreça o acusado vale também para fatos passados.","e":"Se alguém cumpre pena por uma conduta e uma lei nova deixa de tratá-la como crime, a execução da pena cessa.","d":"A lei mais favorável retroage mesmo depois de sentença condenatória transitada em julgado (aquela da qual não cabe mais recurso). Quando o fato deixa de ser crime, cessam só os efeitos penais da sentença, não os civis.","pena":"","rub":"Lei penal no tempo","caput":"Ninguém pode ser punido por fato que lei posterior deixa de considerar crime, cessando em virtude dela a execução e os efeitos penais da sentença condenatória.","txt":["Art. 2º - Ninguém pode ser punido por fato que lei posterior deixa de considerar crime, cessando em virtude dela a execução e os efeitos penais da sentença condenatória.","Parágrafo único - A lei posterior, que de qualquer modo favorecer o agente, aplica-se aos fatos anteriores, ainda que decididos por sentença condenatória transitada em julgado."],"ti":0,"ch":""},{"n":"3","t":"Lei excepcional ou temporária","k":"lei temporária","s":"A lei feita para um período certo (temporária) ou para uma situação especial (excepcional) continua valendo para os fatos cometidos enquanto ela estava em vigor, mesmo depois que ela termina.","e":"Quem descumpre uma regra penal criada só para o período de uma calamidade pública continua respondendo por isso depois que a calamidade acaba.","d":"É exceção à retroatividade da lei mais benéfica: o fim da lei temporária ou excepcional não apaga o crime cometido durante sua vigência.","pena":"","rub":"Lei excepcional ou temporária","caput":"A lei excepcional ou temporária, embora decorrido o período de sua duração ou cessadas as circunstâncias que a determinaram, aplica-se ao fato praticado durante sua vigência.","txt":["Art. 3º - A lei excepcional ou temporária, embora decorrido o período de sua duração ou cessadas as circunstâncias que a determinaram, aplica-se ao fato praticado durante sua vigência."],"ti":0,"ch":""},{"n":"4","t":"Tempo do crime","k":"momento da ação","s":"O crime é considerado praticado no momento em que a pessoa agiu ou deixou de agir, mesmo que o resultado aconteça depois.","e":"Se um adolescente atira em alguém e a vítima só morre depois que o atirador completa a maioridade, vale a data do tiro, e ele não responde pelo Código Penal.","d":"O Código adota a teoria da atividade para o tempo do crime: importa a ação ou omissão, não o resultado. Não confunda com o lugar do crime (art. 6º), que considera tanto a ação quanto o resultado.","pena":"","rub":"Tempo do crime","caput":"Considera-se praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado.","txt":["Art. 4º - Considera-se praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado."],"ti":0,"ch":""},{"n":"5","t":"Territorialidade","k":"território nacional","s":"A lei brasileira se aplica aos crimes cometidos dentro do Brasil, respeitados os tratados internacionais. Navios e aviões brasileiros públicos ou a serviço do governo contam como território brasileiro onde estiverem; os privados contam quando estão em alto-mar ou no espaço aéreo correspondente.","e":"Um furto cometido a bordo de um navio mercante brasileiro em alto-mar é julgado pela lei brasileira.","d":"Embarcação ou aeronave pública brasileira é extensão do território onde quer que esteja; a privada, só em alto-mar ou no espaço aéreo correspondente. O § 2º também alcança aeronaves e embarcações estrangeiras privadas pousadas ou em voo no espaço aéreo brasileiro, ou em porto ou mar territorial do Brasil.","pena":"","rub":"Territorialidade","caput":"Aplica-se a lei brasileira, sem prejuízo de convenções, tratados e regras de direito internacional, ao crime cometido no território nacional.","txt":["Art. 5º - Aplica-se a lei brasileira, sem prejuízo de convenções, tratados e regras de direito internacional, ao crime cometido no território nacional.","§ 1º - Para os efeitos penais, consideram-se como extensão do território nacional as embarcações e aeronaves brasileiras, de natureza pública ou a serviço do governo brasileiro onde quer que se encontrem, bem como as aeronaves e as embarcações brasileiras, mercantes ou de propriedade privada, que se achem, respectivamente, no espaço aéreo correspondente ou em alto-mar.","§ 2º - É também aplicável a lei brasileira aos crimes praticados a bordo de aeronaves ou embarcações estrangeiras de propriedade privada, achando-se aquelas em pouso no território nacional ou em vôo no espaço aéreo correspondente, e estas em porto ou mar territorial do Brasil."],"ti":0,"ch":""},{"n":"6","t":"Lugar do crime","k":"lugar do crime","s":"O crime é considerado praticado tanto no lugar onde ocorreu a ação ou omissão, no todo ou em parte, quanto no lugar onde o resultado aconteceu ou deveria acontecer.","e":"Se alguém envia do Paraguai uma encomenda envenenada que mata uma pessoa em São Paulo, o crime também é considerado praticado no Brasil.","d":"Aqui vale a teoria da ubiquidade (ação ou resultado), diferente do tempo do crime (art. 4º), que olha só para a ação. Dica de memória: LUTA, lugar = ubiquidade, tempo = atividade.","pena":"","rub":"Lugar do crime","caput":"Considera-se praticado o crime no lugar em que ocorreu a ação ou omissão, no todo ou em parte, bem como onde se produziu ou deveria produzir-se o resultado.","txt":["Art. 6º - Considera-se praticado o crime no lugar em que ocorreu a ação ou omissão, no todo ou em parte, bem como onde se produziu ou deveria produzir-se o resultado."],"ti":0,"ch":""},{"n":"7","t":"Extraterritorialidade","k":"cometidos no estrangeiro","s":"Lista crimes cometidos fora do Brasil que mesmo assim ficam sujeitos à lei brasileira. Em alguns casos (inciso I) a aplicação é automática; em outros (inciso II e § 3º) depende de várias condições, como o agente entrar no Brasil e o fato também ser crime no outro país.","e":"Um brasileiro que comete um crime no exterior e depois volta ao Brasil pode ser julgado aqui, se presentes todas as condições do § 2º.","d":"Nos casos do inciso I (como crime contra a vida ou liberdade do Presidente da República), o agente é punido pela lei brasileira ainda que absolvido ou condenado no estrangeiro. No crime de estrangeiro contra brasileiro fora do Brasil (§ 3º), além das condições do § 2º, exige-se que a extradição não tenha sido pedida ou tenha sido negada e que haja requisição do Ministro da Justiça.","pena":"","rub":"Extraterritorialidade","caput":"Ficam sujeitos à lei brasileira, embora cometidos no estrangeiro:","txt":["Art. 7º - Ficam sujeitos à lei brasileira, embora cometidos no estrangeiro:","I - os crimes:","a) contra a vida ou a liberdade do Presidente da República;","b) contra o patrimônio ou a fé pública da União, do Distrito Federal, de Estado, de Território, de Município, de empresa pública, sociedade de economia mista, autarquia ou fundação instituída pelo Poder Público;","c) contra a administração pública, por quem está a seu serviço;","d) de genocídio, quando o agente for brasileiro ou domiciliado no Brasil;","II - os crimes:","a) que, por tratado ou convenção, o Brasil se obrigou a reprimir;","b) praticados por brasileiro;","c) praticados em aeronaves ou embarcações brasileiras, mercantes ou de propriedade privada, quando em território estrangeiro e aí não sejam julgados.","§ 1º - Nos casos do inciso I, o agente é punido segundo a lei brasileira, ainda que absolvido ou condenado no estrangeiro.","§ 2º - Nos casos do inciso II, a aplicação da lei brasileira depende do concurso das seguintes condições:","a) entrar o agente no território nacional;","b) ser o fato punível também no país em que foi praticado;","c) estar o crime incluído entre aqueles pelos quais a lei brasileira autoriza a extradição;","d) não ter sido o agente absolvido no estrangeiro ou não ter aí cumprido a pena;","e) não ter sido o agente perdoado no estrangeiro ou, por outro motivo, não estar extinta a punibilidade, segundo a lei mais favorável.","§ 3º - A lei brasileira aplica-se também ao crime cometido por estrangeiro contra brasileiro fora do Brasil, se, reunidas as condições previstas no parágrafo anterior:","a) não foi pedida ou foi negada a extradição;","b) houve requisição do Ministro da Justiça.","Pena cumprida no estrangeiro"],"ti":0,"ch":""},{"n":"8","t":"Pena cumprida no estrangeiro","k":"pena cumprida","s":"Se a pessoa já cumpriu pena no exterior pelo mesmo crime, isso é levado em conta no Brasil. Se as penas forem de tipos diferentes, a de fora diminui a daqui; se forem iguais, o tempo cumprido lá é descontado.","e":"Quem já cumpriu um período de prisão no exterior e é condenado aqui à prisão pelo mesmo crime terá esse tempo descontado da pena brasileira.","d":"Atenção às palavras: penas diversas = atenua; penas idênticas = computa (desconta). Evita que a pessoa seja punida duas vezes pelo mesmo fato.","pena":"","rub":"","caput":"A pena cumprida no estrangeiro atenua a pena imposta no Brasil pelo mesmo crime, quando diversas, ou nela é computada, quando idênticas.","txt":["Art. 8º - A pena cumprida no estrangeiro atenua a pena imposta no Brasil pelo mesmo crime, quando diversas, ou nela é computada, quando idênticas."],"ti":0,"ch":""},{"n":"9","t":"Eficácia de sentença estrangeira","k":"homologada","s":"Uma sentença de outro país pode ser homologada (validada) no Brasil para obrigar o condenado a reparar o dano e outros efeitos civis, ou para sujeitá-lo a medida de segurança. Isso só vale se a lei brasileira produzir as mesmas consequências no caso.","e":"Uma vítima pode pedir a homologação no Brasil de uma condenação estrangeira para cobrar do condenado a reparação do prejuízo.","d":"Para efeitos civis, a homologação depende de pedido da parte interessada; para medida de segurança, depende de tratado de extradição com o país ou, na falta dele, de requisição do Ministro da Justiça. A sentença estrangeira não é homologada para fazer cumprir pena de prisão.","pena":"","rub":"Eficácia de sentença estrangeira","caput":"A sentença estrangeira, quando a aplicação da lei brasileira produz na espécie as mesmas conseqüências, pode ser homologada no Brasil para:","txt":["Art. 9º - A sentença estrangeira, quando a aplicação da lei brasileira produz na espécie as mesmas conseqüências, pode ser homologada no Brasil para:","I - obrigar o condenado à reparação do dano, a restituições e a outros efeitos civis;","II - sujeitá-lo a medida de segurança.","Parágrafo único - A homologação depende:","a) para os efeitos previstos no inciso I, de pedido da parte interessada;","b) para os outros efeitos, da existência de tratado de extradição com o país de cuja autoridade judiciária emanou a sentença, ou, na falta de tratado, de requisição do Ministro da Justiça."],"ti":0,"ch":""},{"n":"10","t":"Contagem de prazo","k":"dia do começo","s":"Nos prazos penais, o primeiro dia entra na contagem. Dias, meses e anos são contados pelo calendário comum.","e":"Uma pena que começa a ser cumprida numa segunda-feira tem essa segunda-feira contada como o primeiro dia.","d":"No prazo penal o dia do começo é incluído, ao contrário do prazo processual, em que normalmente se exclui o primeiro dia. Meses e anos seguem o calendário comum, sem conversão para um número fixo de dias.","pena":"","rub":"Contagem de prazo","caput":"O dia do começo inclui-se no cômputo do prazo. Contam-se os dias, os meses e os anos pelo calendário comum.","txt":["Art. 10 - O dia do começo inclui-se no cômputo do prazo. Contam-se os dias, os meses e os anos pelo calendário comum."],"ti":0,"ch":""},{"n":"11","t":"Frações não computáveis da pena","k":"frações","s":"Ao calcular a pena, as horas que sobram (frações de dia) são desprezadas nas penas de prisão e restritivas de direitos. Na multa, despreza-se a fração da moeda.","e":"Se o cálculo de uma pena resultar em alguns meses, alguns dias e mais algumas horas, as horas são simplesmente ignoradas.","d":"O texto fala em frações de cruzeiro, moeda antiga; hoje se entende como os centavos do real. As frações desprezadas são de dia, não de mês ou de ano.","pena":"","rub":"Frações não computáveis da pena","caput":"Desprezam-se, nas penas privativas de liberdade e nas restritivas de direitos, as frações de dia, e, na pena de multa, as frações de cruzeiro.","txt":["Art. 11 - Desprezam-se, nas penas privativas de liberdade e nas restritivas de direitos, as frações de dia, e, na pena de multa, as frações de cruzeiro."],"ti":0,"ch":""},{"n":"12","t":"Legislação especial","k":"lei especial","s":"As regras gerais do Código Penal também valem para crimes previstos em outras leis, a menos que essas leis digam algo diferente.","e":"As regras de tentativa do Código Penal se aplicam a um crime previsto em lei especial, se essa lei não trouxer regra própria.","d":"É o princípio da especialidade: a lei especial prevalece quando trata do assunto de forma diversa; se ela for omissa, aplica-se o Código.","pena":"","rub":"Legislação especial","caput":"As regras gerais deste Código aplicam-se aos fatos incriminados por lei especial, se esta não dispuser de modo diverso.","txt":["Art. 12 - As regras gerais deste Código aplicam-se aos fatos incriminados por lei especial, se esta não dispuser de modo diverso."],"ti":0,"ch":""},{"n":"13","t":"Relação de causalidade","k":"deu causa","s":"Só responde pelo resultado quem lhe deu causa, e causa é a ação ou omissão sem a qual o resultado não teria acontecido. A omissão só importa quando a pessoa devia e podia agir para evitar o resultado.","e":"Um salva-vidas de plantão que vê alguém se afogando e não faz nada, podendo ajudar, responde pelo resultado.","d":"Causa superveniente relativamente independente que, por si só, produz o resultado exclui a imputação, mas o agente responde pelos atos anteriores. O dever de agir existe para quem tem obrigação legal de cuidado, para quem assumiu a responsabilidade de impedir o resultado ou para quem criou o risco com sua conduta anterior.","pena":"","rub":"Relação de causalidade","caput":"O resultado, de que depende a existência do crime, somente é imputável a quem lhe deu causa. Considera-se causa a ação ou omissão sem a qual o resultado não teria ocorrido.","txt":["Art. 13 - O resultado, de que depende a existência do crime, somente é imputável a quem lhe deu causa. Considera-se causa a ação ou omissão sem a qual o resultado não teria ocorrido.","Superveniência de causa independente","§ 1º - A superveniência de causa relativamente independente exclui a imputação quando, por si só, produziu o resultado; os fatos anteriores, entretanto, imputam-se a quem os praticou.","Relevância da omissão","§ 2º - A omissão é penalmente relevante quando o omitente devia e podia agir para evitar o resultado. O dever de agir incumbe a quem:","a) tenha por lei obrigação de cuidado, proteção ou vigilância;","b) de outra forma, assumiu a responsabilidade de impedir o resultado;","c) com seu comportamento anterior, criou o risco da ocorrência do resultado."],"ti":1,"ch":""},{"n":"14","t":"Crime consumado e tentativa","k":"consumado","s":"O crime está consumado quando reúne todos os elementos da sua definição na lei. É tentado quando a execução começou, mas não se completou por motivos alheios à vontade do agente; nesse caso, a pena do crime consumado é diminuída de um a dois terços.","e":"Quem é preso pelo segurança logo depois de colocar a mão na bolsa da vítima, sem conseguir levar nada, responde por tentativa.","d":"A diminuição da tentativa é de um a dois terços, salvo disposição em contrário. Se o crime não se consumou por vontade do próprio agente, não é tentativa, e sim desistência voluntária ou arrependimento eficaz (art. 15).","pena":"","rub":"","caput":"Diz-se o crime:","txt":["Art. 14 - Diz-se o crime:","Crime consumado","I - consumado, quando nele se reúnem todos os elementos de sua definição legal;","Tentativa","II - tentado, quando, iniciada a execução, não se consuma por circunstâncias alheias à vontade do agente.","Pena de tentativa","Parágrafo único - Salvo disposição em contrário, pune-se a tentativa com a pena correspondente ao crime consumado, diminuída de um a dois terços."],"ti":1,"ch":""},{"n":"15","t":"Desistência voluntária e arrependimento eficaz","k":"desiste","s":"Se a pessoa, por vontade própria, para no meio da execução ou impede que o resultado aconteça, ela responde só pelo que já fez.","e":"Quem dá veneno a alguém e, arrependido, leva a vítima ao hospital a tempo de salvá-la responde só pelas lesões causadas, não por tentativa de homicídio.","d":"Desistência voluntária é parar a execução; arrependimento eficaz é agir para impedir o resultado depois de terminar a execução. Nos dois casos a consumação não ocorre por vontade do agente, por isso não há tentativa.","pena":"","rub":"Desistência voluntária e arrependimento eficaz","caput":"O agente que, voluntariamente, desiste de prosseguir na execução ou impede que o resultado se produza, só responde pelos atos já praticados.","txt":["Art. 15 - O agente que, voluntariamente, desiste de prosseguir na execução ou impede que o resultado se produza, só responde pelos atos já praticados."],"ti":1,"ch":""},{"n":"16","t":"Arrependimento posterior","k":"reparado o dano","s":"Nos crimes sem violência ou grave ameaça à pessoa, se o agente, por vontade própria, reparar o dano ou devolver a coisa até o recebimento da denúncia ou da queixa, a pena será reduzida de um a dois terços.","e":"Quem furta um celular e o devolve voluntariamente antes de o juiz receber a denúncia tem a pena reduzida.","d":"O limite é o recebimento (não o oferecimento) da denúncia ou da queixa. Não cabe em crimes com violência ou grave ameaça à pessoa, e o crime já está consumado, por isso só reduz a pena, não a exclui.","pena":"","rub":"Arrependimento posterior","caput":"Nos crimes cometidos sem violência ou grave ameaça à pessoa, reparado o dano ou restituída a coisa, até o recebimento da denúncia ou da queixa, por ato voluntário do agente, a pena será reduzida de um a dois terços.","txt":["Art. 16 - Nos crimes cometidos sem violência ou grave ameaça à pessoa, reparado o dano ou restituída a coisa, até o recebimento da denúncia ou da queixa, por ato voluntário do agente, a pena será reduzida de um a dois terços."],"ti":1,"ch":""},{"n":"17","t":"Crime impossível","k":"impossível consumar","s":"Não se pune a tentativa quando era impossível o crime se consumar, porque o meio usado não funcionaria de jeito nenhum ou porque o objeto do crime não existia ou não servia.","e":"Quem tenta matar alguém com uma arma de brinquedo, achando que é verdadeira, não responde por tentativa de homicídio.","d":"A ineficácia do meio e a impropriedade do objeto precisam ser absolutas. Se forem apenas relativas, por exemplo uma arma de verdade que falhou, há tentativa punível.","pena":"","rub":"Crime impossível","caput":"Não se pune a tentativa quando, por ineficácia absoluta do meio ou por absoluta impropriedade do objeto, é impossível consumar-se o crime.","txt":["Art. 17 - Não se pune a tentativa quando, por ineficácia absoluta do meio ou por absoluta impropriedade do objeto, é impossível consumar-se o crime."],"ti":1,"ch":""},{"n":"18","t":"Crime doloso e culposo","k":"dolo ou culpa","s":"Crime doloso é quando a pessoa quis o resultado ou assumiu o risco de produzi-lo. Crime culposo é quando ela causou o resultado por imprudência, negligência ou imperícia, sem querer.","e":"O motorista que atropela alguém por dirigir distraído no celular age com culpa; quem atropela de propósito age com dolo.","d":"Em regra só se pune o crime doloso; a forma culposa só existe quando a lei prevê expressamente. Assumir o risco de produzir o resultado também é dolo, e não culpa.","pena":"","rub":"","caput":"Diz-se o crime:","txt":["Art. 18 - Diz-se o crime:","Crime doloso","I - doloso, quando o agente quis o resultado ou assumiu o risco de produzi-lo;","Crime culposo","II - culposo, quando o agente deu causa ao resultado por imprudência, negligência ou imperícia.","Parágrafo único - Salvo os casos expressos em lei, ninguém pode ser punido por fato previsto como crime, senão quando o pratica dolosamente."],"ti":1,"ch":""},{"n":"19","t":"Agravação pelo resultado","k":"ao menos culposamente","s":"Quando um resultado mais grave aumenta a pena, o agente só responde por ele se o causou pelo menos por culpa.","e":"Quem dá um empurrão em alguém que cai, bate a cabeça e morre só responde pela morte se ela era previsível para ele.","d":"Proíbe a responsabilidade penal objetiva, isto é, punir alguém só porque o resultado aconteceu. Se o resultado mais grave era imprevisível, o agente não responde por ele.","pena":"","rub":"Agravação pelo resultado","caput":"Pelo resultado que agrava especialmente a pena, só responde o agente que o houver causado ao menos culposamente.","txt":["Art. 19 - Pelo resultado que agrava especialmente a pena, só responde o agente que o houver causado ao menos culposamente."],"ti":1,"ch":""},{"n":"20","t":"Erro sobre elementos do tipo","k":"erro de tipo","s":"Se a pessoa se engana sobre um elemento do crime, não há dolo, mas ela pode responder por crime culposo se a lei previr essa forma. Também trata de quem imagina, por erro justificado, uma situação que tornaria a ação legítima.","e":"Quem sai de uma loja levando o guarda-chuva de outra pessoa achando que era o seu não comete furto.","d":"Erro sobre a pessoa não isenta de pena: consideram-se as qualidades da vítima que o agente queria atingir, não as de quem foi atingido. Se o erro foi provocado por terceiro, responde pelo crime quem determinou o erro.","pena":"","rub":"Erro sobre elementos do tipo","caput":"O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei.","txt":["Art. 20 - O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei.","Descriminantes putativas","§ 1º - É isento de pena quem, por erro plenamente justificado pelas circunstâncias, supõe situação de fato que, se existisse, tornaria a ação legítima. Não há isenção de pena quando o erro deriva de culpa e o fato é punível como crime culposo.","Erro determinado por terceiro","§ 2º - Responde pelo crime o terceiro que determina o erro.","Erro sobre a pessoa","§ 3º - O erro quanto à pessoa contra a qual o crime é praticado não isenta de pena. Não se consideram, neste caso, as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime."],"ti":1,"ch":""},{"n":"21","t":"Erro sobre a ilicitude do fato","k":"erro de proibição","s":"Ninguém pode alegar que não conhecia a lei. Mas se a pessoa achava que sua conduta era permitida, o erro inevitável isenta de pena e o evitável pode diminuí-la de um sexto a um terço.","e":"Um turista estrangeiro, em situação na qual não tinha como saber que certa conduta era proibida aqui, pode ter a pena excluída ou reduzida conforme o erro fosse inevitável ou evitável.","d":"A redução do erro evitável é de um sexto a um terço, diferente da tentativa (um a dois terços). O erro é evitável quando era possível ao agente, nas circunstâncias, ter consciência da ilicitude.","pena":"","rub":"Erro sobre a ilicitude do fato","caput":"O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço.","txt":["Art. 21 - O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço.","Parágrafo único - Considera-se evitável o erro se o agente atua ou se omite sem a consciência da ilicitude do fato, quando lhe era possível, nas circunstâncias, ter ou atingir essa consciência."],"ti":1,"ch":""},{"n":"22","t":"Coação irresistível e obediência hierárquica","k":"coação irresistível","s":"Se alguém comete o fato porque foi coagido de forma irresistível, ou cumprindo ordem de superior hierárquico que não era manifestamente ilegal, só é punido quem coagiu ou quem deu a ordem.","e":"O gerente de banco que abre o cofre porque criminosos ameaçam matar sua família não é punido; respondem os criminosos.","d":"Se a ordem for manifestamente (claramente) ilegal, quem a cumpre também responde. A coação precisa ser irresistível; a coação resistível não exclui a punição de quem cometeu o fato.","pena":"","rub":"Coação irresistível e obediência hierárquica","caput":"Se o fato é cometido sob coação irresistível ou em estrita obediência a ordem, não manifestamente ilegal, de superior hierárquico, só é punível o autor da coação ou da ordem.","txt":["Art. 22 - Se o fato é cometido sob coação irresistível ou em estrita obediência a ordem, não manifestamente ilegal, de superior hierárquico, só é punível o autor da coação ou da ordem."],"ti":1,"ch":""},{"n":"23","t":"Exclusão de ilicitude","k":"não há crime","s":"Não há crime quando o fato é praticado em estado de necessidade, em legítima defesa, em estrito cumprimento de dever legal ou no exercício regular de direito.","e":"O policial que prende alguém em flagrante, cumprindo seu dever, não comete crime de constrangimento.","d":"Em qualquer dessas hipóteses o agente responde pelo excesso, seja doloso ou culposo. São quatro excludentes, e o inciso III reúne duas delas.","pena":"","rub":"Exclusão de ilicitude","caput":"Não há crime quando o agente pratica o fato:","txt":["Art. 23 - Não há crime quando o agente pratica o fato:","I - em estado de necessidade;","II - em legítima defesa;","III - em estrito cumprimento de dever legal ou no exercício regular de direito.","Excesso punível","Parágrafo único - O agente, em qualquer das hipóteses deste artigo, responderá pelo excesso doloso ou culposo."],"ti":1,"ch":""},{"n":"24","t":"Estado de necessidade","k":"perigo atual","s":"Age em estado de necessidade quem sacrifica um direito para salvar outro, próprio ou de terceiro, de um perigo atual que não provocou por vontade própria e que não podia evitar de outra forma.","e":"Quem arromba a porta de uma casa vizinha para tirar uma criança de um incêndio age em estado de necessidade.","d":"Não pode alegá-lo quem tinha o dever legal de enfrentar o perigo, como o bombeiro. Se era razoável exigir o sacrifício do direito ameaçado, a pena apenas pode ser reduzida de um a dois terços.","pena":"","rub":"Estado de necessidade","caput":"Considera-se em estado de necessidade quem pratica o fato para salvar de perigo atual, que não provocou por sua vontade, nem podia de outro modo evitar, direito próprio ou alheio, cujo sacrifício, nas circunstâncias, não era razoável exigir-se.","txt":["Art. 24 - Considera-se em estado de necessidade quem pratica o fato para salvar de perigo atual, que não provocou por sua vontade, nem podia de outro modo evitar, direito próprio ou alheio, cujo sacrifício, nas circunstâncias, não era razoável exigir-se.","§ 1º - Não pode alegar estado de necessidade quem tinha o dever legal de enfrentar o perigo.","§ 2º - Embora seja razoável exigir-se o sacrifício do direito ameaçado, a pena poderá ser reduzida de um a dois terços."],"ti":1,"ch":""},{"n":"25","t":"Legítima defesa","k":"repele injusta agressão","s":"Age em legítima defesa quem, usando com moderação os meios necessários, repele uma agressão injusta, atual ou iminente, contra direito seu ou de outra pessoa.","e":"Quem empurra e imobiliza um assaltante que tenta agredi-lo na rua age em legítima defesa.","d":"O perigo do estado de necessidade é atual; já a agressão da legítima defesa pode ser atual ou iminente. O parágrafo único inclui o agente de segurança pública que repele agressão ou risco de agressão a vítima mantida refém durante crimes, desde que respeitados os requisitos do caput.","pena":"","rub":"Legítima defesa","caput":"Entende-se em legítima defesa quem, usando moderadamente dos meios necessários, repele injusta agressão, atual ou iminente, a direito seu ou de outrem.","txt":["Art. 25 - Entende-se em legítima defesa quem, usando moderadamente dos meios necessários, repele injusta agressão, atual ou iminente, a direito seu ou de outrem.","Parágrafo único. Observados os requisitos previstos no caput deste artigo, considera-se também em legítima defesa o agente de segurança pública que repele agressão ou risco de agressão a vítima mantida refém durante a prática de crimes."],"ti":1,"ch":""},{"n":"26","t":"Inimputáveis","k":"doença mental","s":"É isento de pena quem, por doença mental ou desenvolvimento mental incompleto ou retardado, era totalmente incapaz de entender que o fato era ilícito ou de se controlar conforme esse entendimento. Se essa capacidade era apenas parcial, a pena pode ser reduzida de um a dois terços.","e":"Uma pessoa em surto psicótico grave que agride alguém sem ter qualquer noção do que faz pode ser isenta de pena.","d":"A incapacidade é avaliada ao tempo da ação ou omissão. Inteiramente incapaz leva à isenção; não inteiramente capaz (semi-imputável) leva só à redução de um a dois terços.","pena":"","rub":"Inimputáveis","caput":"É isento de pena o agente que, por doença mental ou desenvolvimento mental incompleto ou retardado, era, ao tempo da ação ou da omissão, inteiramente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.","txt":["Art. 26 - É isento de pena o agente que, por doença mental ou desenvolvimento mental incompleto ou retardado, era, ao tempo da ação ou da omissão, inteiramente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.","Redução de pena","Parágrafo único - A pena pode ser reduzida de um a dois terços, se o agente, em virtude de perturbação de saúde mental ou por desenvolvimento mental incompleto ou retardado não era inteiramente capaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento."],"ti":2,"ch":""},{"n":"27","t":"Menores de dezoito anos","k":"menores de 18","s":"Quem tem menos de 18 anos não responde pelo Código Penal. Fica sujeito às regras da legislação especial.","e":"Um adolescente que comete um roubo responde segundo a legislação especial, e não segundo o Código Penal.","d":"Aqui o critério é só a idade (critério biológico): não importa se o menor entendia perfeitamente o que fazia. A idade é verificada no momento da ação (art. 4º).","pena":"","rub":"Menores de dezoito anos","caput":"Os menores de 18 (dezoito) anos são penalmente inimputáveis, ficando sujeitos às normas estabelecidas na legislação especial.","txt":["Art. 27 - Os menores de 18 (dezoito) anos são penalmente inimputáveis, ficando sujeitos às normas estabelecidas na legislação especial."],"ti":2,"ch":""},{"n":"28","t":"Emoção, paixão e embriaguez","k":"embriaguez","s":"Emoção, paixão e embriaguez voluntária ou culposa não afastam a responsabilidade penal. Só a embriaguez completa vinda de caso fortuito ou força maior isenta de pena, e a incompleta dessa origem pode reduzir a pena de um a dois terços.","e":"Quem bebe por conta própria numa festa e depois agride alguém responde normalmente pelo crime.","d":"Embriaguez voluntária (quis beber) ou culposa (bebeu demais sem querer se embriagar) não isenta. Só a embriaguez acidental, por caso fortuito ou força maior, isenta (se completa) ou reduz a pena (se incompleta).","pena":"","rub":"Emoção e paixão","caput":"Não excluem a imputabilidade penal:","txt":["Art. 28 - Não excluem a imputabilidade penal:","I - a emoção ou a paixão;","Embriaguez","II - a embriaguez, voluntária ou culposa, pelo álcool ou substância de efeitos análogos.","§ 1º - É isento de pena o agente que, por embriaguez completa, proveniente de caso fortuito ou força maior, era, ao tempo da ação ou da omissão, inteiramente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.","§ 2º - A pena pode ser reduzida de um a dois terços, se o agente, por embriaguez, proveniente de caso fortuito ou força maior, não possuía, ao tempo da ação ou da omissão, a plena capacidade de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento."],"ti":2,"ch":""},{"n":"29","t":"Concurso de pessoas","k":"concorre para o crime","s":"Quem, de qualquer forma, ajuda ou participa de um crime responde pelas penas desse crime, na medida da sua culpabilidade (o grau de reprovação da sua conduta).","e":"Quem fica do lado de fora vigiando a rua enquanto o comparsa furta uma casa também responde pelo furto.","d":"Participação de menor importância pode diminuir a pena de um sexto a um terço. Se um dos participantes quis cometer crime menos grave, recebe a pena deste, aumentada até metade se o resultado mais grave era previsível.","pena":"","rub":"","caput":"Quem, de qualquer modo, concorre para o crime incide nas penas a este cominadas, na medida de sua culpabilidade.","txt":["Art. 29 - Quem, de qualquer modo, concorre para o crime incide nas penas a este cominadas, na medida de sua culpabilidade.","§ 1º - Se a participação for de menor importância, a pena pode ser diminuída de um sexto a um terço.","§ 2º - Se algum dos concorrentes quis participar de crime menos grave, ser-lhe-á aplicada a pena deste; essa pena será aumentada até metade, na hipótese de ter sido previsível o resultado mais grave."],"ti":3,"ch":""},{"n":"30","t":"Circunstâncias incomunicáveis","k":"caráter pessoal","s":"As circunstâncias e condições pessoais de um participante não passam para os outros, a não ser quando fazem parte da própria definição do crime (elementares).","e":"Se um funcionário público e um particular desviam juntos dinheiro da repartição, a condição de funcionário público, por ser elementar do crime, se estende ao particular que sabia dela.","d":"A regra é a incomunicabilidade, mas a exceção cai muito: quando a condição pessoal é elementar do crime, ela se comunica aos demais participantes.","pena":"","rub":"Circunstâncias incomunicáveis","caput":"Não se comunicam as circunstâncias e as condições de caráter pessoal, salvo quando elementares do crime.","txt":["Art. 30 - Não se comunicam as circunstâncias e as condições de caráter pessoal, salvo quando elementares do crime."],"ti":3,"ch":""},{"n":"31","t":"Casos de impunibilidade","k":"pelo menos tentado","s":"Combinar, mandar, incentivar ou ajudar um crime não é punido se o crime nem chega a ser tentado.","e":"Duas pessoas que combinam assaltar uma loja, mas desistem antes de sair de casa, não respondem por esse assalto.","d":"A ressalva \"salvo disposição expressa em contrário\" importa: há crimes em que o simples ajuste já é punido por si só, como a associação criminosa.","pena":"","rub":"Casos de impunibilidade","caput":"O ajuste, a determinação ou instigação e o auxílio, salvo disposição expressa em contrário, não são puníveis, se o crime não chega, pelo menos, a ser tentado.","txt":["Art. 31 - O ajuste, a determinação ou instigação e o auxílio, salvo disposição expressa em contrário, não são puníveis, se o crime não chega, pelo menos, a ser tentado."],"ti":3,"ch":""},{"n":"32","t":"Espécies de pena","k":"penas","s":"O Código prevê três tipos de pena: privativas de liberdade (prisão), restritivas de direitos e multa.","e":"Um juiz pode condenar alguém à prisão, a prestar serviços à comunidade (restritiva de direitos) ou a pagar multa, conforme o crime.","d":"São só três espécies. Prestação de serviços, prestação pecuniária e limitação de fim de semana não são espécies autônomas, e sim tipos de pena restritiva de direitos.","pena":"","rub":"","caput":"As penas são:","txt":["Art. 32 - As penas são:","I - privativas de liberdade;","II - restritivas de direitos;","III - de multa."],"ti":4,"ch":"Das espécies de pena"},{"n":"33","t":"Reclusão e detenção","k":"regime","s":"A reclusão pode ser cumprida em regime fechado, semiaberto ou aberto; a detenção, em semiaberto ou aberto, salvo necessidade de transferência ao fechado. O regime inicial depende do tamanho da pena e da reincidência.","e":"Um réu não reincidente condenado a pena de até 4 anos pode começar a cumpri-la em regime aberto.","d":"Pena superior a 8 anos começa obrigatoriamente no fechado; o semiaberto inicial (mais de 4 até 8) e o aberto inicial (até 4) são só para não reincidentes. No crime contra a administração pública, a progressão depende de reparar o dano ou devolver o produto do crime.","pena":"","rub":"Reclusão e detenção","caput":"A pena de reclusão deve ser cumprida em regime fechado, semi-aberto ou aberto. A de detenção, em regime semi-aberto, ou aberto, salvo necessidade de transferência a regime fechado.","txt":["Art. 33 - A pena de reclusão deve ser cumprida em regime fechado, semi-aberto ou aberto. A de detenção, em regime semi-aberto, ou aberto, salvo necessidade de transferência a regime fechado.","§ 1º - Considera-se:","a) regime fechado a execução da pena em estabelecimento de segurança máxima ou média;","b) regime semi-aberto a execução da pena em colônia agrícola, industrial ou estabelecimento similar;","c) regime aberto a execução da pena em casa de albergado ou estabelecimento adequado.","§ 2º - As penas privativas de liberdade deverão ser executadas em forma progressiva, segundo o mérito do condenado, observados os seguintes critérios e ressalvadas as hipóteses de transferência a regime mais rigoroso:","a) o condenado a pena superior a 8 (oito) anos deverá começar a cumpri-la em regime fechado;","b) o condenado não reincidente, cuja pena seja superior a 4 (quatro) anos e não exceda a 8 (oito), poderá, desde o princípio, cumpri-la em regime semi-aberto;","c) o condenado não reincidente, cuja pena seja igual ou inferior a 4 (quatro) anos, poderá, desde o início, cumpri-la em regime aberto.","§ 3º - A determinação do regime inicial de cumprimento da pena far-se-á com observância dos critérios previstos no art. 59 deste Código.","§ 4º O condenado por crime contra a administração pública terá a progressão de regime do cumprimento da pena condicionada à reparação do dano que causou, ou à devolução do produto do ilícito praticado, com os acréscimos legais."],"ti":4,"ch":"Das espécies de pena"},{"n":"34","t":"Regras do regime fechado","k":"regime fechado","s":"No início da pena, o condenado passa por exame criminológico para individualizar a execução. No regime fechado, trabalha durante o dia e fica isolado no repouso noturno.","e":"Um preso em regime fechado pode trabalhar fora da prisão em uma obra pública de reforma de escola.","d":"O trabalho externo é admitido no regime fechado, mas apenas em serviços ou obras públicas.","pena":"","rub":"Regras do regime fechado","caput":"O condenado será submetido, no início do cumprimento da pena, a exame criminológico de classificação para individualização da execução.","txt":["Art. 34 - O condenado será submetido, no início do cumprimento da pena, a exame criminológico de classificação para individualização da execução.","§ 1º - O condenado fica sujeito a trabalho no período diurno e a isolamento durante o repouso noturno.","§ 2º - O trabalho será em comum dentro do estabelecimento, na conformidade das aptidões ou ocupações anteriores do condenado, desde que compatíveis com a execução da pena.","§ 3º - O trabalho externo é admissível, no regime fechado, em serviços ou obras públicas."],"ti":4,"ch":"Das espécies de pena"},{"n":"35","t":"Regras do regime semiaberto","k":"regime semiaberto","s":"No regime semiaberto, o condenado também passa pelo exame criminológico e trabalha em comum durante o dia em colônia agrícola, industrial ou similar. Pode ter trabalho externo e frequentar cursos.","e":"Um condenado no semiaberto pode frequentar um curso supletivo profissionalizante fora da colônia.","d":"Diferente do fechado, aqui o trabalho externo não se limita a obras públicas, e o texto admite expressamente cursos supletivos profissionalizantes, de segundo grau ou superior.","pena":"","rub":"Regras do regime semi-aberto","caput":"Aplica-se a norma do art. 34 deste Código, caput, ao condenado que inicie o cumprimento da pena em regime semi-aberto.","txt":["Art. 35 - Aplica-se a norma do art. 34 deste Código, caput, ao condenado que inicie o cumprimento da pena em regime semi-aberto.","§ 1º - O condenado fica sujeito a trabalho em comum durante o período diurno, em colônia agrícola, industrial ou estabelecimento similar.","§ 2º - O trabalho externo é admissível, bem como a freqüência a cursos supletivos profissionalizantes, de instrução de segundo grau ou superior."],"ti":4,"ch":"Das espécies de pena"},{"n":"36","t":"Regras do regime aberto","k":"autodisciplina","s":"O regime aberto se baseia na autodisciplina do condenado. Ele trabalha, estuda ou exerce outra atividade fora, sem vigilância, e fica recolhido à noite e nos dias de folga.","e":"O condenado trabalha durante o dia numa loja e volta à casa de albergado para dormir.","d":"Será transferido do aberto se praticar crime doloso, frustrar os fins da execução ou, podendo, não pagar a multa aplicada junto com a prisão. Crime culposo não está entre as causas do texto.","pena":"","rub":"Regras do regime aberto","caput":"O regime aberto baseia-se na autodisciplina e senso de responsabilidade do condenado.","txt":["Art. 36 - O regime aberto baseia-se na autodisciplina e senso de responsabilidade do condenado.","§ 1º - O condenado deverá, fora do estabelecimento e sem vigilância, trabalhar, freqüentar curso ou exercer outra atividade autorizada, permanecendo recolhido durante o período noturno e nos dias de folga.","§ 2º - O condenado será transferido do regime aberto, se praticar fato definido como crime doloso, se frustrar os fins da execução ou se, podendo, não pagar a multa cumulativamente aplicada."],"ti":4,"ch":"Das espécies de pena"},{"n":"37","t":"Regime especial","k":"estabelecimento próprio","s":"As mulheres cumprem pena em estabelecimento próprio, respeitando-se os deveres e direitos ligados à sua condição pessoal.","e":"Uma mulher condenada deve cumprir pena em presídio feminino, e não em unidade masculina.","d":"O artigo não cria um regime mais leve: as regras gerais do capítulo continuam valendo para as mulheres no que couber.","pena":"","rub":"Regime especial","caput":"As mulheres cumprem pena em estabelecimento próprio, observando-se os deveres e direitos inerentes à sua condição pessoal, bem como, no que couber, o disposto neste Capítulo.","txt":["Art. 37 - As mulheres cumprem pena em estabelecimento próprio, observando-se os deveres e direitos inerentes à sua condição pessoal, bem como, no que couber, o disposto neste Capítulo."],"ti":4,"ch":"Das espécies de pena"},{"n":"38","t":"Direitos do preso","k":"direitos do preso","s":"O preso mantém todos os direitos que não foram atingidos pela perda da liberdade. Todas as autoridades devem respeitar sua integridade física e moral.","e":"O preso continua tendo direito a receber atendimento médico e a não ser agredido por agentes penitenciários.","d":"A prisão tira a liberdade, não os demais direitos. O dever de respeito à integridade física e moral vale para todas as autoridades.","pena":"","rub":"Direitos do preso","caput":"O preso conserva todos os direitos não atingidos pela perda da liberdade, impondo-se a todas as autoridades o respeito à sua integridade física e moral.","txt":["Art. 38 - O preso conserva todos os direitos não atingidos pela perda da liberdade, impondo-se a todas as autoridades o respeito à sua integridade física e moral."],"ti":4,"ch":"Das espécies de pena"},{"n":"39","t":"Trabalho do preso","k":"remunerado","s":"O trabalho do preso deve ser sempre pago, e ele tem garantidos os benefícios da Previdência Social.","e":"O preso que trabalha na cozinha do presídio deve receber remuneração por isso.","d":"A palavra-chave é \"sempre\": não existe trabalho do preso gratuito pelo Código. Não confunda com a prestação de serviços à comunidade, que consiste em tarefas gratuitas (art. 46).","pena":"","rub":"Trabalho do preso","caput":"O trabalho do preso será sempre remunerado, sendo-lhe garantidos os benefícios da Previdência Social.","txt":["Art. 39 - O trabalho do preso será sempre remunerado, sendo-lhe garantidos os benefícios da Previdência Social."],"ti":4,"ch":"Das espécies de pena"},{"n":"40","t":"Legislação especial","k":"legislação especial","s":"Uma lei específica regulará os direitos e o trabalho do preso, seus deveres, as regras de revogação e transferência de regimes e as faltas disciplinares com suas sanções.","e":"As faltas disciplinares de um preso, como tentar fugir, são definidas na lei de execução penal, e não no Código Penal.","d":"O Código só traça as linhas gerais; os detalhes da execução, incluindo infrações disciplinares e sanções, ficam para a legislação especial.","pena":"","rub":"Legislação especial","caput":"A legislação especial regulará a matéria prevista nos arts. 38 e 39 deste Código, bem como especificará os deveres e direitos do preso, os critérios para revogação e transferência dos regimes e estabelecerá as infrações disciplinares e correspondentes sanções.","txt":["Art. 40 - A legislação especial regulará a matéria prevista nos arts. 38 e 39 deste Código, bem como especificará os deveres e direitos do preso, os critérios para revogação e transferência dos regimes e estabelecerá as infrações disciplinares e correspondentes sanções."],"ti":4,"ch":"Das espécies de pena"},{"n":"41","t":"Superveniência de doença mental","k":"doença mental","s":"Se o condenado passa a sofrer de doença mental durante a pena, deve ser levado a hospital de custódia e tratamento psiquiátrico ou, na falta, a outro local adequado.","e":"Um preso que desenvolve um quadro psiquiátrico grave durante a pena é transferido para tratamento em hospital de custódia.","d":"Aqui a doença surge depois da condenação. Se a doença existia ao tempo do crime, o caso é de inimputabilidade (art. 26).","pena":"","rub":"Superveniência de doença mental","caput":"O condenado a quem sobrevém doença mental deve ser recolhido a hospital de custódia e tratamento psiquiátrico ou, à falta, a outro estabelecimento adequado.","txt":["Art. 41 - O condenado a quem sobrevém doença mental deve ser recolhido a hospital de custódia e tratamento psiquiátrico ou, à falta, a outro estabelecimento adequado."],"ti":4,"ch":"Das espécies de pena"},{"n":"42","t":"Detração","k":"detração","s":"Detração é descontar da pena final o tempo que a pessoa já ficou presa antes da condenação. Entram a prisão provisória, no Brasil ou no exterior, a prisão administrativa e a internação em hospital de custódia ou estabelecimento similar.","e":"Quem ficou preso preventivamente durante o processo tem esse tempo descontado da pena de prisão fixada na sentença.","d":"A detração vale para a pena privativa de liberdade e também para a medida de segurança, e conta inclusive prisão provisória cumprida no estrangeiro.","pena":"","rub":"Detração","caput":"Computam-se, na pena privativa de liberdade e na medida de segurança, o tempo de prisão provisória, no Brasil ou no estrangeiro, o de prisão administrativa e o de internação em qualquer dos estabelecimentos referidos no artigo anterior.","txt":["Art. 42 - Computam-se, na pena privativa de liberdade e na medida de segurança, o tempo de prisão provisória, no Brasil ou no estrangeiro, o de prisão administrativa e o de internação em qualquer dos estabelecimentos referidos no artigo anterior."],"ti":4,"ch":"Das espécies de pena"},{"n":"43","t":"Penas restritivas de direitos","k":"restritivas de direitos","s":"Lista as penas restritivas de direitos: prestação pecuniária, perda de bens e valores, prestação de serviço à comunidade ou a entidades públicas, interdição temporária de direitos e limitação de fim de semana.","e":"Em vez da prisão, o juiz pode mandar o condenado prestar serviços em um hospital público.","d":"Prestação pecuniária (dinheiro pago à vítima ou a entidade) não é a mesma coisa que pena de multa, que é espécie autônoma de pena. Atenção: no texto fornecido, a limitação de fim de semana aparece repetida nos incisos III e VI.","pena":"","rub":"Penas restritivas de direitos","caput":"As penas restritivas de direitos são:","txt":["Art. 43. As penas restritivas de direitos são:","I - prestação pecuniária;","II - perda de bens e valores;","III - (VETADO)","IV - prestação de serviço à comunidade ou a entidades públicas;","V - interdição temporária de direitos;","VI - limitação de fim de semana."],"ti":4,"ch":"Das espécies de pena"},{"n":"44","t":"Substituição por restritivas de direitos","k":"substituem","s":"As penas restritivas de direitos substituem a prisão quando a pena aplicada não passa de quatro anos e o crime não teve violência ou grave ameaça à pessoa, ou quando o crime é culposo, qualquer que seja a pena. O réu também não pode ser reincidente em crime doloso, e as circunstâncias devem indicar que a troca é suficiente.","e":"Quem é condenado a pena de prisão de até quatro anos por um furto sem violência, sendo primário, pode ter a pena trocada por prestação de serviços.","d":"No crime culposo cabe substituição qualquer que seja a pena. Se a restrição for descumprida sem justificativa, converte-se em prisão, descontado o tempo cumprido, respeitado o saldo mínimo de trinta dias de detenção ou reclusão.","pena":"","rub":"","caput":"As penas restritivas de direitos são autônomas e substituem as privativas de liberdade, quando:","txt":["Art. 44. As penas restritivas de direitos são autônomas e substituem as privativas de liberdade, quando:","I - aplicada pena privativa de liberdade não superior a quatro anos e o crime não for cometido com violência ou grave ameaça à pessoa ou, qualquer que seja a pena aplicada, se o crime for culposo;","II - o réu não for reincidente em crime doloso;","III - a culpabilidade, os antecedentes, a conduta social e a personalidade do condenado, bem como os motivos e as circunstâncias indicarem que essa substituição seja suficiente.","§ 1º (VETADO)","§ 2º Na condenação igual ou inferior a um ano, a substituição pode ser feita por multa ou por uma pena restritiva de direitos; se superior a um ano, a pena privativa de liberdade pode ser substituída por uma pena restritiva de direitos e multa ou por duas restritivas de direitos.","§ 3º Se o condenado for reincidente, o juiz poderá aplicar a substituição, desde que, em face de condenação anterior, a medida seja socialmente recomendável e a reincidência não se tenha operado em virtude da prática do mesmo crime.","§ 4º A pena restritiva de direitos converte-se em privativa de liberdade quando ocorrer o descumprimento injustificado da restrição imposta. No cálculo da pena privativa de liberdade a executar será deduzido o tempo cumprido da pena restritiva de direitos, respeitado o saldo mínimo de trinta dias de detenção ou reclusão.","§ 5º Sobrevindo condenação a pena privativa de liberdade, por outro crime, o juiz da execução penal decidirá sobre a conversão, podendo deixar de aplicá-la se for possível ao condenado cumprir a pena substitutiva anterior."],"ti":4,"ch":"Das espécies de pena"},{"n":"45","t":
