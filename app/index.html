"Prestação pecuniária e perda de bens","k":"prestação pecuniária","s":"A prestação pecuniária é um pagamento em dinheiro à vítima, a seus dependentes ou a entidade com fim social, fixado pelo juiz entre 1 e 360 salários mínimos. A perda de bens e valores vai para o Fundo Penitenciário Nacional.","e":"O juiz pode substituir a prisão pelo pagamento de certa quantia em salários mínimos a uma entidade assistencial.","d":"O valor pago é descontado de eventual indenização civil se os beneficiários forem os mesmos. O teto da perda de bens é o que for maior entre o prejuízo causado e o proveito obtido com o crime.","pena":"","rub":"Conversão das penas restritivas de direitos","caput":"Na aplicação da substituição prevista no artigo anterior, proceder-se-á na forma deste e dos arts. 46, 47 e 48.","txt":["Art. 45. Na aplicação da substituição prevista no artigo anterior, proceder-se-á na forma deste e dos arts. 46, 47 e 48.","§ 1º A prestação pecuniária consiste no pagamento em dinheiro à vítima, a seus dependentes ou a entidade pública ou privada com destinação social, de importância fixada pelo juiz, não inferior a 1 (um) salário mínimo nem superior a 360 (trezentos e sessenta) salários mínimos. O valor pago será deduzido do montante de eventual condenação em ação de reparação civil, se coincidentes os beneficiários.","§ 2º No caso do parágrafo anterior, se houver aceitação do beneficiário, a prestação pecuniária pode consistir em prestação de outra natureza.","§ 3º A perda de bens e valores pertencentes aos condenados dar-se-á, ressalvada a legislação especial, em favor do Fundo Penitenciário Nacional, e seu valor terá como teto - o que for maior - o montante do prejuízo causado ou do provento obtido pelo agente ou por terceiro, em conseqüência da prática do crime.","§ 4º (VETADO)"],"ti":4,"ch":"Das espécies de pena"},{"n":"46","t":"Prestação de serviços à comunidade","k":"tarefas gratuitas","s":"É a atribuição de tarefas gratuitas ao condenado em entidades assistenciais, hospitais, escolas e similares. Só se aplica a condenações superiores a seis meses de prisão.","e":"Um condenado pode cumprir a pena ajudando em uma escola pública no fim do dia, sem atrapalhar seu emprego.","d":"A conta é de uma hora de tarefa por dia de condenação. Se a pena substituída for superior a um ano, o condenado pode cumpri-la em menos tempo, nunca inferior à metade da pena fixada.","pena":"","rub":"Prestação de serviços à comunidade ou a entidades públicas","caput":"A prestação de serviços à comunidade ou a entidades públicas é aplicável às condenações superiores a seis meses de privação da liberdade.","txt":["Art. 46. A prestação de serviços à comunidade ou a entidades públicas é aplicável às condenações superiores a seis meses de privação da liberdade.","§ 1º A prestação de serviços à comunidade ou a entidades públicas consiste na atribuição de tarefas gratuitas ao condenado.","§ 2º A prestação de serviço à comunidade dar-se-á em entidades assistenciais, hospitais, escolas, orfanatos e outros estabelecimentos congêneres, em programas comunitários ou estatais.","§ 3º As tarefas a que se refere o § 1º serão atribuídas conforme as aptidões do condenado, devendo ser cumpridas à razão de uma hora de tarefa por dia de condenação, fixadas de modo a não prejudicar a jornada normal de trabalho.","§ 4º Se a pena substituída for superior a um ano, é facultado ao condenado cumprir a pena substitutiva em menor tempo (art. 55), nunca inferior à metade da pena privativa de liberdade fixada."],"ti":4,"ch":"Das espécies de pena"},{"n":"47","t":"Interdição temporária de direitos","k":"interdição","s":"São proibições temporárias: exercer cargo público ou mandato, exercer profissão que dependa de licença, dirigir veículo, frequentar certos lugares e inscrever-se em concurso, avaliação ou exame públicos.","e":"Um motorista condenado por crime de trânsito culposo pode ter a habilitação para dirigir suspensa.","d":"A proibição de inscrever-se em concurso, avaliação ou exame públicos também é interdição de direitos (inciso V) e costuma ser esquecida em prova.","pena":"","rub":"Interdição temporária de direitos","caput":"As penas de interdição temporária de direitos são:","txt":["Art. 47 - As penas de interdição temporária de direitos são:","I - proibição do exercício de cargo, função ou atividade pública, bem como de mandato eletivo;","II - proibição do exercício de profissão, atividade ou ofício que dependam de habilitação especial, de licença ou autorização do poder público;","III - suspensão de autorização ou de habilitação para dirigir veículo. >","IV - proibição de freqüentar determinados lugares.","V - proibição de inscrever-se em concurso, avaliação ou exame públicos."],"ti":4,"ch":"Das espécies de pena"},{"n":"48","t":"Limitação de fim de semana","k":"fim de semana","s":"O condenado deve ficar, aos sábados e domingos, por 5 horas por dia em casa de albergado ou outro local adequado. Durante esse tempo, pode assistir a cursos e palestras ou fazer atividades educativas.","e":"O condenado passa as tardes de sábado e domingo na casa de albergado assistindo a palestras.","d":"São 5 horas diárias, só aos sábados e domingos. Não confunda com o regime aberto, em que o recolhimento é noturno e nos dias de folga.","pena":"","rub":"Limitação de fim de semana","caput":"A limitação de fim de semana consiste na obrigação de permanecer, aos sábados e domingos, por 5 (cinco) horas diárias, em casa de albergado ou outro estabelecimento adequado.","txt":["Art. 48 - A limitação de fim de semana consiste na obrigação de permanecer, aos sábados e domingos, por 5 (cinco) horas diárias, em casa de albergado ou outro estabelecimento adequado.","Parágrafo único - Durante a permanência poderão ser ministrados ao condenado cursos e palestras ou atribuídas atividades educativas."],"ti":4,"ch":"Das espécies de pena"},{"n":"49","t":"Multa","k":"dias-multa","s":"A multa é paga ao fundo penitenciário e calculada em dias-multa, de no mínimo 10 e no máximo 360. O juiz fixa o valor de cada dia-multa entre um trigésimo do maior salário mínimo e 5 vezes esse salário.","e":"O juiz pode fixar uma multa de 10 dias-multa, cada um no valor de um trigésimo do salário mínimo, para um réu de baixa renda.","d":"São dois passos: primeiro a quantidade de dias-multa (10 a 360), depois o valor de cada um (um trigésimo a 5 vezes o salário mínimo da época do fato). Na execução, o valor é atualizado pela correção monetária.","pena":"","rub":"Multa","caput":"A pena de multa consiste no pagamento ao fundo penitenciário da quantia fixada na sentença e calculada em dias-multa. Será, no mínimo, de 10 (dez) e, no máximo, de 360 (trezentos e sessenta) dias-multa.","txt":["Art. 49 - A pena de multa consiste no pagamento ao fundo penitenciário da quantia fixada na sentença e calculada em dias-multa. Será, no mínimo, de 10 (dez) e, no máximo, de 360 (trezentos e sessenta) dias-multa.","§ 1º - O valor do dia-multa será fixado pelo juiz não podendo ser inferior a um trigésimo do maior salário mínimo mensal vigente ao tempo do fato, nem superior a 5 (cinco) vezes esse salário.","§ 2º - O valor da multa será atualizado, quando da execução, pelos índices de correção monetária."],"ti":4,"ch":"Das espécies de pena"},{"n":"50","t":"Pagamento da multa","k":"pagamento","s":"A multa deve ser paga em até 10 dias depois que a sentença transita em julgado (não cabe mais recurso). O juiz pode permitir o parcelamento mensal, a pedido do condenado.","e":"Um condenado sem dinheiro para pagar tudo de uma vez pode pedir ao juiz para parcelar a multa em prestações mensais.","d":"O desconto em salário só cabe quando a multa é aplicada isoladamente, junto com restritiva de direitos ou quando concedido o sursis (suspensão condicional da pena), e nunca sobre o necessário ao sustento do condenado e da família.","pena":"","rub":"Pagamento da multa","caput":"A multa deve ser paga dentro de 10 (dez) dias depois de transitada em julgado a sentença. A requerimento do condenado e conforme as circunstâncias, o juiz pode permitir que o pagamento se realize em parcelas mensais.","txt":["Art. 50 - A multa deve ser paga dentro de 10 (dez) dias depois de transitada em julgado a sentença. A requerimento do condenado e conforme as circunstâncias, o juiz pode permitir que o pagamento se realize em parcelas mensais.","§ 1º - A cobrança da multa pode efetuar-se mediante desconto no vencimento ou salário do condenado quando:","a) aplicada isoladamente;","b) aplicada cumulativamente com pena restritiva de direitos;","c) concedida a suspensão condicional da pena.","§ 2º - O desconto não deve incidir sobre os recursos indispensáveis ao sustento do condenado e de sua família."],"ti":4,"ch":"Das espécies de pena"},{"n":"51","t":"Execução da multa","k":"dívida de valor","s":"Depois que a condenação se torna definitiva, a multa é executada perante o juiz da execução penal e passa a ser tratada como dívida de valor. Aplicam-se as regras da dívida ativa da Fazenda Pública, inclusive sobre interrupção e suspensão da prescrição.","e":"Se o condenado não paga a multa, ela é cobrada perante o juiz da execução penal como uma dívida, e não vira prisão.","d":"A rubrica fala em conversão, mas o texto atual não converte multa não paga em prisão: ela é dívida de valor. A execução é perante o juiz da execução penal.","pena":"","rub":"Conversão da Multa e revogação","caput":"Transitada em julgado a sentença condenatória, a multa será executada perante o juiz da execução penal e será considerada dívida de valor, aplicáveis as normas relativas à dívida ativa da Fazenda Pública, inclusive no que concerne às causas interruptivas e suspensivas da prescrição.","txt":["Art. 51. Transitada em julgado a sentença condenatória, a multa será executada perante o juiz da execução penal e será considerada dívida de valor, aplicáveis as normas relativas à dívida ativa da Fazenda Pública, inclusive no que concerne às causas interruptivas e suspensivas da prescrição."],"ti":4,"ch":"Das espécies de pena"},{"n":"52","t":"Suspensão da execução da multa","k":"doença mental","s":"Se o condenado passa a sofrer de doença mental depois da condenação, a cobrança da pena de multa fica suspensa. A multa não é perdoada, só fica parada enquanto durar a doença.","e":"Um homem condenado a pagar multa desenvolve um quadro psiquiátrico grave antes de quitá-la, e o juiz suspende a cobrança.","d":"A doença mental precisa surgir depois da condenação (\"sobrevém\"). O efeito é suspender a execução da multa, e não extinguir a pena.","pena":"","rub":"Suspensão da execução da multa","caput":"É suspensa a execução da pena de multa, se sobrevém ao condenado doença mental.","txt":["Art. 52 - É suspensa a execução da pena de multa, se sobrevém ao condenado doença mental."],"ti":4,"ch":"Das espécies de pena"},{"n":"53","t":"Penas privativas de liberdade","k":"limites","s":"Cada crime traz, no seu próprio artigo, a pena mínima e a máxima de prisão. O juiz só pode trabalhar dentro desses limites.","e":"No furto, o juiz consulta o próprio artigo do furto para saber entre qual mínimo e qual máximo pode fixar a prisão.","d":"Os limites da pena de prisão não ficam na parte geral: estão na \"sanção correspondente a cada tipo legal\", ou seja, no artigo de cada crime.","pena":"","rub":"Penas privativas de liberdade","caput":"As penas privativas de liberdade têm seus limites estabelecidos na sanção correspondente a cada tipo legal de crime.","txt":["Art. 53 - As penas privativas de liberdade têm seus limites estabelecidos na sanção correspondente a cada tipo legal de crime."],"ti":4,"ch":"Da cominação das penas"},{"n":"54","t":"Penas restritivas de direitos","k":"substituição","s":"As penas restritivas de direitos (como prestar serviços à comunidade) servem para substituir a prisão. Elas podem ser aplicadas mesmo que o artigo do crime não as preveja, quando a prisão fixada for inferior a 1 ano ou o crime for culposo (sem intenção).","e":"Alguém condenado a poucos meses de detenção por lesão culposa no trânsito tem a prisão trocada por serviços à comunidade.","d":"Essas penas não aparecem nos crimes da parte especial: são aplicadas \"independentemente de cominação\", sempre como substitutas da prisão, nunca de forma autônoma.","pena":"","rub":"Penas restritivas de direitos","caput":"As penas restritivas de direitos são aplicáveis, independentemente de cominação na parte especial, em substituição à pena privativa de liberdade, fixada em quantidade inferior a 1 (um) ano, ou nos crimes culposos.","txt":["Art. 54 - As penas restritivas de direitos são aplicáveis, independentemente de cominação na parte especial, em substituição à pena privativa de liberdade, fixada em quantidade inferior a 1 (um) ano, ou nos crimes culposos."],"ti":4,"ch":"Da cominação das penas"},{"n":"55","t":"Duração das restritivas de direitos","k":"mesma duração","s":"As penas restritivas de direitos dos incisos III, IV, V e VI do art. 43 duram o mesmo tempo da prisão que substituíram. A exceção é a regra do § 4º do art. 46, que permite cumprir a prestação de serviços em menos tempo.","e":"Quem teve uma pena de prisão substituída por limitação de fim de semana cumpre essa limitação pelo mesmo período da prisão original.","d":"A regra da mesma duração vale só para os incisos III a VI do art. 43; prestação pecuniária e perda de bens ficam de fora. A ressalva do § 4º do art. 46 permite encurtar a prestação de serviços.","pena":"","rub":"","caput":"As penas restritivas de direitos referidas nos incisos III, IV, V e VI do art. 43 terão a mesma duração da pena privativa de liberdade substituída, ressalvado o disposto no § 4º do art. 46.","txt":["Art. 55. As penas restritivas de direitos referidas nos incisos III, IV, V e VI do art. 43 terão a mesma duração da pena privativa de liberdade substituída, ressalvado o disposto no § 4º do art. 46."],"ti":4,"ch":"Da cominação das penas"},{"n":"56","t":"Interdição: proibição de exercer atividade","k":"violação de deveres","s":"As interdições dos incisos I e II do art. 47 (proibição de exercer cargo, função, profissão ou atividade) valem para qualquer crime cometido no exercício dessas atividades, desde que a pessoa tenha violado os deveres delas.","e":"Um contador que frauda balanços de clientes pode ter a prisão substituída pela proibição de exercer a profissão.","d":"Não basta o crime ocorrer durante o trabalho: é preciso que haja violação dos deveres próprios daquela profissão, cargo ou função.","pena":"","rub":"","caput":"As penas de interdição, previstas nos incisos I e II do art. 47 deste Código, aplicam-se para todo o crime cometido no exercício de profissão, atividade, ofício, cargo ou função, sempre que houver violação dos deveres que lhes são inerentes.","txt":["Art. 56 - As penas de interdição, previstas nos incisos I e II do art. 47 deste Código, aplicam-se para todo o crime cometido no exercício de profissão, atividade, ofício, cargo ou função, sempre que houver violação dos deveres que lhes são inerentes."],"ti":4,"ch":"Da cominação das penas"},{"n":"57","t":"Interdição: suspensão da habilitação","k":"crimes culposos de trânsito","s":"A interdição do inciso III do art. 47 (suspensão de autorização ou habilitação para dirigir) é aplicada aos crimes culposos de trânsito, isto é, cometidos sem intenção.","e":"Um motorista que causa um acidente por descuido pode ter a prisão substituída pela suspensão da habilitação.","d":"O artigo fala só em crimes culposos de trânsito. Não confunda com a inabilitação para dirigir prevista entre os efeitos da condenação, que é efeito da condenação quando o veículo é usado em crime doloso.","pena":"","rub":"","caput":"A pena de interdição, prevista no inciso III do art. 47 deste Código, aplica-se aos crimes culposos de trânsito.","txt":["Art. 57 - A pena de interdição, prevista no inciso III do art. 47 deste Código, aplica-se aos crimes culposos de trânsito.","Pena de multa"],"ti":4,"ch":"Da cominação das penas"},{"n":"58","t":"Limites da multa","k":"multa","s":"A multa prevista em cada crime segue os limites de cálculo do art. 49. Já a multa que substitui a prisão (parágrafo único do art. 44 e § 2º do art. 60) pode ser aplicada mesmo que o crime não preveja multa.","e":"Mesmo num crime que só prevê prisão, o juiz pode substituí-la por multa, calculada pelas regras do art. 49.","d":"A multa substitutiva não depende de estar prevista no tipo penal: vale \"independentemente de cominação na parte especial\".","pena":"","rub":"","caput":"A multa, prevista em cada tipo legal de crime, tem os limites fixados no art. 49 e seus parágrafos deste Código.","txt":["Art. 58 - A multa, prevista em cada tipo legal de crime, tem os limites fixados no art. 49 e seus parágrafos deste Código.","Parágrafo único - A multa prevista no parágrafo único do art. 44 e no § 2º do art. 60 deste Código aplica-se independentemente de cominação na parte especial."],"ti":4,"ch":"Da cominação das penas"},{"n":"59","t":"Fixação da pena","k":"circunstâncias judiciais","s":"Lista o que o juiz analisa para fixar a pena: culpabilidade, antecedentes, conduta social, personalidade, motivos, circunstâncias, consequências do crime e comportamento da vítima. Com isso ele escolhe a pena, a quantidade, o regime inicial e se cabe substituição.","e":"Ao condenar por estelionato, o juiz aumenta a pena-base porque o golpe deixou a vítima idosa sem suas economias.","d":"O comportamento da vítima também está na lista, detalhe que costuma ser esquecido. Este artigo é a primeira fase do cálculo da pena.","pena":"","rub":"Fixação da pena","caput":"O juiz, atendendo à culpabilidade, aos antecedentes, à conduta social, à personalidade do agente, aos motivos, às circunstâncias e conseqüências do crime, bem como ao comportamento da vítima, estabelecerá, conforme seja necessário e suficiente para reprovação e prevenção do crime:","txt":["Art. 59 - O juiz, atendendo à culpabilidade, aos antecedentes, à conduta social, à personalidade do agente, aos motivos, às circunstâncias e conseqüências do crime, bem como ao comportamento da vítima, estabelecerá, conforme seja necessário e suficiente para reprovação e prevenção do crime:","I - as penas aplicáveis dentre as cominadas;","II - a quantidade de pena aplicável, dentro dos limites previstos;","III - o regime inicial de cumprimento da pena privativa de liberdade;","IV - a substituição da pena privativa da liberdade aplicada, por outra espécie de pena, se cabível."],"ti":4,"ch":"Da aplicação da pena"},{"n":"60","t":"Critérios especiais da pena de multa","k":"situação econômica","s":"Ao fixar a multa, o juiz olha principalmente a situação econômica do réu. Se mesmo no máximo a multa for ineficaz para alguém muito rico, ela pode ser aumentada até o triplo.","e":"Um empresário milionário condenado a multa recebe o valor triplicado porque o máximo comum seria irrelevante para ele.","d":"O aumento até o triplo só cabe se a multa for ineficaz mesmo aplicada no máximo. Pelo § 2º, prisão não superior a 6 meses pode ser trocada por multa.","pena":"","rub":"Critérios especiais da pena de multa","caput":"Na fixação da pena de multa o juiz deve atender, principalmente, à situação econômica do réu.","txt":["Art. 60 - Na fixação da pena de multa o juiz deve atender, principalmente, à situação econômica do réu.","§ 1º - A multa pode ser aumentada até o triplo, se o juiz considerar que, em virtude da situação econômica do réu, é ineficaz, embora aplicada no máximo.","Multa substitutiva","§ 2º - A pena privativa de liberdade aplicada, não superior a 6 (seis) meses, pode ser substituída pela de multa, observados os critérios dos incisos II e III do art. 44 deste Código."],"ti":4,"ch":"Da aplicação da pena"},{"n":"61","t":"Circunstâncias agravantes","k":"agravam a pena","s":"Lista situações que sempre aumentam a pena, como reincidência, motivo fútil ou torpe, traição, uso de veneno ou fogo, crime contra parente próximo, contra criança, maior de 60 anos, enfermo ou grávida, e crime nas dependências de instituição de ensino.","e":"Quem furta casas aproveitando-se de uma enchente que atingiu a cidade tem a pena agravada por agir em ocasião de calamidade pública.","d":"A agravante não se aplica quando a circunstância já constitui ou qualifica o crime, para não punir duas vezes pelo mesmo fato. A embriaguez que agrava é só a preordenada, isto é, aquela em que a pessoa bebe de propósito para cometer o crime.","pena":"","rub":"Circunstâncias agravantes","caput":"São circunstâncias que sempre agravam a pena, quando não constituem ou qualificam o crime:","txt":["Art. 61 - São circunstâncias que sempre agravam a pena, quando não constituem ou qualificam o crime:","I - a reincidência;","II - ter o agente cometido o crime:","a) por motivo fútil ou torpe;","b) para facilitar ou assegurar a execução, a ocultação, a impunidade ou vantagem de outro crime;","c) à traição, de emboscada, ou mediante dissimulação, ou outro recurso que dificultou ou tornou impossível a defesa do ofendido;","d) com emprego de veneno, fogo, explosivo, tortura ou outro meio insidioso ou cruel, ou de que podia resultar perigo comum;","e) contra ascendente, descendente, irmão ou cônjuge;","f) com abuso de autoridade ou prevalecendo-se de relações domésticas, de coabitação ou de hospitalidade, ou com violência contra a mulher na forma da lei específica;","g) com abuso de poder ou violação de dever inerente a cargo, ofício, ministério ou profissão;","h) contra criança, maior de 60 (sessenta) anos, enfermo ou mulher grávida;","i) quando o ofendido estava sob a imediata proteção da autoridade;","j) em ocasião de incêndio, naufrágio, inundação ou qualquer calamidade pública, ou de desgraça particular do ofendido;","l) em estado de embriaguez preordenada.","m) nas dependências de instituição de ensino."],"ti":4,"ch":"Da aplicação da pena"},{"n":"62","t":"Agravantes no concurso de pessoas","k":"promove ou organiza","s":"Quando várias pessoas cometem o crime juntas, a pena é agravada para quem organiza ou dirige o grupo, coage ou induz outro a executar, instiga alguém sob sua autoridade ou não punível, ou age por pagamento ou promessa de recompensa.","e":"O chefe que planeja um assalto e distribui as tarefas aos comparsas recebe pena agravada por dirigir a atividade dos demais.","d":"Quem executa o crime mediante paga também tem a pena agravada, não só quem manda. Instigar alguém não punível, como um menor de idade, também agrava.","pena":"","rub":"Agravantes no caso de concurso de pessoas","caput":"A pena será ainda agravada em relação ao agente que:","txt":["Art. 62 - A pena será ainda agravada em relação ao agente que:","I - promove, ou organiza a cooperação no crime ou dirige a atividade dos demais agentes;","II - coage ou induz outrem à execução material do crime;","III - instiga ou determina a cometer o crime alguém sujeito à sua autoridade ou não-punível em virtude de condição ou qualidade pessoal;","IV - executa o crime, ou nele participa, mediante paga ou promessa de recompensa."],"ti":4,"ch":"Da aplicação da pena"},{"n":"63","t":"Reincidência","k":"novo crime","s":"Reincidente é quem comete um novo crime depois de já ter sido condenado definitivamente (sem mais recurso) por crime anterior. Vale também condenação no estrangeiro.","e":"Uma pessoa condenada definitivamente por furto que, depois disso, comete um roubo é reincidente.","d":"O novo crime precisa vir depois do trânsito em julgado da condenação anterior; se vier antes, não há reincidência. A condenação no estrangeiro também conta.","pena":"","rub":"Reincidência","caput":"Verifica-se a reincidência quando o agente comete novo crime, depois de transitar em julgado a sentença que, no País ou no estrangeiro, o tenha condenado por crime anterior.","txt":["Art. 63 - Verifica-se a reincidência quando o agente comete novo crime, depois de transitar em julgado a sentença que, no País ou no estrangeiro, o tenha condenado por crime anterior."],"ti":4,"ch":"Da aplicação da pena"},{"n":"64","t":"Período depurador da reincidência","k":"5 anos","s":"A condenação anterior deixa de gerar reincidência se passarem mais de 5 anos entre o cumprimento ou a extinção da pena e o novo crime. Crimes militares próprios e políticos não geram reincidência.","e":"Quem terminou de cumprir a pena e só cometeu outro crime muito depois de passados mais de 5 anos não é considerado reincidente.","d":"Os 5 anos contam do cumprimento ou extinção da pena, não da condenação, e incluem o período de prova da suspensão ou do livramento condicional, se não houver revogação.","pena":"","rub":"","caput":"Para efeito de reincidência:","txt":["Art. 64 - Para efeito de reincidência:","I - não prevalece a condenação anterior, se entre a data do cumprimento ou extinção da pena e a infração posterior tiver decorrido período de tempo superior a 5 (cinco) anos, computado o período de prova da suspensão ou do livramento condicional, se não ocorrer revogação;","II - não se consideram os crimes militares próprios e políticos."],"ti":4,"ch":"Da aplicação da pena"},{"n":"65","t":"Circunstâncias atenuantes","k":"atenuam a pena","s":"Lista situações que sempre reduzem a pena, como ser menor de 21 anos na data do fato ou maior de 70 na data da sentença, desconhecer a lei, confessar espontaneamente, reparar o dano antes do julgamento ou agir sob influência de multidão.","e":"Um jovem que confessa à polícia que foi o autor do furto tem a pena atenuada pela confissão espontânea.","d":"A idade é medida em momentos diferentes: menor de 21 na data do fato, maior de 70 na data da sentença. A atenuante da idade não se aplica se o crime envolver violência sexual contra a mulher.","pena":"","rub":"Circunstâncias atenuantes","caput":"São circunstâncias que sempre atenuam a pena:","txt":["Art. 65 - São circunstâncias que sempre atenuam a pena:","I - ser o agente menor de 21 (vinte e um) anos, na data do fato, ou maior de 70 (setenta) anos, na data da sentença, salvo se o crime envolver violência sexual contra a mulher;","II - o desconhecimento da lei;","III - ter o agente:","a) cometido o crime por motivo de relevante valor social ou moral;","b) procurado, por sua espontânea vontade e com eficiência, logo após o crime, evitar-lhe ou minorar-lhe as conseqüências, ou ter, antes do julgamento, reparado o dano;","c) cometido o crime sob coação a que podia resistir, ou em cumprimento de ordem de autoridade superior, ou sob a influência de violenta emoção, provocada por ato injusto da vítima;","d) confessado espontaneamente, perante a autoridade, a autoria do crime;","e) cometido o crime sob a influência de multidão em tumulto, se não o provocou."],"ti":4,"ch":"Da aplicação da pena"},{"n":"66","t":"Atenuante inominada","k":"circunstância relevante","s":"O juiz pode diminuir a pena por qualquer circunstância relevante, anterior ou posterior ao crime, mesmo que não esteja escrita na lei.","e":"O juiz reduz a pena de um réu que, após o crime, passou a se dedicar a ajudar a família da vítima.","d":"Diferente das agravantes, que são uma lista fechada, as atenuantes admitem uma circunstância não prevista expressamente em lei.","pena":"","rub":"","caput":"A pena poderá ser ainda atenuada em razão de circunstância relevante, anterior ou posterior ao crime, embora não prevista expressamente em lei.","txt":["Art. 66 - A pena poderá ser ainda atenuada em razão de circunstância relevante, anterior ou posterior ao crime, embora não prevista expressamente em lei."],"ti":4,"ch":"Da aplicação da pena"},{"n":"67","t":"Concurso de agravantes e atenuantes","k":"preponderantes","s":"Quando há agravantes e atenuantes ao mesmo tempo, a pena deve se aproximar das que pesam mais. Pesam mais as ligadas aos motivos do crime, à personalidade do agente e à reincidência.","e":"Um réu reincidente que confessou tem as duas circunstâncias analisadas, e o juiz verifica qual delas deve preponderar.","d":"O texto lista como preponderantes apenas três grupos: motivos determinantes, personalidade do agente e reincidência.","pena":"","rub":"Concurso de circunstâncias agravantes e atenuantes","caput":"No concurso de agravantes e atenuantes, a pena deve aproximar-se do limite indicado pelas circunstâncias preponderantes, entendendo-se como tais as que resultam dos motivos determinantes do crime, da personalidade do agente e da reincidência.","txt":["Art. 67 - No concurso de agravantes e atenuantes, a pena deve aproximar-se do limite indicado pelas circunstâncias preponderantes, entendendo-se como tais as que resultam dos motivos determinantes do crime, da personalidade do agente e da reincidência."],"ti":4,"ch":"Da aplicação da pena"},{"n":"68","t":"Cálculo da pena","k":"pena-base","s":"O cálculo da pena tem três fases: primeiro a pena-base pelo art. 59, depois as atenuantes e agravantes e, por último, as causas de diminuição e de aumento.","e":"Num roubo, o juiz fixa a pena-base, depois reduz pela confissão e, por fim, aplica a causa de aumento prevista no próprio artigo do crime.","d":"A ordem é fixa: art. 59, atenuantes e agravantes, depois diminuição e aumento. Com várias causas de aumento ou diminuição da parte especial, o juiz pode aplicar só uma, a que mais aumente ou diminua.","pena":"","rub":"Cálculo da pena","caput":"A pena-base será fixada atendendo-se ao critério do art. 59 deste Código; em seguida serão consideradas as circunstâncias atenuantes e agravantes; por último, as causas de diminuição e de aumento.","txt":["Art. 68 - A pena-base será fixada atendendo-se ao critério do art. 59 deste Código; em seguida serão consideradas as circunstâncias atenuantes e agravantes; por último, as causas de diminuição e de aumento.","Parágrafo único - No concurso de causas de aumento ou de diminuição previstas na parte especial, pode o juiz limitar-se a um só aumento ou a uma só diminuição, prevalecendo, todavia, a causa que mais aumente ou diminua."],"ti":4,"ch":"Da aplicação da pena"},{"n":"69","t":"Concurso material","k":"mais de uma ação","s":"Quando a pessoa pratica duas ou mais condutas e comete dois ou mais crimes, as penas de prisão são somadas. Se houver reclusão e detenção, cumpre-se primeiro a reclusão.","e":"Alguém que furta uma loja pela manhã e, à tarde, agride um vizinho responde pelos dois crimes com as penas somadas.","d":"A marca do concurso material é a pluralidade de condutas (mais de uma ação ou omissão). Se uma das penas de prisão não for suspensa, não cabe substituição por restritiva de direitos para os demais crimes.","pena":"","rub":"Concurso material","caput":"Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplicam-se cumulativamente as penas privativas de liberdade em que haja incorrido. No caso de aplicação cumulativa de penas de reclusão e de detenção, executa-se primeiro aquela.","txt":["Art. 69 - Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplicam-se cumulativamente as penas privativas de liberdade em que haja incorrido. No caso de aplicação cumulativa de penas de reclusão e de detenção, executa-se primeiro aquela.","§ 1º - Na hipótese deste artigo, quando ao agente tiver sido aplicada pena privativa de liberdade, não suspensa, por um dos crimes, para os demais será incabível a substituição de que trata o art. 44 deste Código.","§ 2º - Quando forem aplicadas penas restritivas de direitos, o condenado cumprirá simultaneamente as que forem compatíveis entre si e sucessivamente as demais."],"ti":4,"ch":"Da aplicação da pena"},{"n":"70","t":"Concurso formal","k":"uma só ação","s":"Quando uma única conduta produz dois ou mais crimes, aplica-se a pena mais grave (ou uma delas, se iguais), aumentada de um sexto até metade. Mas, se a conduta for dolosa e o agente quis cada resultado de forma autônoma, as penas são somadas.","e":"Um motorista que, por descuido, atropela duas pessoas com um só movimento do carro responde com a pena de um crime, aumentada.","d":"Com desígnios autônomos (o agente quis cada resultado), as penas se somam: é o concurso formal impróprio. E a pena nunca pode passar da que resultaria da soma do art. 69.","pena":"","rub":"Concurso formal","caput":"Quando o agente, mediante uma só ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplica-se-lhe a mais grave das penas cabíveis ou, se iguais, somente uma delas, mas aumentada, em qualquer caso, de um sexto até metade. As penas aplicam-se, entretanto, cumulativamente, se a ação ou omissão é dolosa e os crimes concorrentes resultam de desígnios autônomos, consoante o disposto no artigo anterior.","txt":["Art. 70 - Quando o agente, mediante uma só ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplica-se-lhe a mais grave das penas cabíveis ou, se iguais, somente uma delas, mas aumentada, em qualquer caso, de um sexto até metade. As penas aplicam-se, entretanto, cumulativamente, se a ação ou omissão é dolosa e os crimes concorrentes resultam de desígnios autônomos, consoante o disposto no artigo anterior.","Parágrafo único - Não poderá a pena exceder a que seria cabível pela regra do art. 69 deste Código."],"ti":4,"ch":"Da aplicação da pena"},{"n":"71","t":"Crime continuado","k":"continuação","s":"Quando a pessoa comete vários crimes da mesma espécie em condições parecidas de tempo, lugar e modo, eles são tratados como continuação do primeiro. Aplica-se a pena de um só crime, aumentada de um sexto a dois terços.","e":"Um caixa que desvia pequenas quantias do mesmo cofre, do mesmo jeito, várias vezes seguidas, responde por crime continuado.","d":"O aumento comum é de um sexto a dois terços, diferente do concurso formal (um sexto até metade). Em crimes dolosos com violência ou grave ameaça contra vítimas diferentes, o aumento pode chegar ao triplo.","pena":"","rub":"Crime continuado","caput":"Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes da mesma espécie e, pelas condições de tempo, lugar, maneira de execução e outras semelhantes, devem os subseqüentes ser havidos como continuação do primeiro, aplica-se-lhe a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, aumentada, em qualquer caso, de um sexto a dois terços.","txt":["Art. 71 - Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes da mesma espécie e, pelas condições de tempo, lugar, maneira de execução e outras semelhantes, devem os subseqüentes ser havidos como continuação do primeiro, aplica-se-lhe a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, aumentada, em qualquer caso, de um sexto a dois terços.","Parágrafo único - Nos crimes dolosos, contra vítimas diferentes, cometidos com violência ou grave ameaça à pessoa, poderá o juiz, considerando a culpabilidade, os antecedentes, a conduta social e a personalidade do agente, bem como os motivos e as circunstâncias, aumentar a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, até o triplo, observadas as regras do parágrafo único do art. 70 e do art. 75 deste Código."],"ti":4,"ch":"Da aplicação da pena"},{"n":"72","t":"Multas no concurso de crimes","k":"distinta e integralmente","s":"Quando há vários crimes, as multas não seguem as regras de aumento do concurso: cada multa é aplicada separadamente e por inteiro.","e":"Quem comete vários estelionatos em crime continuado recebe uma só pena de prisão aumentada, mas paga a multa de cada crime por inteiro.","d":"A regra de aplicar uma só pena aumentada (concurso formal e crime continuado) vale para a prisão, não para a multa, que é sempre somada.","pena":"","rub":"Multas no concurso de crimes","caput":"No concurso de crimes, as penas de multa são aplicadas distinta e integralmente.","txt":["Art. 72 - No concurso de crimes, as penas de multa são aplicadas distinta e integralmente."],"ti":4,"ch":"Da aplicação da pena"},{"n":"73","t":"Erro na execução","k":"pessoa diversa","s":"Quando, por acidente ou falha no uso dos meios, o agente atinge outra pessoa em vez da que queria atingir, ele responde como se tivesse atingido a vítima pretendida. Se atingir as duas, aplica-se a regra do concurso formal.","e":"Alguém atira contra um desafeto, erra a mira e acerta um pedestre; responde como se tivesse atingido o desafeto.","d":"Consideram-se as características da vítima pretendida, e não da atingida (remissão ao § 3º do art. 20). Não confunda com o erro sobre a pessoa, em que o agente confunde quem é a vítima, sem falha na execução.","pena":"","rub":"Erro na execução","caput":"Quando, por acidente ou erro no uso dos meios de execução, o agente, ao invés de atingir a pessoa que pretendia ofender, atinge pessoa diversa, responde como se tivesse praticado o crime contra aquela, atendendo-se ao disposto no § 3º do art. 20 deste Código. No caso de ser também atingida a pessoa que o agente pretendia ofender, aplica-se a regra do art. 70 deste Código.","txt":["Art. 73 - Quando, por acidente ou erro no uso dos meios de execução, o agente, ao invés de atingir a pessoa que pretendia ofender, atinge pessoa diversa, responde como se tivesse praticado o crime contra aquela, atendendo-se ao disposto no § 3º do art. 20 deste Código. No caso de ser também atingida a pessoa que o agente pretendia ofender, aplica-se a regra do art. 70 deste Código."],"ti":4,"ch":"Da aplicação da pena"},{"n":"74","t":"Resultado diverso do pretendido","k":"resultado diverso","s":"Quando, por acidente ou erro na execução, o agente produz um resultado diferente do que queria (por exemplo, atinge uma pessoa em vez de uma coisa), ele responde por culpa, se esse resultado for previsto como crime culposo.","e":"Alguém joga uma pedra para quebrar a vitrine de uma loja, erra e fere um cliente; responde por lesão culposa.","d":"Aqui o erro é entre bens diferentes (coisa e pessoa), e não entre pessoas, que é o caso do erro na execução do artigo anterior. Se ocorrer também o resultado pretendido, aplica-se a regra do concurso formal.","pena":"","rub":"Resultado diverso do pretendido","caput":"Fora dos casos do artigo anterior, quando, por acidente ou erro na execução do crime, sobrevém resultado diverso do pretendido, o agente responde por culpa, se o fato é previsto como crime culposo; se ocorre também o resultado pretendido, aplica-se a regra do art. 70 deste Código.","txt":["Art. 74 - Fora dos casos do artigo anterior, quando, por acidente ou erro na execução do crime, sobrevém resultado diverso do pretendido, o agente responde por culpa, se o fato é previsto como crime culposo; se ocorre também o resultado pretendido, aplica-se a regra do art. 70 deste Código."],"ti":4,"ch":"Da aplicação da pena"},{"n":"75","t":"Limite das penas","k":"40 anos","s":"Ninguém pode ficar preso por mais de 40 anos. Se as condenações somarem mais que isso, elas são unificadas para respeitar esse limite.","e":"Um condenado cuja soma de penas ultrapassa 40 anos terá as penas unificadas para cumprir no máximo 40.","d":"O limite atual é de 40 anos. Se vier condenação por fato posterior ao início do cumprimento, faz-se nova unificação, desprezando-se a pena já cumprida.","pena":"","rub":"Limite das penas","caput":"O tempo de cumprimento das penas privativas de liberdade não pode ser superior a 40 (quarenta) anos.","txt":["Art. 75. O tempo de cumprimento das penas privativas de liberdade não pode ser superior a 40 (quarenta) anos.","§ 1º Quando o agente for condenado a penas privativas de liberdade cuja soma seja superior a 40 (quarenta) anos, devem elas ser unificadas para atender ao limite máximo deste artigo.","§ 2º - Sobrevindo condenação por fato posterior ao início do cumprimento da pena, far-se-á nova unificação, desprezando-se, para esse fim, o período de pena já cumprido."],"ti":4,"ch":"Da aplicação da pena"},{"n":"76","t":"Concurso de infrações","k":"mais grave","s":"Quando há várias infrações a cumprir, executa-se primeiro a pena mais grave.","e":"Um condenado com uma pena de reclusão e outra de detenção começa cumprindo a reclusão.","d":"A ordem de execução é da pena mais grave para a menos grave, regra que conversa com o concurso material, em que a reclusão é executada antes da detenção.","pena":"","rub":"Concurso de infrações","caput":"No concurso de infrações, executar-se-á primeiramente a pena mais grave.","txt":["Art. 76 - No concurso de infrações, executar-se-á primeiramente a pena mais grave."],"ti":4,"ch":"Da aplicação da pena"},{"n":"77","t":"Requisitos da suspensão da pena","k":"suspensão condicional","s":"A prisão não superior a 2 anos pode ter a execução suspensa por 2 a 4 anos (o chamado sursis), se o condenado não for reincidente em crime doloso, tiver circunstâncias pessoais favoráveis e não couber a troca por pena restritiva de direitos.","e":"Uma pessoa sem antecedentes condenada a 2 anos, sem direito à substituição, fica livre cumprindo condições por um período de prova.","d":"O sursis só cabe se não for cabível a substituição do art. 44. Para maiores de setenta anos ou por razões de saúde, vale para pena não superior a quatro anos, suspensa por quatro a seis anos.","pena":"","rub":"Requisitos da suspensão da pena","caput":"A execução da pena privativa de liberdade, não superior a 2 (dois) anos, poderá ser suspensa, por 2 (dois) a 4 (quatro) anos, desde que:","txt":["Art. 77 - A execução da pena privativa de liberdade, não superior a 2 (dois) anos, poderá ser suspensa, por 2 (dois) a 4 (quatro) anos, desde que:","I - o condenado não seja reincidente em crime doloso;","II - a culpabilidade, os antecedentes, a conduta social e personalidade do agente, bem como os motivos e as circunstâncias autorizem a concessão do benefício;","III - Não seja indicada ou cabível a substituição prevista no art. 44 deste Código.","§ 1º - A condenação anterior a pena de multa não impede a concessão do benefício.","§ 2º A execução da pena privativa de liberdade, não superior a quatro anos, poderá ser suspensa, por quatro a seis anos, desde que o condenado seja maior de setenta anos de idade, ou razões de saúde justifiquem a suspensão."],"ti":4,"ch":"Da suspensão condicional da pena"},{"n":"78","t":"Condições da suspensão","k":"condições","s":"Durante o sursis, o condenado cumpre condições fixadas pelo juiz. No primeiro ano, deve prestar serviços à comunidade ou cumprir limitação de fim de semana.","e":"Beneficiado pelo sursis, um condenado passa o primeiro ano prestando serviços em uma creche municipal.","d":"Se reparou o dano e as circunstâncias do art. 59 forem inteiramente favoráveis, o juiz troca essa exigência por condições aplicadas cumulativamente: não frequentar certos lugares, não sair da comarca sem autorização e comparecer mensalmente em juízo.","pena":"","rub":"","caput":"Durante o prazo da suspensão, o condenado ficará sujeito à observação e ao cumprimento das condições estabelecidas pelo juiz.","txt":["Art. 78 - Durante o prazo da suspensão, o condenado ficará sujeito à observação e ao cumprimento das condições estabelecidas pelo juiz.","§ 1º - No primeiro ano do prazo, deverá o condenado prestar serviços à comunidade (art. 46) ou submeter-se à limitação de fim de semana (art. 48).","§ 2º Se o condenado houver reparado o dano, salvo impossibilidade de fazê-lo, e se as circunstâncias do art. 59 deste Código lhe forem inteiramente favoráveis, o juiz poderá substituir a exigência do parágrafo anterior pelas seguintes condições, aplicadas cumulativamente:","a) proibição de freqüentar determinados lugares;","b) proibição de ausentar-se da comarca onde reside, sem autorização do juiz;","c) comparecimento pessoal e obrigatório a juízo, mensalmente, para informar e justificar suas atividades."],"ti":4,"ch":"Da suspensão condicional da pena"},{"n":"79","t":"Outras condições do sursis","k":"outras condições","s":"Além das condições previstas em lei, o juiz pode fixar na sentença outras condições para o sursis, desde que adequadas ao fato e à situação do condenado.","e":"O juiz determina que um condenado por crime ligado à bebida frequente um grupo de apoio durante a suspensão.","d":"As condições extras não são livres: precisam ser adequadas ao fato e à situação pessoal do condenado.","pena":"","rub":"","caput":"A sentença poderá especificar outras condições a que fica subordinada a suspensão, desde que adequadas ao fato e à situação pessoal do condenado.","txt":["Art. 79 - A sentença poderá especificar outras condições a que fica subordinada a suspensão, desde que adequadas ao fato e à situação pessoal do condenado."],"ti":4,"ch":"Da suspensão condicional da pena"},{"n":"80","t":"Alcance da suspensão","k":"não se estende","s":"O sursis suspende só a pena de prisão. Ele não alcança as penas restritivas de direitos nem a multa.","e":"Quem obteve o sursis continua obrigado a pagar a multa a que foi condenado.","d":"Mesmo com a prisão suspensa, a multa continua devida.","pena":"","rub":"","caput":"A suspensão não se estende às penas restritivas de direitos nem à multa.","txt":["Art. 80 - A suspensão não se estende às penas restritivas de direitos nem à multa."],"ti":4,"ch":"Da suspensão condicional da pena"},{"n":"81","t":"Revogação da suspensão","k":"revogada","s":"O sursis é obrigatoriamente revogado se o beneficiário for condenado definitivamente por crime doloso, frustrar o pagamento da multa podendo pagar, não reparar o dano sem justificativa ou descumprir a condição do primeiro ano.","e":"Durante o período de prova, o beneficiário é condenado definitivamente por um furto e perde o sursis.","d":"Condenação por crime doloso revoga obrigatoriamente; por crime culposo ou contravenção, a prisão ou restritiva de direitos, a revogação é facultativa. Se o beneficiário estiver sendo processado, o prazo fica prorrogado até o julgamento definitivo.","pena":"","rub":"Revogação obrigatória","caput":"A suspensão será revogada se, no curso do prazo, o beneficiário:","txt":["Art. 81 - A suspensão será revogada se, no curso do prazo, o beneficiário:","I - é condenado, em sentença irrecorrível, por crime doloso;","II - frustra, embora solvente, a execução de pena de multa ou não efetua, sem motivo justificado, a reparação do dano;","III - descumpre a condição do § 1º do art. 78 deste Código.","Revogação facultativa","§ 1º - A suspensão poderá ser revogada se o condenado descumpre qualquer outra condição imposta ou é irrecorrivelmente condenado, por crime culposo ou por contravenção, a pena privativa de liberdade ou restritiva de direitos.","Prorrogação do período de prova","§ 2º - Se o beneficiário está sendo processado por outro crime ou contravenção, considera-se prorrogado o prazo da suspensão até o julgamento definitivo.","§ 3º - Quando facultativa a revogação, o juiz pode, ao invés de decretá-la, prorrogar o período de prova até o máximo, se este não foi o fixado."],"ti":4,"ch":"Da suspensão condicional da pena"},{"n":"82","t":"Cumprimento das condições","k":"extinta","s":"Se o período de prova termina sem revogação, a pena de prisão é considerada extinta.","e":"Ao fim do período de suspensão sem nenhum problema, o condenado tem a pena declarada extinta e não precisa ir para a prisão.","d":"O que se extingue é a pena privativa de liberdade; a multa, que o sursis não alcança, segue suas próprias regras.","pena":"","rub":"Cumprimento das condições","caput":"Expirado o prazo sem que tenha havido revogação, considera-se extinta a pena privativa de liberdade.","txt":["Art. 82 - Expirado o prazo sem que tenha havido revogação, considera-se extinta a pena privativa de liberdade."],"ti":4,"ch":"Da suspensão condicional da pena"},{"n":"83","t":"Requisitos do livramento condicional","k":"livramento condicional","s":"O condenado a prisão igual ou superior a 2 anos pode sair antes, em liberdade condicional, depois de cumprir parte da pena: mais de um terço se não for reincidente em crime doloso e tiver bons antecedentes, mais da metade se for reincidente, e mais de dois terços em crimes hediondos e equiparados.","e":"Um condenado primário com bom comportamento pede o livramento após cumprir mais de um terço da pena.","d":"Exige também bom comportamento, nenhuma falta grave nos últimos 12 meses e reparação do dano. Nos crimes hediondos, tortura, tráfico de drogas, tráfico de pessoas e terrorismo, o reincidente específico não tem direito ao livramento.","pena":"","rub":"Requisitos do livramento condicional","caput":"O juiz poderá conceder livramento condicional ao condenado a pena privativa de liberdade igual ou superior a 2 (dois) anos, desde que:","txt":["Art. 83 - O juiz poderá conceder livramento condicional ao condenado a pena privativa de liberdade igual ou superior a 2 (dois) anos, desde que:","I - cumprida mais de um terço da pena se o condenado não for reincidente em crime doloso e tiver bons antecedentes;","II - cumprida mais da metade se o condenado for reincidente em crime doloso;","III - comprovado:","a) bom comportamento durante a execução da pena;","b) não cometimento de falta grave nos últimos 12 (doze) meses;","c) bom desempenho no trabalho que lhe foi atribuído; e","d) aptidão para prover a própria subsistência mediante trabalho honesto;","IV - tenha reparado, salvo efetiva impossibilidade de fazê-lo, o dano causado pela infração;","V - cumpridos mais de dois terços da pena, nos casos de condenação por crime hediondo, prática de tortura, tráfico ilícito de entorpecentes e drogas afins, tráfico de pessoas e terrorismo, se o apenado não for reincidente específico em crimes dessa natureza.","Parágrafo único - Para o condenado por crime doloso, cometido com violência ou grave ameaça à pessoa, a concessão do livramento ficará também subordinada à constatação de condições pessoais que façam presumir que o liberado não voltará a delinqüir."],"ti":4,"ch":"Do livramento condicional"},{"n":"84","t":"Soma de penas","k":"somar-se","s":"Para calcular o tempo necessário ao livramento condicional, as penas de crimes diferentes são somadas.","e":"Um condenado por crimes diferentes, em processos separados, tem as penas somadas para saber quando pode pedir o livramento.","d":"A soma vale para infrações diversas e serve justamente para alcançar o tempo mínimo de pena exigido para o livramento.","pena":"","rub":"Soma de penas","caput":"As penas que correspondem a infrações diversas devem somar-se para efeito do livramento.","txt":["Art. 84 - As penas que correspondem a infrações diversas devem somar-se para efeito do livramento."],"ti":4,"ch":"Do livramento condicional"},{"n":"85","t":"Especificações das condições","k":"condições","s":"A sentença que concede o livramento condicional deve dizer quais condições o liberado terá de cumprir.","e":"Ao conceder o livramento, o juiz fixa que o liberado deve trabalhar e informar ao juízo se mudar de endereço.","d":"As condições do livramento são as fixadas na sentença; descumpri-las pode levar à revogação facultativa do livramento.","pena":"","rub":"Especificações das condições","caput":"A sentença especificará as condições a que fica subordinado o livramento.","txt":["Art. 85 - A sentença especificará as condições a que fica subordinado o livramento."],"ti":4,"ch":"Do livramento condicional"},{"n":"86","t":"Revogação do livramento","k":"revoga-se","s":"O livramento é obrigatoriamente revogado se o liberado for condenado definitivamente a pena de prisão, seja por crime cometido durante o benefício, seja por crime anterior.","e":"Em liberdade condicional, um homem comete um roubo, é condenado definitivamente à prisão e perde o livramento.","d":"A revogação obrigatória exige condenação a pena privativa de liberdade; se a pena não for de prisão, a revogação é facultativa. No crime anterior, observa-se a soma de penas do art. 84.","pena":"","rub":"Revogação do livramento","caput":"Revoga-se o livramento, se o liberado vem a ser condenado a pena privativa de liberdade, em sentença irrecorrível:","txt":["Art. 86 - Revoga-se o livramento, se o liberado vem a ser condenado a pena privativa de liberdade, em sentença irrecorrível:","I - por crime cometido durante a vigência do benefício;","II - por crime anterior, observado o disposto no art. 84 deste Código."],"ti":4,"ch":"Do livramento condicional"},{"n":"87","t":"Revogação facultativa","k":"poderá revogar","s":"O juiz pode revogar o livramento se o liberado descumprir as obrigações da sentença ou for condenado definitivamente, por crime ou contravenção, a pena que não seja de prisão.","e":"Um liberado deixa de comparecer ao juízo como determinado, e o juiz avalia se revoga o benefício.","d":"Aqui a revogação é uma possibilidade (\"poderá\"), não uma obrigação, e a condenação é a pena que não seja privativa de liberdade.","pena":"","rub":"Revogação facultativa","caput":"O juiz poderá, também, revogar o livramento, se o liberado deixar de cumprir qualquer das obrigações constantes da sentença, ou for irrecorrivelmente condenado, por crime ou contravenção, a pena que não seja privativa de liberdade.","txt":["Art. 87 - O juiz poderá, também, revogar o livramento, se o liberado deixar de cumprir qualquer das obrigações constantes da sentença, ou for irrecorrivelmente condenado, por crime ou contravenção, a pena que não seja privativa de liberdade."],"ti":4,"ch":"Do livramento condicional"},{"n":"88","t":"Efeitos da revogação","k":"novamente concedido","s":"Revogado o livramento, ele não pode ser concedido de novo, e em regra o tempo que o condenado passou solto não é descontado da pena.","e":"Quem perdeu o livramento por cometer novo crime durante o benefício volta a cumprir a pena sem abater o tempo em liberdade.","d":"A exceção: se a revogação decorrer de condenação por crime anterior ao benefício, o tempo solto é descontado da pena.","pena":"","rub":"Efeitos da revogação","caput":"Revogado o livramento, não poderá ser novamente concedido, e, salvo quando a revogação resulta de condenação por outro crime anterior àquele benefício, não se desconta na pena o tempo em que esteve solto o condenado.","txt":["Art. 88 - Revogado o livramento, não poderá ser novamente concedido, e, salvo quando a revogação resulta de condenação por outro crime anterior àquele benefício, não se desconta na pena o tempo em que esteve solto o condenado."],"ti":4,"ch":"Do livramento condicional"},{"n":"89","t":"Extinção","k":"passar em julgado","s":"Se o liberado responde a processo por crime cometido durante o livramento, o juiz não pode declarar a pena extinta enquanto esse processo não terminar definitivamente.","e":"Terminado o prazo do livramento, o juiz aguarda o fim do processo por um furto praticado pelo liberado antes de declarar a pena extinta.","d":"A regra vale só para crime cometido na vigência do livramento, não para crime anterior.","pena":"","rub":"Extinção","caput":"O juiz não poderá declarar extinta a pena, enquanto não passar em julgado a sentença em processo a que responde o liberado, por crime cometido na vigência do livramento.","txt":["Art. 89 - O juiz não poderá declarar extinta a pena, enquanto não passar em julgado a sentença em processo a que responde o liberado, por crime cometido na vigência do livramento."],"ti":4,"ch":"Do livramento condicional"},{"n":"90","t":"Extinção da pena pelo livramento","k":"extinta","s":"Se o livramento chega ao fim sem ser revogado, a pena de prisão é considerada extinta.","e":"O liberado cumpre todas as condições até o término do período e tem a pena declarada extinta.","d":"A extinção depende de não ter havido revogação até o término, combinando com a regra do artigo anterior: se houver processo por crime cometido durante o livramento, a extinção espera o julgamento definitivo.","pena":"","rub":"","caput":"Se até o seu término o livramento não é revogado, considera-se extinta a pena privativa de liberdade.","txt":["Art. 90 - Se até o seu término o livramento não é revogado, considera-se extinta a pena privativa de liberdade."],"ti":4,"ch":"Do livramento condicional"},{"n":"91","t":"Efeitos genéricos e específicos","k":"efeitos da condenação","s":"A condenação torna certa a obrigação de indenizar a vítima e faz o condenado perder para a União os instrumentos ilícitos do crime e o produto ou proveito obtido com ele.","e":"Condenado por corrupção, o servidor perde para a União o dinheiro que recebeu de propina.","d":"Os instrumentos só são perdidos se forem coisas de fabrico, uso, porte ou detenção ilícitos, ressalvado o direito do lesado ou de terceiro de boa-fé. Se o produto não for encontrado ou estiver no exterior, podem ser perdidos bens equivalentes.","pena":"","rub":"Efeitos genéricos e específicos","caput":"São efeitos da condenação:","txt":["Art. 91 - São efeitos da condenação:","I - tornar certa a obrigação de indenizar o dano causado pelo crime;","II - a perda em favor da União, ressalvado o direito do lesado ou de terceiro de boa-fé:","a) dos instrumentos do crime, desde que consistam em coisas cujo fabrico, alienação, uso, porte ou detenção constitua fato ilícito;","b) do produto do crime ou de qualquer bem ou valor que constitua proveito auferido pelo agente com a prática do fato criminoso.","§ 1º Poderá ser decretada a perda de bens ou valores equivalentes ao produto ou proveito do crime quando estes não forem encontrados ou quando se localizarem no exterior.","§ 2º Na hipótese do § 1º, as medidas assecuratórias previstas na legislação processual poderão abranger bens ou valores equivalentes do investigado ou acusado para posterior decretação de perda."],"ti":4,"ch":"Dos efeitos da condenação"},{"n":"91-A","t":"Perda alargada de bens","k":"perda alargada","s":"Em condenações por crimes com pena máxima superior a 6 anos de reclusão, o juiz pode decretar a perda dos bens que excedem o que seria compatível com a renda lícita do condenado. O condenado pode provar que seu patrimônio tem origem lícita.","e":"Um servidor condenado por crime grave que tem imóveis de luxo incompatíveis com seu salário pode perder a diferença.","d":"A perda precisa ser pedida expressamente pelo Ministério Público na denúncia, com a diferença apurada. Instrumentos usados por organizações criminosas e milícias devem ser perdidos mesmo que não ofereçam perigo.","pena":"","rub":"","caput":"Na hipótese de condenação por infrações às quais a lei comine pena máxima superior a 6 (seis) anos de reclusão, poderá ser decretada a perda, como produto ou proveito do crime, dos bens correspondentes à diferença entre o valor do patrimônio do condenado e aquele que seja compatível com o seu rendimento lícito.","txt":["Art. 91-A. Na hipótese de condenação por infrações às quais a lei comine pena máxima superior a 6 (seis) anos de reclusão, poderá ser decretada a perda, como produto ou proveito do crime, dos bens correspondentes à diferença entre o valor do patrimônio do condenado e aquele que seja compatível com o seu rendimento lícito.","§ 1º Para efeito da perda prevista no caput deste artigo, entende-se por patrimônio do condenado todos os bens:","I - de sua titularidade, ou em relação aos quais ele tenha o domínio e o benefício direto ou indireto, na data da infração penal ou recebidos posteriormente; e","II - transferidos a terceiros a título gratuito ou mediante contraprestação irrisória, a partir do início da atividade criminal.","§ 2º O condenado poderá demonstrar a inexistência da incompatibilidade ou a procedência lícita do patrimônio.","§ 3º A perda prevista neste artigo deverá ser requerida expressamente pelo Ministério Público, por ocasião do oferecimento da denúncia, com indicação da diferença apurada.","§ 4º Na sentença condenatória, o juiz deve declarar o valor da diferença apurada e especificar os bens cuja perda for decretada.","§ 5º Os instrumentos utilizados para a prática de crimes por organizações criminosas e milícias deverão ser declarados perdidos em favor da União, do Estado ou do Distrito Federal, dependendo da Justiça onde tramita a ação penal, ainda que não ponham em perigo a segurança das pessoas, a moral ou a ordem pública, nem ofereçam sério risco de ser utilizados para o cometimento de novos crimes."],"ti":4,"ch":"Dos efeitos da condenação"},{"n":"92","t":"Efeitos específicos da condenação","k":"perda de cargo","s":"Outros efeitos da condenação: perda de cargo, função ou mandato, incapacidade para o poder familiar, tutela ou curatela em certos crimes, inabilitação para dirigir quando o veículo foi usado em crime doloso, e suspensão do CNPJ por 180 dias da empresa usada para receptação.","e":"Um prefeito condenado a mais de 4 anos de prisão por crime comum perde o mandato, desde que o juiz declare isso na sentença.","d":"A perda do cargo exige pena igual ou superior a um ano nos crimes com abuso de poder contra a Administração e superior a 4 anos nos demais. Esses efeitos não são automáticos, salvo nos crimes contra a mulher por razões da condição do sexo feminino e nos crimes do ECA listados no § 2º.","pena":"","rub":"","caput":"São também efeitos da condenação:","txt":["Art. 92 - São também efeitos da condenação:","I - a perda de cargo, função pública ou mandato eletivo:","a) quando aplicada pena privativa de liberdade por tempo igual ou superior a um ano, nos crimes praticados com abuso de poder ou violação de dever para com a Administração Pública;","b) quando for aplicada pena privativa de liberdade por tempo superior a 4 (quatro) anos nos demais casos.","II - a incapacidade para o exercício do poder familiar, da tutela ou da curatela nos crimes dolosos sujeitos à pena de reclusão cometidos contra outrem igualmente titular do mesmo poder familiar, contra filho, filha ou outro descendente, tutelado ou curatelado, bem como nos crimes cometidos contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código;","III - a inabilitação para dirigir veículo, quando utilizado como meio para a prática de crime doloso.","IV - a suspensão, pelo prazo de 180 (cento e oitenta) dias, da eficácia da inscrição no Cadastro Nacional da Pessoa Jurídica (CNPJ) do estabelecimento que, no exercício de atividade comercial ou industrial, for constituída ou utilizada com o fim de permitir, facilitar ou ocultar a prática dos crimes definidos no caput e no § 1º do art. 180 deste Código.","§ 1º Os efeitos de que trata este artigo não são automáticos, devendo ser motivadamente declarados na sentença pelo juiz, mas independem de pedido expresso da acusação, observado o disposto no inciso III do § 2º deste artigo.","§ 2º Ao condenado por crime praticado contra a mulher por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código, e ao condenado por crime previsto no caput e nos §§ 1º e 2º do art. 240, no caput e no parágrafo único do art. 241, no caput e nos §§ 1º e 3º do art. 241-A, no caput do art. 241-B, no caput e nos §§ 1º e 2º do art. 241-D e no caput e no § 1º do art. 244-A da Lei nº 8.069, de 13 de julho de 1990 (Estatuto da Criança e do Adolescente), serão:","I - aplicados os efeitos previstos nos incisos I e II do caput deste artigo;","II - vedadas a sua nomeação, designação ou diplomação em qualquer cargo, função pública ou mandato eletivo entre o trânsito em julgado da condenação até o efetivo cumprimento da pena;","III - automáticos os efeitos dos incisos I e II do caput e do inciso II do § 2º deste artigo.","§ 3º Em caso de reincidência da conduta prevista no inciso IV do caput deste artigo, a empresa será considerada inidônea e terá sua inscrição no CNPJ considerada inapta, com os efeitos previstos na Lei nº 9.430, de 27 de dezembro de 1996.","§ 4º Na hipótese da reincidência descrita no § 3º deste artigo, o administrador, direta ou indiretamente responsável pela infração cometida, será interditado para o exercício do comércio pelo período de 5 (cinco) anos."],"ti":4,"ch":"Dos efeitos da condenação"},{"n":"93","t":"Reabilitação","k":"reabilitação","s":"A reabilitação garante ao condenado o sigilo dos registros do seu processo e condenação, alcançando qualquer pena aplicada em sentença definitiva. Pode também atingir os efeitos do art. 92.","e":"Anos após cumprir a pena, um ex-condenado obtém a reabilitação e seus registros criminais passam a ser sigilosos.","d":"Nos casos de perda de cargo e incapacidade para o poder familiar (incisos I e II do art. 92), a reabilitação não devolve a pessoa à situação anterior.","pena":"","rub":"Reabilitação","caput":"A reabilitação alcança quaisquer penas aplicadas em sentença definitiva, assegurando ao condenado o sigilo dos registros sobre o seu processo e condenação.","txt":["Art. 93 - A reabilitação alcança quaisquer penas aplicadas em sentença definitiva, assegurando ao condenado o sigilo dos registros sobre o seu processo e condenação.","Parágrafo único - A reabilitação poderá, também, atingir os efeitos da condenação, previstos no art. 92 deste Código, vedada reintegração na situação anterior, nos casos dos incisos I e II do mesmo artigo."],"ti":4,"ch":"Da reabilitação"},{"n":"94","t":"Requisitos da reabilitação","k":"2 anos","s":"A reabilitação pode ser pedida depois de 2 anos da extinção ou do fim da execução da pena, se o condenado morou no país nesse período, teve bom comportamento e reparou o dano ou provou que não podia repará-lo.","e":"Passados 2 anos do fim da pena, uma mulher que manteve bom comportamento e indenizou a vítima pede a reabilitação.","d":"O prazo de 2 anos inclui o período de prova do sursis e do livramento, se não houver revogação. Se negada, pode ser pedida de novo a qualquer tempo, com novas provas.","pena":"","rub":"","caput":"A reabilitação poderá ser requerida, decorridos 2 (dois) anos do dia em que for extinta, de qualquer modo, a pena ou terminar sua execução, computando-se o período de prova da suspensão e o do livramento condicional, se não sobrevier revogação, desde que o condenado:","txt":["Art. 94 - A reabilitação poderá ser requerida, decorridos 2 (dois) anos do dia em que for extinta, de qualquer modo, a pena ou terminar sua execução, computando-se o período de prova da suspensão e o do livramento condicional, se não sobrevier revogação, desde que o condenado:","I - tenha tido domicílio no País no prazo acima referido;","II - tenha dado, durante esse tempo, demonstração efetiva e constante de bom comportamento público e privado;","III - tenha ressarcido o dano causado pelo crime ou demonstre a absoluta impossibilidade de o fazer, até o dia do pedido, ou exiba documento que comprove a renúncia da vítima ou novação da dívida.","Parágrafo único - Negada a reabilitação, poderá ser requerida, a qualquer tempo, desde que o pedido seja instruído com novos elementos comprobatórios dos requisitos necessários."],"ti":4,"ch":"Da reabilitação"},{"n":"95","t":"Revogação da reabilitação","k":"revogada","s":"A reabilitação é revogada se o reabilitado for condenado definitivamente, como reincidente, a pena que não seja de multa. O juiz pode revogá-la por conta própria ou a pedido do Ministério Público.","e":"Um reabilitado comete novo crime, é condenado como reincidente a pena de prisão e perde a reabilitação.","d":"Condenação apenas a multa não revoga a reabilitação. É preciso que a nova condenação seja como reincidente.","pena":"","rub":"","caput":"A reabilitação será revogada, de ofício ou a requerimento do Ministério Público, se o reabilitado for condenado, como reincidente, por decisão definitiva, a pena que não seja de multa.","txt":["Art. 95 - A reabilitação será revogada, de ofício ou a requerimento do Ministério Público, se o reabilitado for condenado, como reincidente, por decisão definitiva, a pena que não seja de multa."],"ti":4,"ch":"Da reabilitação"},{"n":"96","t":"Espécies de medidas de segurança","k":"medidas de segurança","s":"As medidas de segurança são o tratamento dado, no lugar da pena, a quem cometeu crime por causa de doença mental. Podem ser a internação em hospital de custódia e tratamento psiquiátrico ou o tratamento ambulatorial.","e":"Uma pessoa com doença mental grave que comete um crime é encaminhada a um hospital de custódia para tratamento.","d":"Extinta a punibilidade, não se impõe medida de segurança nem subsiste a que já tenha sido imposta.","pena":"","rub":"Espécies de medidas de segurança","caput":"As medidas de segurança são:","txt":["Art. 96. As medidas de segurança são:","I - Internação em hospital de custódia e tratamento psiquiátrico ou, à falta, em outro estabelecimento adequado;","II - sujeição a tratamento ambulatorial.","Parágrafo único - Extinta a punibilidade, não se impõe medida de segurança nem subsiste a que tenha sido imposta."],"ti":5,"ch":""},{"n":"97","t":"Medida de segurança para inimputável","k":"internação","s":"Se o agente for inimputável (incapaz de entender o que fazia), o juiz determina sua internação; se o crime for punido com detenção, pode optar pelo tratamento ambulatorial. A medida dura enquanto a perícia não constatar o fim da periculosidade, com prazo mínimo de 1 a 3 anos.","e":"Uma pessoa em surto psicótico que agride um vizinho é absolvida por inimputabilidade e internada para tratamento.","d":"O prazo é indeterminado; o que vai de 1 a 3 anos é só o mínimo. A desinternação é sempre condicional e volta atrás se, antes de 1 ano, o agente praticar fato que indique periculosidade.","pena":"","rub":"Imposição da medida de segurança para inimputável","caput":"Se o agente for inimputável, o juiz determinará sua internação (art. 26). Se, todavia, o fato previsto como crime for punível com detenção, poderá o juiz submetê-lo a tratamento ambulatorial.","txt":["Art. 97 - Se o agente for inimputável, o juiz determinará sua internação (art. 26). Se, todavia, o fato previsto como crime for punível com detenção, poderá o juiz submetê-lo a tratamento ambulatorial.","Prazo","§ 1º - A internação, ou tratamento ambulatorial, será por tempo indeterminado, perdurando enquanto não for averiguada, mediante perícia médica, a cessação de periculosidade. O prazo mínimo deverá ser de 1 (um) a 3 (três) anos.","Perícia médica","§ 2º - A perícia médica realizar-se-á ao termo do prazo mínimo fixado e deverá ser repetida de ano em ano, ou a qualquer tempo, se o determinar o juiz da execução.","Desinternação ou liberação condicional","§ 3º - A desinternação, ou a liberação, será sempre condicional devendo ser restabelecida a situação anterior se o agente, antes do decurso de 1 (um) ano, pratica fato indicativo de persistência de sua periculosidade.","§ 4º - Em qualquer fase do tratamento ambulatorial, poderá o juiz determinar a internação do agente, se essa providência for necessária para fins curativos."],"ti":5,"ch":""},{"n":"98","t":"Medida de segurança para semi-imputável","k":"substituída","s":"Se o condenado é semi-imputável (tem capacidade reduzida de entender o que fazia) e precisa de tratamento especial, a pena de prisão pode ser substituída por internação ou tratamento ambulatorial, com prazo mínimo de 1 a 3 anos.","e":"Um réu com transtorno mental que reduzia parcialmente sua compreensão tem a prisão trocada por tratamento ambulatorial.","d":"Para o semi-imputável, primeiro há condenação e pena, que depois pode ser substituída; para o inimputável, há internação sem pena.","pena":"","rub":"Substituição da pena por medida de segurança para o semi-imputável","caput":"Na hipótese do parágrafo único do art. 26 deste Código e necessitando o condenado de especial tratamento curativo, a pena privativa de liberdade pode ser substituída pela internação, ou tratamento ambulatorial, pelo prazo mínimo de 1 (um) a 3 (três) anos, nos termos do artigo anterior e respectivos §§ 1º a 4º.","txt":["Art. 98 - Na hipótese do parágrafo único do art. 26 deste Código e necessitando o condenado de especial tratamento curativo, a pena privativa de liberdade pode ser substituída pela internação, ou tratamento ambulatorial, pelo prazo mínimo de 1 (um) a 3 (três) anos, nos termos do artigo anterior e respectivos §§ 1º a 4º."],"ti":5,"ch":""},{"n":"99","t":"Direitos do internado","k":"tratamento","s":"Quem cumpre medida de internação deve ficar em local com características de hospital e receber tratamento.","e":"Uma pessoa internada por medida de segurança deve ser levada a uma unidade hospitalar, e não mantida numa cela comum de presídio.","d":"O artigo garante, ao mesmo tempo, estabelecimento com características hospitalares e efetiva submissão a tratamento.","pena":"","rub":"Direitos do internado","caput":"O internado será recolhido a estabelecimento dotado de características hospitalares e será submetido a tratamento.","txt":["Art. 99 - O internado será recolhido a estabelecimento dotado de características hospitalares e será submetido a tratamento."],"ti":5,"ch":""},{"n":"100","t":"Ação pública e de iniciativa privada","k":"ação penal","s":"Em regra, a ação penal é pública, movida pelo Ministério Público; só é privada quando a lei diz expressamente. Na ação privada, a própria vítima entra com a queixa.","e":"Ofendida por um vizinho num crime que a lei declara de ação privada, a vítima contrata advogado e apresenta a queixa ao juiz.","d":"Se o Ministério Público não oferece denúncia no prazo legal, a vítima pode entrar com ação privada no crime de ação pública. Se a vítima morre ou é declarada ausente, o direito passa ao cônjuge, ascendente, descendente ou irmão.","pena":"","rub":"Ação pública e de iniciativa privada","caput":"A ação penal é pública, salvo quando a lei expressamente a declara privativa do ofendido.","txt":["Art. 100 - A ação penal é pública, salvo quando a lei expressamente a declara privativa do ofendido.","§ 1º - A ação pública é promovida pelo Ministério Público, dependendo, quando a lei o exige, de representação do ofendido ou de requisição do Ministro da Justiça.","§ 2º - A ação de iniciativa privada é promovida mediante queixa do ofendido ou de quem tenha qualidade para representá-lo.","§ 3º - A ação de iniciativa privada pode intentar-se nos crimes de ação pública, se o Ministério Público não oferece denúncia no prazo legal.","§ 4º - No caso de morte do ofendido ou de ter sido declarado ausente por decisão judicial, o direito de oferecer queixa ou de prosseguir na ação passa ao cônjuge, ascendente, descendente ou irmão."],"ti":6,"ch":""},{"n":"101","t":"Ação penal no crime complexo","k":"crime complexo","s":"Crime complexo é aquele formado pela soma de outros crimes. Se qualquer um dos crimes que o compõem for de ação pública, o crime complexo também será de ação pública.","e":"O roubo junta a subtração de um bem com violência ou ameaça; como a subtração (furto) é de ação pública, o roubo também é.","d":"Basta que um dos crimes componentes seja de ação pública para que o crime complexo inteiro seja de ação pública.","pena":"","rub":"A ação penal no crime complexo","caput":"Quando a lei considera como elemento ou circunstâncias do tipo legal fatos que, por si mesmos, constituem crimes, cabe ação pública em relação àquele, desde que, em relação a qualquer destes, se deva proceder por iniciativa do Ministério Público.","txt":["Art. 101 - Quando a lei considera como elemento ou circunstâncias do tipo legal fatos que, por si mesmos, constituem crimes, cabe ação pública em relação àquele, desde que, em relação a qualquer destes, se deva proceder por iniciativa do Ministério Público."],"ti":6,"ch":""},{"n":"102","t":"Irretratabilidade da representação","k":"irretratável","s":"A representação é a autorização que a vítima dá para o Ministério Público processar o autor em certos crimes. A vítima pode desistir dela (retratar-se), mas só até o promotor oferecer a denúncia; depois disso, não dá mais para voltar atrás.","e":"Uma vítima de ameaça autoriza a investigação, mas, depois que o promotor já apresentou a denúncia ao juiz, tenta retirar a autorização e não consegue.","d":"O marco é o oferecimento da denúncia, e não o seu recebimento pelo juiz. Até o oferecimento, a retratação é possível.","pena":"","rub":"Irretratabilidade da representação","caput":"A representação será irretratável depois de oferecida a denúncia.","txt":["Art. 102 - A representação será irretratável depois de oferecida a denúncia."],"ti":6,"ch":""},{"n":"103","t":"Decadência da queixa ou representação","k":"decadência","s":"A vítima perde o direito de apresentar queixa ou representação se não agir em 6 meses, contados do dia em que descobriu quem é o autor do crime. Nos crimes de violência doméstica e familiar contra a mulher, esse prazo é de 12 meses.","e":"Quem descobre em março quem caluniou seu nome tem até setembro para apresentar a queixa; se perder o prazo, o autor não pode mais ser punido.","d":"O prazo não conta da data do crime, mas do dia em que a vítima soube quem é o autor. Na violência doméstica contra a mulher, o prazo dobra para 12 meses.","pena":"","rub":"Decadência do direito de queixa ou de representação","caput":"Salvo disposição expressa em contrário, o ofendido decai do direito de queixa ou de representação se não o exerce dentro do prazo de 6 (seis) meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100 deste Código, do dia em que se esgota o prazo para oferecimento da denúncia.","txt":["Art. 103 - Salvo disposição expressa em contrário, o ofendido decai do direito de queixa ou de representação se não o exerce dentro do prazo de 6 (seis) meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100 deste Código, do dia em que se esgota o prazo para oferecimento da denúncia.","Parágrafo único. Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher, a ofendida decai do direito de queixa ou de representação se não o exerce no prazo de 12 (doze) meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100 deste Código, do dia em que se esgota o prazo para oferecimento da denúncia."],"ti":6,"ch":""},{"n":"104","t":"Renúncia ao direito de queixa","k":"renúncia","s":"Se a vítima abre mão do direito de queixa, de forma expressa (declarando) ou tácita (com atitudes), não pode mais exercê-lo. Renúncia tácita é agir de modo incompatível com a vontade de processar.","e":"A vítima de injúria convida o ofensor para ser padrinho do seu casamento, demonstrando que não quer mais processá-lo.","d":"Receber indenização pelo dano causado pelo crime não significa renúncia tácita. A renúncia acontece antes da ação; depois dela, o instituto é o perdão.","pena":"","rub":"Renúncia expressa ou tácita do direito de queixa","caput":"O direito de queixa não pode ser exercido quando renunciado expressa ou tacitamente.","txt":["Art. 104 - O direito de queixa não pode ser exercido quando renunciado expressa ou tacitamente.","Parágrafo único - Importa renúncia tácita ao direito de queixa a prática de ato incompatível com a vontade de exercê-lo; não a implica, todavia, o fato de receber o ofendido a indenização do dano causado pelo crime."],"ti":6,"ch":""},{"n":"105","t":"Perdão do ofendido","k":"perdão do ofendido","s":"Nos crimes em que só se processa mediante queixa (ação penal privada), o perdão da vítima impede que o processo continue.","e":"Durante um processo por difamação entre vizinhos, a vítima perdoa o réu após um pedido de desculpas, e o processo é encerrado.","d":"O perdão só vale para crimes de ação penal privada e acontece com o processo já em andamento; antes do processo, o instituto é a renúncia.","pena":"","rub":"Perdão do ofendido","caput":"O perdão do ofendido, nos crimes em que somente se procede mediante queixa, obsta ao prosseguimento da ação.","txt":["Art. 105 - O perdão do ofendido, nos crimes em que somente se procede mediante queixa, obsta ao prosseguimento da ação."],"ti":6,"ch":""},{"n":"106","t":"Perdão: alcance e aceitação","k":"perdão","s":"O perdão pode ser dado dentro ou fora do processo, de forma expressa ou tácita. Se dado a um dos réus, vale para todos; se dado por uma das vítimas, não atinge o direito das outras; e, se o réu recusar, não produz efeito.","e":"Duas pessoas são processadas por injúria e a vítima perdoa só uma delas; o perdão acaba beneficiando as duas, salvo a que recusar.","d":"O perdão depende de aceitação do réu (é bilateral), diferente da renúncia. E não é admitido depois que a sentença condenatória passa em julgado, ou seja, quand
