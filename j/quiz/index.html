<script>
(function () {

    { tip: 2 },
    { id: 't1', k: 'Pergunta 5 de 11 · Caso 1 de 5', law: 1, t: 'Qual é o crime?', h: 'O fiscal diz ao dono do bar: “ou você me paga R$ 5 mil, ou eu interdito o seu estabelecimento”.', o: [['a', 'A', 'Concussão', 'art. 316'], ['b', 'B', 'Corrupção passiva', 'art. 317'], ['c', 'C', 'Extorsão', 'art. 158']], quiz: 'a', vb: 'exigir', e: 'Servidor que <b>exige</b> vantagem em razão da função comete <b>concussão</b>. Se ele só tivesse <b>pedido</b>, seria corrupção passiva.' },

    { id: 'dev', k: 'Pergunta 9 de 11', t: 'Onde você mais estuda?', o: [['cel', '📱', 'No celular', 'No ônibus, no intervalo, antes de dormir'], ['pc', '💻', 'No computador', ''], ['pap', '📒', 'No papel', '']] },
    { id: 't4', k: 'Pergunta 10 de 11 · Caso 4 de 5', law: 1, t: 'Qual é o crime?', h: 'Um servidor leva para casa, e fica para si, o notebook da repartição que estava sob a guarda dele por causa do cargo.', o: [['a', 'A', 'Furto', 'art. 155'], ['b', 'B', 'Apropriação indébita', 'art. 168'], ['c', 'C', 'Peculato', 'art. 312']], quiz: 'c', vb: 'apropriar-se', e: 'Funcionário público que <b>se apropria</b> de bem que tem <b>em razão do cargo</b> comete <b>peculato</b>. Se fosse um particular, seria apropriação indébita.' },
    { id: 't5', k: 'Pergunta 11 de 11 · Caso 5 de 5', law: 1, t: 'A pegadinha das bancas', h: 'Irritado, João escreve no grupo do trabalho que o colega Pedro “é um ladrão”, sem contar nenhum fato.', o: [['a', 'A', 'Calúnia', 'art. 138'], ['b', 'B', 'Difamação', 'art. 139'], ['c', 'C', 'Injúria', 'art. 140']], quiz: 'c', vb: 'ofender a dignidade', e: 'Chamar alguém de ladrão, sem apontar um fato, é <b>injúria</b>. Calúnia exige <b>imputar falsamente um fato</b> definido como crime (“ele furtou o celular da Maria ontem”).' },

  var TOTAL = Q.filter(function (q) { return q.id; }).length;

      '<p style="margin-top:14px;font-size:17px">Responda 11 perguntas rápidas, incluindo 5 casos de Penal que caem em prova, e receba um diagnóstico do seu estudo e um plano para a sua prova.</p>' +
      '<button class="btn gold block" id="go" style="margin-top:22px">Começar o diagnóstico</button>' +
      '<p class="center" style="margin-top:12px;font-size:13px;color:#8F9BB8">Sem cadastro · resultado na hora</p>' +
      '<div style="margin-top:16px;display:flex;gap:10px;align-items:center;justify-content:center;background:rgba(214,180,103,.12);border:1px dashed rgba(214,180,103,.5);border-radius:14px;padding:10px 12px;font-size:14.5px;color:var(--gold2);font-weight:700"><span style="font-size:20px">💰</span>Cada resposta vale um bônus. Vá juntando até o final.</div></div>' +
      '<div class="card" style="margin-top:16px;display:flex;gap:14px;align-items:center"><span style="font-size:30px">🔑</span><p style="font-size:15px;color:var(--ink2)">Feito a partir do <b style="color:var(--ink)">Método do Verbo-Chave</b>: cada crime do Código Penal tem um verbo que o diferencia dos outros.</p></div></div>';
    document.getElementById('go').onclick = function () { X.play('select'); EV('start'); started = true; window.PFOffer.trackCustom('QuizStart', { quiz: 'diagnostico' }); go(0); };
  }

  function show() {
    var q = Q[i]; progress();
    if (!q) return analyze();
    if (q.tip) return tip(q.tip);
    if (q.name) return askName();
    st.innerHTML = '<div class="screen q"><span class="kicker">' + q.k + '</span><h2>' + q.t + '</h2>' + (q.h ? '<p class="help" style="font-size:17px;color:var(--ink)">' + q.h + '</p>' : '') +

      b.onclick = function () {
        var first = A[q.id] === undefined;

        A[q.id] = b.dataset.v;

        var ok = b.dataset.v === q.quiz;

          '<button class="btn navy block" id="nx" style="margin-top:14px">Continuar</button>';
        document.getElementById('nx').onclick = function () { X.play('tap'); go(i + 1); };
      };
    });
  }

  function tip(n) {

      ? '<span class="kicker">Você sabia?</span><h2 style="font-size:30px;margin-top:8px">Direito Penal é uma das matérias que mais ' + (c === 'pol' ? 'pesam nos concursos policiais' : c === 'oab' ? 'aparecem na 1ª fase da OAB' : 'aparecem em provas de Direito') + '.</h2>' +

        '<div class="card" style="margin-top:18px"><p style="font-size:15px;color:var(--ink2)">Exemplo: <b style="color:var(--ink)">subtrair</b> é furto. <b style="color:var(--ink)">Subtrair com violência ou grave ameaça</b> é roubo. Uma expressão muda a pena de 1 a 6 anos para 6 a 10 anos (penas em vigor desde a Lei 15.397/2026).</p></div>'
      : '<span class="kicker">Isso é mais comum do que parece</span><h2 style="font-size:30px;margin-top:8px">' + ({ conf: 'Confundir crimes parecidos', fix: 'Ler e não fixar', pena: 'Esquecer as penas', ling: 'Travar na linguagem da lei', tempo: 'Ter pouco tempo' }[A.tra] || 'Travar em Penal') + ' tem solução.</h2>' +

    document.getElementById('nx').onclick = function () { X.play('tap'); go(i + 1); };

  function askName() {
    st.innerHTML = '<div class="screen q"><span class="kicker">Última etapa</span><h2>Como você quer que o seu plano seja chamado?</h2><p class="help">Opcional. Só para personalizar o seu resultado.</p>' +

  function analyze() {
    EV('analyze');
    pb.style.width = '100%'; pt.textContent = 'Analisando'; back.classList.remove('on');

      '<h2 style="font-size:28px;margin-top:22px">Preparando seu diagnóstico…</h2><ul class="steps">' + steps.map(function (s) { return '<li><i>✓</i>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
    var p = 0, li = st.querySelectorAll('.steps li'), arc = document.getElementById('arc'), pc = document.getElementById('pc');
    var t = setInterval(function () {
      p += 2; arc.style.strokeDashoffset = 327 - 327 * p / 100; pc.textContent = p + '%';

  function result() {

    // risco: prazo curto, estudo passivo, confusão entre crimes e erro no teste aumentam
    var r = 0;
    r += { '1': 3, '3': 2, '6': 1, '0': 1 }[A.prz] || 1;
    r += { lei: 2, pdf: 2, vid: 1, qst: 1, nada: 2 }[A.com] || 1;
    r += A.tra === 'conf' ? 2 : 1;
    var LAW = Q.filter(function (q) { return q.law; }), hits = LAW.filter(function (q) { return A[q.id] === q.quiz; }).length;
    r += LAW.length - hits;

    var nome = A.nome ? esc(A.nome) : '';
    var c = CAR[A.car] || 'sua prova';

    st.innerHTML = '<div class="screen">' +

      '<h1 style="font-size:clamp(28px,7vw,38px);margin-top:10px">Risco <span style="color:' + (nivel[0] === 'Baixo' ? '#7BD3A8' : 'var(--gold2)') + '">' + nivel[0].toLowerCase() + '</span> de perder pontos em Penal</h1>' +
      '<div style="margin-top:16px;height:12px;border-radius:99px;background:linear-gradient(90deg,#1E7F5C,#B8913A,#7B1E2B);position:relative"><i style="position:absolute;top:-6px;left:calc(' + nivel[2] + '% - 12px);width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid ' + nivel[1] + '"></i></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#8F9BB8;margin-top:8px;font-weight:700"><span>Baixo</span><span>Moderado</span><span>Alto</span></div>' +
      '<p style="margin-top:18px">Para ' + esc(c) + ', o que mais pesa no seu caso: <b style="color:#fff">' + dor + '</b> e o hábito de <b style="color:#fff">' + met + '</b>. ' + 'Nos casos de Penal, você acertou <b style="color:#fff">' + hits + ' de ' + LAW.length + '</b>' + (hits === LAW.length ? ': você já pensa pelo verbo. Agora é levar isso para os 405 dispositivos.' : '. ' + (LAW.filter(function (q) { return A[q.id] !== q.quiz; }).map(function (q) { return q.o.filter(function (o) { return o[0] === q.quiz; })[0][2]; }).join(', ')) + ': é aí que a banca vai tentar te pegar.') + '</p><a class="btn gold block" href="#oferta" id="seeb" style="margin-top:18px">Ver meu plano e meu bônus 💰</a></div>' +
      '<div class="card" style="margin-top:16px"><span class="kicker">Seu plano' + (nome ? ', ' + nome : '') + '</span>' +

      '<div style="background:var(--bg);border-radius:14px;padding:12px 6px"><b style="font-family:var(--serif);font-weight:400;font-size:30px;display:block">' + perDay + '</b><span class="muted">artigos por dia</span></div>' +
      '<div style="background:var(--bg);border-radius:14px;padding:12px 6px"><b style="font-family:var(--serif);font-weight:400;font-size:30px;display:block">' + mais + (mais === 1 ? ' dia' : ' dias') + '</b><span class="muted">para os 25 mais cobrados</span></div>' +
      '<div style="background:var(--bg);border-radius:14px;padding:12px 6px"><b style="font-family:var(--serif);font-weight:400;font-size:30px;display:block">' + dias + '</b><span class="muted">dias para o Código inteiro</span></div></div>' +
      '<p style="margin-top:14px;font-size:15.5px;color:var(--ink2)">' + cabe + ' ' + (A.dev === 'cel' ? 'Como você estuda no celular, o app cabe nos intervalos do seu dia, com meta diária e lembrete.' : 'O app funciona no ' + (A.dev === 'pc' ? 'computador' : 'celular e no computador') + ', com meta diária e lembrete.') + '</p>' +
      '<ol style="margin:14px 0 0 20px;font-size:15.5px;display:grid;gap:6px"><li><b>Semana 1:</b> os 25 artigos mais cobrados, pelo verbo-chave.</li><li><b>Depois:</b> ' + perDay + ' artigos por dia, com flashcards do que você errar.</li><li><b>Toda semana:</b> um simulado comentado no estilo das bancas.</li></ol></div>' +
      '<h2 style="font-size:28px;margin-top:28px" class="center">Comece o seu plano hoje</h2><p class="center muted" style="font-size:15px;margin-top:6px">Tudo o que o plano usa está no PenalFlux Completo.</p>' +
      '<div id="oferta" style="margin-top:16px"></div></div>';
    X.play('level');
    document.getElementById('seeb').onclick = function (e) { e.preventDefault(); X.play('tap'); document.getElementById('oferta').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    var of = document.getElementById('oferta'), fin = X.fill('', document.querySelector('.dark'));
    setTimeout(function () {
      window.PFOffer.render(of, { lines: [['Respostas do perfil', EARN.resp], ['Casos de Penal (' + hits + ' de ' + LAW.length + ')', EARN.teste], ['Plano personalizado', EARN.plano], ['Bônus por concluir', fin]], title: (nome ? nome + ', você' : 'Você') + ' juntou esse bônus respondendo o diagnóstico. Ele fica guardado para você usar no Completo.', cta: 'Quero o Completo e começar meu plano' });
    }, 500);
    window.PFOffer.track('ViewContent', { content_name: 'PenalFlux · resultado do quiz', currency: 'BRL', value: 29.9 });
    window.scrollTo(0, 0);
  }

  intro();
})();
</script>
