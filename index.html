<style>
body{background:var(--navy)}
.qtop{border-bottom:1px solid rgba(214,180,103,.18)}
.stage{color:#fff}
.hud{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:16px}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:7px 13px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip.hot{background:rgba(214,180,103,.16);border-color:rgba(214,180,103,.5);color:var(--gold2)}
.timer{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:18px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#7BD3A8,var(--gold2));width:100%;transition:width 1s linear}
.timer.low i{background:#E06A7A}
.case{background:#fff;color:var(--ink);border-radius:22px;padding:22px}
.case .lvl{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.case p.sc{font-size:18px;line-height:1.5;margin-top:8px}
.case .opts{margin-top:18px}
.exp{margin-top:14px;border-radius:16px;padding:16px;font-size:15.5px;background:var(--bg)}
.exp .vb{display:inline-block;font-family:var(--serif);font-size:24px;background:linear-gradient(100deg,transparent 2%,var(--goldhl) 4%,var(--goldhl) 96%,transparent 98%) no-repeat 0 85%/100% 45%;margin:4px 0}
.pts{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:54px;color:var(--gold2);pointer-events:none;animation:pop 1s ease forwards;text-shadow:0 6px 30px rgba(0,0,0,.4);z-index:30}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.conf{position:fixed;top:40%;left:50%;font-size:22px;pointer-events:none;z-index:29;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.badge-big{width:150px;height:150px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#EBD08E,#B8913A 60%,#8E6C24);display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 0 0 8px rgba(214,180,103,.18),0 20px 50px -10px rgba(184,145,58,.6);animation:in .6s ease both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stats div{background:rgba(255,255,255,.07);border-radius:16px;padding:14px 6px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--gold2)}
.stats span{font-size:12.5px;color:#AEB8CF;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.15)}
.dots i.ok{background:#7BD3A8}.dots i.no{background:#E06A7A}
.rev{background:#fff;color:var(--ink);border-radius:20px;padding:18px;margin-top:18px}
.rev li{margin:6px 0 0 18px;font-size:15px}
.light{background:var(--bg);color:var(--ink);border-radius:24px;padding:22px 16px;margin:24px -6px 0}
footer{color:#5E6B88}
.welcome{text-align:center;margin:-4px 0 14px}.welcome em{display:inline-block;font-style:normal;font-weight:800;font-size:11.5px;letter-spacing:1.6px;color:var(--navy,#0E1A33);background:var(--gold2,#D6B467);border-radius:99px;padding:5px 12px;margin-bottom:9px}.welcome b{display:block;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.12;color:#fff}.welcome span{display:block;font-size:14.5px;color:#C9D1E0;font-weight:600;margin-top:7px;line-height:1.4}.welcome i{display:block;font-style:normal;font-size:13px;font-weight:800;color:var(--gold2,#D6B467);margin-top:10px;letter-spacing:.3px}
</style>

<script>
(function () {
  'use strict';
  var TIME = 25;
  var C = [
    { lvl: 'Nível 1 · Crimes contra o patrimônio', s: 'No ponto de ônibus, alguém tira o celular do bolso de uma pessoa distraída, sem que ela perceba.', o: [['Furto', 'art. 155'], ['Roubo', 'art. 157'], ['Estelionato', 'art. 171']], a: 0, vb: 'subtrair', e: '<b>Subtrair</b> coisa alheia, sem violência nem ameaça, é furto. Se tivesse empurrado ou ameaçado a vítima, seria roubo.' },
    { lvl: 'Nível 1 · Crimes contra o patrimônio', s: 'Um homem mostra uma faca e manda a vítima entregar o celular. Ela entrega com medo.', o: [['Furto', 'art. 155'], ['Roubo', 'art. 157'], ['Extorsão', 'art. 158']], a: 1, vb: 'subtrair mediante grave ameaça', e: 'É o mesmo <b>subtrair</b> do furto, mas com <b>grave ameaça</b> ou violência. Essa expressão transforma o furto em roubo e muda a pena.' },
    { lvl: 'Nível 1 · Crimes contra o patrimônio', s: 'Um falso vendedor anuncia uma TV na internet, convence a vítima de que o produto existe e ela faz o Pix. A TV nunca chega.', o: [['Furto mediante fraude', 'art. 155, § 4º'], ['Estelionato', 'art. 171'], ['Extorsão', 'art. 158']], a: 1, vb: 'obter vantagem induzindo em erro', e: 'No estelionato a vítima é <b>induzida em erro</b> e entrega o dinheiro por vontade própria. No furto mediante fraude, a fraude só distrai a vítima para o agente <b>subtrair</b>.' },
    { lvl: 'Nível 1 · Crimes contra o patrimônio', s: 'Lucas pega emprestado o notebook de um amigo. Semanas depois, decide ficar com ele e vende o aparelho.', o: [['Furto', 'art. 155'], ['Estelionato', 'art. 171'], ['Apropriação indébita', 'art. 168']], a: 2, vb: 'apropriar-se', e: 'Lucas já tinha a <b>posse</b> do notebook (emprestado) e depois resolveu <b>se apropriar</b> dele: apropriação indébita. Não houve subtração, então não é furto.' },
    { lvl: 'Nível 1 · Crimes contra o patrimônio', s: 'Um criminoso liga para o comerciante: “ou você me deposita R$ 500 todo mês, ou eu ponho fogo na sua loja”.', o: [['Roubo', 'art. 157'], ['Extorsão', 'art. 158'], ['Ameaça', 'art. 147']], a: 1, vb: 'constranger para obter vantagem', e: 'Ele <b>constrange</b> a vítima, com grave ameaça, a fazer algo (depositar) para obter <b>vantagem econômica</b>: extorsão. No roubo, o agente subtrai a coisa na hora.' },
    { lvl: 'Nível 2 · Crimes contra a administração pública', s: 'O fiscal diz ao dono do bar: “ou você me paga R$ 5 mil, ou eu interdito o seu estabelecimento”.', o: [['Concussão', 'art. 316'], ['Corrupção passiva', 'art. 317'], ['Corrupção ativa', 'art. 333']], a: 0, vb: 'exigir', e: 'Servidor que <b>exige</b> vantagem em razão da função comete concussão. Se ele só tivesse <b>pedido</b>, seria corrupção passiva.' },
    { lvl: 'Nível 2 · Crimes contra a administração pública', s: 'O servidor do cartório diz: “se você me der R$ 100, eu adianto o seu processo na fila”.', o: [['Concussão', 'art. 316'], ['Corrupção passiva', 'art. 317'], ['Prevaricação', 'art. 319']], a: 1, vb: 'solicitar', e: '<b>Solicitar</b> (pedir) ou <b>receber</b> vantagem indevida é corrupção passiva. Não houve imposição, então não é concussão.' },
    { lvl: 'Nível 2 · Crimes contra a administração pública', s: 'Parado na blitz, o motorista estende R$ 200 ao policial e diz: “deixa passar essa”.', o: [['Corrupção ativa', 'art. 333'], ['Corrupção passiva', 'art. 317'], ['Concussão', 'art. 316']], a: 0, vb: 'oferecer', e: 'Quem <b>oferece</b> vantagem ao servidor comete corrupção ativa. O policial que aceitasse responderia por corrupção passiva.' },
    { lvl: 'Nível 2 · Crimes contra a administração pública', s: 'Um servidor leva para casa, e fica para si, o notebook da repartição que estava sob a guarda dele por causa do cargo.', o: [['Furto', 'art. 155'], ['Apropriação indébita', 'art. 168'], ['Peculato', 'art. 312']], a: 2, vb: 'apropriar-se', e: 'Funcionário público que <b>se apropria</b> de bem que tem a posse <b>em razão do cargo</b> comete peculato. Se fosse um particular, seria apropriação indébita.' },
    { lvl: 'Chefão · A pegadinha das bancas', s: 'Irritado, João escreve no grupo do trabalho que o colega Pedro “é um ladrão”, sem contar nenhum fato.', o: [['Calúnia', 'art. 138'], ['Difamação', 'art. 139'], ['Injúria', 'art. 140']], a: 2, vb: 'ofender a dignidade', e: 'Chamar alguém de ladrão, sem apontar um fato concreto, é <b>injúria</b>: ofende a dignidade. Calúnia exige <b>imputar falsamente um fato</b> definido como crime (“ele furtou o celular da Maria ontem”).' }
  ];
  var KEYS = { furto: 0, roubo: 1, estelionato: 2, golpe: 2, pix: 2, apropriacao: 3, extorsao: 4, concussao: 5, exigir: 5, corrupcao: 6, propina: 6, ativa: 7, peculato: 8, injuria: 9, calunia: 9 };
  var Q = (new URLSearchParams(location.search).get('caso') || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
  var FIRST = KEYS.hasOwnProperty(Q) ? KEYS[Q] : (/^\d+$/.test(Q) && +Q >= 1 && +Q <= C.length ? +Q - 1 : 0);
  if (FIRST > 0) { var mv = C.splice(FIRST, 1)[0]; mv = Object.assign({}, mv, { lvl: 'Caso de abertura · ' + mv.lvl.split('·').pop().trim() }); C.unshift(mv); }
  var started = false;
  var st = document.getElementById('stage'), pb = document.getElementById('pb'), pt = document.getElementById('pt');
  var i = 0, streak = 0, best = 0, res = [], timer = null, left = TIME;
  var X = window.PFX, EARN = { acerto: 0, rapido: 0, seq: 0 };
  var wl = document.getElementById('wl'); X.wallet(wl.parentNode); X.muteButton(wl.parentNode); wl.remove();
  var EV = window.PFQ.ev; window.PFQ.init('desafio');

  function intro() {
    pb.style.width = '2%';
    st.innerHTML = '<div class="screen center"><div class="badge-big">🔑</div>' +
      '<span class="kicker" style="display:block;margin-top:22px">Desafio do Verbo-Chave</span>' +
      '<h1 style="font-size:clamp(32px,8vw,44px);margin-top:8px">Você reconhece o crime <span style="color:var(--gold2)">pelo verbo</span>?</h1>' +
      '<p style="color:#C3CBDD;margin-top:12px;font-size:17px">10 casos que caem em prova. Cada acerto vale bônus 💰: acerte rápido e em sequência para juntar mais, e descubra a sua patente no fim.</p>' +
      '<div class="stats" style="margin-top:22px"><div><b>' + C.length + '</b><span>casos</span></div><div><b>' + TIME + 's</b><span>por caso</span></div><div><b>3</b><span>níveis</span></div></div>' +
      '<button class="btn gold block" id="go" style="margin-top:22px">Começar o desafio</button><p style="margin-top:12px;font-size:13px;color:#8F9BB8">Grátis · sem cadastro · 3 minutos</p></div>';
    document.getElementById('go').onclick = function () { X.play('select'); EV('start'); window.PFOffer.trackCustom('QuizStart', { quiz: 'desafio' }); play(); };
  }

  function hud() {
    return '<div class="hud"><span class="chip">Caso ' + (i + 1) + '/' + C.length + '</span><span class="chip">' + res.filter(function (r) { return r.ok; }).length + ' acertos</span><span class="chip ' + (streak >= 2 ? 'hot' : '') + '">🔥 ' + streak + '</span></div>';
  }

  function play() {
    var c = C[i]; left = TIME;
    pb.style.width = Math.round(i / C.length * 100) + '%'; pt.textContent = 'Caso ' + (i + 1) + ' de ' + C.length;
    var first = i === 0;
    st.innerHTML = '<div class="screen">' + (first ? '<div class="welcome"><em>TESTE GRATUITO · SEM CADASTRO</em><b>Você está pronto para a prova de Direito Penal?</b><span>10 casos no estilo das questões de concurso. No final, você vê o seu nível.</span><i>Comece pelo caso 1:</i></div>' : '') + hud() + (first ? '' : '<div class="timer" id="tm"><i id="ti"></i></div>') +
      '<div class="case" id="cs"><span class="lvl">' + c.lvl + '</span><p class="sc">' + c.s + '</p><p class="muted" style="margin-top:6px">Qual é o crime?</p>' +
      '<div class="opts">' + c.o.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><span class="em">' + 'ABC'[k] + '</span><span>' + o[0] + '<small>' + o[1] + '</small></span></button>'; }).join('') + '</div><div id="ex"></div></div></div>';
    st.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () { answer(+b.dataset.k); }; });
    clearInterval(timer);
    window.scrollTo(0, 0);
    if (first) return;
    var ti = document.getElementById('ti'), tm = document.getElementById('tm');
    requestAnimationFrame(function () { ti.style.width = '100%'; });
    clearInterval(timer);
    timer = setInterval(function () {
      left--; ti.style.width = Math.max(0, left / TIME * 100) + '%';
      if (left <= 7) { tm.classList.add('low'); if (left > 0) X.play('tick'); }
      if (left <= 0) { clearInterval(timer); answer(-1); }
    }, 1000);
  }

  function burst() {
    var em = ['⭐', '✨', '🔑', '⚖️'];
    for (var k = 0; k < 14; k++) {
      var d = document.createElement('span'); d.className = 'conf'; d.textContent = em[k % em.length];
      d.style.setProperty('--x', (Math.random() * 320 - 160) + 'px'); d.style.setProperty('--y', (Math.random() * -260 - 40) + 'px'); d.style.setProperty('--r', (Math.random() * 360) + 'deg');
      document.body.appendChild(d); setTimeout(function (n) { return function () { n.remove(); }; }(d), 1100);
    }
  }

  function answer(k) {
    clearInterval(timer);
    var c = C[i], ok = k === c.a, gained = 0;
    if (!started) { started = true; EV('start', { first: FIRST + 1 }); window.PFOffer.trackCustom('QuizStart', { quiz: 'desafio' }); }
    EV('c' + (i + 1), { ok: ok, t: TIME - Math.max(0, left) });
    st.querySelectorAll('.opt').forEach(function (x, j) { x.disabled = true; if (j === c.a) x.classList.add('right'); else if (j === k) x.classList.add('wrong'); });
    if (ok) {
      streak++; best = Math.max(best, streak);
      X.play('right'); X.buzz(30); burst();
      var btn = st.querySelectorAll('.opt')[c.a];
      // acerto R$ 0,50 · rápido (15 s ou mais sobrando) + R$ 0,20 · sequência de 3 ou mais + R$ 0,10 (o teto deixa espaço para o bônus de conclusão)
      var cap = function (v) { return Math.max(0, Math.min(v, 9 - X.total)); };
      var a1 = cap(0.5), a2 = left >= 15 ? cap(0.5 + 0.2) - a1 : 0, a3 = streak >= 3 ? cap(a1 + a2 + 0.1) - a1 - a2 : 0;
      a2 = Math.max(0, Math.round(a2 * 100) / 100); a3 = Math.max(0, Math.round(a3 * 100) / 100);
      gained = a1 + a2 + a3;
      EARN.acerto += X.earn(a1, '', btn); EARN.rapido += a2; EARN.seq += a3;
      if (a2 + a3 > 0) setTimeout(function () { X.earn(a2 + a3, a3 ? 'sequência' : 'rápido', document.getElementById('cs')); }, 450);
    } else { streak = 0; X.play('wrong'); X.buzz([40, 60, 40]); document.getElementById('cs').classList.add('shake'); }
    res.push({ ok: ok, c: c });
    var last = i === C.length - 1;
    document.getElementById('ex').innerHTML = '<div class="exp"><b style="color:' + (ok ? 'var(--green)' : 'var(--wine)') + '">' + (ok ? (streak >= 3 ? 'Sequência de ' + streak + '! 🔥' : 'Acertou!') : k < 0 ? 'Tempo esgotado.' : 'Errou, mas agora não erra mais.') + '</b>' +
      '<div style="margin-top:6px;font-size:13px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em">Verbo-chave</div><div class="vb">' + c.vb + '</div><p style="color:var(--ink2)">' + c.e + '</p></div>' +
      '<button class="btn navy block" id="nx" style="margin-top:14px">' + (last ? 'Ver minha patente e meu bônus' : 'Próximo caso') + '</button>';
    st.querySelector('.hud').outerHTML = hud();
    document.getElementById('nx').onclick = function () {
      X.play('tap');
      i++;
      if (i >= C.length) return finish();
      if (/^Nível 2/.test(C[i].lvl) && !/^Nível 2/.test(C[i - 1].lvl)) return levelUp('Nível 2 desbloqueado', 'Crimes contra a administração pública', 'Aqui as bancas trocam um verbo e a resposta muda: exigir, solicitar, apropriar-se.');
      if (/^Chefão/.test(C[i].lvl)) return levelUp(i === C.length - 1 ? 'Último caso' : 'Caso chefão', 'O chefão: a pegadinha das bancas', 'Calúnia, difamação ou injúria? Esta derruba muita gente.');
      play();
    };
  }

  function levelUp(t, sub, txt) {
    var ok = res.filter(function (r) { return r.ok; }).length;
    st.innerHTML = '<div class="screen center" style="padding-top:20px"><div class="badge-big" style="width:110px;height:110px;font-size:46px">' + (/^Chefão/.test(C[i].lvl) ? '👑' : '🏛️') + '</div>' +
      '<span class="kicker" style="display:block;margin-top:20px">' + t + '</span><h2 style="font-size:32px;margin-top:6px">' + sub + '</h2>' +
      '<p style="color:#C3CBDD;margin-top:10px">' + txt + '</p>' +
      '<div class="stats"><div><b>' + ok + '/' + i + '</b><span>acertos</span></div><div><b style="font-size:24px">' + X.brl(X.total) + '</b><span>bônus juntado</span></div><div><b>' + best + '</b><span>melhor sequência</span></div></div>' +
      '<button class="btn gold block" id="nx" style="margin-top:22px">Continuar</button></div>';
    X.play('level'); X.buzz([20, 30, 20]); EV(/^Chefão/.test(C[i].lvl) ? 'boss' : 'lvl2');
    document.getElementById('nx').onclick = function () { X.play('tap'); play(); };
  }

  function finish() {
    pb.style.width = '100%'; pt.textContent = 'Resultado';
    var ok = res.filter(function (r) { return r.ok; }).length;
    var N = C.length;
    var R = ok === N ? ['👑', 'Delegado(a) do Verbo', 'Acerto total. Você já pensa pelo verbo: agora é levar isso para os 405 dispositivos do Código.']
      : ok >= 7 ? ['🕵️', 'Investigador(a)', 'Você reconhece a maioria dos crimes pelo verbo. Os erros mostram exatamente onde a banca vai tentar te pegar.']
      : ok >= 4 ? ['🛡️', 'Agente', 'Você já acerta parte dos casos, mas os crimes parecidos ainda te confundem. É aí que se perdem pontos.']
      : ['🎖️', 'Recruta', 'Os crimes parecidos ainda se misturam. A boa notícia: com o verbo-chave, cada um passa a ter uma regra de uma frase.'];
    window.PFOffer.trackCustom('QuizComplete', { quiz: 'desafio', acertos: ok });
    EV('result', { acertos: ok });
    var miss = res.filter(function (r) { return !r.ok; });
    st.innerHTML = '<div class="screen"><div class="center"><div class="badge-big">' + R[0] + '</div>' +
      '<span class="kicker" style="display:block;margin-top:20px">Sua patente</span><h1 style="font-size:clamp(32px,8vw,42px);margin-top:6px">' + R[1] + '</h1>' +
      '<div class="dots">' + res.map(function (r) { return '<i class="' + (r.ok ? 'ok' : 'no') + '"></i>'; }).join('') + '</div>' +
      '<div class="stats"><div><b>' + ok + '/' + C.length + '</b><span>acertos</span></div><div><b style="font-size:24px">' + X.brl(X.total) + '</b><span>bônus nos casos</span></div><div><b>' + best + '</b><span>melhor sequência</span></div></div>' +
      '<p style="color:#C3CBDD;margin-top:16px;font-size:16.5px">' + R[2] + '</p><a class="btn gold block" href="#oferta" id="seeb" style="margin-top:18px">Resgatar meu bônus 💰</a></div>' +
      (miss.length ? '<div class="rev"><span class="kicker">O que revisar</span><ul>' + miss.map(function (r) { return '<li><b>' + r.c.o[r.c.a][0] + '</b> (' + r.c.o[r.c.a][1] + '): verbo <b>' + r.c.vb + '</b></li>'; }).join('') + '</ul><p class="muted" style="margin-top:10px">No PenalFlux, o que você erra volta nos flashcards até fixar.</p></div>' : '') +
      '<div class="light"><h2 style="font-size:28px" class="center">Foram ' + C.length + ' casos. O Código tem 405 dispositivos.</h2>' +
      '<p class="center" style="color:var(--ink2);margin-top:8px;font-size:15.5px">No PenalFlux, cada um vem com o verbo-chave, a lei atualizada até 2026, a explicação em português simples, um exemplo e simulados no estilo das bancas.</p>' +
      '<img src="/j/qz/telas.webp" alt="Telas do app PenalFlux" width="1100" height="464" style="border-radius:14px;margin-top:16px">' +
      '<div id="oferta" style="margin-top:16px"></div></div></div>';
    var nc = EARN.acerto + EARN.rapido + EARN.seq;
    X.play('fanfare');
    var fin = X.fill('', document.querySelector('.badge-big'));
    document.getElementById('seeb').onclick = function (e) { e.preventDefault(); X.play('tap'); document.getElementById('oferta').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    setTimeout(function () {
      window.PFOffer.render(document.getElementById('oferta'), { lines: [['Acertos (' + ok + ' de ' + N + ')', EARN.acerto], ['Respostas rápidas', EARN.rapido], ['Sequências de acerto', EARN.seq], ['Bônus por concluir o desafio', fin]], title: 'Você juntou esse bônus no desafio. Ele fica guardado para você usar no Completo.', cta: 'Quero o Completo: os 405 dispositivos' });
    }, 500);
    window.PFOffer.track('ViewContent', { content_name: 'PenalFlux · resultado do desafio', currency: 'BRL', value: 29.9 });
    window.scrollTo(0, 0);
  }

  play();
})();
